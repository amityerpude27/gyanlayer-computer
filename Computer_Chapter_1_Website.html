    active:   'bg-amber-500 text-white border-amber-500 shadow-[0_4px_12px_-2px_rgba(245,158,11,0.4)]',
    inactive: 'bg-white text-amber-700 border-amber-200 hover:border-amber-400 hover:bg-amber-50',
    inactiveWarm: 'bg-[#faf7ef] text-amber-800 border-[#e0d5b0] hover:bg-[#f3eedc] hover:border-amber-400',
    inactiveDark: 'bg-slate-800 text-amber-400 border-slate-700 hover:border-amber-500 hover:bg-slate-800/80',
  },
  green: {
    active:   'bg-green-600 text-white border-green-600 shadow-[0_4px_12px_-2px_rgba(22,163,74,0.4)]',
    inactive: 'bg-white text-green-700 border-green-200 hover:border-green-400 hover:bg-green-50',
    inactiveWarm: 'bg-[#faf7ef] text-green-800 border-[#e0d5b0] hover:bg-[#f3eedc] hover:border-green-400',
    inactiveDark: 'bg-slate-800 text-green-400 border-slate-700 hover:border-green-500 hover:bg-slate-800/80',
  },
  red: {
    active:   'bg-red-600 text-white border-red-600 shadow-[0_4px_12px_-2px_rgba(220,38,38,0.4)]',
    inactive: 'bg-white text-red-700 border-red-200 hover:border-red-400 hover:bg-red-50',
    inactiveWarm: 'bg-[#faf7ef] text-red-800 border-[#e0d5b0] hover:bg-[#f3eedc] hover:border-red-400',
    inactiveDark: 'bg-slate-800 text-red-400 border-slate-700 hover:border-red-500 hover:bg-slate-800/80',
  },
  slate: {
    active:   'bg-slate-600 text-white border-slate-600 shadow-[0_4px_12px_-2px_rgba(75,85,99,0.4)]',
    inactive: 'bg-white text-slate-700 border-slate-300 hover:border-slate-505 hover:bg-slate-55',
    inactiveWarm: 'bg-[#faf7ef] text-slate-700 border-[#e0d5b0] hover:bg-[#f3eedc] hover:border-slate-500',
    inactiveDark: 'bg-slate-805 text-slate-300 border-slate-700 hover:bg-slate-700/80',
  },
  blue: {
    active:   'bg-blue-600 text-white border-blue-600 shadow-[0_4px_12px_-2px_rgba(37,99,235,0.4)]',
    inactive: 'bg-white text-blue-700 border-blue-200 hover:border-blue-400 hover:bg-blue-50',
    inactiveWarm: 'bg-[#faf7ef] text-blue-800 border-[#e0d5b0] hover:bg-[#f3eedc] hover:border-blue-400',
    inactiveDark: 'bg-slate-800 text-blue-400 border-slate-700 hover:border-blue-500 hover:bg-slate-800/80',
  },
  purple: {
    active:   'bg-purple-600 text-white border-purple-600 shadow-[0_4px_12px_-2px_rgba(147,51,234,0.4)]',
    inactive: 'bg-white text-purple-700 border-purple-200 hover:border-purple-400 hover:bg-purple-50',
    inactiveWarm: 'bg-[#faf7ef] text-purple-800 border-[#e0d5b0] hover:bg-[#f3eedc] hover:border-purple-400',
    inactiveDark: 'bg-slate-800 text-purple-400 border-slate-700 hover:border-purple-500 hover:bg-slate-800/80',
  },
};

const MOTIVATION_QUOTES = [
  { icon: '🎯', text: 'Rank 1 Focus', color: 'from-violet-500/15 via-indigo-500/15 to-violet-500/15 border-violet-300/60 dark:border-violet-700/60 text-violet-700 dark:text-violet-300' },
  { icon: '🔥', text: 'Target 100%', color: 'from-amber-500/15 via-orange-500/15 to-amber-500/15 border-amber-300/60 dark:border-amber-700/60 text-amber-700 dark:text-amber-300' },
  { icon: '⚡', text: 'Active Recall', color: 'from-cyan-500/15 via-blue-500/15 to-cyan-500/15 border-cyan-300/60 dark:border-cyan-700/60 text-cyan-700 dark:text-cyan-300' },
  { icon: '💡', text: 'Smart Revision', color: 'from-emerald-500/15 via-teal-500/15 to-emerald-500/15 border-emerald-300/60 dark:border-emerald-700/60 text-emerald-700 dark:text-emerald-300' },
  { icon: '🚀', text: 'Top Aspirant', color: 'from-fuchsia-500/15 via-pink-500/15 to-fuchsia-500/15 border-fuchsia-300/60 dark:border-fuchsia-700/60 text-fuchsia-700 dark:text-fuchsia-300' },
  { icon: '✨', text: 'Stay Focused', color: 'from-purple-500/15 via-violet-500/15 to-purple-500/15 border-purple-300/60 dark:border-purple-700/60 text-purple-700 dark:text-purple-300' },
  { icon: '🏆', text: 'Daily Winner', color: 'from-yellow-500/15 via-amber-500/15 to-yellow-500/15 border-amber-400/60 dark:border-amber-600/60 text-amber-800 dark:text-amber-200' }
];

const CategoryBar = ({
  categories, selectedCategory, setSelectedCategory,
  searchQuery, setSearchQuery, theme, allQuestions,
  viewMode = 'grid', setViewMode
}) => {
  const isDark = theme === 'dark';
  const isWarm = theme === 'warm';
  const isYouTubeStudio = Boolean(window.caConfig && window.caConfig.isYouTubeStudio);
  const scrollRef = useRef(null);
  const [showRight, setShowRight] = useState(true);
  const [showLeft,  setShowLeft]  = useState(false);
  const [isExpanded, setIsExpanded] = useState(false);
  const [quoteIdx, setQuoteIdx] = useState(0);

  // Dynamic rotating motivational pill timer (every 6 seconds)
  useEffect(() => {
    const quoteTimer = setInterval(() => {
      setQuoteIdx(prev => (prev + 1) % MOTIVATION_QUOTES.length);
    }, 6000);
    return () => clearInterval(quoteTimer);
  }, []);

  const currentQuote = MOTIVATION_QUOTES[quoteIdx];

  const barBg      = isDark ? 'bg-slate-950' : isWarm ? 'bg-[#faf8f2]' : 'bg-slate-50';
  const borderCol  = isDark ? 'border-slate-800' : isWarm ? 'border-[#e8dcb5]' : 'border-slate-200';
  
  // Fade gradients per theme
  const fadeGradientLeft = isDark
    ? 'from-slate-950 to-transparent'
    : isWarm
    ? 'from-[#faf8f2] to-transparent'
    : 'from-slate-50 to-transparent';

  const fadeGradientRight = isDark
    ? 'from-slate-950 to-transparent'
    : isWarm
    ? 'from-[#faf8f2] to-transparent'
    : 'from-slate-50 to-transparent';

  const inputCls   = isDark
    ? 'bg-slate-900 border-slate-800 text-slate-200 placeholder-slate-500 focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20'
    : isWarm
    ? 'bg-[#f5ebd0] border-[#d8ccaf] text-[#4a3b32] placeholder-[#a6987c] focus:border-violet-400 focus:ring-2 focus:ring-violet-400/20'
    : 'bg-white border-slate-200 text-slate-700 placeholder-slate-400 focus:border-violet-400 focus:ring-2 focus:ring-violet-400/20';

  const handleScroll = (e) => {
    if (isExpanded) return;
    const el = e.target;
    setShowLeft(el.scrollLeft > 8);
    setShowRight(el.scrollLeft < el.scrollWidth - el.clientWidth - 8);
  };

  // Scroll category bar horizontally on chevron click
  const scroll = (direction) => {
    const el = scrollRef.current;
    if (el) {
      const scrollAmt = direction === 'left' ? -220 : 220;
      el.scrollBy({ left: scrollAmt, behavior: 'smooth' });
    }
  };

  // Check overflow on load/resize/category changes
  const checkOverflow = () => {
    const el = scrollRef.current;
    if (el && !isExpanded) {
      setShowLeft(el.scrollLeft > 8);
      setShowRight(el.scrollWidth > el.clientWidth + 8);
    }
  };

  const dropdownRef = useRef(null);

  useEffect(() => {
    checkOverflow();
    window.addEventListener('resize', checkOverflow);
    return () => window.removeEventListener('resize', checkOverflow);
  }, [categories, isExpanded]);

  // Click-outside auto-close for dropdown menu
  useEffect(() => {
    if (!isExpanded) return;
    const handleClickOutside = (e) => {
      if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
        setIsExpanded(false);
      }
    };
    document.addEventListener('mousedown', handleClickOutside);
    document.addEventListener('touchstart', handleClickOutside);
    return () => {
      document.removeEventListener('mousedown', handleClickOutside);
      document.removeEventListener('touchstart', handleClickOutside);
    };
  }, [isExpanded]);

  // Bind mouse drag-to-scroll & mouse wheel events to Category Bar
  useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;

    let isDown = false;
    let startX = 0;
    let scrollLeft = 0;

    const onMouseDown = (e) => {
      if (isExpanded) return;
      if (e.button !== 0) return; // left click only
      isDown = true;
      el.style.cursor = 'grabbing';
      el.style.userSelect = 'none'; // prevent text selection
      startX = e.pageX - el.offsetLeft;
      scrollLeft = el.scrollLeft;
    };

    const onMouseLeave = () => {
      isDown = false;
      el.style.cursor = 'grab';
    };

    const onMouseUp = () => {
      isDown = false;
      el.style.cursor = 'grab';
    };

    const onMouseMove = (e) => {
      if (!isDown || isExpanded) return;
      e.preventDefault();
      const x = e.pageX - el.offsetLeft;
      const walk = (x - startX) * 2.0; // Fast scroll speed multiplier
      el.scrollLeft = scrollLeft - walk;
    };

    const onWheel = (e) => {
      if (isExpanded) return;
      if (e.deltaY !== 0) {
        e.preventDefault();
        el.scrollLeft += e.deltaY * 2.2; // 2.2x fast smooth scrolling speed factor
      }
    };

    // Set initial cursor style
    el.style.cursor = 'grab';

    // Attach listeners
    el.addEventListener('mousedown', onMouseDown);
    el.addEventListener('mouseleave', onMouseLeave);
    el.addEventListener('mouseup', onMouseUp);
    el.addEventListener('mousemove', onMouseMove);
    el.addEventListener('wheel', onWheel, { passive: false });

    return () => {
      el.removeEventListener('mousedown', onMouseDown);
      el.removeEventListener('mouseleave', onMouseLeave);
      el.removeEventListener('mouseup', onMouseUp);
      el.removeEventListener('mousemove', onMouseMove);
      el.removeEventListener('wheel', onWheel);
    };
  }, [isExpanded]);

  // Scroll Hint (Bounce effect on mount to visually hint horizontal scrollability)
  useEffect(() => {
    const timer = setTimeout(() => {
      const el = scrollRef.current;
      if (el && el.scrollLeft === 0 && !isExpanded) {
        el.scrollTo({ left: 65, behavior: 'smooth' });
        const returnTimer = setTimeout(() => {
          if (el && el.scrollLeft <= 70) {
            el.scrollTo({ left: 0, behavior: 'smooth' });
          }
        }, 500);
      }
    }, 800);
    return () => clearTimeout(timer);
  }, [isExpanded]);

  const handlePdf = () => {
    const el = document.getElementById('study-notes-content');
    if (!el || typeof html2pdf === 'undefined') return;
    html2pdf().set({
      margin: 8,
      filename: `Computer_Awareness_${window.caConfig.month || 'Chapter_1'}_${window.caConfig.year}.pdf`,
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    }).from(el).save();
  };

  // --- Dynamic Category Filtering & Predefined Master Sequence Sorting ---
  const getMasterIndex = (id) => {
    const norm = (id || '').toLowerCase();
    if (norm === 'all') return 0;
    if (norm === 'world' || norm === 'first_world') return 1;
    if (norm === 'india' || norm === 'first_india') return 2;
    if (norm === 'sports' || norm === 'sport') return 3;
    if (norm === 'sci' || norm === 'science') return 4;
    if (norm === 'env' || norm === 'ecology') return 5;
    if (norm === 'economy' || norm === 'banking') return 6;
    if (norm === 'awards' || norm === 'appointments') return 7;
    if (norm === 'schemes' || norm === 'govt' || norm === 'yojana') return 8;
    if (norm === 'summits' || norm === 'conferences') return 9;
    if (norm === 'defense' || norm === 'security') return 10;
    if (norm === 'national' || norm === 'state') return 11;
    if (norm === 'intl' || norm === 'international') return 12;
    if (norm === 'indices' || norm === 'reports') return 13;
    if (norm === 'art' || norm === 'culture') return 14;
    if (norm === 'days' || norm === 'themes') return 15;
    if (norm === 'books' || norm === 'authors') return 16;
    if (norm === 'space' || norm === 'isro') return 17;
    if (norm === 'misc' || norm === 'miscellaneous') return 18;
    return 999;
  };

  const [windowWidth, setWindowWidth] = useState(typeof window !== 'undefined' ? window.innerWidth : 1280);
  const isMobile = windowWidth < 768;

  useEffect(() => {
    const handleResize = () => setWindowWidth(window.innerWidth);
    window.addEventListener('resize', handleResize);

    const handleKeyDown = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        const searchInput = document.getElementById('ca-search-input');
        if (searchInput) searchInput.focus();
      }
    };
    window.addEventListener('keydown', handleKeyDown);

    return () => {
      window.removeEventListener('resize', handleResize);
      window.removeEventListener('keydown', handleKeyDown);
    };
  }, []);

  const sortedCategories = useMemo(() => {
    return (categories || [])
      .filter(cat => {
        const count = cat.id === 'all'
          ? allQuestions.length
          : allQuestions.filter(q => q.category === cat.id).length;
        return cat.id === 'all' || count > 0;
      })
      .sort((a, b) => getMasterIndex(a.id) - getMasterIndex(b.id));
  }, [categories, allQuestions]);

  // Main high-count categories (Count >= 5 or 'all') vs low-count categories (< 5 Qs)
  const mainCategories = useMemo(() => {
    return sortedCategories.filter(cat => {
      if (cat.id === 'all') return true;
      const count = allQuestions.filter(q => q.category === cat.id).length;
      return count >= 5;
    });
  }, [sortedCategories, allQuestions]);

  const lowCountCategories = useMemo(() => {
    return sortedCategories.filter(cat => {
      if (cat.id === 'all') return false;
      const count = allQuestions.filter(q => q.category === cat.id).length;
      return count < 5;
    });
  }, [sortedCategories, allQuestions]);

  const threshold = 12;
  const visibleCats = isMobile
    ? sortedCategories
    : mainCategories.slice(0, threshold);

  // 'More' Dropdown categories: Sorted in DESCENDING ORDER by Question Count (highest first)
  const remainingCats = useMemo(() => {
    if (isMobile) return [];
    const overflowFromMain = mainCategories.slice(threshold);
    const combined = [...overflowFromMain, ...lowCountCategories];
    return combined.sort((a, b) => {
      const countA = allQuestions.filter(q => q.category === a.id).length;
      const countB = allQuestions.filter(q => q.category === b.id).length;
      if (countB !== countA) return countB - countA; // Descending by Question Count
      return getMasterIndex(a.id) - getMasterIndex(b.id); // Master sequence tie-breaker
    });
  }, [mainCategories, lowCountCategories, isMobile, allQuestions]);

  const hasMore = !isMobile && remainingCats.length > 0;
  const isRemainingActive = remainingCats.some(cat => cat.id === selectedCategory);

  return (
    <div id="ca-category-bar" className={`${barBg} border-b ${borderCol} px-3 sm:px-5 ${viewMode === 'map' ? 'py-1.5' : 'pt-2.5 pb-2.5'} flex-shrink-0 transition-colors duration-300`}>

      {/* ── CATEGORY PILLS (Horizontal scroll / wrapped grid - Hidden in Reading Map mode to maximize vertical space) ── */}
      {viewMode !== 'map' && (
        <div className="relative flex items-center mx-auto w-fit max-w-full mb-3 group/pills">
          {/* Left Scroll Chevron (Desktop only - hidden when expanded) */}
          {!isExpanded && showLeft && (
          <button
            onClick={() => scroll('left')}
            className={`absolute left-1.5 z-20 hidden md:flex items-center justify-center w-7 h-7 rounded-full border shadow-md hover:scale-105 active:scale-90 transition-all duration-150 ${
              isDark 
                ? 'bg-slate-900 border-slate-700 text-slate-350 hover:text-white' 
                : isWarm 
                ? 'bg-[#f4efe0] border-[#d8ccaf] text-[#4a3b32] hover:bg-[#e8dcbd]' 
                : 'bg-white border-slate-200 text-slate-605 hover:bg-slate-50 hover:text-slate-900'
            }`}
            title="Scroll Left"
          >
            <i className="fa-solid fa-chevron-left text-[9px]"></i>
          </button>
        )}

        {/* Left fade gradient (hidden when expanded) */}
        {!isExpanded && showLeft && (
          <div className={`absolute left-0 top-0 bottom-0 w-16 z-10 pointer-events-none bg-gradient-to-r ${fadeGradientLeft}`} />
        )}

        {/* Scrollable pill row with fast mouse wheel support */}
        <div
          ref={scrollRef}
          onScroll={handleScroll}
          onWheel={(e) => { if (e.deltaY) { e.currentTarget.scrollLeft += e.deltaY * 1.5; } }}
          className="category-bar w-full px-1 py-1 gap-2.5 flex overflow-x-auto whitespace-nowrap scrollbar-hide select-none"
        >
          {visibleCats.map(cat => {
            const isActive = selectedCategory === cat.id;
            const count = cat.id === 'all'
              ? allQuestions.length
              : allQuestions.filter(q => q.category === cat.id).length;
            
            const isAll = cat.id === 'all';
            const colorSet = CAT_COLORS[cat.color] || CAT_COLORS.indigo;
            
            let cls = '';
            if (isActive) {
              if (isAll) {
                cls = 'bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white border-transparent shadow-[0_4px_12px_0_rgba(124,58,237,0.45)]';
              } else {
                cls = colorSet.active;
              }
            } else {
              cls = isDark 
                ? colorSet.inactiveDark 
                : isWarm 
                ? colorSet.inactiveWarm 
                : colorSet.inactive;
            }

            return (
              <button
                key={cat.id}
                id={`cat-${cat.id}`}
                onClick={() => setSelectedCategory(cat.id)}
                className={`flex-shrink-0 flex items-center gap-2 px-3.5 py-2 rounded-full text-xs font-semibold border transition-all duration-200 hover:scale-[1.04] active:scale-[0.96] ${cls}`}
              >
                <i className={`${cat.icon} text-[13px] ${isActive ? 'text-white' : cat.iconColor || 'text-slate-405'}`}></i>
                <span>{cat.label}</span>
                <span className={`text-[10px] font-black rounded-full px-2 py-0.5 transition-all ${
                  isActive 
                    ? 'bg-white/20 text-white' 
                    : isDark 
                    ? 'bg-slate-700/80 text-slate-300' 
                    : isWarm
                    ? 'bg-[#e5dcbe] text-[#4a3b32]'
                    : 'bg-slate-100 text-slate-500'
                }`}>
                  {count}
                </span>
              </button>
            );
          })}
          
          {/* Scroll spacer padding so elements don't get hidden behind sticky More */}
          {hasMore && <div className="flex-shrink-0 w-8 h-8" />}
        </div>

        {/* Sticky More Button with Left Fade Gradient */}
        {hasMore && (
          <div ref={dropdownRef} className={`absolute right-0 top-0 bottom-0 flex items-center z-20 pl-7 select-none pointer-events-none bg-gradient-to-l ${
            isDark 
              ? 'from-slate-950 via-slate-950/80 to-transparent' 
              : isWarm 
              ? 'from-[#faf8f2] via-[#faf8f2]/80 to-transparent' 
              : 'from-slate-50 via-slate-50/80 to-transparent'
          }`}>
            <button
              onClick={() => setIsExpanded(!isExpanded)}
              className={`w-8 h-8 rounded-full flex items-center justify-center border shadow-md transition-all duration-200 hover:scale-105 active:scale-95 pointer-events-auto ${
                isRemainingActive
                  ? 'bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white border-transparent shadow-[0_4px_12px_0_rgba(124,58,237,0.45)]'
                  : isExpanded
                  ? (isDark ? 'bg-slate-800 border-violet-500 text-violet-400' : 'bg-slate-100 border-violet-500 text-violet-600')
                  : isDark
                  ? 'bg-slate-900 border-slate-700 text-slate-300'
                  : isWarm
                  ? 'bg-[#f4efe0] border-[#d8ccaf] text-[#4a3b32]'
                  : 'bg-white border-slate-200 text-slate-650 hover:bg-slate-50'
              }`}
              title="More Topics"
            >
              <i className={`fa-solid ${isExpanded ? 'fa-xmark' : 'fa-ellipsis-vertical'} text-xs`}></i>
            </button>
            
            {/* Dropdown Menu for Remaining Categories */}
            {isExpanded && (
              <div className={`absolute right-0 top-full mt-2 p-2 rounded-xl border shadow-xl z-50 flex flex-col gap-1.5 min-w-[200px] pointer-events-auto max-h-[60vh] overflow-y-auto ${
                isDark ? 'bg-slate-900 border-slate-700 shadow-black/50' : isWarm ? 'bg-[#faf8f2] border-[#e0d5b0]' : 'bg-white border-slate-200'
              }`}>
                {remainingCats.map(cat => {
                  const isActive = selectedCategory === cat.id;
                  const count = allQuestions.filter(q => q.category === cat.id).length;
                  const colorSet = CAT_COLORS[cat.color] || CAT_COLORS.indigo;
                  
                  let cls = isActive ? colorSet.active : (isDark ? colorSet.inactiveDark : isWarm ? colorSet.inactiveWarm : colorSet.inactive);

                  return (
                    <button
                      key={cat.id}
                      onClick={() => {
                        setSelectedCategory(cat.id);
                        setIsExpanded(false);
                      }}
                      className={`flex items-center justify-between px-3.5 py-2.5 rounded-lg text-sm font-semibold border transition-all duration-200 hover:scale-[1.02] active:scale-[0.98] ${cls}`}
                    >
                      <div className="flex items-center gap-2.5">
                        <i className={`${cat.icon} text-sm ${isActive ? 'text-white' : cat.iconColor || 'text-slate-405'}`}></i>
                        <span>{cat.label}</span>
                      </div>
                      <span className={`text-[10.5px] font-black rounded-full px-2 py-0.5 transition-all ${
                        isActive ? 'bg-white/20 text-white' : isDark ? 'bg-slate-700/80 text-slate-300' : isWarm ? 'bg-[#e5dcbe] text-[#4a3b32]' : 'bg-slate-100 text-slate-500'
                      }`}>
                        {count}
                      </span>
                    </button>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {/* Right Scroll Chevron (Desktop only - hidden when sticky button is shown) */}
        {!hasMore && showRight && (
          <button
            onClick={() => scroll('right')}
            className={`absolute right-1.5 z-20 hidden md:flex items-center justify-center w-7 h-7 rounded-full border shadow-md hover:scale-105 active:scale-90 transition-all duration-150 ${
              isDark 
                ? 'bg-slate-900 border-slate-700 text-slate-300 hover:text-white' 
                : isWarm 
                ? 'bg-[#f4efe0] border-[#d8ccaf] text-[#4a3b32] hover:bg-[#e8dcbd]' 
                : 'bg-white border-slate-200 text-slate-605 hover:bg-slate-50 hover:text-slate-900'
            }`}
            title="Scroll Right"
          >
            <i className="fa-solid fa-chevron-right text-[9px]"></i>
          </button>
        )}

        {/* Right fade gradient (hidden when expanded or when sticky button is shown) */}
        {!isExpanded && !hasMore && showRight && (
          <div className={`absolute right-0 top-0 bottom-0 w-16 z-10 pointer-events-none bg-gradient-to-l ${fadeGradientRight}`} />
        )}
      </div>
      )}

      {/* ── SEARCH & VIEW SWITCHER ROW (Unified Modern Command Bar) ── */}
      <div className="flex items-center justify-between py-1 gap-2.5 flex-wrap sm:flex-nowrap">
        {/* Left: Search Input Box */}
        <div className="relative flex-1 min-w-[200px] sm:max-w-md md:max-w-lg transition-all duration-300">
          {/* Left Magnifying Glass Icon */}
          <i className={`fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-xs ${
            isDark ? 'text-slate-400' : isWarm ? 'text-[#9e9075]' : 'text-slate-400'
          }`}></i>
          
          {/* Rounded Pill Input Box */}
          <input

// Get category label + icon + color from config
const getCategoryMeta = (catId) => {
  const categories = (window.caConfig && window.caConfig.categories) ? window.caConfig.categories : [];
  const normalizedId = (catId || '').toLowerCase().trim();
  const cat = categories.find(c => {
    const cid = (c.id || '').toLowerCase();
    return cid === normalizedId ||
      (cid === 'international' && normalizedId === 'intl') ||
      (cid === 'intl' && normalizedId === 'international') ||
      (cid === 'first_world' && normalizedId === 'world') ||
      (cid === 'first_india' && normalizedId === 'india') ||
      (cid === 'science' && normalizedId === 'sci') ||
      (cid === 'space' && normalizedId === 'isro') ||
      (cid === 'env' && (normalizedId === 'ecology' || normalizedId === 'environment'));
  });
  const cleanLabel = (catId || 'General').replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
  const fullLabel = cat ? (cat.label || cat.name) : cleanLabel;
  const shortLabel = SHORT_CATEGORY_LABELS[normalizedId] || (cat && (cat.shortLabel || cat.shortName)) || fullLabel;
  return { 
    label: fullLabel, 
    shortLabel: shortLabel,
    name: cat ? cat.name : fullLabel,
    emoji: (cat && cat.emoji) || (cat && cat.name ? cat.name.split(' ')[0] : '💡'),
    icon: (cat && cat.icon) || 'fa-solid fa-bookmark', 
    color: (cat && cat.color) || 'slate' 
  };
};

// 💡 Universal Memory Trick Formatter with Hanging Indent (Zero duplicate icons & flawless alignment)
const renderFormattedTrick = (trickStr, textClassName = "") => {
  if (!trickStr) return null;
  const cleanStr = trickStr.replace(/^(?:💡|🧠|🎯)\s*/, '').trim();
  const chars = Array.from(cleanStr);
  if (chars.length > 0) {
    const first = chars[0];
    const cp = first.codePointAt(0);
    const isEmoji = cp > 0x1F000 || (cp >= 0x2600 && cp <= 0x27BF) || (cp >= 0x2300 && cp <= 0x23FF);
    if (isEmoji) {
      let idx = 1;
      while (idx < chars.length && (chars[idx] === '\uFE0F' || chars[idx] === '\uFE0E' || chars[idx] === '\u200D' || (chars[idx - 1] === '\u200D'))) {
        idx++;
      }
      const emoji = chars.slice(0, idx).join('');
      const text = cleanStr.slice(emoji.length).trim();
      return (
        <div className="flex items-start gap-2 text-left select-text w-full">
          <span className="shrink-0 text-sm sm:text-base leading-snug select-none pt-0.5">{emoji}</span>
          <p className={`flex-1 font-semibold leading-relaxed tracking-wide ${textClassName}`}>
            {text}
          </p>
        </div>
      );
    }
  }
  return (
    <p className={`font-semibold leading-relaxed tracking-wide text-left select-text ${textClassName}`}>
      {cleanStr}
    </p>
  );
};
window.renderFormattedTrick = renderFormattedTrick;

// Individual current affairs card
const CACard = ({ 
  item, 
  index, 
  theme, 
  activeCategory, 
  categoryTotal, 
  catStats,
  checkpoint, 
  checkpointIndex, 
  onMarkLastRead, 
  onShareCard, 
  onTrackReadCard, 
  isPodcastActive,
  isExpanded360,
  onToggle360,
  cardHeightClass
}) => {
  const [localShowDetails, setLocalShowDetails] = useState(false);
  const showDetails = isExpanded360 !== undefined ? isExpanded360 : localShowDetails;
  const [isSpeaking, setIsSpeaking] = useState(false);
  const isDark = theme === 'dark';
  const isMega = (window.caConfig && (window.caConfig.mode === 'mega' || window.caConfig.isMega === true)) || (window.caConfig && window.caConfig.questions && window.caConfig.questions.length >= 400);
  const catMeta = getCategoryMeta(item.category);
  const catColor = catMeta.color || 'slate';

  // ⏱️ Anti-Cheat Dwell-Time Observer (Card is only counted as Read if viewed for >= 3.5s)
  useEffect(() => {
    if (!onTrackReadCard) return;
    let dwellTimer = null;
    const cardEl = document.getElementById(`ca-card-${item.id}`);
    if (!cardEl || typeof IntersectionObserver === 'undefined') return;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
          dwellTimer = setTimeout(() => {
            onTrackReadCard(item.id);
          }, 3500);
        } else {
          if (dwellTimer) {
            clearTimeout(dwellTimer);
            dwellTimer = null;
          }
        }
      });
    }, { threshold: 0.5 });

    observer.observe(cardEl);
    return () => {
      if (dwellTimer) clearTimeout(dwellTimer);
      observer.disconnect();
    };
  }, [item.id, onTrackReadCard]);

  useEffect(() => {
    const handleGlobalStarted = (e) => {
      if (e && e.detail && e.detail.id === `card-${item.id}`) {
        setIsSpeaking(true);
      } else {
        setIsSpeaking(false);
      }
    };
    const handleGlobalStop = (e) => {
      if (!e || !e.detail || !e.detail.stoppedId || e.detail.stoppedId === `card-${item.id}` || window.caCurrentSpeakingId !== `card-${item.id}`) {
        setIsSpeaking(false);
      }
    };
    window.addEventListener('ca-speech-started', handleGlobalStarted);
    window.addEventListener('ca-speech-stopped', handleGlobalStop);
    return () => {
      window.removeEventListener('ca-speech-started', handleGlobalStarted);
      window.removeEventListener('ca-speech-stopped', handleGlobalStop);
      if (window.caCurrentSpeakingId === `card-${item.id}`) {
        window.caStopSpeech();
      }
    };
  }, [item.id]);

  const handleToggleAudio = (e) => {
    e.stopPropagation();
    if (onTrackReadCard) onTrackReadCard(item.id);
    if (isSpeaking || window.caCurrentSpeakingId === `card-${item.id}` || (window.caCurrentAudioObj && !window.caCurrentAudioObj.paused)) {
      window.caStopSpeech();
      setIsSpeaking(false);
    } else {
      setIsSpeaking(true);
      window.caSpeak(
        item,
        `card-${item.id}`,
        () => setIsSpeaking(false),
        () => setIsSpeaking(true)
      );
    }

  const cStyle = isDark

// 🎬 Ultra-Premium 16:9 Widescreen Cinema Presentation Slide Card for YouTube Videos & Studio Screen Recording

  totalCount, 
  theme, 
  selectedCategory, 
  onNext, 
  onPrev, 
  onToggleView, 
  isPlaying,
  onTogglePlay,
  isTheaterMode,
  onToggleTheater,
  onSelectPart
}) => {
  const isDark = theme === 'dark';
  const catMeta = getCategoryMeta(item.category || selectedCategory);
  const catColor = catMeta.color || 'slate';

    ? (CARD_DARK[item.category] || COLOR_CARD_DARK[catColor] || CARD_DARK.default)

    ? 'bg-slate-900/80 border-slate-700/80 text-slate-200'

  const progressPercent = Math.round(((index + 1) / totalCount) * 100);

  const allParts = (window.caConfig && window.caConfig.youtubeAudioParts) ? window.caConfig.youtubeAudioParts : [];
  const currentPartObj = allParts.find(p => (index + 1) >= p.startQ && (index + 1) <= p.endQ) || allParts[0];
  const currentPartNum = currentPartObj ? currentPartObj.part : 1;

  return (
    <div className="w-full max-w-[1780px] mx-auto flex flex-col items-center justify-center animate-fade-in-app py-0">
      {/* ── 16:9 Widescreen Master Broadcast Tablet ── */}
      <div className={`relative w-full rounded-3xl p-6 sm:p-8 md:p-9 border-2 transition-all duration-300 shadow-2xl ${cStyle.wrap} border-amber-500/90 dark:border-amber-400/80 shadow-[0_0_40px_rgba(245,158,11,0.25)] ring-1 ring-amber-400/50`}>
        
        {/* ── Top Horizontal Progress Line ── */}

          <div

            style={{ width: `${progressPercent}%` }}
          />
        </div>

        {/* ── 2-COLUMN 16:9 WIDESCREEN GRID ── */}
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start">
          
          {/* ════════ LEFT COLUMN (Core Q&A Hero ~ 7 Cols) ════════ */}
          <div className="lg:col-span-7 flex flex-col space-y-4 sm:space-y-5">
            
            {/* Top Meta Badges */}
            <div className="flex items-center justify-between gap-2 flex-wrap min-w-0 pb-1">
              <div className="flex items-center gap-2 flex-wrap">

                          <span>📝</span>
                          <span>Extra Facts (Static GK)</span>

                          {item.explanation.additionalInfo.map((ai, aIdx) => (

            {/* Broadcast Control Dock */}
            <div className="pt-2 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2 flex-wrap">
              <div className="flex items-center gap-1.5">
                <button
                  onClick={onPrev}
                  disabled={index === 0}
                  className="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs sm:text-sm font-bold transition-all disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-1.5 active:scale-95 cursor-pointer"
                  title="Previous Question Slide (← Arrow Key)"
                >
                  <i className="fa-solid fa-chevron-left text-xs"></i>
                  <span>Prev [←]</span>
                </button>
                <button
                  onClick={onNext}
                  disabled={index >= totalCount - 1}
                  className="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs sm:text-sm font-black transition-all shadow-md active:scale-95 flex items-center gap-1.5 cursor-pointer"
                  title="Next Question Slide (→ Arrow Key)"
                >
                  <span>Next [→]</span>
                  <i className="fa-solid fa-chevron-right text-xs"></i>

              <div className="flex items-center gap-1.5 flex-wrap">
                <button

                  className="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-bold transition-all shadow-sm active:scale-95 flex items-center gap-1.5 cursor-pointer"
                  title="Play/Pause Podcast (P / Space Key)"
                >
                  <i className={`fa-solid ${isPlaying ? 'fa-pause' : 'fa-play'} text-xs`}></i>
                  <span>{isPlaying ? 'Pause' : 'Play [P]'}</span>
                </button>
                <button
                  onClick={onToggleTheater}
                  className={`px-3 py-2 rounded-xl border text-xs sm:text-sm font-bold transition-all flex items-center gap-1.5 cursor-pointer active:scale-95 ${
                    isTheaterMode
                      ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-sm'
                      : 'border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300'
                  }`}
                  title="Toggle 100% Full-Screen Theater Mode (T or F Key)"
                >
                  <i className={`fa-solid ${isTheaterMode ? 'fa-compress' : 'fa-expand'} text-xs`}></i>
                  <span>{isTheaterMode ? 'Exit Theater [T]' : 'Theater [T]'}</span>
                </button>
                <button
                  onClick={onToggleView}
                  className="px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs sm:text-sm font-bold transition-all flex items-center gap-1 cursor-pointer"
                  title="Switch to Grid View (S Key)"
                >
                  <i className="fa-solid fa-table-cells-large text-xs"></i>
                  <span>Grid [S]</span>
                </button>
              </div>
            </div>

          </div>

        </div>

      </div>
    </div>
  );
};

// Study Notes tab root
const StudyNotes = ({
  questions = [],
  allQuestions = [],
  categories = [],
  month = 'जनवरी',
  year = 2026,
  theme = 'dark',
  selectedCategory = 'all',
  setSelectedCategory,
  searchQuery = '',
  viewMode: propViewMode,
  setViewMode: propSetViewMode,
  onShareCard,
  onTrackReadCard
}) => {
  const isDark = theme === 'dark';
  const isYouTubeStudio = Boolean(window.caConfig && window.caConfig.isYouTubeStudio);
  const [checkpoint, setCheckpoint] = useState(() => window.getReadingCheckpoint(selectedCategory));
  const [showBanner, setShowBanner] = useState(true);
  
  // 🪟 View Mode: 'grid' (Default Infographic Cards) vs 'map' (Reading Map Tree) vs 'slide' (Presentation Deck)
  const [localViewMode, setLocalViewMode] = useState(() => isYouTubeStudio ? 'slide' : 'grid');
  const viewMode = propViewMode !== undefined ? propViewMode : localViewMode;
  const setViewMode = propSetViewMode || setLocalViewMode;
  const [currentSlideIndex, setCurrentSlideIndex] = useState(0);

  // 🎬 100% Immersive Full-Screen Broadcast Theater Mode (Activated via [T] or toggle button)
  const [isTheaterMode, setIsTheaterMode] = useState(() => Boolean(isYouTubeStudio));

  useEffect(() => {
    window.caSetCurrentSlideIndex = setCurrentSlideIndex;
    window.caSetViewMode = setViewMode;
    window.caSetTheaterMode = setIsTheaterMode;
    return () => {
      window.caSetCurrentSlideIndex = null;
    };
  }, [setViewMode]);

  useEffect(() => {
    if (isYouTubeStudio && viewMode === 'slide' && isTheaterMode) {
      document.body.classList.add('ca-theater-mode');
    } else {
      document.body.classList.remove('ca-theater-mode');
    }
    return () => {
      document.body.classList.remove('ca-theater-mode');
    };
  }, [viewMode, isTheaterMode, isYouTubeStudio]);

  // Dynamic category-relative question serial number (e.g. Question #5 in Sports)
  const categoryQuestionIndex = useMemo(() => {
    if (!checkpoint || !questions || !questions.length) return null;
    const idx = questions.findIndex(q => String(q.id) === String(checkpoint.id));
    return idx !== -1 ? idx + 1 : null;
  }, [checkpoint, questions]);

  // 🎯 Category question sequence map: For each question ID, calculate { catIndex, catTotal }
  const catStatsMap = useMemo(() => {
    const map = {};
    const catListMap = {};
    const source = (allQuestions && allQuestions.length > 0) ? allQuestions : ((window.caConfig && window.caConfig.questions) || questions || []);

    source.forEach(q => {
      const cat = q.category || 'misc';
      if (!catListMap[cat]) catListMap[cat] = [];
      catListMap[cat].push(q);
    });

    Object.values(catListMap).forEach(list => {
      const total = list.length;
      list.forEach((q, idx) => {
        map[String(q.id)] = {
          catIndex: idx + 1,
          catTotal: total
        };
      });
    });

    return map;
  }, [allQuestions, questions]);

  // ⚡ High-Performance Progressive Chunk Rendering (0ms Instant Load)
  const [visibleCount, setVisibleCount] = useState(() => {
    if (categoryQuestionIndex && categoryQuestionIndex > 30) {
      return Math.min(categoryQuestionIndex + 15, questions.length);
    }
    return Math.min(30, questions.length);
  });

  // ⚡ Instant scroll-to-top reset on category change (0ms animated delay)
  useEffect(() => {
    const scrollEl = document.querySelector('.main-scroll');
    if (scrollEl) {
      scrollEl.scrollTop = 0;
    }
    setVisibleCount(30);
  }, [selectedCategory]);

  const observerRef = useRef(null);
  const [activePodcastQId, setActivePodcastQId] = useState(null);
  const [isPodcastPlaying, setIsPodcastPlaying] = useState(false);

  // 📐 Responsive Grid Column Tracker & 360° Isolated Accordion Engine
  const [gridCols, setGridCols] = useState(() => (typeof window !== 'undefined' ? (window.innerWidth >= 1024 ? 3 : window.innerWidth >= 640 ? 2 : 1) : 3));
  const [expanded360Set, setExpanded360Set] = useState(() => new Set());

  useEffect(() => {
    const updateGridCols = () => {
      const w = window.innerWidth;
      setGridCols(w >= 1024 ? 3 : w >= 640 ? 2 : 1);
    };
    window.addEventListener('resize', updateGridCols);
    return () => window.removeEventListener('resize', updateGridCols);
  }, []);

  const handleToggle360 = useCallback((qId) => {
    const sId = String(qId);
    setExpanded360Set(prev => {
      const next = new Set(prev);
      if (next.has(sId)) {
        next.delete(sId);
      } else {
        next.add(sId);
      }
      return next;
    });
  }, []);

  // 🌟 Unified Top-Level Podcast Spotlight & Slide Sync Observer
  useEffect(() => {
    if (window.caPodcastController) {
      const unsub = window.caPodcastController.subscribe((state) => {
        if (state && state.isActive && state.currentQ) {
          const targetId = String(state.currentQ.id);
          setActivePodcastQId(targetId);
          setIsPodcastPlaying(state.isPlaying === true);

          // Auto-sync current slide index in Slide Mode
          const idx = questions.findIndex(q => String(q.id) === targetId);
          if (idx !== -1) {
            setCurrentSlideIndex(idx);
            if (idx >= visibleCount - 4) {
              setVisibleCount(prev => Math.min(Math.max(prev, idx + 25), questions.length));
            }
          }
        } else {
          setActivePodcastQId(null);
          setIsPodcastPlaying(false);
        }
      });
      return unsub;
    }
  }, [questions, visibleCount]);

  // Keyboard Shortcuts: [S] for Slide/Grid Toggle (Studio Only), [T]/[F] for Theater Mode (Studio Only), [←] [→] for Slide Navigation
  useEffect(() => {
    const handleKeyDown = (e) => {
      const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
      if (activeTag === 'input' || activeTag === 'textarea') return;

      if (!isYouTubeStudio) return;

      if (e.key === 's' || e.key === 'S') {
        e.preventDefault();
        setViewMode(prev => prev === 'slide' ? 'grid' : 'slide');
      } else if (e.key === 't' || e.key === 'T' || e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        setIsTheaterMode(prev => !prev);
      } else if (e.key === 'ArrowRight' && viewMode === 'slide') {
        e.preventDefault();
        setCurrentSlideIndex(prev => Math.min(questions.length - 1, prev + 1));
      } else if (e.key === 'ArrowLeft' && viewMode === 'slide') {
        e.preventDefault();
        setCurrentSlideIndex(prev => Math.max(0, prev - 1));
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [viewMode, questions.length, isYouTubeStudio]);

  const [customSlideItem, setCustomSlideItem] = useState(null);

  useEffect(() => {
    window.caSetCustomSlideItem = (customItem, customIdx) => {
      setCustomSlideItem(customItem);
      if (typeof customIdx === 'number') {
        setCurrentSlideIndex(customIdx);
        window.caCurrentSlideIndex = customIdx;
      }
    };
  }, []);

  // Keep window.caCurrentSlideIndex synchronized for 1-click [P] keyboard shortcut
  useEffect(() => {
    window.caCurrentSlideIndex = currentSlideIndex;
  }, [currentSlideIndex]);

  // Sync checkpoint & reset chunk count when category tab or questions change
  useEffect(() => {
    const cp = window.getReadingCheckpoint(selectedCategory);
    setCheckpoint(cp);
    setShowBanner(true);

    let initialCount = 30;
    if (cp && questions && questions.length) {
      const idx = questions.findIndex(q => String(q.id) === String(cp.id));
      if (idx !== -1) {
        if (idx >= 30) initialCount = Math.min(idx + 15, questions.length);
        setCurrentSlideIndex(idx);
      }
    }
    setVisibleCount(Math.min(initialCount, questions.length));
  }, [selectedCategory, questions.length]);

  // 🔄 Real-time listener for checkpoint updates (e.g. from Parent App SET_READ_CHECKPOINTS)
  useEffect(() => {
    const handleCpUpdate = () => {
      const cp = window.getReadingCheckpoint(selectedCategory);
      setCheckpoint(cp);
      if (cp) setShowBanner(true);
    };
    window.addEventListener('ca_reading_checkpoint_updated', handleCpUpdate);
    return () => window.removeEventListener('ca_reading_checkpoint_updated', handleCpUpdate);
  }, [selectedCategory]);

  // ⚡ IntersectionObserver for 0ms Smooth Progressive Virtual Chunk Loading
  useEffect(() => {
    if (visibleCount >= questions.length) return;

    if (typeof IntersectionObserver !== 'undefined') {
      const observer = new IntersectionObserver((entries) => {
        if (entries[0] && entries[0].isIntersecting) {
          setVisibleCount(prev => Math.min(prev + 30, questions.length));
        }
      }, { rootMargin: '600px' });

      const el = observerRef.current;
      if (el) observer.observe(el);
      return () => {
        if (el) observer.unobserve(el);
      };
    } else {
      const handleScroll = () => {
        if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 800) {
          setVisibleCount(prev => Math.min(prev + 30, questions.length));
        }
      };
      window.addEventListener('scroll', handleScroll, { passive: true });
      return () => window.removeEventListener('scroll', handleScroll);
    }
  }, [visibleCount, questions.length]);

  const handleMarkLastRead = (item) => {
    const isAlready = checkpoint && String(checkpoint.id) === String(item.id);
    if (isAlready) {
      window.clearReadingCheckpoint(selectedCategory);
      setCheckpoint(null);
      setShowBanner(false);
    } else {
      window.setReadingCheckpoint(selectedCategory, item);
      const cp = window.getReadingCheckpoint(selectedCategory);
      setCheckpoint(cp);
      setShowBanner(true);
    }
  };

  const handleContinueReading = () => {
    if (!checkpoint) return;
    const targetIdx = questions.findIndex(q => String(q.id) === String(checkpoint.id));
    if (targetIdx !== -1) {
      if (viewMode === 'slide') {
        setCurrentSlideIndex(targetIdx);
        setShowBanner(false);
      } else {
        const needsMore = targetIdx >= visibleCount;
        if (needsMore) {
          setVisibleCount(Math.min(targetIdx + 20, questions.length));
        }
        setTimeout(() => {
          const targetEl = document.getElementById(`ca-card-${checkpoint.id}`) ||
                           document.querySelector(`[data-qid="${checkpoint.id}"]`) ||
                           document.getElementById(`card-q-${checkpoint.id}`);
          if (targetEl) {
            const scrollContainer = document.querySelector('.main-scroll');
            if (scrollContainer) {
              const containerRect = scrollContainer.getBoundingClientRect();
              const targetRect = targetEl.getBoundingClientRect();

              scrollContainer.style.scrollSnapType = 'none';

              window.caActivePartNum = partNum;
              if (window.caPodcastController) {
                window.caPodcastController.setPart(partNum, false);

          }}
        />
      ) : (
        /* ── VIEW 3: ▦ Standard Symmetrical Uniform Card Grid (Default) ── */
        <div className={`grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-6 w-full transition-all duration-300 ${activePodcastQId ? 'ca-cinema-container' : ''}`}>
          {questions.slice(0, visibleCount).map((item, i) => {
            const rowIndex = Math.floor(i / gridCols);
            const rowStart = rowIndex * gridCols;
            const rowEnd = rowStart + gridCols;
            const rowSlice = questions.slice(rowStart, rowEnd);
            const rowHasExpanded = rowSlice.some(q => expanded360Set.has(String(q.id)));
            const isThisExpanded = expanded360Set.has(String(item.id));
            const cardHeightClass = (rowHasExpanded && !isThisExpanded) ? 'self-start h-auto' : 'h-full';

            return (
              <CACard
                key={item.id}
                item={item}
                index={i}
                theme={theme}
                activeCategory={selectedCategory}
                categoryTotal={questions.length}
                catStats={catStatsMap[String(item.id)]}
                checkpoint={checkpoint}
                checkpointIndex={categoryQuestionIndex}
                onMarkLastRead={handleMarkLastRead}
                onShareCard={onShareCard}
                onTrackReadCard={onTrackReadCard}
                isPodcastActive={activePodcastQId === String(item.id)}
                isExpanded360={isThisExpanded}
                onToggle360={handleToggle360}
                cardHeightClass={cardHeightClass}
              />
            );
          })}

          {/* ⚡ High-Speed Virtualized Loading Sentinel */}
          {visibleCount < questions.length && (
            <div 
              ref={observerRef} 
              className="w-full py-8 flex flex-col items-center justify-center gap-2 col-span-full"
            >
              <div className="w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
              <span className="text-xs font-bold text-slate-400">Loading more questions... ({visibleCount}/{questions.length})</span>
            </div>
          )}
        </div>
      )}

      {/* Bulletproof mobile scroll snapping spacer */}
      <div className="h-40 md:h-0 w-full shrink-0 pointer-events-none snap-none" />
    </div>
  );
};

const FlashCards = ({ questions, theme, addMistake, goToMistakes }) => {
  const isDark = theme === 'dark';
  const isWarm = theme === 'warm';
  const currentTheme = theme;

  const categories = (window.caConfig && window.caConfig.categories) ? window.caConfig.categories : [];

  // --- Category Sub-Header State ---
  const [selectedCategory, setSelectedCategory] = useState('all');
  const scrollRef = useRef(null);
  const [showRight, setShowRight] = useState(true);
  const [showLeft,  setShowLeft]  = useState(false);

  // --- Flashcard Core States ---
  const [orderMode,        setOrderMode]        = useState('sequential');
  const [orderList,        setOrderList]        = useState([]);
  const [listIndex,        setListIndex]        = useState(0);
  const [isFlipped,        setIsFlipped]         = useState(false);
  const [transitionClass,  setTransitionClass]  = useState('');
  const [isCompleted,      setIsCompleted]      = useState(false);
  const [sessionMistakes,  setSessionMistakes]  = useState(0);
  const [confettiFired,    setConfettiFired]    = useState(false);
  const [isExpanded,       setIsExpanded]       = useState(false);

  // --- Anki Spaced Repetition States ---
  const [hardCount,        setHardCount]        = useState(0);
  const [goodCount,        setGoodCount]        = useState(0);
  const [masteredCount,    setMasteredCount]    = useState(0);

  const getMasterIndex = (id) => {
    const norm = (id || '').toLowerCase();
    if (norm === 'all') return 0;
    if (norm === 'world' || norm === 'first_world') return 1;
    if (norm === 'india' || norm === 'first_india') return 2;
    if (norm === 'sports' || norm === 'sport') return 3;
    if (norm === 'sci' || norm === 'science') return 4;
    if (norm === 'env' || norm === 'ecology') return 5;
    if (norm === 'economy' || norm === 'banking') return 6;
    if (norm === 'awards' || norm === 'appointments') return 7;
    if (norm === 'schemes' || norm === 'govt' || norm === 'yojana') return 8;
    if (norm === 'summits' || norm === 'conferences') return 9;
    if (norm === 'defense' || norm === 'security') return 10;
    if (norm === 'national' || norm === 'state') return 11;
    if (norm === 'intl' || norm === 'international') return 12;
    if (norm === 'indices' || norm === 'reports') return 13;
    if (norm === 'art' || norm === 'culture') return 14;
    if (norm === 'days' || norm === 'themes') return 15;
    if (norm === 'books' || norm === 'authors') return 16;
    if (norm === 'space' || norm === 'isro') return 17;
    if (norm === 'misc' || norm === 'miscellaneous') return 18;
    return 999;
  };

  const dropdownRef = useRef(null);

  // Click-outside auto-close for category dropdown menu
  useEffect(() => {
    if (!isExpanded) return;
    const handleClickOutside = (e) => {
      if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
        setIsExpanded(false);
      }
    };
    document.addEventListener('mousedown', handleClickOutside);
    document.addEventListener('touchstart', handleClickOutside);
    return () => {
      document.removeEventListener('mousedown', handleClickOutside);
      document.removeEventListener('touchstart', handleClickOutside);
    };
  }, [isExpanded]);

  const [windowWidth, setWindowWidth] = useState(typeof window !== 'undefined' ? window.innerWidth : 1280);
  const isMobile = windowWidth < 768;

  useEffect(() => {
    const handleResize = () => setWindowWidth(window.innerWidth);
    window.addEventListener('resize', handleResize);
    return () => window.removeEventListener('resize', handleResize);
  }, []);

  const isMega = (window.caConfig && window.caConfig.mode === 'mega') || (window.caConfig && window.caConfig.questions && window.caConfig.questions.length >= 400);

  const sortedCategories = useMemo(() => {
    const allQs = questions || [];
    return (categories || [])
      .filter(cat => {
        const count = cat.id === 'all'
          ? allQs.length
          : allQs.filter(q => q && q.category === cat.id).length;
        return cat.id === 'all' || count > 0;
      })
      .sort((a, b) => getMasterIndex(a.id) - getMasterIndex(b.id));
  }, [categories, questions]);

  const mainCategories = useMemo(() => {
    const allQs = questions || [];
    return sortedCategories.filter(cat => {
      if (cat.id === 'all') return true;
      const count = allQs.filter(q => q && q.category === cat.id).length;
      return count >= 5;
    });
  }, [sortedCategories, questions]);

  const lowCountCategories = useMemo(() => {
    const allQs = questions || [];
    return sortedCategories.filter(cat => {
      if (cat.id === 'all') return false;
      const count = allQs.filter(q => q && q.category === cat.id).length;
      return count < 5;
    });
  }, [sortedCategories, questions]);

  const threshold = 12;
  const visibleCats = isMobile
    ? sortedCategories
    : mainCategories.slice(0, threshold);

  // 'More' Dropdown categories: Sorted in DESCENDING ORDER by Question Count (highest first)
  const remainingCats = useMemo(() => {
    if (isMobile) return [];
    const allQs = questions || [];
    const overflowFromMain = mainCategories.slice(threshold);
    const combined = [...overflowFromMain, ...lowCountCategories];
    return combined.sort((a, b) => {
      const countA = allQs.filter(q => q && q.category === a.id).length;
      const countB = allQs.filter(q => q && q.category === b.id).length;
      if (countB !== countA) return countB - countA; // Descending by Question Count
      return getMasterIndex(a.id) - getMasterIndex(b.id); // Master sequence tie-breaker
    });
  }, [mainCategories, lowCountCategories, isMobile, questions]);

  const hasMore = !isMobile && remainingCats.length > 0;
  const isRemainingActive = remainingCats.some(cat => cat.id === selectedCategory);

  // Local Toast notification
  const [toast, setToast] = useState({ message: '', icon: '', visible: false });

  // Dynamically filter deck based on category
  const filteredDeck = useMemo(() => {
    if (selectedCategory === 'all') return questions;
    return questions.filter(q => q.category === selectedCategory);
  }, [selectedCategory, questions]);

  // Re-generate orderList when orderMode or filteredDeck changes (instant reset pointers)
  useEffect(() => {
    let newOrder = filteredDeck.map((_, index) => index);
    if (orderMode === 'random') {
      for (let i = newOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newOrder[i], newOrder[j]] = [newOrder[j], newOrder[i]];
      }
    }
    setOrderList(newOrder);

      isDown = true;
      el.style.cursor = 'grabbing';
      el.style.userSelect = 'none'; // prevent text selection

      scrollLeft = el.scrollLeft;

      isDown = false;
      el.style.cursor = 'grab';
    };

      isDown = false;

    };

      if (!isDown) return;
      e.preventDefault();
      const x = e.pageX - el.offsetLeft;
      const walk = (x - startX) * 1.5; // scroll speed multiplier
      el.scrollLeft = scrollLeft - walk;
    };

    const onWheel = (e) => {
      if (e.deltaY !== 0) {
        e.preventDefault();
        el.scrollLeft += e.deltaY * 0.85; // smooth scrolling speed factor
      }
    };

    // Set initial cursor style
    el.style.cursor = 'grab';

    // Attach listeners
    el.addEventListener('mousedown', onMouseDown);
    el.addEventListener('mouseleave', onMouseLeave);
    el.addEventListener('mouseup', onMouseUp);
    el.addEventListener('mousemove', onMouseMove);
    el.addEventListener('wheel', onWheel, { passive: false });

    // Store cleanup on node
    el._cleanupScrollListeners = () => {
      el.removeEventListener('mousedown', onMouseDown);
      el.removeEventListener('mouseleave', onMouseLeave);

// ===== components/MindMap.js =====
// ================================================================
//  MindMap.js — Reading Map (Visual Knowledge Tree & Rapid Scanning)
//  ✅ Left-to-Right Horizontal Tree Navigation
//  ✅ Root Hub (Left) ➔ Categories (Middle) ➔ Q&A Leaves (Right)
//  ✅ Minimalist Leaves: Question + Emerald Answer + Golden Trick
//  ✅ Direct Jump to Study Notes: [ 📖 Study Notes में विस्तार से देखें ➔ ]
//  ✅ Zero Bulky Text (Preserves Study Notes as primary deep learning powerhouse)
//  ✅ Category Filters, Search, Expand All / Collapse All
// ================================================================

const MindMap = ({
  questions = [],
  allQuestions = [],
  categories = [],
  theme = 'dark',
  month = 'जनवरी',
  year = 2026,
  searchQuery: externalSearchQuery = '',
  onOpenStudyCard
}) => {
  const isDark = theme === 'dark';
  const isWarm = theme === 'warm';

  // 🌟 Reading Map encompasses ALL 156 Questions across ALL Categories (Never filter out categories!)
  const sourceQuestions = React.useMemo(() => {
    if (allQuestions && allQuestions.length > 0) return allQuestions;
    if (window.caConfig && window.caConfig.questions && window.caConfig.questions.length > 0) return window.caConfig.questions;
    if (questions && questions.length > 0) return questions;
    return [];
  }, [allQuestions, questions]);

  // Selected category in Tree Mode ('all' or category ID)
  const [selectedCatId, setSelectedCatId] = React.useState('all');
  const rightStreamRef = React.useRef(null);

  // ⚡ Instant scroll-to-top reset on category change (0ms animated delay)
  React.useEffect(() => {
    if (rightStreamRef.current) {
      rightStreamRef.current.scrollTop = 0;
    }
  }, [selectedCatId]);
  
  // Expanded questions set (for trick / details toggle)
  const [expandedQs, setExpandedQs] = React.useState(new Set());

  // Search Query (Synced with external or local)
  const [searchQuery, setSearchQuery] = React.useState(externalSearchQuery || '');

  // 📍 Checkpoint State in Reading Map (Synced with globals / localStorage)
  const [checkpoint, setCheckpoint] = React.useState(() => {
    return window.getReadingCheckpoint ? window.getReadingCheckpoint('all') : null;
  });
  const [showBanner, setShowBanner] = React.useState(true);

  // Sync checkpoint on mount & on real-time update
  React.useEffect(() => {
    if (window.getReadingCheckpoint) {
      const cp = window.getReadingCheckpoint(selectedCatId || 'all');
      if (cp) setCheckpoint(cp);
    }
    const handleCpUpdate = () => {
      if (window.getReadingCheckpoint) {
        const cp = window.getReadingCheckpoint(selectedCatId || 'all');
        setCheckpoint(cp);
      }
    };
    window.addEventListener('ca_reading_checkpoint_updated', handleCpUpdate);
    return () => window.removeEventListener('ca_reading_checkpoint_updated', handleCpUpdate);
  }, [selectedCatId]);

  const handleMarkLastRead = (q) => {
    const isAlready = checkpoint && String(checkpoint.id) === String(q.id);
    if (isAlready) {
      if (window.clearReadingCheckpoint) {
        window.clearReadingCheckpoint('all');
        if (q.category) window.clearReadingCheckpoint(q.category);
      }
      setCheckpoint(null);
      setShowBanner(false);
    } else {
      if (window.setReadingCheckpoint) {
        window.setReadingCheckpoint('all', q);
        if (q.category) window.setReadingCheckpoint(q.category, q);
      }
      const cp = window.getReadingCheckpoint ? window.getReadingCheckpoint('all') : null;
      setCheckpoint(cp || q);
      setShowBanner(true);
    }
  };

  const handleContinueReading = () => {
    if (!checkpoint) return;
    if (checkpoint.category && selectedCatId !== checkpoint.category && selectedCatId !== 'all') {
      setSelectedCatId(checkpoint.category);
    }
    setTimeout(() => {
      const el = document.getElementById(`tree-leaf-${checkpoint.id}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('ring-4', 'ring-emerald-400');
        setTimeout(() => {
          if (el) el.classList.remove('ring-4', 'ring-emerald-400');
        }, 2500);
        setShowBanner(false);
      }
    }, 150);
  };

  const handleStartOver = () => {
    if (window.clearReadingCheckpoint) {
      window.clearReadingCheckpoint('all');
      if (checkpoint && checkpoint.category) window.clearReadingCheckpoint(checkpoint.category);
    }
    setCheckpoint(null);
    setShowBanner(false);
    setSelectedCatId('all');
    const scrollContainer = document.querySelector('.main-scroll');
    if (scrollContainer) scrollContainer.scrollTo({ top: 0, behavior: 'smooth' });
  };

  React.useEffect(() => {
    if (externalSearchQuery !== undefined) {
      setSearchQuery(externalSearchQuery);
    }
  }, [externalSearchQuery]);

  // Group questions by category (excluding 'all' to prevent duplicate 0 Qs entry)
  const categoryGroups = React.useMemo(() => {
    const map = {};
    (categories || []).forEach(c => {
      if (c && c.id && c.id !== 'all') {
        map[c.id] = { meta: c, questions: [] };
      }
    });

    (sourceQuestions || []).forEach(q => {
      const cat = q.category || 'misc';
      if (cat !== 'all') {
        if (!map[cat]) {
          map[cat] = { meta: { id: cat, label: cat, color: 'slate', icon: 'fa-circle-question' }, questions: [] };
        }
        map[cat].questions.push(q);
      }
    });

    // Keep only populated categories
    const cleanMap = {};
    Object.entries(map).forEach(([k, v]) => {
      if (v.questions && v.questions.length > 0) {
        cleanMap[k] = v;
      }
    });

    return cleanMap;
  }, [sourceQuestions, categories]);

  // Filtered categories and questions based on search
  const filteredGroups = React.useMemo(() => {
    if (!searchQuery.trim()) return categoryGroups;
    const query = searchQuery.toLowerCase().trim();
    const result = {};

    Object.entries(categoryGroups).forEach(([catId, group]) => {
      const matchedQs = group.questions.filter(q => 
        (q.question || '').toLowerCase().includes(query) ||
        (q.answer || '').toLowerCase().includes(query) ||
        (q.memoryTrick || '').toLowerCase().includes(query) ||
        (group.meta.label || '').toLowerCase().includes(query)
      );

      if (matchedQs.length > 0) {
        result[catId] = {
          ...group,
          questions: matchedQs
        };
      }
    });

    return result;
  }, [categoryGroups, searchQuery]);

  // Total questions count in filtered set
  const totalFilteredCount = React.useMemo(() => {
    return Object.values(filteredGroups).reduce((acc, g) => acc + g.questions.length, 0);
  }, [filteredGroups]);

  // Active category questions for Right Leaf Stream (Strictly sorted by Serial Number 1..N in 'all' mode)
  const activeTreeQuestions = React.useMemo(() => {
    if (selectedCatId === 'all') {
      const baseList = [...sourceQuestions].sort((a, b) => (parseInt(a.id, 10) || 0) - (parseInt(b.id, 10) || 0));
      if (!searchQuery.trim()) {
        return baseList;
      }
      const q = searchQuery.toLowerCase().trim();
      return baseList.filter(item => 
        (item.question || '').toLowerCase().includes(q) ||
        (item.answer || '').toLowerCase().includes(q) ||
        (item.memoryTrick || '').toLowerCase().includes(q) ||
        (item.category || '').toLowerCase().includes(q)
      );
    }
    return (filteredGroups[selectedCatId] && filteredGroups[selectedCatId].questions) || [];
  }, [selectedCatId, filteredGroups, sourceQuestions, searchQuery]);

  // 🎯 Category question sequence map: For each question ID, calculate { catIndex, catTotal }
  const catStatsMap = React.useMemo(() => {
    const map = {};
    const catListMap = {};

    (sourceQuestions || []).forEach(q => {
      const cat = q.category || 'misc';
      if (!catListMap[cat]) catListMap[cat] = [];
      catListMap[cat].push(q);
    });

    Object.values(catListMap).forEach(list => {
      const total = list.length;
      list.forEach((q, idx) => {
        map[String(q.id)] = {
          catIndex: idx + 1,
          catTotal: total
        };
      });
    });

    return map;
  }, [sourceQuestions]);

  // Find index of current checkpoint in the active stream (for auto-checking read questions)
  const checkpointIdx = React.useMemo(() => {
    if (!checkpoint || !activeTreeQuestions || !activeTreeQuestions.length) return -1;
    return activeTreeQuestions.findIndex(q => String(q.id) === String(checkpoint.id));
  }, [checkpoint, activeTreeQuestions]);

  const toggleQuestionExpand = (qId) => {
    setExpandedQs(prev => {
      const next = new Set(prev);
      if (next.has(qId)) next.delete(qId);
      else next.add(qId);
      return next;
    });
  };

  const handleExpandAll = () => {
    const allQIds = new Set((sourceQuestions || []).map(q => q.id));

      purple: isDark ? 'border-purple-500/60 bg-purple-950/40 text-purple-300' : 'border-purple-300 bg-purple-50 text-purple-800',
      rose: isDark ? 'border-rose-500/60 bg-rose-950/40 text-rose-300' : 'border-rose-300 bg-rose-50 text-rose-800',
      teal: isDark ? 'border-teal-500/60 bg-teal-950/40 text-teal-300' : 'border-teal-300 bg-teal-50 text-teal-800',
      indigo: isDark ? 'border-indigo-500/60 bg-indigo-950/40 text-indigo-300' : 'border-indigo-300 bg-indigo-50 text-indigo-800',
      pink: isDark ? 'border-pink-500/60 bg-pink-950/40 text-pink-300' : 'border-pink-300 bg-pink-50 text-pink-800',
      cyan: isDark ? 'border-cyan-500/60 bg-cyan-950/40 text-cyan-300' : 'border-cyan-300 bg-cyan-50 text-cyan-800',
      slate: isDark ? 'border-slate-700 bg-slate-900/60 text-slate-300' : 'border-slate-200 bg-slate-50 text-slate-800'
    };

    const selectedGlow = isDark

    return `${colorMap[color] || colorMap.slate} ${isSelected ? selectedGlow : 'hover:scale-[1.01]'}`;

    ? 'bg-[#faf6ee] border-[#ebdcb9] text-[#4a3b32] hover:border-amber-300'

              </span>

            {/* ── 🔖 Checkpoint Resume Banner in Reading Map ── */}
            {checkpoint && showBanner && (

// ===== components/mock/mockUtils.js =====
// components/mock/mockUtils.js — Exam-Style Mock Test Utilities & Shuffling Engine
// Reads config from window.caConfig.mockConfig

// ── States ──
const QS = { NV:'nv', NA:'na', ANS:'ans', MRK:'mrk', MA:'ma' };

// ── Date Formatting Helpers ──
const isToday = (ts) => {
  if (!ts) return false;
  const d = new Date(ts);
  const today = new Date();
  return d.getDate() === today.getDate() &&
         d.getMonth() === today.getMonth() &&
         d.getFullYear() === today.getFullYear();
};

const fmtDateText = (ts) => {
  if (!ts) return "recently";
  const d = new Date(ts);
  const today = new Date();
  if (d.getDate() === today.getDate() &&
      d.getMonth() === today.getMonth() &&
      d.getFullYear() === today.getFullYear()) {
    return "Today";
  }
  const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  return "on " + d.getDate() + " " + monthNames[d.getMonth()] + " " + d.getFullYear();
};

const fmtDateOnly = (ts) => {
  if (!ts) return "";
  const d = new Date(ts);
  const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  return d.getDate() + " " + monthNames[d.getMonth()] + " " + d.getFullYear();
};

// ── Palette Colors ──
const palColor = (s, dk) => {
  if (s===QS.ANS) return { bg: dk?'#052e16':'#dcfce7', fg: dk?'#4ade80':'#16a34a', br: dk?'#166534':'#86efac' };
  if (s===QS.NA)  return { bg: dk?'#450a0a':'#fee2e2', fg: dk?'#f87171':'#dc2626', br: dk?'#7f1d1d':'#fca5a5' };
  if (s===QS.MRK) return { bg: dk?'#3b0764':'#fdf4ff', fg: dk?'#d946ef':'#a21caf', br: dk?'#7e22ce':'#d946ef' };
  if (s===QS.MA)  return { bg:'#7c3aed', fg:'#ffffff', br:'#6d28d9' };
  return { bg: dk?'#1e293b':'#f1f5f9', fg: dk?'#64748b':'#94a3b8', br: dk?'#334155':'#e2e8f0' };
};

// ── Format Time ──
const fmt = s => {
  const t = Math.max(0,s);
  return String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0');
};

// ── Shuffle ──
const shuf = arr => [...arr].sort(()=>Math.random()-0.5);

// ── Deterministic Hash & Seeded Shuffler ──
const hashStr = (str) => {
  let hash = 0;
  const s = String(str || 'ca_mock_seed');
  for (let i = 0; i < s.length; i++) {
    hash = ((hash << 5) - hash) + s.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
};

const seededRandom = (seed) => {
  const s = Math.sin(seed) * 10000;
  return s - Math.floor(s);
};

const seededShuffle = (arr, seedKey = 'ca_mock_2026') => {
  const seed = hashStr(seedKey);
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const r = Math.abs(seededRandom(seed + i));
    const j = Math.floor(r * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
};

const stableShuf = (arr) => {
  return [...arr].sort((a, b) => {
    const ha = hashStr((a.id || a.question) + "ca_mock_2026");
    const hb = hashStr((b.id || b.question) + "ca_mock_2026");
    return ha - hb;
  });
};

// ── Universal Student Answer Lookup (Safe Fallback: idx -> qid_id) ──
const getStudentAnswer = (answers, q, idx) => {
  if (!answers || typeof answers !== 'object') return null;
  if (idx !== undefined && answers[idx] !== undefined) return answers[idx];
  if (q && q.id !== undefined && answers[`qid_${q.id}`] !== undefined) return answers[`qid_${q.id}`];
  if (q && q.id !== undefined && typeof q.id === 'string' && isNaN(Number(q.id)) && answers[q.id] !== undefined) return answers[q.id];
  return null;
};

// ── Build 4 options for a question (with Option D stability for "All/None of above") ──
const isFixedOptionD = (opt) => {
  if (!opt || typeof opt !== 'string') return false;
  const s = opt.toLowerCase().trim();
  return (
    s.includes('उपर्युक्त सभी') ||
    s.includes('उपरोक्त सभी') ||
    s.includes('इनमें से कोई नहीं') ||
    s.includes('इनमें से कोई भी नहीं') ||
    s.includes('all of the above') ||
    s.includes('all the above') ||
    s.includes('all of above') ||
    s.includes('none of the above') ||
    s.includes('none of above')
  );
};

const makeOpts = (q, allQs) => {
  const seed = String(q.id || q.question || 'opt_seed');
  if (q.options && Array.isArray(q.options) && q.options.length >= 2) {
    const rawOpts = [...q.options];
    const dIdx = rawOpts.findIndex(isFixedOptionD);
    if (dIdx !== -1) {
      // Keep "All/None of above" option strictly at Option D (index 3) and shuffle only the other 3
      const fixedOpt = rawOpts[dIdx];
      const otherOpts = seededShuffle(rawOpts.filter((_, idx) => idx !== dIdx), seed);
      return [...otherOpts, fixedOpt];
    }
    return seededShuffle(rawOpts, seed);
  }
  const others = seededShuffle([...new Set(allQs.map(x=>x.answer))].filter(a=>a!==q.answer), seed).slice(0,3);
  return seededShuffle([...others, q.answer], seed + '_opts');
};

// ── Build Sectional / Monthly sets (Strictly 25-Question Sets in Descending Year Priority) ──
const buildMonthly = (qs, mc) => {
  const tag = mc.monthlyExamTag || 'RRB/SSC IMP';
  const per = mc.questionsPerSet || 25;
  const min = mc.minQuestionsForTopicTest || 5;

  const isComputerMode = window.caConfig && (
    window.caConfig.mode === 'chapter' || 
    (window.caConfig.title && window.caConfig.title.toLowerCase().includes('computer')) || 
    (window.caConfig.month && window.caConfig.month.toLowerCase().includes('chapter'))
  );

  let filteredQs = qs.filter(q => !tag || q.examTag === tag || isComputerMode);
  if (filteredQs.length < min) return [];

  // 🎯 Helper to extract year and exam priority score for sorting
  const getQScore = (q) => {
    const fullDate = String(q.date || '') + ' ' + String(q.rawDate || '');
    const yrMatch = fullDate.match(/\b(20\d{2})\b/);
    const yr = yrMatch ? parseInt(yrMatch[1], 10) : 2000;
    
    // Level Priority within the same year: Graduate Level (GL) = 2, Undergraduate (UG) = 1
    let lvl = 0;
    if (/graduate|gl/i.test(fullDate) && !/under/i.test(fullDate)) {
      lvl = 2;
    } else if (/undergraduate|ug/i.test(fullDate)) {
      lvl = 1;
    }
    return yr * 10 + lvl;
  };

  // Sort descending by recency / year (2026 first, then 2025, 2022, 2021, etc.)
  // Stable sub-shuffle within the same score tier so questions within a year have good variety
  const tieredMap = {};
  filteredQs.forEach(q => {
    const sc = getQScore(q);
    if (!tieredMap[sc]) tieredMap[sc] = [];
    tieredMap[sc].push(q);
  });

  const sortedScores = Object.keys(tieredMap).map(Number).sort((a, b) => b - a);
  let fil = [];
  sortedScores.forEach(sc => {
    const shuffledTier = seededShuffle(tieredMap[sc], `tier_${sc}_seed`);
    fil = fil.concat(shuffledTier);
  });

  const getRoman = (num) => {
    const romans = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII','XXIV','XXV','XXVI','XXVII','XXVIII','XXIX','XXX','XXXI','XXXII','XXXIII','XXXIV','XXXV','XXXVI','XXXVII','XXXVIII','XXXIX','XL'];
    return romans[num - 1] || String(num);
  };

  const rawChunks = fil.reduce((acc, q, i) => {
    const si = Math.floor(i / per);
    if (!acc[si]) acc[si] = [];
    acc[si].push(q);
    return acc;
  }, []);

  // Strictly only include full 25-question sets (discard incomplete trailing mini-sets)
  const completeChunks = rawChunks.filter(chunk => chunk.length === per);

  return completeChunks.map((chunk, i) => {
    const testId = 'mt_' + i;
    return {
      id: testId,
      name: isComputerMode
        ? 'Sectional Mock Test ' + (i + 1)
        : 'Mock Test - ' + getRoman(i + 1),
      type: 'monthly',
      qs: seededShuffle(chunk, `monthly_test_${testId}`).map(q => ({...q, opts: makeOpts(q, qs)})), // Deterministic seed
      mins: Math.ceil(chunk.length * (mc.monthlyTimeMinutes || 15) / per),
      mark: mc.marksPerCorrect || 1,
      neg: mc.negativeMarking || 0.33,
    };
  });
};

// ── Build topic sets with 30-Question Buffer Rule & Balanced Splitting ──
const buildTopic = (qs, cats, mc) => {
  const min = mc.minQuestionsForTopicTest || 5;
  const tpq = mc.topicTimePerQuestion || 0.75;
  const mint = mc.topicMinTime || 5;
  const qps = mc.questionsPerSet || 25; // Default standard chunk size

  const smallCatQuestions = [];

  const mainTopicTests = cats.filter(c => c.id !== 'all').flatMap(cat => {
    // Stable shuffle for topics
    const cqs = seededShuffle(qs.filter(q => q.category === cat.id), `topic_${cat.id}_filter`);
    const totalCount = cqs.length;
    if (totalCount < min) {
      if (totalCount > 0) {
        smallCatQuestions.push(...cqs);
      }
      return [];
    }
    
    // Dynamic 30-Question Buffer Chunking
    const chunks = [];
    if (totalCount <= 30) {
      // Tier 1: 5 to 30 Questions (e.g. 18, 22, 27) -> 1 Single Complete Topic Master Capsule!
      chunks.push(cqs);
    } else if (totalCount <= 50) {
      // Tier 2: 31 to 50 Questions (e.g. 40 Qs) -> Even balanced split into 2 sets (e.g. 20 + 20)
      const half = Math.ceil(totalCount / 2);
      chunks.push(cqs.slice(0, half));
      chunks.push(cqs.slice(half));
    } else {
      // Tier 3: 51+ Questions -> Standard 25 chunks with tail-end buffer protection
      for (let i = 0; i < totalCount; i += qps) {
        const remaining = totalCount - i;
        if (remaining > 0 && remaining <= 5 && chunks.length > 0) {
          // If remaining is <= 5, merge into previous chunk so no tiny 2-3 question test is created
          chunks[chunks.length - 1] = chunks[chunks.length - 1].concat(cqs.slice(i));
          break;
        } else {
          chunks.push(cqs.slice(i, i + qps));
        }
      }
    }
    
    return chunks.map((chunk, index) => {
      const isMulti = chunks.length > 1;
      const setName = isMulti ? `${cat.label} — Set ${index + 1}` : `${cat.label} — Topic Test`;
      const setId = isMulti ? `tp_${cat.id}_set${index + 1}` : `tp_${cat.id}`;
      
      return {
        id: setId,
        name: setName,
        type: 'topic',
        qs: seededShuffle(chunk, `topic_test_${setId}`).map(q => ({...q, opts: makeOpts(q, qs)})), // Deterministic seed
        mins: Math.max(mint, Math.ceil(chunk.length * tpq)),
        mark: mc.marksPerCorrect || 1,
        neg: mc.negativeMarking || 0.33,
      };
    });
  }).filter(Boolean);

  // If there are micro-category questions (< 5 Qs each), create a Mixed & Other Topics Test
  if (smallCatQuestions.length > 0) {
    const mixedShuffled = seededShuffle(smallCatQuestions, 'topic_mixed_micro');
    mainTopicTests.push({
      id: 'tp_mixed_micro',
      name: 'Mixed & Other Topics Test (मिश्रित एवं अन्य टॉपिक्स)',
      type: 'topic',
      qs: seededShuffle(mixedShuffled, 'mixed_set').map(q => ({...q, opts: makeOpts(q, qs)})),
      mins: Math.max(mint, Math.ceil(mixedShuffled.length * tpq)),
      mark: mc.marksPerCorrect || 1,
      neg: mc.negativeMarking || 0.33,
    });
  }

  return mainTopicTests;
};

//  Palette Grid
