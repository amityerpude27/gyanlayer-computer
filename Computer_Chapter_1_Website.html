window.caReadingCheckpointsCache = null;

function _getCaReadingStorageKey() {
  return `ca_reading_checkpoint_${(window.caConfig && window.caConfig.month) || 'module'}`;
}

window.getAllReadingCheckpoints = function() {
  if (window.caReadingCheckpointsCache && typeof window.caReadingCheckpointsCache === 'object') {
    return window.caReadingCheckpointsCache;
  }
  const key = _getCaReadingStorageKey();
  let data = null;
  try {
    const raw = localStorage.getItem(key);
    if (raw) data = JSON.parse(raw);
  } catch(e) {}
  if (!data) {
    try {
      const rawSession = sessionStorage.getItem(key);
      if (rawSession) data = JSON.parse(rawSession);
    } catch(e) {}
  }
  window.caReadingCheckpointsCache = (data && typeof data === 'object') ? data : {};
  return window.caReadingCheckpointsCache;
};

window.getReadingCheckpoint = function(catId) {
  try {
    const data = window.getAllReadingCheckpoints();
    return data[catId || 'all'] || null;
  } catch(e) { return null; }
};

window.setReadingCheckpoint = function(catId, item) {
  try {
    const key = _getCaReadingStorageKey();
    const data = Object.assign({}, window.getAllReadingCheckpoints());
    const categoryKey = catId || 'all';
    data[categoryKey] = {
      id: item.id,
      bookQNum: item.bookQNum || null,
      question: item.question,
      category: item.category,
      timestamp: Date.now()
    };
    window.caReadingCheckpointsCache = data;
    try { localStorage.setItem(key, JSON.stringify(data)); } catch(e) {}
    try { sessionStorage.setItem(key, JSON.stringify(data)); } catch(e) {}

    // ⚡ Real-time Event Dispatch
    window.dispatchEvent(new CustomEvent('ca_reading_checkpoint_updated', {
      detail: { category: categoryKey, checkpoint: data[categoryKey], allCheckpoints: data }
    }));

    // ⚡ GyanLayer Parent App Bridge Sync
    if (window.dispatchReadingCheckpointEvent) {
      window.dispatchReadingCheckpointEvent(categoryKey, item, false, data);
    }
  } catch(e) {
    console.warn("Error setting reading checkpoint:", e);
  }
};

window.clearReadingCheckpoint = function(catId) {
  try {
    const key = _getCaReadingStorageKey();
    const data = Object.assign({}, window.getAllReadingCheckpoints());
    const categoryKey = catId || 'all';
    delete data[categoryKey];
    window.caReadingCheckpointsCache = data;
    try { localStorage.setItem(key, JSON.stringify(data)); } catch(e) {}
    try { sessionStorage.setItem(key, JSON.stringify(data)); } catch(e) {}

    window.dispatchEvent(new CustomEvent('ca_reading_checkpoint_updated', {
      detail: { category: categoryKey, checkpoint: null, allCheckpoints: data }
    }));

    if (window.dispatchReadingCheckpointEvent) {
      window.dispatchReadingCheckpointEvent(categoryKey, null, true, data);
    }
  } catch(e) {
    console.warn("Error clearing reading checkpoint:", e);
  }
};

window.restoreReadingCheckpoints = function(remoteData) {
  try {
    if (!remoteData || typeof remoteData !== 'object') return;
    const key = _getCaReadingStorageKey();
    const local = window.getAllReadingCheckpoints();
    const merged = Object.assign({}, local, remoteData);
    window.caReadingCheckpointsCache = merged;
    try { localStorage.setItem(key, JSON.stringify(merged)); } catch(e) {}
    try { sessionStorage.setItem(key, JSON.stringify(merged)); } catch(e) {}

    window.dispatchEvent(new CustomEvent('ca_reading_checkpoint_updated', {
      detail: { allCheckpoints: merged }
    }));
  } catch(e) {
    console.warn("Error restoring reading checkpoints:", e);
  }
};

// ================================================================
//  BottomNav.js — Mobile Bottom Navigation
//
//  ✅ EDIT THIS FILE FOR: Bottom nav appearance, tab icons
//  ✅ Fixed bottom, only visible on mobile (sm: hidden)
//  ✅ Safe area padding for iOS home bar + Android nav bar
//  ✅ Active indicator line at top of active tab
//  ✅ Solid background (no blur/bleed-through) so cards hide underneath cleanly
//  ❌ NO Eye Shield icon here
//  ❌ DO NOT add content rendering here
// ================================================================

const BottomNav = ({ tabs, activeTab, setActiveTab, theme, mistakeCount }) => {
  const isDark = theme === 'dark';
  const isWarm = theme === 'warm';

  // 100% Solid background color (no transparency / no blur) to cover content behind it
  const navBg = isDark
    ? 'bg-slate-950 border-slate-800'
    : isWarm
    ? 'bg-[#faf8f2] border-[#e8dcb5]'
    : 'bg-white border-slate-200';

  return (
    <nav
      className={`sm:hidden fixed bottom-0 left-0 right-0 z-40 border-t bottom-nav-safe ${navBg}`}
      role="navigation"
      aria-label="Main navigation"
    >
      <div className="flex items-stretch h-14">
        {tabs.map(tab => {
          const isActive = activeTab === tab.id;
          
          // Icon active color styling matching desktop
          const iconActiveCls = isActive && !isDark && !isWarm
            ? 'bg-gradient-to-tr from-violet-500 to-pink-500 text-transparent bg-clip-text'
            : isActive && isDark
            ? 'text-amber-400'
            : isActive && isWarm
            ? 'text-amber-800'
            : isDark
            ? 'text-slate-500'
            : 'text-slate-400';

          // Label text active color
          const labelCls = isActive
            ? isDark
              ? 'text-amber-400 font-bold'
              : isWarm
              ? 'text-[#b45309] font-bold' // Amber-700
              : 'text-pink-600 font-bold'    // Pink active color matching the gradient
            : isDark
            ? 'text-slate-500'
            : 'text-slate-400';

          // Top active indicator line
          const indicatorBg = isDark
            ? 'bg-amber-400'
            : isWarm
            ? 'bg-[#b45309]'
            : 'bg-gradient-to-r from-violet-500 to-pink-500';

          return (
            <button
              key={tab.id}
              id={`mobile-tab-${tab.id}`}
              onClick={() => setActiveTab(tab.id)}
              aria-label={tab.label}
              className="flex-1 relative flex flex-col items-center justify-center gap-0.5 transition-all duration-200 active:scale-95"
            >
              {/* Active indicator — top line */}
              {isActive && (
                <span className={`absolute top-0 left-3 right-3 h-0.5 rounded-full ${indicatorBg}`} />
              )}

              {/* Icon */}
              <i className={`fa-solid ${tab.icon} text-[15px] transition-transform ${isActive ? 'scale-110' : ''} ${iconActiveCls}`}></i>

              {/* Label */}
              <span className={`text-[10px] font-semibold leading-none ${labelCls}`}>
                {tab.mLabel}
              </span>

              {/* Mistake count badge */}
              {tab.id === 'mistakes' && mistakeCount > 0 && (
                <span className="absolute top-1 right-[18%] bg-rose-500 text-white text-[9px] font-black rounded-full min-w-[14px] h-3.5 flex items-center justify-center px-0.5">
                  {mistakeCount > 9 ? '9+' : mistakeCount}
                </span>
              )}
            </button>
          );
        })}
      </div>
    </nav>
  );
};

// ===== components/ShareCardModal.js =====
// ================================================================
//  ShareCardModal.js — 1-Click HD Question Card Image & Share Engine
//  ✅ 100% Native HTML5 2D Canvas Engine (0 CDN dependency, 0 CORS issues, 100% offline file:/// safe)
//  ✅ 1-Click Save HD PNG (1080x1080 Crisp Retina Resolution)
//  ✅ 1-Click Native Mobile Share (WhatsApp / Telegram / Instagram)
//  ✅ 1-Click Text Copy with bulletproof clipboard & textarea fallbacks
// ================================================================

const ShareCardModal = ({ isOpen, onClose, item, theme, catMeta }) => {
  if (!isOpen || !item) return null;

  const [isGenerating, setIsGenerating] = useState(false);
  const [copySuccess, setCopySuccess] = useState(false);
  const [downloadSuccess, setDownloadSuccess] = useState(false);
  const cardRef = useRef(null);

  const isDark = theme === 'dark';
  const cleanTrick = (item.memoryTrick || "").replace(/^(?:💡|🧠|🎯)\s*/, '');
  const catLabel = (catMeta && catMeta.label) || item.category || "Current Affairs";
  const examTag = item.examTag || "EXAM FOCUS";

  // 1-Click Bulletproof Copy Text
  const handleCopyText = (e) => {
    if (e && e.preventDefault) e.preventDefault();
    const textToCopy = `🎯 ${examTag} • ${catLabel}\n\n❓ प्रश्न: ${item.question}\n\n✅ सही उत्तर: ${item.answer}\n\n💡 मेमोरी ट्रिक: ${item.memoryTrick || "N/A"}\n\n📲 ज्ञानलेयर ऐप पर पूरी 360° व्याख्या और मॉक टेस्ट लगाएं:\n👉 https://www.gyanlayer.in`;

    let success = false;
    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
      navigator.clipboard.writeText(textToCopy)
        .then(() => {
          setCopySuccess(true);
          setTimeout(() => setCopySuccess(false), 2500);
        })
        .catch(() => {
          fallbackCopy(textToCopy);
        });
      return;
    }
    fallbackCopy(textToCopy);
  };

  const fallbackCopy = (text) => {
    try {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.top = "0";
      textarea.style.left = "0";
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      textarea.style.pointerEvents = "none";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      const res = document.execCommand("copy");
      document.body.removeChild(textarea);
      if (res) {
        setCopySuccess(true);
        setTimeout(() => setCopySuccess(false), 2500);
      }
    } catch (err) {
      console.warn("Copy failed:", err);
    }
  };

  // Helper to wrap text on 2D Canvas
  const wrapCanvasText = (ctx, text, x, y, maxWidth, lineHeight) => {
    const words = text.split(' ');
    let line = '';
    let currY = y;
    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      const metrics = ctx.measureText(testLine);
      if (metrics.width > maxWidth && n > 0) {
        ctx.fillText(line.trim(), x, currY);
        line = words[n] + ' ';
        currY += lineHeight;
      } else {
        line = testLine;
      }
    }
    ctx.fillText(line.trim(), x, currY);
    return currY + lineHeight;
  };

  // Generate High-Res 1080x1080 2D Canvas Image (100% Native & Instant)
  const generateHDCanvas = () => {
    const canvas = document.createElement('canvas');
    const width = 1080;
    const height = 1080;
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');

    // 1. Background Gradient
    const bgGrad = ctx.createLinearGradient(0, 0, width, height);
    bgGrad.addColorStop(0, '#0F172A');
    bgGrad.addColorStop(0.5, '#0A0F1C');
    bgGrad.addColorStop(1, '#1E1B4B');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, width, height);

    // 2. Decorative Outer Border
    ctx.strokeStyle = 'rgba(59, 130, 246, 0.4)';
    ctx.lineWidth = 6;
    ctx.strokeRect(30, 30, width - 60, height - 60);

    // 3. Header Badges
    // Exam Focus Tag
    ctx.fillStyle = '#E11D48';
    ctx.beginPath();
    ctx.roundRect(60, 60, 220, 50, 12);
    ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 22px system-ui, -apple-system, sans-serif';
    ctx.fillText(`🎯 ${examTag}`, 80, 93);

    // Category Tag
    ctx.fillStyle = 'rgba(30, 41, 59, 0.9)';
    ctx.beginPath();
    ctx.roundRect(295, 60, 420, 50, 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(71, 85, 105, 0.8)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#94A3B8';
    ctx.font = 'bold 20px system-ui, -apple-system, sans-serif';
    ctx.fillText(`📂 ${catLabel}`, 315, 93);

    // Brand Watermark
    ctx.fillStyle = '#38BDF8';
    ctx.font = '900 24px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('⚡ GYANLAYER', width - 60, 93);
    ctx.textAlign = 'left';

    // Divider Line
    ctx.strokeStyle = 'rgba(51, 65, 85, 0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(60, 140);
    ctx.lineTo(width - 60, 140);
    ctx.stroke();

    // 4. Question Text
    ctx.fillStyle = '#F8FAFC';
    ctx.font = 'bold 36px system-ui, -apple-system, sans-serif';
    const qStartY = 200;
    const qEnd = wrapCanvasText(ctx, `Q.${item.id}  ${item.question}`, 60, qStartY, width - 120, 52);

    // 5. Correct Answer Box
    const ansY = Math.max(qEnd + 20, 440);
    ctx.fillStyle = 'rgba(6, 78, 59, 0.7)';
    ctx.beginPath();
    ctx.roundRect(60, ansY, width - 120, 110, 20);
    ctx.fill();
    ctx.strokeStyle = 'rgba(16, 185, 129, 0.6)';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = '#34D399';
    ctx.font = 'bold 20px system-ui, -apple-system, sans-serif';
    ctx.fillText('✓ CORRECT ANSWER (सही उत्तर):', 90, ansY + 40);

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '900 34px system-ui, -apple-system, sans-serif';
    ctx.fillText(item.answer, 90, ansY + 85);

    // 6. Memory Trick Box
    if (item.memoryTrick) {
      const trickY = ansY + 140;
      ctx.fillStyle = 'rgba(120, 53, 15, 0.4)';
      ctx.beginPath();
      ctx.roundRect(60, trickY, width - 120, 240, 20);
      ctx.fill();
      ctx.strokeStyle = 'rgba(245, 158, 11, 0.6)';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = '#FBBF24';
      ctx.font = '900 22px system-ui, -apple-system, sans-serif';
      ctx.fillText('💡 SMART MEMORY TRICK (याद रखने की ट्रिक):', 90, trickY + 45);

      ctx.fillStyle = '#FEF3C7';
      ctx.font = '600 28px system-ui, -apple-system, sans-serif';
      wrapCanvasText(ctx, cleanTrick, 90, trickY + 95, width - 180, 42);
    }

    // 7. Footer Branding & Call to Action
    ctx.strokeStyle = 'rgba(51, 65, 85, 0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(60, height - 100);
    ctx.lineTo(width - 60, height - 100);
    ctx.stroke();

    ctx.fillStyle = '#38BDF8';
    ctx.font = 'bold 22px system-ui, -apple-system, sans-serif';
    ctx.fillText('📲 GyanLayer App • 360° Explanation & Mock Tests', 60, height - 50);

    ctx.fillStyle = '#94A3B8';
    ctx.font = 'mono 22px monospace';
    ctx.textAlign = 'right';
    ctx.fillText('www.gyanlayer.in', width - 60, height - 50);
    ctx.textAlign = 'left';

    return canvas;
  };

  // 1-Click Download HD Image
  const handleDownloadImage = () => {
    if (isGenerating) return;
    setIsGenerating(true);

    try {
      const canvas = generateHDCanvas();
      const imgData = canvas.toDataURL("image/png");
      const link = document.createElement("a");
      link.href = imgData;
      link.download = `GyanLayer_CurrentAffairs_Q${item.id || 'Card'}.png`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      setDownloadSuccess(true);
      setTimeout(() => setDownloadSuccess(false), 2500);
    } catch (err) {
      console.error("Error generating image:", err);
      handleCopyText();
    } finally {
      setIsGenerating(false);
    }
  };

  // 1-Click Universal Share (Native Mobile Sheet on Phone / 1-Click WhatsApp on PC)
  const handleNativeShare = () => {
    if (isGenerating) return;
    setIsGenerating(true);

    const shareText = `🎯 ${examTag} • ${catLabel}\n\n❓ प्रश्न: ${item.question}\n\n✅ सही उत्तर: ${item.answer}\n\n💡 मेमोरी ट्रिक: ${cleanTrick}\n\n📲 ज्ञानलेयर ऐप डाउनलोड करें:\n👉 https://www.gyanlayer.in`;

    const openWhatsAppFallback = (text) => {
      handleCopyText();
      const waUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(text);
      try {
        window.open(waUrl, "_blank", "noopener,noreferrer");
      } catch (e) {
        window.location.href = waUrl;
      }
    };

    // Layer 1: Mobile Native Share Sheet (Android/iOS)
    if (navigator.share) {
      try {
        const canvas = generateHDCanvas();
        if (canvas.toBlob && navigator.canShare) {
          canvas.toBlob((blob) => {
            let shared = false;
            try {
              if (blob && navigator.canShare({ files: [new File([blob], `GyanLayer_Q${item.id}.png`, { type: 'image/png' })] })) {
                const file = new File([blob], `GyanLayer_CA_Q${item.id}.png`, { type: 'image/png' });
                navigator.share({
                  title: (window.caConfig && window.caConfig.title) || 'GyanLayer Computer Awareness',
                  text: shareText,
                  files: [file]
                }).then(() => {
                  shared = true;
                  setIsGenerating(false);
                }).catch(() => {
                  if (!shared) {
                    navigator.share({
                      title: (window.caConfig && window.caConfig.title) || 'GyanLayer Computer Awareness',
                      text: shareText,
                      url: 'https://www.gyanlayer.in'
                    }).then(() => {
                      shared = true;
                      setIsGenerating(false);
                    }).catch(() => {
                      openWhatsAppFallback(shareText);
                      setIsGenerating(false);
                    });
                  }
                });
                return;
              }
            } catch (err) {}

            if (!shared) {
              navigator.share({
                title: (window.caConfig && window.caConfig.title) || 'GyanLayer Computer Awareness',
                text: shareText,
                url: 'https://www.gyanlayer.in'
              }).then(() => {
                setIsGenerating(false);
              }).catch(() => {
                openWhatsAppFallback(shareText);
                setIsGenerating(false);
              });
            }
          }, 'image/png');
          return;
        }

        navigator.share({
          title: (window.caConfig && window.caConfig.title) || 'GyanLayer Computer Awareness',
          text: shareText,
          url: 'https://www.gyanlayer.in'
        }).then(() => {
          setIsGenerating(false);
        }).catch(() => {
          openWhatsAppFallback(shareText);
          setIsGenerating(false);
        });
        return;
      } catch (e) {
        openWhatsAppFallback(shareText);
      }
    } else {
      // Layer 2: Desktop / Laptop (Open WhatsApp Web + Copy Text)
      openWhatsAppFallback(shareText);
    }
    setIsGenerating(false);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/75 backdrop-blur-md animate-fade-in-app">
      <div className="w-full max-w-md rounded-3xl border border-slate-700 bg-slate-900 shadow-2xl p-4 sm:p-5 flex flex-col gap-3 text-slate-100 max-h-[95vh] overflow-y-auto">
        
        {/* Modal Header */}
        <div className="flex items-center justify-between pb-2.5 border-b border-slate-800 shrink-0">
          <div className="flex items-center gap-2">
            <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white shadow-md shadow-cyan-500/30">
              <i className="fa-solid fa-share-nodes text-sm"></i>
            </div>
            <div>
              <h3 className="font-black text-sm sm:text-base leading-tight text-white">Share HD Infographic Card</h3>
              <p className="text-[10px] text-slate-400 font-medium">1-Click Share & Save</p>
            </div>
          </div>
          <button
            onClick={onClose}
            className="w-7 h-7 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-800 transition-colors cursor-pointer"
          >
            <i className="fa-solid fa-xmark text-sm"></i>
          </button>
        </div>

        {/* ── HD Card Preview Container ── */}
        <div 
          ref={cardRef}
          className="w-full rounded-2xl p-4 sm:p-5 border border-slate-700/80 bg-gradient-to-br from-[#0F172A] via-[#0A0F1C] to-[#1E1B4B] shadow-inner relative overflow-hidden shrink-0"
        >
          {/* Card Top Meta Badges */}
          <div className="flex items-center justify-between gap-1.5 mb-3">
            <div className="flex items-center gap-1.5 min-w-0">
              <span className="px-2 py-0.5 rounded-md bg-rose-600/90 text-white text-[9px] font-black uppercase tracking-wider">
                🎯 {examTag}
              </span>
              <span className="px-2 py-0.5 rounded-md bg-slate-800 text-slate-300 text-[9px] font-bold truncate max-w-[140px]">
                {catLabel}
              </span>
            </div>
            <div className="px-2 py-0.5 rounded-md bg-cyan-950/80 border border-cyan-800 text-cyan-300 text-[9px] font-black tracking-wider flex items-center gap-1">
              <span>⚡</span> GYANLAYER
            </div>
          </div>

          {/* Question Text */}
          <div className="mb-3">
            <p className="text-xs sm:text-sm font-bold leading-relaxed text-slate-100 text-left">
              <span className="font-black text-violet-400 mr-1.5">Q.{item.id}</span>
              {item.question}
            </p>
          </div>

          {/* Correct Answer Box */}
          <div className="p-2.5 rounded-xl bg-emerald-950/70 border border-emerald-500/60 mb-2.5 flex items-center justify-between">
            <span className="text-[10px] font-black uppercase tracking-wider text-emerald-400 flex items-center gap-1">
              <i className="fa-solid fa-circle-check"></i> सही उत्तर:
            </span>
            <span className="text-xs sm:text-sm font-black text-emerald-200">
              {item.answer}
            </span>
          </div>

          {/* Memory Trick Box */}
          {item.memoryTrick && (
            <div className="p-2.5 rounded-xl bg-gradient-to-br from-amber-950/60 via-yellow-950/40 to-orange-950/60 border border-amber-500/60 mb-2.5">
              <div className="text-[9.5px] font-black uppercase tracking-wider text-amber-400 mb-1 flex items-center gap-1">
                <span>💡 MEMORY TRICK</span>
              </div>
              <p className="text-xs font-semibold leading-relaxed text-amber-200">{cleanTrick}</p>
            </div>
          )}

          {/* Card Watermark Footer */}
          <div className="pt-2 border-t border-slate-800/80 flex items-center justify-between text-[9px] text-slate-400 font-semibold">
            <span className="flex items-center gap-1 text-cyan-400">
              <i className="fa-solid fa-mobile-screen"></i> GyanLayer App
            </span>
            <span className="font-mono text-slate-400">www.gyanlayer.in</span>
          </div>
        </div>

        {/* ── Modal Action Buttons ── */}
        <div className="pt-2 border-t border-slate-800 grid grid-cols-3 gap-2 shrink-0">
          
          {/* Share Button */}
          <button
            onClick={handleNativeShare}
            disabled={isGenerating}
            className="py-2.5 px-2 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-[11px] font-black flex items-center justify-center gap-1.5 shadow-md shadow-emerald-600/20 active:scale-95 transition-all cursor-pointer disabled:opacity-50"
          >
            <i className="fa-solid fa-share text-xs"></i>
            <span>{isGenerating ? 'Sharing...' : 'Share'}</span>
          </button>

          {/* Save Image Button */}
          <button
            onClick={handleDownloadImage}
            disabled={isGenerating}
            className="py-2.5 px-2 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white text-[11px] font-black flex items-center justify-center gap-1.5 shadow-md shadow-violet-600/20 active:scale-95 transition-all cursor-pointer disabled:opacity-50"
          >
            <i className={`fa-solid ${downloadSuccess ? 'fa-check text-emerald-300' : 'fa-download'} text-xs`}></i>
            <span>{downloadSuccess ? 'Saved!' : 'Save Image'}</span>

          {/* Copy Text Button */}

            onClick={handleCopyText}

    </div>
  );
};

// ===== components/PodcastModal.js =====
// ================================================================
//  PodcastModal.js — Continuous Hands-Free Podcast Settings Modal
//  ✅ Seamless Speed Change with Zero Playback Interruption (No Reset to Q1)
//  ✅ Quick Jump to Current Q, Q.1, Saved Checkpoint, or Any Custom Question
//  ✅ Full YouTube-grade Speed Picker (0.75x to 2.0x) with Real-Time Audio Feedback
// ================================================================

const PodcastModal = ({
  isOpen,
  onClose,
  onStartPodcast,
  questions,
  categories,
  selectedCategory,
  theme,
  checkpoint,
  podcastState
}) => {
  if (!isOpen) return null;

  const isDark = theme === 'dark';
  const isWarm = theme === 'warm';
  const isCurrentlyActive = Boolean(podcastState && podcastState.isActive);

  // Filter questions by active category if needed
  const activeCatQs = React.useMemo(() => {
    if (!questions) return [];
    if (selectedCategory === 'all') return questions;
    return questions.filter(q => q && q.category === selectedCategory);
  }, [questions, selectedCategory]);

  const catMeta = (categories || []).find(c => c.id === selectedCategory) || { name: 'सभी टॉपिक्स' };

  // Determine current active question number if running
  const activeCurrentQ = podcastState && podcastState.currentQ;
  const activeCurrentQNum = activeCurrentQ ? activeCurrentQ.id : (podcastState ? podcastState.currentIndex + 1 : 1);

  // Local state
  const [scope, setScope] = React.useState(selectedCategory === 'all' ? 'all' : 'topic');
  const [startMode, setStartMode] = React.useState(() => {
    if (isCurrentlyActive) return 'current';
    if (checkpoint) return 'checkpoint';
    return 'first';
  });
  const [customNum, setCustomNum] = React.useState('');
  const [speed, setSpeed] = React.useState(() => {
    if (podcastState && podcastState.speed) return podcastState.speed;
    if (typeof localStorage !== 'undefined') {
      const saved = parseFloat(localStorage.getItem('ca_podcast_speed'));
      if (!isNaN(saved) && saved > 0) return saved;
    }
    return 1.25;
  });

  const [speedAppliedNotice, setSpeedAppliedNotice] = React.useState(false);

  const playlist = scope === 'all' ? questions : activeCatQs;
  const totalCount = playlist.length;

  const handleSelectSpeed = (s) => {
    setSpeed(s);
    setSpeedAppliedNotice(true);
    setTimeout(() => setSpeedAppliedNotice(false), 2000);
    // Real-time apply to active controller
    if (window.caPodcastController && isCurrentlyActive) {
      window.caPodcastController.setSpeed(s);
    }
  };

  const handleAction = () => {
    // If user just wanted to keep playing current question and apply settings
    if (startMode === 'current' && isCurrentlyActive) {
      if (window.caPodcastController) {
        window.caPodcastController.setSpeed(speed);
        if (!podcastState.isPlaying) {
          window.caPodcastController.resume();
        }
      }
      onClose();
      return;
    }

    let startIndex = 0;
    if (startMode === 'current' && isCurrentlyActive) {
      startIndex = podcastState.currentIndex || 0;
    } else if (startMode === 'checkpoint' && checkpoint) {
      const idx = playlist.findIndex(q => String(q.id) === String(checkpoint.id));
      if (idx !== -1) startIndex = idx;
    } else if (startMode === 'custom') {
      const parsed = parseInt(customNum, 10);
      if (!isNaN(parsed) && parsed >= 1) {
        const idx = playlist.findIndex(q => parseInt(q.id, 10) === parsed);
        if (idx !== -1) startIndex = idx;
        else startIndex = Math.min(Math.max(0, parsed - 1), playlist.length - 1);
      }
    }

    onStartPodcast({
      playlist,
      startIndex,
      speed,
      scopeTitle: scope === 'all' ? 'सभी टॉपिक्स' : catMeta.name
    });
    onClose();
  };

  const modalBg = isDark ? 'bg-slate-900 border-slate-800 text-slate-100' : isWarm ? 'bg-[#faf6ee] border-[#ebdcb9] text-[#4a3b32]' : 'bg-white border-slate-200 text-slate-900';
  const cardSectionBg = isDark ? 'bg-slate-950/60 border-slate-800' : isWarm ? 'bg-[#f4ecdb] border-[#e2d2ad]' : 'bg-slate-50 border-slate-200/80';

  const speedOptions = [
    { val: 0.75, label: '0.75x', desc: 'धीमा' },
    { val: 1.0,  label: '1.0x',  desc: 'सामान्य' },
    { val: 1.25, label: '1.25x ⚡', desc: 'अनुशंसित' },
    { val: 1.5,  label: '1.5x 🔥', desc: 'फ़ास्ट' },
    { val: 1.75, label: '1.75x', desc: 'सुपर' },
    { val: 2.0,  label: '2.0x 🚀', desc: '2x स्पीड' }
  ];

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/60 backdrop-blur-xs animate-fade-in-app">
      <div className={`w-full max-w-md rounded-3xl border shadow-2xl p-5 sm:p-6 flex flex-col gap-4 max-h-[90vh] overflow-y-auto ${modalBg}`}>
        
        {/* Modal Header */}
        <div className="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
          <div className="flex items-center gap-2.5">
            <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center text-white shadow-md shadow-amber-500/30">
              <i className="fa-solid fa-headphones text-lg"></i>
            </div>
            <div>
              <h3 className="font-black text-base sm:text-lg leading-tight">🎧 पॉडकास्ट मोड (Podcast)</h3>
              <p className="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 font-medium">बिना स्क्रीन देखे लगातार पूरे करंट अफेयर्स सुनें</p>
            </div>
          </div>
          <button
            onClick={onClose}
            className="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
          >
            <i className="fa-solid fa-xmark text-base"></i>
          </button>
        </div>

        {/* Live Active Status Banner (If podcast is running) */}
        {isCurrentlyActive && (
          <div className="p-2.5 rounded-xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-700 dark:text-emerald-300 text-xs flex items-center justify-between gap-2">
            <div className="flex items-center gap-2 truncate">
              <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping shrink-0"></span>
              <span className="font-black truncate">चालू पॉडकास्ट: Q.{activeCurrentQNum} ({podcastState.isPlaying ? 'बज रहा है 🔊' : 'रोका गया ⏸️'})</span>
            </div>
            <span className="px-2 py-0.5 rounded-md bg-emerald-600 text-white font-black text-[10px] shrink-0">
              {podcastState.speed}x Active
            </span>
          </div>
        )}

        {/* 1. Scope Selector */}
        <div className={`p-3.5 rounded-2xl border flex flex-col gap-2 ${cardSectionBg}`}>
          <label className="text-[11px] sm:text-xs font-black uppercase tracking-wider text-amber-600 dark:text-amber-400 flex items-center gap-1.5">
            <i className="fa-solid fa-layer-group"></i> 1. टॉपिक स्कोप चुनें
          </label>
          <div className="grid grid-cols-2 gap-2">
            <button
              type="button"
              onClick={() => setScope('all')}
              className={`py-2 px-2.5 rounded-xl border text-xs font-black transition-all flex items-center justify-center gap-1.5 cursor-pointer ${
                scope === 'all'
                  ? 'bg-amber-500 border-amber-400 text-white shadow-sm'
                  : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300'
              }`}
            >
              <span>🌐 सभी ({questions ? questions.length : 0})</span>
            </button>
            <button
              type="button"
              onClick={() => setScope('topic')}
              disabled={selectedCategory === 'all'}
              className={`py-2 px-2.5 rounded-xl border text-xs font-black transition-all flex items-center justify-center gap-1.5 truncate cursor-pointer ${
                selectedCategory === 'all'
                  ? 'opacity-40 cursor-not-allowed bg-slate-100 dark:bg-slate-800 border-transparent text-slate-400'
                  : scope === 'topic'
                  ? 'bg-amber-500 border-amber-400 text-white shadow-sm'
                  : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300'
              }`}
              title={selectedCategory === 'all' ? "पहले ऊपर से कोई टॉपिक चुनें" : catMeta.name}
            >
              <span className="truncate">🎯 {selectedCategory === 'all' ? 'टॉपिक चुनें' : `${catMeta.name} (${activeCatQs.length})`}</span>
            </button>
          </div>
        </div>

        {/* 2. Start Position Selector */}
        <div className={`p-3.5 rounded-2xl border flex flex-col gap-2.5 ${cardSectionBg}`}>
          <label className="text-[11px] sm:text-xs font-black uppercase tracking-wider text-amber-600 dark:text-amber-400 flex items-center gap-1.5">
            <i className="fa-solid fa-play"></i> 2. कहाँ से सुनना है?
          </label>
          <div className={`grid ${isCurrentlyActive ? 'grid-cols-2 sm:grid-cols-4' : 'grid-cols-3'} gap-1.5`}>
            {isCurrentlyActive && (
              <button
                type="button"
                onClick={() => setStartMode('current')}
                className={`py-2 px-1.5 rounded-xl border text-[11px] font-bold transition-all text-center cursor-pointer truncate ${
                  startMode === 'current'
                    ? 'bg-emerald-600 border-emerald-500 text-white shadow-sm font-black ring-2 ring-emerald-400/50'
                    : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300'
                }`}
                title={`चालू प्रश्न Q.${activeCurrentQNum} से ही सुनें`}
              >
                ▶️ Q.{activeCurrentQNum} चालू
              </button>
            )}
            <button
              type="button"
              onClick={() => setStartMode('first')}
              className={`py-2 px-1.5 rounded-xl border text-[11px] font-bold transition-all text-center cursor-pointer ${
                startMode === 'first'
                  ? 'bg-amber-500 border-amber-400 text-white shadow-sm font-black'
                  : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300'
              }`}
            >
              🔄 Q. 1 से
            </button>
            <button
              type="button"
              onClick={() => setStartMode('checkpoint')}
              disabled={!checkpoint}
              className={`py-2 px-1.5 rounded-xl border text-[11px] font-bold transition-all text-center truncate cursor-pointer ${
                !checkpoint
                  ? 'opacity-40 cursor-not-allowed bg-slate-100 dark:bg-slate-800 border-transparent text-slate-400'
                  : startMode === 'checkpoint'
                  ? 'bg-amber-500 border-amber-400 text-white shadow-sm font-black'
                  : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300'
              }`}
              title={checkpoint ? `Saved Q.${checkpoint.id}` : "कोई चेकपॉइंट सेव नहीं है"}
            >
              🔖 {checkpoint ? `Q.${checkpoint.id}` : 'चेकपॉइंट'}
            </button>
            <button
              type="button"
              onClick={() => setStartMode('custom')}
              className={`py-2 px-1.5 rounded-xl border text-[11px] font-bold transition-all text-center cursor-pointer ${
                startMode === 'custom'
                  ? 'bg-amber-500 border-amber-400 text-white shadow-sm font-black'
                  : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300'
              }`}
            >
              🔢 मनचाहा No.
            </button>
          </div>

          {startMode === 'custom' && (
            <div className="flex items-center gap-2 mt-1 animate-fade-in-app">
              <span className="text-xs font-bold text-slate-500 dark:text-slate-400 shrink-0">प्रश्न संख्या (1–{totalCount}):</span>
              <input
                type="number"
                min="1"
                max={totalCount}
                placeholder={`1 से ${totalCount}`}
                value={customNum}
                onChange={e => setCustomNum(e.target.value)}
                autoFocus
                className="flex-1 py-1.5 px-3 rounded-xl border border-amber-400/60 bg-white dark:bg-slate-900 text-xs font-black text-center focus:outline-none focus:ring-2 focus:ring-amber-500"
              />
            </div>
          )}
        </div>

        {/* 3. Playback Speed Selector (YouTube Grade) */}
        <div className={`p-3.5 rounded-2xl border flex flex-col gap-2 ${cardSectionBg}`}>
          <div className="flex items-center justify-between">
            <label className="text-[11px] sm:text-xs font-black uppercase tracking-wider text-amber-600 dark:text-amber-400 flex items-center gap-1.5">
              <i className="fa-solid fa-gauge-high"></i> 3. आवाज की स्पीड (Playback Speed)
            </label>
            {speedAppliedNotice && (
              <span className="text-[10px] font-black text-emerald-600 dark:text-emerald-400 animate-pulse">
                ⚡ स्पीड लागू हो गई!
              </span>
            )}
          </div>
          
          <div className="grid grid-cols-3 sm:grid-cols-6 gap-1.5">
            {speedOptions.map(opt => (
              <button
                key={opt.val}
                type="button"
                onClick={() => handleSelectSpeed(opt.val)}
                className={`py-2 px-1 rounded-xl border text-center transition-all cursor-pointer ${
                  speed === opt.val
                    ? 'bg-amber-500 border-amber-400 text-white font-black shadow-sm ring-1 ring-amber-300'
                    : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:border-amber-400'
                }`}
                title={opt.desc}
              >
                <div className="text-xs font-black">{opt.label}</div>
                <div className={`text-[8.5px] opacity-80 ${speed === opt.val ? 'text-white' : 'text-slate-400'}`}>{opt.desc}</div>
              </button>
            ))}
          </div>
        </div>

        {/* Action Button */}
        <button
          onClick={handleAction}
          className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 hover:from-amber-600 hover:to-orange-600 text-white font-black text-sm sm:text-base tracking-wide shadow-lg shadow-orange-500/25 transition-all transform hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-2 cursor-pointer"
        >
          {isCurrentlyActive && startMode === 'current' ? (
            <React.Fragment>
              <i className="fa-solid fa-circle-check text-lg"></i>
              <span>✅ सेटिंग्स लागू करें (Q.{activeCurrentQNum} चालू रखें)</span>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <i className="fa-solid fa-circle-play text-lg"></i>
              <span>
                {startMode === 'first' 
                  ? `पॉडकास्ट शुरू करें (${totalCount} सवाल)` 
                  : startMode === 'custom' && customNum
                  ? `Q.${customNum} से शुरू करें`
                  : startMode === 'checkpoint' && checkpoint
                  ? `Q.${checkpoint.id} से शुरू करें`
                  : `पॉडकास्ट शुरू करें`}
              </span>
            </React.Fragment>
          )}
        </button>

      </div>
    </div>
  );
};

window.PodcastModal = PodcastModal;


// ===== components/PodcastPlayer.js =====
// ================================================================
//  PodcastPlayer.js — Ultra-Smooth Draggable & Minimizable Audio Player
//  ✅ YouTube-Grade Speed Popover (0.75x to 2.0x) with Live Real-Time Change
//  ✅ Quick Question Jumper (मनचाहा प्रश्न तुरंत लगाएं) via 1-Click Popover
//  ✅ Seamless Drag & Drop anywhere on screen via mouse or touch
//  ✅ 1-Click Stealth / Minimize Mode for Clean YouTube Screen Recording
//  ✅ Pro Keyboard Hotkeys: [Space] Play/Pause, [→/N] Next, [←/P] Prev, [M] Minimize, [Esc] Close
// ================================================================

const PodcastPlayer = ({
  podcastState,
  onTogglePlay,
  onNext,
  onPrev,
  onChangeSpeed,
  onJumpTo,
  onClose,
  theme
}) => {
  if (!podcastState || !podcastState.isActive) return null;

  const isDark = theme === 'dark';
  const isWarm = theme === 'warm';

  const {
    currentQ,
    currentIndex,
    totalCount,
    isPlaying,
    speed,
    scopeTitle
  } = podcastState;

  const currentQNum = currentQ ? currentQ.id : (currentIndex + 1);
  const qText = currentQ ? currentQ.question : "ऑडियो लोड हो रहा है...";

  // Minimize / Stealth mode state for screen recording
  const [isMinimized, setIsMinimized] = React.useState(false);

  // Popovers state
  const [showSpeedMenu, setShowSpeedMenu] = React.useState(false);
  const [showJumpMenu, setShowJumpMenu] = React.useState(false);
  const [jumpInputVal, setJumpInputVal] = React.useState('');
  const [feedbackToast, setFeedbackToast] = React.useState('');

  const triggerToast = (msg) => {
    setFeedbackToast(msg);
    setTimeout(() => setFeedbackToast(''), 2200);
  };

  // 🖱️ Ultra-Smooth Freeform Dragging State
  const [pos, setPos] = React.useState({ x: 0, y: 0 });
  const isDraggingRef = React.useRef(false);
  const dragOffsetRef = React.useRef({ x: 0, y: 0 });

  const speedOptions = [
    { val: 0.75, label: '0.75x', tag: 'धीमा' },
    { val: 1.0,  label: '1.0x',  tag: 'सामान्य' },
    { val: 1.25, label: '1.25x ⚡', tag: 'अनुशंसित' },
    { val: 1.5,  label: '1.5x 🔥', tag: 'तेज़' },
    { val: 1.75, label: '1.75x', tag: 'सुपर' },
    { val: 2.0,  label: '2.0x 🚀', tag: '2x' }
  ];

  const handleSelectSpeed = (s) => {
    onChangeSpeed(s);
    setShowSpeedMenu(false);
    triggerToast(`⚡ स्पीड: ${s}x`);
  };

  const handleExecuteJump = (targetIdx) => {
    if (typeof onJumpTo === 'function') {
      onJumpTo(targetIdx);
    } else if (window.caPodcastController) {
      window.caPodcastController.jumpTo(targetIdx);
    }
    setShowJumpMenu(false);
    setJumpInputVal('');
    triggerToast(`🎯 Q.${typeof targetIdx === 'number' ? targetIdx + 1 : targetIdx} पर जंप किया`);
  };

  const handleJumpSubmit = (e) => {
    if (e) e.preventDefault();
    const parsed = parseInt(jumpInputVal, 10);
    if (!isNaN(parsed) && parsed >= 1 && parsed <= totalCount) {
      handleExecuteJump(parsed - 1);
    }
  };

  // ⌨️ Pro Studio Keyboard Shortcuts Engine
  React.useEffect(() => {
    const handleKeyDown = (e) => {
      const tag = (document.activeElement && document.activeElement.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || (document.activeElement && document.activeElement.isContentEditable)) {
        return;
      }

      if (e.code === 'Space' || e.code === 'KeyP' || e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        onTogglePlay();
      } else if (e.code === 'ArrowRight' || e.code === 'KeyN') {
        e.preventDefault();
        onNext();
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        onPrev();
      } else if (e.code === 'KeyM') {
        e.preventDefault();
        setIsMinimized(prev => !prev);
      } else if (e.code === 'Escape') {
        e.preventDefault();
        if (showSpeedMenu || showJumpMenu) {
          setShowSpeedMenu(false);
          setShowJumpMenu(false);
        } else {
          onClose();
        }
      }
    };

    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [onTogglePlay, onNext, onPrev, onClose, showSpeedMenu, showJumpMenu]);

  // 🖱️ Drag Start
  const handleStartDrag = (e) => {
    if (e.target.closest('button') || e.target.closest('input') || e.target.closest('a') || e.target.closest('.no-drag')) {
      return;
    }
    const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

    isDraggingRef.current = true;
    dragOffsetRef.current = {
      x: clientX - pos.x,
      y: clientY - pos.y
    };
    document.body.style.userSelect = 'none';
  };

  React.useEffect(() => {
    const handleMove = (e) => {
      if (!isDraggingRef.current) return;
      const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
      const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

      setPos({
        x: clientX - dragOffsetRef.current.x,
        y: clientY - dragOffsetRef.current.y
      });
    };

    const handleEnd = () => {
      if (isDraggingRef.current) {
        isDraggingRef.current = false;
        document.body.style.userSelect = '';
      }
    };

    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);
    window.addEventListener('touchmove', handleMove, { passive: true });
    window.addEventListener('touchend', handleEnd);

    return () => {
      window.removeEventListener('mousemove', handleMove);
      window.removeEventListener('mouseup', handleEnd);
      window.removeEventListener('touchmove', handleMove);
      window.removeEventListener('touchend', handleEnd);
      document.body.style.userSelect = '';
    };
  }, [pos]);

  const bgStyle = isDark
    ? 'bg-slate-900/95 border-slate-700/80 text-slate-100 shadow-[0_10px_35px_rgba(0,0,0,0.6)]'
    : isWarm
    ? 'bg-[#faf6ee]/95 border-[#d6c4a1] text-[#4a3b32] shadow-[0_10px_30px_rgba(139,115,85,0.25)]'
    : 'bg-white/95 border-slate-300 text-slate-900 shadow-[0_10px_35px_rgba(0,0,0,0.15)]';

  const menuBg = isDark ? 'bg-slate-900 border-slate-700 text-slate-100' : 'bg-white border-slate-200 text-slate-900';

  return (
    <div 
      onMouseDown={handleStartDrag}
      onTouchStart={handleStartDrag}
      style={{
        transform: `translate3d(${pos.x}px, ${pos.y}px, 0)`,
        cursor: 'move',
        touchAction: 'none'
      }}
      className="fixed bottom-16 sm:bottom-5 left-2 right-2 sm:left-auto sm:right-6 sm:w-[420px] z-50 animate-slide-up-app backdrop-blur-md select-none transition-shadow"
      title="माउस से पकड़कर स्क्रीन पर कहीं भी ले जाएं (Drag anywhere on screen)"
    >
      {/* 🔔 Transient Instant Feedback Toast */}
      {feedbackToast && (
        <div className="absolute -top-9 left-1/2 -translate-x-1/2 px-3 py-1 rounded-full bg-emerald-600 text-white font-black text-xs shadow-lg animate-fade-in-app shrink-0 pointer-events-none whitespace-nowrap z-50">
          {feedbackToast}
        </div>
      )}

      {/* ⚡ SPEED POPOVER MENU (YouTube Grade) */}
      {showSpeedMenu && !isMinimized && (
        <div 
          onClick={e => e.stopPropagation()} 
          className={`no-drag absolute bottom-full mb-2 left-2 right-2 sm:left-auto sm:right-0 sm:w-64 p-3 rounded-2xl border shadow-2xl z-50 ${menuBg} animate-fade-in-app`}
        >
          <div className="flex items-center justify-between pb-2 mb-2 border-b border-slate-200 dark:border-slate-800">
            <span className="text-xs font-black uppercase text-amber-500 flex items-center gap-1.5">
              <i className="fa-solid fa-gauge-high"></i> प्लेबैक स्पीड (Speed)
            </span>
            <button
              onClick={() => setShowSpeedMenu(false)}
              className="w-5 h-5 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xs"
            >
              ✕
            </button>
          </div>
          <div className="grid grid-cols-2 gap-1.5">
            {speedOptions.map(opt => (
              <button
                key={opt.val}
                type="button"
                onClick={() => handleSelectSpeed(opt.val)}
                className={`py-2 px-2.5 rounded-xl border text-left text-xs font-bold transition-all flex items-center justify-between cursor-pointer ${
                  speed === opt.val
                    ? 'bg-amber-500 text-white border-amber-400 font-black shadow-xs'
                    : 'bg-slate-50 dark:bg-slate-800/80 border-slate-200 dark:border-slate-700 hover:border-amber-400 text-slate-700 dark:text-slate-200'
                }`}
              >
                <span>{opt.label}</span>
                <span className={`text-[10px] ${speed === opt.val ? 'text-white' : 'text-slate-400'}`}>{opt.tag}</span>
              </button>
            ))}
          </div>
        </div>
      )}

      {/* 🎯 DIRECT QUESTION JUMP POPOVER */}
      {showJumpMenu && !isMinimized && (
        <div 
          onClick={e => e.stopPropagation()} 
          className={`no-drag absolute bottom-full mb-2 left-2 right-2 sm:left-0 sm:right-auto sm:w-80 p-3 rounded-2xl border shadow-2xl z-50 ${menuBg} animate-fade-in-app`}
        >
          <div className="flex items-center justify-between pb-2 mb-2 border-b border-slate-200 dark:border-slate-800">
            <span className="text-xs font-black uppercase text-amber-500 flex items-center gap-1.5">
              <i className="fa-solid fa-crosshairs"></i> मनचाहे प्रश्न पर जाएं
            </span>
            <button
              onClick={() => setShowJumpMenu(false)}
              className="w-5 h-5 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xs"
            >
              ✕
            </button>
          </div>

          <form onSubmit={handleJumpSubmit} className="flex items-center gap-1.5 mb-2.5">
            <input
              type="number"
              min="1"
              max={totalCount}
              placeholder={`1 से ${totalCount}`}
              value={jumpInputVal}
              onChange={e => setJumpInputVal(e.target.value)}
              autoFocus
              className="flex-1 py-1.5 px-3 rounded-xl border border-amber-400/60 bg-white dark:bg-slate-900 text-xs font-black text-center focus:outline-none focus:ring-2 focus:ring-amber-500"
            />
            <button
              type="submit"
              className="py-1.5 px-4 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-black text-xs shadow-xs cursor-pointer active:scale-95"
            >
              जाएं ▶
            </button>
          </form>

          {/* Quick Jump Chips */}
          <div className="flex items-center gap-1 flex-wrap">
            <button
              type="button"
              onClick={() => handleExecuteJump(0)}
              className="py-1 px-2 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-[10px] font-bold text-slate-600 dark:text-slate-300 hover:border-amber-400 cursor-pointer"
            >
              ⏪ Q.1
            </button>
            <button
              type="button"
              onClick={() => handleExecuteJump(Math.max(0, currentIndex - 5))}
              disabled={currentIndex <= 0}
              className="py-1 px-2 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-[10px] font-bold text-slate-600 dark:text-slate-300 hover:border-amber-400 disabled:opacity-30 cursor-pointer"
            >
              ◀ -5
            </button>
            <button
              type="button"
              onClick={() => handleExecuteJump(Math.min(totalCount - 1, currentIndex + 5))}
              disabled={currentIndex >= totalCount - 1}
              className="py-1 px-2 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-[10px] font-bold text-slate-600 dark:text-slate-300 hover:border-amber-400 disabled:opacity-30 cursor-pointer"
            >
              +5 ▶
            </button>
            {totalCount >= 50 && (
              <button
                type="button"
                onClick={() => handleExecuteJump(49)}
                className="py-1 px-2 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-[10px] font-bold text-slate-600 dark:text-slate-300 hover:border-amber-400 cursor-pointer"
              >
                Q.50
              </button>
            )}
            {totalCount >= 100 && (
              <button
                type="button"
                onClick={() => handleExecuteJump(99)}
                className="py-1 px-2 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-[10px] font-bold text-slate-600 dark:text-slate-300 hover:border-amber-400 cursor-pointer"
              >
                Q.100
              </button>
            )}
            <button
              type="button"
              onClick={() => handleExecuteJump(totalCount - 1)}
              className="py-1 px-2 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-[10px] font-bold text-slate-600 dark:text-slate-300 hover:border-amber-400 ml-auto cursor-pointer"
            >
              ⏩ अंतिम
            </button>
          </div>
        </div>
      )}

      {isMinimized ? (
        /* ── STEALTH MINIMIZED CAPSULE ── */
        <div className={`rounded-full border px-3 py-1.5 flex items-center justify-between gap-2.5 shadow-xl ${bgStyle}`}>
          <div className="text-slate-400 hover:text-amber-500 py-1 px-0.5 shrink-0">
            <i className="fa-solid fa-grip-vertical text-xs"></i>
          </div>

          <div className="flex items-center gap-1.5 min-w-0 flex-1">
            <span className="w-2 h-2 rounded-full bg-amber-500 animate-ping shrink-0"></span>
            <button 
              type="button"
              onClick={(e) => { e.stopPropagation(); setShowJumpMenu(prev => !prev); }}
              className="text-[11px] font-black text-amber-500 tracking-wide shrink-0 hover:underline cursor-pointer"
              title="प्रश्न बदलें"
            >
              Q.{currentQNum}/{totalCount}
            </button>
            <span className="text-[10.5px] font-bold truncate text-slate-600 dark:text-slate-300">
              {qText}
            </span>
          </div>

          <button
            type="button"
            onClick={(e) => { e.stopPropagation(); onTogglePlay(); }}
            className="w-7 h-7 rounded-full bg-amber-500 hover:bg-amber-600 text-white flex items-center justify-center shadow-xs shrink-0 active:scale-95 transition-transform cursor-pointer"
            title={isPlaying ? "रोकें (Space)" : "चलाएं (Space)"}
          >
            <i className={`fa-solid ${isPlaying ? 'fa-pause' : 'fa-play'} text-[10px]`}></i>
          </button>

          <button
            type="button"
            onClick={(e) => { e.stopPropagation(); setIsMinimized(false); }}
            className="w-6 h-6 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-700 dark:hover:text-white transition-colors shrink-0 cursor-pointer"
            title="बड़ा करें (M)"
          >
            <i className="fa-solid fa-up-right-and-down-left-from-center text-[10px]"></i>
          </button>
        </div>
      ) : (
        /* ── FULL EXPANDED PLAYER ── */
        <div className={`rounded-2xl border p-2.5 sm:p-3 flex flex-col gap-2 shadow-2xl ${bgStyle}`}>
          
          {/* Top Info Row */}
          <div className="flex items-center justify-between gap-2 min-w-0">
            <div className="flex items-center gap-1.5 min-w-0 flex-1">
              <span className="text-slate-400 dark:text-slate-500 text-xs px-0.5">
                <i className="fa-solid fa-grip-vertical"></i>
              </span>
              <button
                type="button"
                onClick={(e) => { e.stopPropagation(); setShowJumpMenu(prev => !prev); setShowSpeedMenu(false); }}
                className="inline-flex items-center justify-center px-2 py-0.5 rounded-lg bg-amber-500 hover:bg-amber-600 text-white text-[10.5px] font-black tracking-wide shrink-0 shadow-xs active:scale-95 transition-transform cursor-pointer"
                title="मनचाहे प्रश्न पर जाएं (Click to Jump)"
              >
                <span>🎧 Q.{currentQNum}/{totalCount}</span>
                <i className="fa-solid fa-caret-down text-[8.5px] ml-1 opacity-80"></i>
              </button>
              <p className="text-xs font-bold truncate leading-tight flex-1 text-slate-700 dark:text-slate-200">
                {qText}
              </p>
            </div>

            {/* Right Action Icons */}
            <div className="flex items-center gap-1 shrink-0">
              <button
                type="button"
                onClick={(e) => { e.stopPropagation(); setIsMinimized(true); }}
                title="छोटा करें (M)"
                className="w-6 h-6 rounded-full flex items-center justify-center text-slate-400 hover:text-amber-500 hover:bg-amber-50 dark:hover:bg-amber-950/40 transition-colors cursor-pointer"
              >
                <i className="fa-solid fa-minus text-xs"></i>
              </button>

              <button
                type="button"
                onClick={(e) => { e.stopPropagation(); onClose(); }}
                title="पॉडकास्ट बंद करें (Esc)"
                className="w-6 h-6 rounded-full flex items-center justify-center text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/40 transition-colors cursor-pointer"
              >
                <i className="fa-solid fa-xmark text-xs"></i>
              </button>
            </div>
          </div>

          {/* Controls Row */}
          <div className="flex items-center justify-between gap-1 pt-1 border-t border-slate-200/60 dark:border-slate-800/80">
            {/* Speed Toggle (Opens YouTube-like speed menu) */}
            <div className="flex items-center gap-1">
              <button
                type="button"
                onClick={(e) => { e.stopPropagation(); setShowSpeedMenu(prev => !prev); setShowJumpMenu(false); }}
                className={`px-2.5 py-1 rounded-lg border text-[11px] font-black transition-transform active:scale-95 flex items-center gap-1 cursor-pointer ${
                  showSpeedMenu
                    ? 'bg-amber-500 text-white border-amber-400 shadow-xs'
                    : 'border-amber-400/50 bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300 hover:bg-amber-100'
                }`}
                title="स्पीड बदलें (YouTube Speed Picker)"
              >
                <span>⚡ {speed}x</span>
                <i className="fa-solid fa-sliders text-[9px] opacity-75"></i>
              </button>
            </div>

            {/* Player Navigation Buttons */}
            <div className="flex items-center gap-1.5">
              {/* Prev */}
              <button
                type="button"
                onClick={(e) => { e.stopPropagation(); onPrev(); }}
                disabled={currentIndex <= 0}
                className="w-8 h-8 rounded-xl flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800 disabled:opacity-30 disabled:cursor-not-allowed transition-all active:scale-90 cursor-pointer"
                title="पिछला सवाल (← या P)"
              >
                <i className="fa-solid fa-backward-step text-xs"></i>
              </button>

              {/* Play / Pause Primary Button */}
              <button
                type="button"
                onClick={(e) => { e.stopPropagation(); onTogglePlay(); }}
                className="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-500 text-white flex items-center justify-center shadow-md shadow-amber-500/30 transition-transform active:scale-95 hover:scale-105 cursor-pointer"
                title={isPlaying ? "रोकें (Space)" : "चलाएं (Space)"}
              >
                <i className={`fa-solid ${isPlaying ? 'fa-pause' : 'fa-play'} text-sm`}></i>
              </button>

              {/* Next */}
              <button
                type="button"
                onClick={(e) => { e.stopPropagation(); onNext(); }}
                disabled={currentIndex >= totalCount - 1}
                className="w-8 h-8 rounded-xl flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800 disabled:opacity-30 disabled:cursor-not-allowed transition-all active:scale-90 cursor-pointer"
                title="अगला सवाल (→ या N)"
              >
                <i className="fa-solid fa-forward-step text-xs"></i>
              </button>
            </div>

            {/* Scope Indicator */}
            <div className="flex flex-col items-end">
              <span className="text-[10px] font-bold text-slate-400 dark:text-slate-500 truncate max-w-[80px]">
                {scopeTitle || 'पॉडकास्ट'}
              </span>
              <span className="text-[8px] font-mono text-slate-400 dark:text-slate-500 hidden sm:inline">
                Space: Play/Pause
              </span>
            </div>
          </div>

        </div>
      )}
    </div>
  );
};

window.PodcastPlayer = PodcastPlayer;
