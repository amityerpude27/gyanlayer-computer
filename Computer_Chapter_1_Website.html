                        }}
                        disabled={filteredQs.findIndex(item => item.originalIndex === idx) >= filteredQs.length - 1}
                        className="px-3.5 py-1.5 rounded-lg sm:rounded-xl text-xs font-black border transition-all active:scale-95 disabled:opacity-30 disabled:pointer-events-none cursor-pointer flex items-center gap-1.5 bg-violet-600 hover:bg-violet-700 text-white border-violet-600 shadow-sm shadow-violet-600/20"
                      >
                        <span>Next</span>
                        <i className="fa-solid fa-chevron-right text-[10px]"></i>
                      </button>
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>

        {/* Right Sidebar (Grid) */}
        <div className={`hidden sm:flex flex-col w-60 border-l overflow-visible relative flex-shrink-0 h-full z-10 ${sbg}`}>
          <div className="p-3 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between relative z-40">
            <span className={`text-[10px] font-black uppercase tracking-widest ${ts}`}>SECTION: Test</span>
          </div>
          <div className="p-3 flex-1 overflow-y-auto custom-scroll">
            <div style={{display:'grid', gridTemplateColumns:'repeat(5,1fr)', gap:'6px'}}>
              {filteredQs.map((q) => {
                const i = q.originalIndex;
                const userAns = getStudentAnswer(activeAttempt.answers, q, i);
                const isCorrect = userAns === q.answer;
                const isSkipped = userAns === null || userAns === undefined;
                
                let bg, fg, br;
                if (isSkipped) {
                  bg = dk ? '#1e293b' : '#f1f5f9';
                  fg = dk ? '#64748b' : '#94a3b8';
                  br = dk ? '#334155' : '#cbd5e1';
                } else if (isCorrect) {
                  bg = dk ? '#052e16' : '#dcfce7';
                  fg = dk ? '#4ade80' : '#16a34a';
                  br = dk ? '#166534' : '#86efac';
                } else {
                  bg = dk ? '#450a0a' : '#fee2e2';
                  fg = dk ? '#f87171' : '#dc2626';
                  br = dk ? '#7f1d1d' : '#fca5a5';
                }
                
                const isActive = activeSolTab === i;
                if (isActive) br = '#8b5cf6'; // Highlight active border
                
                return (
                  <button key={i} onClick={() => setActiveSolTab(i)}
                  style={{
                    background: bg,
                    color: fg,
                    border: isActive ? '2px solid #7c3aed' : '2px solid '+br,
                    boxShadow: isActive ? '0 0 0 2px rgba(124,58,237,0.4)' : 'none',
                    transform: isActive ? 'scale(1.1)' : 'scale(1)',
                    width:'34px', height:'34px', borderRadius:'6px',
                    fontWeight:'bold', fontSize:'11px', cursor:'pointer',
                    transition:'all 0.15s',
                    zIndex: isActive ? 10 : 1
                  }}>
                    {i+1}
                  </button>
                );
              })}
            </div>
          </div>
          {/* Desktop Legend */}
          <div className={`p-4 border-t flex-shrink-0 z-40 ${dk ? 'border-slate-800 bg-slate-900/50' : 'border-slate-200 bg-slate-50'}`}>
             <div className={`mb-3 font-black uppercase text-[10px] tracking-wider ${ts}`}>Speed Indicators</div>
             <div className="flex flex-col gap-3 text-xs font-bold">
                 <div className="flex items-center gap-2"><SpeedClockIcon size={16} type="superfast" /> <span className={ts}>Superfast (&lt; {Math.ceil(targetTime * 0.5)}s)</span></div>
                 <div className="flex items-center gap-2"><SpeedClockIcon size={16} type="ontime" /> <span className={ts}>On Time (⏳ {targetTime}s)</span></div>
                 <div className="flex items-center gap-2"><SpeedClockIcon size={16} type="slow" /> <span className={ts}>Slow (&gt; {targetTime}s)</span></div>
                 <div className="flex items-center gap-2"><SpeedClockIcon size={16} type="ontime_incorrect" /> <span className={ts}>On Time Error</span></div>
             </div>
          </div>
        </div>
      </div>
    </div>
  );
};

if (typeof window !== 'undefined') {
  window.SolutionReview = SolutionReview;
  window.SpeedClockIcon = SpeedClockIcon;
}


// ===== components/MockTest.js =====
// components/MockTest.js — Exam-Style Mock Test Main Coordinator & State Router

// ════════════════════════════════════════════════════════
//  MAIN: MockTest
// ════════════════════════════════════════════════════════
const MockTest = ({questions, theme, addMistake, onTestStateChange}) => {
  const cfg = window.caConfig || {};
  const mc  = cfg.mockConfig  || {};
  const cats = cfg.categories || [];
  const dk = theme==='dark';
  const wm = theme==='warm';

  const [screen, setScreen] = useState('select');
  const [selTest, setSelTest] = useState(null);
  const [result, setResult] = useState(null);
  const [key, setKey] = useState(0);

  // Synchronize active live test status with global app shell (locks bottom nav & guards tab switches)
  useEffect(() => {
    const isLive = screen === 'live';
    if (onTestStateChange) {
      onTestStateChange(isLive);
    }
    window.forceQuitMockTest = () => {
      setSelTest(null);
      setResult(null);
      setScreen('select');
      if (onTestStateChange) onTestStateChange(false);
    };
    return () => {
      if (onTestStateChange) onTestStateChange(false);
      delete window.forceQuitMockTest;
    };
  }, [screen, onTestStateChange]);

  // Unique key based on month and year to prevent cache collision across months
  const storageKey = `ca_mock_attempts_${cfg.month || 'default'}_${cfg.year || ''}`;

  // Load attempt history with multi-key resilient storage
  const [attempts, setAttempts] = useState(() => {
    try {
      let stored = localStorage.getItem(storageKey);
      if (!stored && cfg.month) stored = localStorage.getItem('ca_mock_attempts_' + cfg.month);
      if (!stored) return {};
      const parsed = JSON.parse(stored);
      const migrated = {};
      if (Array.isArray(parsed)) {
        parsed.forEach(item => {
          const tid = (item.test && item.test.id) || item.test_id || item.id;
          if (tid) {
            if (!migrated[tid]) migrated[tid] = [];
            migrated[tid].push({
              ...item,
              score: Number(item.score),
              max: Number(item.max || item.total || 1),
              acc: Number(item.acc !== undefined ? item.acc : (item.accuracy || 0)),
              taken: Number(item.taken !== undefined ? item.taken : (item.time_taken || 0)),
              timestamp: item.timestamp || item.created_at || Date.now(),
              test: item.test || { id: tid, name: item.test_name || 'Mock Test', mark: 1, neg: 0.33 }
            });
          }
        });
      } else if (parsed && typeof parsed === 'object') {
        Object.keys(parsed).forEach(k => {
          const rawList = Array.isArray(parsed[k]) ? parsed[k] : [parsed[k]];
          migrated[k] = rawList.filter(Boolean).map(item => {
            const tid = (item.test && item.test.id) || item.testId || item.test_id || k;
            return {
              ...item,
              score: Number(item.score || 0),
              max: Number(item.max || item.total || 1),
              acc: Number(item.acc !== undefined ? item.acc : (item.accuracy || 0)),
              taken: Number(item.taken !== undefined ? item.taken : (item.time_taken || 0)),
              timestamp: item.timestamp || item.created_at || Date.now(),
              test: item.test || {
                id: tid,
                name: item.testName || item.test_name || 'Mock Test',
                type: item.testType || item.type || 'monthly',
                mins: item.mins || 15,
                mark: item.mark || 1,
                neg: item.neg || 0.33
              }
            };
          });
        });
      }
      Object.keys(migrated).forEach(k => {
        migrated[k] = deduplicateAttemptList(migrated[k]);
      });
      // 🛡️ Enterprise Foreign Attempt Purge: Drop attempts with questions not in current month
      const currentValidQIds = new Set((questions || []).map(q => String(q.id)));
      const sanitized = {};
      Object.keys(migrated).forEach(k => {
        const validAttempts = migrated[k].filter(att => {
          if (att.test && Array.isArray(att.test.qs) && att.test.qs.length > 0) {
            return att.test.qs.every(q => currentValidQIds.has(String(q.id)));
          }
          return true;
        });
        if (validAttempts.length > 0) {
          sanitized[k] = validAttempts;
        }
      });
      return sanitized;
    } catch(e) {
      return {};
    }
  });

  // 🏆 Persistent real-time leaderboard cache for multi-user sync
  const [leaderboardMap, setLeaderboardMap] = useState(() => {
    try {
      const stored = localStorage.getItem('ca_real_leaderboards');
      return stored ? JSON.parse(stored) : {};
    } catch(e) {
      return {};
    }
  });

  const handleRealLeaderboardUpdate = (lbData, explicitTestId) => {
    if (!lbData) return;
    const tid = lbData.test_id || lbData.testId || lbData.raw_test_id || explicitTestId || (selTest && selTest.id);
    if (!tid) return;

    const realRank = lbData.userRank !== undefined ? Number(lbData.userRank) : (lbData.rank !== undefined ? Number(lbData.rank) : null);
    const realTotal = lbData.totalParticipants !== undefined ? Number(lbData.totalParticipants) : (lbData.total !== undefined ? Number(lbData.total) : (Array.isArray(lbData.topRankers) ? lbData.topRankers.length : null));

    // 1. Update leaderboardMap state and localStorage
    setLeaderboardMap(prev => {
      const updated = {
        ...prev,
        [tid]: lbData
      };
      if (lbData.raw_test_id) {
        updated[lbData.raw_test_id] = lbData;
      }
      if (tid.match(/^[a-z]+_\d{4}_/i)) {
        const stripped = tid.replace(/^[a-z]+_\d{4}_/i, '');
        updated[stripped] = lbData;
      }
      if (tid.includes('_')) {
        const simpleKey = tid.split('_').slice(-2).join('_'); // e.g. "tp_0"
        updated[simpleKey] = lbData;
      }
      try {
        localStorage.setItem('ca_real_leaderboards', JSON.stringify(updated));
      } catch(e) {}
      return updated;
    });

    // 2. Update attempts in state and localStorage so the test card always reflects real rank & total participants
    setAttempts(prev => {
      let changed = false;
      const next = { ...prev };
      const keysToUpdate = Object.keys(next).filter(k => 
        k === tid || 
        k.toLowerCase() === tid.toLowerCase() || 
        tid.endsWith(k) || 
        k.endsWith(tid) ||
        k.replace(/[-_]/g, '') === tid.replace(/[-_]/g, '')
      );
      if (keysToUpdate.length === 0 && tid) {
        keysToUpdate.push(tid);
      }

      keysToUpdate.forEach(k => {
        const list = next[k] ? [...next[k]] : [];
        if (list.length > 0) {
          const latest = { ...list[list.length - 1] };
          if (realRank !== null) {
            latest.userRank = realRank;
          } else if (Array.isArray(lbData.topRankers) && lbData.topRankers.length > 0) {
            const myScore = Number(latest.score || 0);
            const myTime = Number(latest.taken || 0);
            const higher = lbData.topRankers.filter(r => {
              const rScore = Number(r.score || 0);
              const rTime = Number(r.time || 0);
              if (rScore > myScore) return true;
              if (rScore === myScore && rTime < myTime) return true;
              return false;
            }).length;
            latest.userRank = higher + 1;
          }
          if (realTotal !== null) latest.totalParticipants = realTotal;
          if (lbData.topRankers) latest.topRankers = lbData.topRankers;
          latest.leaderboard = lbData;
          list[list.length - 1] = latest;
          next[k] = list;
          changed = true;
        }
      });

      if (changed) {
        try {
          localStorage.setItem(storageKey, JSON.stringify(next));
          if (cfg.month) localStorage.setItem(`ca_mock_attempts_${cfg.month}`, JSON.stringify(next));
        } catch(e) {}
      }
      return next;
    });
  };

  // ☁️ Ingest Lifetime Supabase Attempt History from parent GyanLayer app / Admin Panel
  useEffect(() => {
    // ⚡ Trigger Direct Supabase Real-Time Leaderboard Sync on mount
    if (typeof window !== 'undefined' && window.syncAllSupabaseLeaderboards) {
      window.syncAllSupabaseLeaderboards();
    }
    // 📢 Ping Parent App on Mount to Request Stored Lifetime Attempts & User Profile
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'REQUEST_USER_PROFILE' }, '*');
        window.parent.postMessage({
          type: 'REQUEST_ATTEMPT_HISTORY',
          month: cfg.month,
          year: cfg.year
        }, '*');

        // Request live leaderboards for all previously attempted tests
        const attemptedKeys = Object.keys(attempts || {});
        attemptedKeys.forEach(rawTid => {
          const testMonth = cfg.month || 'January';
          const testYear = cfg.year || '2026';
          const resolvedTestId = (rawTid.includes('_mt_') || rawTid.includes('_tp_'))
            ? rawTid
            : `${testMonth.toLowerCase().replace(/\s+/g, '_')}_${testYear}_${rawTid}`;
          window.parent.postMessage({
            type: 'REQUEST_LEADERBOARD',
            payload: {
              test_id: resolvedTestId,
              raw_test_id: rawTid,
              month: testMonth,
              year: testYear
            }
          }, '*');
        });
      }
    } catch(e) {}

    const parseAndMergeAttempts = (raw, isAuthoritative = false) => {
      if (raw === undefined || raw === null) return;
      const normalized = {};
      if (Array.isArray(raw)) {
        raw.forEach(item => {
          if (!item) return;
          const fullTid = (item.test && item.test.id) || item.test_id || item.id;
          const rawTid = item.raw_test_id || (fullTid && (fullTid.includes('_mt_') ? 'mt_' + fullTid.split('_mt_')[1] : (fullTid.includes('_tp_') ? 'tp_' + fullTid.split('_tp_')[1] : fullTid)));
          
          const normTime = item.created_at 
            ? new Date(item.created_at).getTime() 
            : (typeof item.timestamp === 'number' ? item.timestamp : (item.timestamp ? new Date(item.timestamp).getTime() : Date.now()));
          const attemptNum = Number(item.attemptNumber || item.attempt_number || 1);

          const attemptObj = {
            ...item,
            score: Number(item.score || 0),
            max: Number(item.max || item.total || 1),
            acc: Number(item.acc !== undefined ? item.acc : (item.accuracy || 0)),
            taken: Number(item.taken !== undefined ? item.taken : (item.time_taken || 0)),
            correct: item.correct !== undefined ? item.correct : (item.correct_count !== undefined ? item.correct_count : item.cor),
            cor: item.correct !== undefined ? item.correct : (item.correct_count !== undefined ? item.correct_count : item.cor),
            wrong: item.wrong !== undefined ? item.wrong : (item.wrong_count !== undefined ? item.wrong_count : item.wrg),
            wrg: item.wrong !== undefined ? item.wrong : (item.wrong_count !== undefined ? item.wrong_count : item.wrg),
            skip: item.skip !== undefined ? item.skip : (item.skip_count !== undefined ? item.skip_count : item.skp),
            skp: item.skip !== undefined ? item.skip : (item.skip_count !== undefined ? item.skip_count : item.skp),
            answers: item.answers || {},
            times: item.times || {},
            timestamp: normTime,
            created_at: item.created_at || new Date(normTime).toISOString(),
            userRank: item.userRank !== undefined ? Number(item.userRank) : (item.user_rank !== undefined ? Number(item.user_rank) : (item.rank !== undefined ? Number(item.rank) : undefined)),
            totalParticipants: item.totalParticipants !== undefined ? Number(item.totalParticipants) : (item.total_participants !== undefined ? Number(item.total_participants) : undefined),
            attemptNumber: attemptNum,
            attempt_number: attemptNum,
            isOfficial: item.isOfficial !== undefined ? item.isOfficial : (item.is_official !== undefined ? item.is_official : (attemptNum === 1)),
            test: item.test || { id: rawTid || fullTid, name: item.test_name || 'Mock Test', mark: 1, neg: 0.33 }
          };

          const keysToSet = new Set([fullTid, rawTid].filter(Boolean));
          keysToSet.forEach(tid => {
            if (!normalized[tid]) normalized[tid] = [];
            normalized[tid].push(attemptObj);
          });
        });
      } else if (typeof raw === 'object') {
        Object.keys(raw).forEach(k => {
          if (Array.isArray(raw[k])) {
            normalized[k] = raw[k];
          } else if (raw[k]) {
            normalized[k] = [raw[k]];
          }
        });
      }

      setAttempts(prev => {
        const merged = isAuthoritative ? {} : { ...prev };
        const allKeys = new Set([...Object.keys(prev || {}), ...Object.keys(normalized)]);

        allKeys.forEach(tid => {
          const fromSupabase = normalized[tid] || [];
          const fromPrev = prev[tid] || [];

          let combined;
          if (isAuthoritative) {
            // Keep authoritative Supabase attempts, plus any attempt finished in last 45s in this session
            const recentLocal = fromPrev.filter(p => {
              const pTime = new Date(p.timestamp || p.created_at || 0).getTime();
              return (Date.now() - pTime < 45000);
            });
            combined = [...fromSupabase, ...recentLocal];
          } else {
            combined = [...fromPrev, ...fromSupabase];
          }

          const deduped = deduplicateAttemptList(combined);
          if (deduped.length > 0) {
            merged[tid] = deduped;
          }
        });

        try {
          localStorage.setItem(storageKey, JSON.stringify(merged));
        } catch(err) {}
        return merged;
      });
    };

    const handleAttemptsMsg = (e) => {
      try {
        if (!e.data) return;
        if (e.data.type === 'SET_ATTEMPT_HISTORY' || e.data.type === 'SET_MOCK_ATTEMPTS' || e.data.type === 'SYNC_SUPABASE_ATTEMPTS') {
          const supabaseAttempts = e.data.payload || e.data.data || e.data.attempts;
          parseAndMergeAttempts(supabaseAttempts, true);
        }
        if (e.data.type === 'SET_REAL_LEADERBOARD') {
          const lbData = e.data.payload || e.data.data || e.data.leaderboard || e.data;
          if (lbData) handleRealLeaderboardUpdate(lbData);
        }
        if (e.data.type === 'SET_USER_NAME') {
          const uPayload = e.data.payload || e.data.data || e.data;
          if (uPayload && typeof uPayload === 'object') {
            if (uPayload.name) window.caUserName = uPayload.name;
            if (uPayload.userId || uPayload.id) window.caUserId = uPayload.userId || uPayload.id;
          }
        }
      } catch(err) {
        console.error('[MockTest] Ingest Supabase attempts error:', err);
      }
    };
    const handleCustomAttempts = (e) => {
      if (e.detail) {
        const supabaseAttempts = e.detail.payload || e.detail.data || e.detail;
        parseAndMergeAttempts(supabaseAttempts, true);
      }
    };
    const handleCustomLeaderboard = (e) => {
      if (e.detail) {
        const lb = e.detail.payload || e.detail.data || e.detail;
        handleRealLeaderboardUpdate(lb);
      }
    };
    window.addEventListener('message', handleAttemptsMsg);
    window.addEventListener('ca_set_mock_attempts', handleCustomAttempts);
    window.addEventListener('ca_real_leaderboard', handleCustomLeaderboard);
    return () => {
      window.removeEventListener('message', handleAttemptsMsg);
      window.removeEventListener('ca_set_mock_attempts', handleCustomAttempts);
      window.removeEventListener('ca_real_leaderboard', handleCustomLeaderboard);
    };
  }, [storageKey, cfg.month, cfg.year]);


  // In-progress test session persistence key
  const inProgressKey = `ca_mock_inprogress_${cfg.month || 'default'}_${cfg.year || ''}`;
  const [inProgressMap, setInProgressMap] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem(inProgressKey)) || {};
    } catch(e) {
      return {};
    }
  });

  // Refresh in-progress map & leaderboards whenever user returns to select screen
  useEffect(() => {
    if (screen === 'select') {
      try {
        setInProgressMap(JSON.parse(localStorage.getItem(inProgressKey)) || {});
      } catch(e) {}
      if (typeof window !== 'undefined' && window.syncAllSupabaseLeaderboards) {
        window.syncAllSupabaseLeaderboards();
      }
    }
  }, [screen, inProgressKey]);

  const monthly = useMemo(() => buildMonthly(questions, mc), [questions]);
  const topic   = useMemo(() => buildTopic(questions, cats, mc), [questions, cats]);

  // 📢 Broadcast Complete Tests Count & Metadata to Parent GyanLayer App / Course Dashboard
  useEffect(() => {
    try {
      const testsMeta = {
        month: cfg.month || 'January',
        year: cfg.year || (new Date().getFullYear()),
        totalQuestions: questions.length,
        monthlyTestsCount: monthly.length,
        topicTestsCount: topic.length,
        totalTestsCount: monthly.length + topic.length,
        monthlyTests: monthly.map(t => ({ id: t.id, name: t.name, questionsCount: t.qs.length, mins: t.mins, mark: t.mark, neg: t.neg })),
        topicTests: topic.map(t => ({ id: t.id, name: t.name, questionsCount: t.qs.length, mins: t.mins, mark: t.mark, neg: t.neg }))
      };
      window.caTestsMetadata = testsMeta;
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'SET_MODULE_TESTS_METADATA',
          payload: testsMeta
        }, '*');
      }
    } catch(e) {
      console.warn('[MockTest] Broadcast tests meta failed:', e);
    }
  }, [monthly, topic]);

  const start  = t  => { setSelTest(t); setScreen('inst'); };
  const begin  = () => setScreen('live');
  
  const resume = t => {
    setSelTest(t);
    setScreen('live');
  };

  const startFresh = t => {
    try {
      const all = JSON.parse(localStorage.getItem(inProgressKey)) || {};
      delete all[t.id];
      localStorage.setItem(inProgressKey, JSON.stringify(all));
      setInProgressMap(all);
    } catch(e) {}
    setSelTest(t);
    setKey(k=>k+1);
    setScreen('inst');
  };

  const finish = r  => { 
    const rawPrevList = (attempts && (attempts[r.test.id] || attempts[r.test.id.replace('_', '-')] || attempts[r.test.id.replace('-', '_')])) || [];
    const prevList = deduplicateAttemptList(rawPrevList);
    const isFirstAttempt = prevList.length === 0;
    const attemptNumber = prevList.length + 1;

    // 🎯 Testbook Authentic Attempt Rank Calculation
    const allScores = [...prevList.map(a => Number(a.score || 0)), Number(r.score || 0)];
    const myScore = Number(r.score || 0);
    const computedLocalRank = allScores.filter(s => s > myScore).length + 1;
    const totalAttemptsCount = allScores.length;

    // Check if we already have real leaderboard information cached for this test
    const existingLb = (leaderboardMap && (
      leaderboardMap[r.test.id] || 
      leaderboardMap[r.test.id.replace('_', '-')] || 
      leaderboardMap[r.test.id.replace('-', '_')] ||
      (Object.keys(leaderboardMap).find(k => k.endsWith(r.test.id) || r.test.id.endsWith(k)) ? leaderboardMap[Object.keys(leaderboardMap).find(k => k.endsWith(r.test.id) || r.test.id.endsWith(k))] : null)
    )) || null;

    let initialUserRank = computedLocalRank;
    let initialTotalParticipants = totalAttemptsCount;

    if (existingLb) {
      if (existingLb.topRankers && Array.isArray(existingLb.topRankers) && existingLb.topRankers.length > 0) {
        const higherScorers = existingLb.topRankers.filter(rk => Number(rk.score || 0) > myScore).length;
        initialUserRank = higherScorers + 1;
        initialTotalParticipants = Math.max(Number(existingLb.totalParticipants) || existingLb.topRankers.length, initialUserRank);
      } else if (existingLb.totalParticipants) {
        initialTotalParticipants = Math.max(Number(existingLb.totalParticipants), initialUserRank);
      }
    }

    const resultWithTime = { 
      ...r, 
      test: {
        id: r.test.id,
        name: r.test.name,
        type: r.test.type,
        mins: r.test.mins,
        mark: r.test.mark,
        neg: r.test.neg,
        qs: r.test.qs
      },
      timestamp: Date.now(),
      isOfficial: isFirstAttempt,
      attemptNumber: attemptNumber,
      attempt_number: attemptNumber,
      userRank: initialUserRank,
      totalParticipants: initialTotalParticipants
    };
    if (window.dispatchMockTestResult) {
      window.dispatchMockTestResult(resultWithTime);
    }
    if (window.parent && window.parent !== window) {
      try {
        const testMonth = (window.caConfig && window.caConfig.month) || 'January';
        const testYear = (window.caConfig && window.caConfig.year) || '2026';
        const rawTid = r.test.id;
        const resolvedTestId = (rawTid.includes('_mt_') || rawTid.includes('_tp_'))
          ? rawTid
          : `${testMonth.toLowerCase().replace(/\s+/g, '_')}_${testYear}_${rawTid}`;
        window.parent.postMessage({
          type: 'REQUEST_LEADERBOARD',
          payload: {
            test_id: resolvedTestId,
            raw_test_id: rawTid,
            month: testMonth,
            year: testYear
          }
        }, '*');
      } catch(e) {}
    }
    setAttempts(prev => {
      const rawList = prev[r.test.id] ? [...prev[r.test.id]] : [];
      const list = deduplicateAttemptList([...rawList, resultWithTime]);
      const next = { ...prev, [r.test.id]: list };
      if (r.test.id.includes('_')) {
        next[r.test.id.replace('_', '-')] = list;
      }
      // Lightweight, quota-safe serialization for mobile Webviews & Android Apps (strips bulky questions array)
      const cleanNext = {};
      Object.keys(next).forEach(tid => {
        cleanNext[tid] = next[tid].map(att => ({
          testId: (att.test && att.test.id) || att.testId || tid,
          testName: (att.test && att.test.name) || att.testName || 'Mock Test',
          testType: (att.test && att.test.type) || att.testType || 'monthly',
          mins: (att.test && att.test.mins) || att.mins || 15,
          mark: (att.test && att.test.mark) || att.mark || 1,
          neg: (att.test && att.test.neg) || att.neg || 0.33,
          score: Number(att.score),
          max: Number(att.max),
          acc: Number(att.acc),
          taken: Number(att.taken),
          correct: att.correct !== undefined ? att.correct : att.cor,
          wrong: att.wrong,
          skip: att.skip !== undefined ? att.skip : att.skp,
          answers: att.answers || {},
          times: att.times || (att.qTimes ? att.qTimes : {}),
          qTimes: att.qTimes || [],
          timestamp: att.timestamp || Date.now(),
          isOfficial: att.isOfficial,
          attemptNumber: att.attemptNumber,
          userRank: att.userRank || initialUserRank,
          totalParticipants: att.totalParticipants || initialTotalParticipants
        }));
      });
      try {
        localStorage.setItem(storageKey, JSON.stringify(cleanNext));
        if (cfg.month) localStorage.setItem(`ca_mock_attempts_${cfg.month}`, JSON.stringify(cleanNext));
      } catch(e) {
        console.warn('[MockTest] LocalStorage save warning:', e);
      }
      setResult(list);
      return next;
    });
    setSelTest(r.test);
    setScreen('result'); 
  };

  const retry  = () => {
    if (!selTest) return;
    setKey(k=>k+1);
    setScreen('inst');
  };
  const back = () => { setSelTest(null); setResult(null); setScreen('select'); };

  const viewSolution = t => {
    setSelTest(t);
    const attList = (attempts && (
      attempts[t.id] ||
      attempts[t.id.replace('_', '-')] ||
      attempts[t.id.replace('-', '_')] ||
      (Object.keys(attempts).find(k => k.toLowerCase() === t.id.toLowerCase() || k.endsWith(t.id) || t.id.endsWith(k)) && attempts[Object.keys(attempts).find(k => k.toLowerCase() === t.id.toLowerCase() || k.endsWith(t.id) || t.id.endsWith(k))])
    )) || [];
    if (attList.length > 0) {
      const enrichedList = attList.map(att => ({
        ...att,
        test: (att.test && att.test.qs && att.test.qs.length > 0) ? att.test : t
      }));
      setResult(enrichedList);
    } else {
      setResult([{
        test: t,
        score: 0,
        max: t.qs.length * t.mark,
        acc: 0,
        taken: 0,
        answers: {},
        times: {},
        timestamp: Date.now(),
        isOfficial: true,
        attemptNumber: 1
      }]);
    }
    setScreen('solution');
  };

  const viewAnalysis = t => {
    setSelTest(t);
    const attList = (attempts && (
      attempts[t.id] ||
      attempts[t.id.replace('_', '-')] ||
      attempts[t.id.replace('-', '_')] ||
      (Object.keys(attempts).find(k => k.toLowerCase() === t.id.toLowerCase() || k.endsWith(t.id) || t.id.endsWith(k)) && attempts[Object.keys(attempts).find(k => k.toLowerCase() === t.id.toLowerCase() || k.endsWith(t.id) || t.id.endsWith(k))])
    )) || [];
    if (attList.length > 0) {
      const enrichedList = attList.map(att => ({
        ...att,
        test: (att.test && att.test.qs && att.test.qs.length > 0) ? att.test : t
      }));
      setResult(enrichedList);
      setScreen('result');
    } else {
      setResult([{
        test: t,
        score: 0,
        max: t.qs.length * t.mark,
        acc: 0,
        taken: 0,
        answers: {},
        times: {},
        timestamp: Date.now(),
        isOfficial: true,
        attemptNumber: 1
      }]);
      setScreen('result');
    }
  };

  const clearAllHistory = () => {
    try {
      localStorage.removeItem(storageKey);
      if (cfg.month) localStorage.removeItem(`ca_mock_attempts_${cfg.month}`);
      localStorage.removeItem(inProgressKey);
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const k = localStorage.key(i);
        if (k && (k.startsWith('ca_mock') || k.includes('mock_attempt') || k.startsWith('ca_mistake'))) {
          localStorage.removeItem(k);
        }
      }
      setAttempts({});
      setInProgressMap({});
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'CLEAR_MOCK_ATTEMPTS', month: cfg.month, year: cfg.year }, '*');
      }
    } catch(e) {
      console.warn('[MockTest] Clear history warning:', e);
    }
  };

  useEffect(() => {
    window.clearMockHistory = clearAllHistory;
    return () => {
      delete window.clearMockHistory;
    };
  }, [storageKey, inProgressKey, cfg.month, cfg.year]);

  if (screen==='select')  return <TestSelector monthly={monthly} topic={topic} onStart={start} onResume={resume} onStartFresh={startFresh} inProgressMap={inProgressMap} attempts={attempts} leaderboardMap={leaderboardMap} onViewSolution={viewSolution} onViewAnalysis={viewAnalysis} dk={dk} wm={wm} />;
  if (screen==='inst')    return <Instructions test={selTest} onBegin={begin} onBack={back} dk={dk} wm={wm} />;
  if (screen==='live')    return <LiveTest key={selTest.id+'_'+key} test={selTest} dk={dk} wm={wm} onFinish={finish} onExit={back} addMistake={addMistake} />;
  if (screen==='result')  return <TestResult res={result} leaderboardMap={leaderboardMap} onSyncLeaderboard={handleRealLeaderboardUpdate} onRetry={retry} onBack={back} onViewSolution={viewSolution} dk={dk} wm={wm} />;
  if (screen==='solution') return <SolutionReview res={result} onBack={back} onViewAnalysis={(t) => { if(t) viewAnalysis(t); else setScreen('result'); }} onReattempt={(t) => { start(t || (result && result[0] && result[0].test)); }} dk={dk} wm={wm} />;
  return null;
};

if (typeof window !== 'undefined') {
  window.MockTest = MockTest;
}

// SafeStorage Guard & Month-Namespaced Cache Engine
window.safeStorage = {
  getItem: function(key, fallback) {
    try {
      const val = localStorage.getItem(key);
      if (!val) return fallback;
      return JSON.parse(val);
    } catch(e) {
      console.warn("Corrupted storage detected for key:", key, ". Auto-healing state...");
      try { localStorage.removeItem(key); } catch(err) {}
      return fallback;
    }
  },
  setItem: function(key, val) {
    try {
      localStorage.setItem(key, JSON.stringify(val));
    } catch(e) {
      console.error("Failed to write to localStorage:", e);
    }
  }
};

// ⚡ Persistent Client User Identification (Guarantees unique ID across browsers/devices)
(function initPersistentUserId() {
  if (typeof window === 'undefined') return;
  try {
    let uid = window.caUserId || localStorage.getItem('ca_user_id') || localStorage.getItem('ca_client_uid');
    if (!uid) {
      uid = 'usr_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 8);
      localStorage.setItem('ca_client_uid', uid);
    }
    window.caUserId = uid;
    const uEmail = window.caUserEmail || localStorage.getItem('ca_user_email');
    if (uEmail) window.caUserEmail = uEmail;
  } catch(e) {}
})();

// ⚡ Network-First Auto-Busting Cache-Storage ServiceWorker Engine
(function registerNetworkFirstServiceWorker() {
  if (typeof window === 'undefined' || !('serviceWorker' in navigator)) return;

  const currentMonth = (window.caConfig && window.caConfig.month) ? window.caConfig.month : 'Master';
  const currentYear = (window.caConfig && window.caConfig.year) ? window.caConfig.year : new Date().getFullYear();
  const buildTimestamp = window.caBuildTimestamp || Date.now();
  const cacheName = `gyanlayer_cache_${currentMonth}_${currentYear}_v${buildTimestamp}`;

  const swCode = `
    const CACHE_NAME = '${cacheName}';
    self.addEventListener('install', (evt) => {
      self.skipWaiting();
    });
    self.addEventListener('activate', (evt) => {
      evt.waitUntil(
        caches.keys().then((keys) => {
          return Promise.all(
            keys.map((key) => {
              if (key !== CACHE_NAME && key.startsWith('gyanlayer_cache_')) {
                console.log('Purging old stale cache:', key);
                return caches.delete(key);
              }
            })
          );
        }).then(() => self.clients.claim())
      );
    });
    self.addEventListener('fetch', (evt) => {
      if (evt.request.method !== 'GET') return;
      evt.respondWith(
        fetch(evt.request)
          .then((networkResponse) => {
            if (networkResponse && networkResponse.status === 200) {
              const responseClone = networkResponse.clone();
              caches.open(CACHE_NAME).then((cache) => cache.put(evt.request, responseClone));
            }
            return networkResponse;
          })
          .catch(() => caches.match(evt.request))
      );
    });
  `;

  try {
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(err => console.warn("SW registration bypassed:", err));
  } catch(e) {
    console.warn("SW init bypassed safely");
  }
})();

window.addEventListener('message', (event) => {
  const { type, data } = event.data || {};
  if (!type) return;

  switch (type) {
    case 'SET_THEME':
      // Parent app can set theme: 'light' | 'dark' | 'warm'
      if ((data && data.theme)) {
        document.documentElement.className = data.theme;
      }
      break;

    case 'PING':
      // Respond to parent app health check
      if (event.source) {
        event.source.postMessage({
          type: 'PONG',
          app: 'CurrentAffairs',
          month: (window.caConfig && window.caConfig.month),
          year: (window.caConfig && window.caConfig.year),
          status: 'ready'
        }, '*');
      }
      break;

    case 'GET_TESTS_INFO':
    case 'GET_INFO':
      // Parent app requests complete module info & mock tests breakdown
      if (event.source) {

            name: `${(window.caConfig && window.caConfig.month)} ${(window.caConfig && window.caConfig.year)} – Ultimate Current Affairs`,

            topicTests: meta.topicTests || [],
            categories: (window.caConfig && window.caConfig.categories && window.caConfig.categories.map(c => c.label)) || []
          }
        }, '*');
      }
      break;

    case 'SET_REAL_LEADERBOARD':
      // Parent App sends Real Supabase Leaderboard + Rank
      try {
        const lbData = event.data.payload || event.data.data || (data && (data.payload || data)) || event.data;
        window.dispatchEvent(new CustomEvent('ca_real_leaderboard', { detail: lbData }));
      } catch (e) {}
      break;

    case 'SET_USER_NAME':
    case 'SET_USER_INFO':
    case 'SET_USER':
      // Parent App passes user's actual profile name & ID
      try {
        const uPayload = event.data.payload || event.data.data || (data && (data.payload || data)) || event.data;
        if (uPayload) {
          if (typeof uPayload === 'object') {
            if (uPayload.name) {

            if (uPayload.email || uPayload.user_email) {
              window.caUserEmail = uPayload.email || uPayload.user_email;
              try { localStorage.setItem('ca_user_email', window.caUserEmail); } catch(e) {}
            }
            const foundAvatar = uPayload.avatar || uPayload.avatar_url || uPayload.photo || uPayload.picture || uPayload.image;
            if (foundAvatar) {
              window.caUserAvatar = foundAvatar;
              try { localStorage.setItem('ca_user_avatar', foundAvatar); } catch(e) {}
            }
          } else if (typeof uPayload === 'string') {
            window.caUserName = uPayload;
            try { localStorage.setItem('ca_user_name', uPayload); } catch(e) {}
          }
        }
        window.dispatchEvent(new CustomEvent('ca_set_user_name', { detail: uPayload }));
      } catch (e) {}

    case 'SET_AUDIO_BASE_URL':

        if (audioUrl && typeof audioUrl === 'string' && window.caConfig) {

// ⚡ Helper to calculate full test metadata eagerly on 0ms load
function getOrCalculateTestsMeta() {
  if (window.caTestsMetadata && window.caTestsMetadata.totalTestsCount > 0) return window.caTestsMetadata;
  try {
    const cfg = window.caConfig || {};
    const qs = cfg.questions || [];
    const cats = cfg.categories || [];
    const mc = cfg.mockConfig || {};

    const tag = mc.monthlyExamTag || 'EXAM FOCUS';
    const per = mc.questionsPerSet || 25;
    const fil = qs.filter(q => q.examTag === tag);
    const monthlyCount = Math.floor(fil.length / per);

    const min = mc.minQuestionsForTopicTest || 5;
    const qps = mc.questionsPerSet || 25;
    let topicCount = 0;
    const smallCat = [];

    cats.filter(c => c.id !== 'all').forEach(cat => {
      const cqs = qs.filter(q => q.category === cat.id);
      const total = cqs.length;
      if (total < min) {
        if (total > 0) smallCat.push(...cqs);
        return;
      }
      if (total <= 30) {
        topicCount += 1;
      } else if (total <= 50) {
        topicCount += 2;
      } else {
        topicCount += Math.ceil(total / qps);
      }
    });
    if (smallCat.length > 0) topicCount += 1;

    const meta = {
      month: cfg.month || 'January',
      year: cfg.year || (new Date().getFullYear()),
      totalQuestions: qs.length,
      monthlyTestsCount: monthlyCount,
      topicTestsCount: topicCount,
      totalTestsCount: monthlyCount + topicCount
    };
    window.caTestsMetadata = meta;
    return meta;
  } catch(e) {
    return null;
  }
}

  const sendHandshake = () => {

window.dispatchMockTestResult = (result) => {
  try {
    const isOfficial = result.isOfficial !== false && (result.attemptNumber === 1 || !result.attemptNumber);
    // Bulletproof time calculation: if taken is missing or 0, fallback to sum of per-question times
    const rawTaken = Number(result.taken !== undefined && !isNaN(result.taken) ? result.taken : (result.time_taken || 0));
    const sumQTimes = Array.isArray(result.qTimes) ? result.qTimes.reduce((a, b) => a + (Number(b) || 0), 0) : 0;
    const finalTimeTaken = rawTaken > 0 ? rawTaken : (sumQTimes > 0 ? sumQTimes : 1);

    // 🔴 EXACT structure required by GyanLayer: { type: 'TEST_COMPLETED', score, total, is_official }
    const payload = {
      type: 'TEST_COMPLETED',
      score: result.score,
      total: result.max,
      accuracy: result.acc,
      time_taken: finalTimeTaken,
      timeTaken: finalTimeTaken,
      is_official: isOfficial,
      attempt_number: result.attemptNumber || 1,
      // Extra rich telemetry for Supabase Real-Time Leaderboard & Lifetime History
      extra: {
        test_id: result.test.id,

        correct: result.cor !== undefined ? result.cor : result.correct,

        skip: result.skp !== undefined ? result.skp : result.skip,

// ════════════════════════════════════════════════════════
//  ⚡ DIRECT SUPABASE LEADERBOARD & ATTEMPT SYNC ENGINE
//  Pulls live multi-user submissions directly from Supabase REST API
//  Calculates official All-India Rankings, Topper & Peer statistics
// ════════════════════════════════════════════════════════
window.isSyncingSupabaseLeaderboards = false;

window.syncAllSupabaseLeaderboards = function() {
  if (typeof window === 'undefined') return;
  const cfg = window.SUPABASE_CONFIG;
  if (!cfg || !cfg.url || !cfg.anonKey) return;
  if (window.isSyncingSupabaseLeaderboards) return;

  window.isSyncingSupabaseLeaderboards = true;
  const currentMonth = (window.caConfig && window.caConfig.month) || 'January';
  const currentYear = (window.caConfig && window.caConfig.year) || new Date().getFullYear();
  const endpoint = cfg.url + '/rest/v1/mock_test_submissions?select=*&order=score.desc,time_taken.asc';

  fetch(endpoint, {
    method: 'GET',
    headers: {
      'apikey': cfg.anonKey,
      'Authorization': 'Bearer ' + cfg.anonKey
    }
  })
  .then(function(res) {
    if (!res.ok) {
      console.warn('[Bridge] Supabase leaderboard sync HTTP status:', res.status);
      window.isSyncingSupabaseLeaderboards = false;
      return null;
    }
    return res.json();
  })
  .then(function(allSubmissions) {
    if (!Array.isArray(allSubmissions) || allSubmissions.length === 0) {
      window.isSyncingSupabaseLeaderboards = false;
      return;
    }

    const monthKey = currentMonth.toLowerCase().trim();
    const yearKey = String(currentYear).trim();

    const testGroups = {};
    const myUserSubmissions = [];

    allSubmissions.forEach(function(sub) {
      const tid = sub.test_id || sub.raw_test_id;
      if (!tid) return;

      if (sub.month && sub.month.toLowerCase().trim() !== monthKey) return;
      if (sub.year && String(sub.year).trim() !== yearKey) return;

      if (!testGroups[tid]) testGroups[tid] = [];
      testGroups[tid].push(sub);

      if (window.caUserId && sub.user_id && String(sub.user_id) === String(window.caUserId)) {
        myUserSubmissions.push(sub);
        if (sub.avatar_url && !window.caUserAvatar) {
          window.caUserAvatar = sub.avatar_url;
          try { localStorage.setItem('ca_user_avatar', sub.avatar_url); } catch(e) {}
        }
      } else if (window.caUserEmail && sub.email && String(sub.email).toLowerCase().trim() === String(window.caUserEmail).toLowerCase().trim()) {
        myUserSubmissions.push(sub);
        if (sub.avatar_url && !window.caUserAvatar) {
          window.caUserAvatar = sub.avatar_url;
          try { localStorage.setItem('ca_user_avatar', sub.avatar_url); } catch(e) {}
        }
      }
    });

    if (myUserSubmissions.length > 0) {
      try {
        window.dispatchEvent(new CustomEvent('ca_set_mock_attempts', { detail: myUserSubmissions }));
      } catch(e) {}
    }

    let cachedLbMap = {};
    try {
      const stored = localStorage.getItem('ca_real_leaderboards');
      if (stored) cachedLbMap = JSON.parse(stored);
    } catch(e) {}

    Object.keys(testGroups).forEach(function(tid) {
      const subs = testGroups[tid];
      const userMap = {};

      subs.forEach(function(s) {
        // Group candidate submissions by unique student identity:
        // Prioritize: user_id > email > submission id > unique timestamp
        // ⚠️ CRITICAL: NEVER group by user_name alone! Multiple students can share identical names.
        const ukey = (s.user_id && String(s.user_id).trim()) ||
                     (s.email && String(s.email).toLowerCase().trim()) ||
                     (s.id && String(s.id)) ||
                     (s.created_at ? 'ts_' + s.created_at : Math.random().toString());

        if (!userMap[ukey]) {
          userMap[ukey] = s;
        } else {
          const prev = userMap[ukey];
          if (s.is_official && !prev.is_official) {
            userMap[ukey] = s;
          } else if (Number(s.score) > Number(prev.score)) {
            userMap[ukey] = s;
          } else if (Number(s.score) === Number(prev.score) && Number(s.time_taken) < Number(prev.time_taken)) {
            userMap[ukey] = s;
          }
        }
      });

      const uniqueList = Object.values(userMap);
      uniqueList.sort(function(a, b) {
        const sa = Number(a.score || 0);
        const sb = Number(b.score || 0);
        if (sb !== sa) return sb - sa;
        const ta = Number(a.time_taken || 0);
        const tb = Number(b.time_taken || 0);
        return ta - tb;
      });

      let curRank = 1;
      uniqueList.forEach(function(s, idx) {
        if (idx > 0) {
          const prev = uniqueList[idx - 1];
          const isTie = Number(s.score) === Number(prev.score) && Number(s.time_taken) === Number(prev.time_taken);
          if (!isTie) {
            curRank = idx + 1;
          }
        }
        s.rank = curRank;
      });

      const totalParticipants = uniqueList.length;
      const topRankers = uniqueList.map(function(s) {
        return {
          rank: s.rank,
          name: s.user_name || 'Aspirant',
          score: Number(s.score),
          time: Number(s.time_taken || 0),
          accuracy: Number(s.accuracy || 0),
          avatar: s.avatar_url || '👨‍🎓',
          userId: s.user_id || s.id || null,
          id: s.id || null,
          email: s.email || s.user_email || null,
          timestamp: s.created_at ? new Date(s.created_at).getTime() : null,
          isOfficial: s.is_official !== false
        };
      });

      const topper = topRankers[0] || null;
      const avgScore = totalParticipants > 0 ? Number((uniqueList.reduce(function(acc, x) { return acc + Number(x.score || 0); }, 0) / totalParticipants).toFixed(2)) : 0;
      const avgTime = totalParticipants > 0 ? Math.round(uniqueList.reduce(function(acc, x) { return acc + Number(x.time_taken || 0); }, 0) / totalParticipants) : 0;
      const avgAccuracy = totalParticipants > 0 ? Math.round(uniqueList.reduce(function(acc, x) { return acc + Number(x.accuracy || 0); }, 0) / totalParticipants) : 0;

      let normId = tid;
      if (normId.startsWith(monthKey + '_' + yearKey + '_')) {
        normId = normId.substring((monthKey + '_' + yearKey + '_').length);
      } else if (normId.match(/^[a-z]+_\d{4}_/i)) {
        normId = normId.replace(/^[a-z]+_\d{4}_/i, '');
      }

      let resolvedUserRank = null;
      if (window.caUserId || window.caUserEmail) {
        const foundMe = topRankers.find(function(r) {
          if (window.caUserId && r.userId && String(r.userId) === String(window.caUserId)) return true;
          if (window.caUserEmail && r.email && String(r.email).toLowerCase().trim() === String(window.caUserEmail).toLowerCase().trim()) return true;
          return false;
        });
        if (foundMe) {
          resolvedUserRank = foundMe.rank;
          foundMe.isCurrentUser = true;
        }
      }

      const lbPayload = {
        test_id: tid,
        raw_test_id: normId,
        totalParticipants: totalParticipants,
        total: totalParticipants,
        userRank: resolvedUserRank,
        rank: resolvedUserRank,
        topRankers: topRankers,
        topper: topper,
        avgScore: avgScore,
        avgTime: avgTime,
        avgAccuracy: avgAccuracy
      };

      cachedLbMap[tid] = lbPayload;
      cachedLbMap[normId] = lbPayload;
      if (tid.includes('_')) {
        const simpleKey = tid.split('_').slice(-2).join('_');
        cachedLbMap[simpleKey] = lbPayload;
      }

      window.dispatchEvent(new CustomEvent('ca_real_leaderboard', { detail: lbPayload }));
      if (normId !== tid) {
        window.dispatchEvent(new CustomEvent('ca_real_leaderboard', { detail: Object.assign({}, lbPayload, { test_id: normId }) }));
      }
    });

    try {
      localStorage.setItem('ca_real_leaderboards', JSON.stringify(cachedLbMap));
    } catch(e) {}

    console.log('[Bridge] Supabase leaderboards synced successfully (' + Object.keys(testGroups).length + ' tests, ' + allSubmissions.length + ' submissions).');
  })
  .catch(function(err) {
    console.warn('[Bridge] Error during Supabase leaderboard sync:', err);
  })
  .finally(function() {
    window.isSyncingSupabaseLeaderboards = false;
  });
};

window.caCurrentSpeakingId = null;

window.caStopSpeech = function() {
  if (typeof window !== 'undefined') {
    window.caAudioAbortFlag = true;
    const prevId = window.caCurrentSpeakingId;
    if (window.caCurrentAudioObj) {
      try {
        window.caCurrentAudioObj.pause();
        window.caCurrentAudioObj.currentTime = 0;
        window.caCurrentAudioObj.src = "";
      } catch(e) {}
      window.caCurrentAudioObj = null;
    }
    if ('speechSynthesis' in window) {
      try {
        window.speechSynthesis.cancel();
      } catch(e) {}
    }
    window.caCurrentSpeakingId = null;
    try {
      window.dispatchEvent(new CustomEvent('ca-speech-stopped', { detail: { stoppedId: prevId } }));
    } catch(e) {}
  }
};

window.caToggleAudio = function(id, onEndCallback, onStartCallback) {
  if (window.caCurrentSpeakingId === id || (window.caCurrentAudioObj && !window.caCurrentAudioObj.paused)) {
    window.caStopSpeech();
    return false;
  }
  window.caSpeak("", id, onEndCallback, onStartCallback);
  return true;
};

window.caSpeak = function(textOrQ, id, onEndCallback, onStartCallback) {
  // If a manual single-card audio click happened while podcast was active (and not called from podcast itself)
  const isPodcastCaller = typeof id === 'string' && id.startsWith('podcast-');
  if (!isPodcastCaller && window.caPodcastController && window.caPodcastController.isActive && window.caPodcastController.isPlaying) {
    window.caPodcastController.pause();
  }

  // Stop any active single-card audio
  window.caStopSpeech();
  window.caAudioAbortFlag = false;

  // Resolve question object and question number
  let qNum = null;
  let qObj = null;

  if (typeof textOrQ === 'object' && textOrQ !== null) {
    qObj = textOrQ;
    qNum = String(qObj.id);
  } else if (typeof id === 'object' && id !== null) {
    qObj = id;
    qNum = String(qObj.id);
  } else if (typeof id === 'string') {
    const m = id.match(/\d+/);
    if (m) qNum = m[0];
  } else if (typeof id === 'number') {
    qNum = String(id);
  }

  if (!qObj && qNum && window.caConfig && window.caConfig.questions) {
    qObj = window.caConfig.questions.find(q => String(q.id) === String(qNum));
  }

  const speakingTagId = (typeof id === 'string' || typeof id === 'number') ? id : (qNum ? `card-${qNum}` : 'ca-speech');

  // Play pre-generated natural Madhur Neural MP3 files
  if (qNum) {
    const isStudio = !!(window.caConfig && window.caConfig.isYouTubeStudio);
    const customBase = (window.caConfig && window.caConfig.audioBaseUrl) ? window.caConfig.audioBaseUrl.replace(/\/+$/, '') : '';

    const candidatePaths = [
      (customBase && (!window.location || window.location.protocol !== 'file:')) ? `${customBase}/q_${qNum}.mp3` : null,
      isStudio ? `audio_youtube/q_${qNum}.mp3` : `audio/q_${qNum}.mp3`,
      isStudio ? `./audio_youtube/q_${qNum}.mp3` : `./audio/q_${qNum}.mp3`,
      isStudio ? `../audio_youtube/q_${qNum}.mp3` : `../audio/q_${qNum}.mp3`,
      `${(window.caConfig && window.caConfig.month) || 'February'}_Current_Affairs_${(window.caConfig && window.caConfig.year) || '2026'}_onelinear/audio/q_${qNum}.mp3`,
      `Website_Apps_HTML/audio/q_${qNum}.mp3`,
      `audio/q_${qNum}.mp3`,
      `audio_youtube/q_${qNum}.mp3`,
      (customBase && window.location && window.location.protocol === 'file:') ? `${customBase}/q_${qNum}.mp3` : null
    ].filter(Boolean);

    let pathIdx = 0;
    const tryNextAudio = () => {
      if (window.caAudioAbortFlag) return;
      if (pathIdx >= candidatePaths.length) {
        window.caCurrentAudioObj = null;
        window.caCurrentSpeakingId = null;
        try { window.dispatchEvent(new CustomEvent('ca-speech-stopped', { detail: { stoppedId: speakingTagId } })); } catch(e) {}
        if (onEndCallback) onEndCallback();
        return;
      }
      const p = candidatePaths[pathIdx++];
      try {
        if (window.caAudioAbortFlag) return;
        if (!window.caSharedAudio) {
          window.caSharedAudio = new Audio();
        }
        const audio = window.caSharedAudio;
        window.caCurrentAudioObj = audio;
        window.caCurrentSpeakingId = speakingTagId;

        audio.onplay = () => {
          if (window.caAudioAbortFlag) {
            try { audio.pause(); audio.currentTime = 0; } catch(e) {}
            return;
          }
          if (onStartCallback) onStartCallback();
          try { window.dispatchEvent(new CustomEvent('ca-speech-started', { detail: { id: speakingTagId } })); } catch(e) {}
        };

        audio.onended = () => {
          window.caCurrentSpeakingId = null;
          window.caCurrentAudioObj = null;
          try { window.dispatchEvent(new CustomEvent('ca-speech-stopped', { detail: { stoppedId: speakingTagId } })); } catch(e) {}
          if (onEndCallback) onEndCallback();
        };

        audio.onerror = () => {
          if (!window.caAudioAbortFlag) tryNextAudio();
        };

        const savedSpeed = (window.caPodcastController && window.caPodcastController.speed) || parseFloat(localStorage.getItem('ca_podcast_speed')) || 1.0;
        try {
          audio.defaultPlaybackRate = savedSpeed;
          audio.playbackRate = savedSpeed;
        } catch(e) {}

        audio.onloadedmetadata = () => {
          try {
            audio.defaultPlaybackRate = savedSpeed;
            audio.playbackRate = savedSpeed;
          } catch(e) {}
        };

        audio.pause();
        audio.preload = 'auto';
        audio.src = p;
        audio.load();
        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            try {
              audio.defaultPlaybackRate = savedSpeed;
              audio.playbackRate = savedSpeed;
            } catch(e) {}
          }).catch(() => {
            if (!window.caAudioAbortFlag) tryNextAudio();
          });
        }
      } catch(e) {
        if (!window.caAudioAbortFlag) tryNextAudio();
      }
    };

    tryNextAudio();
    return true;
  }

  if (onEndCallback) onEndCallback();
  return false;
};

// ════════════════════════════════════════════════════════
//  🎧 Continuous Hands-Free Podcast Controller Engine
//  ✅ Sequential Audio Playback with 1.2s Natural Pause
//  ✅ MediaSession Lockscreen & Bluetooth Earphone Integration
//  ✅ Smart Card Auto-Scroll & Visual Highlighter
//  ✅ Speed Controller (1.0x, 1.25x, 1.5x)
// ════════════════════════════════════════════════════════
window.caPodcastController = {
  isActive: false,
  playlist: [],
  currentIndex: 0,
  speed: (typeof window !== 'undefined' && window.caConfig && window.caConfig.isYouTubeStudio) ? 1.0 : 1.25,
  isPlaying: false,
  scopeTitle: '',
  audioObj: null,
  pauseTimer: null,
  listeners: [],
  activePartIndex: 0,
  wakeLock: null,

  requestWakeLock: function() {
    try {
      if (typeof navigator !== 'undefined' && 'wakeLock' in navigator && !this.wakeLock) {
        navigator.wakeLock.request('screen').then(lock => {
          this.wakeLock = lock;
        }).catch(() => {});
      }
    } catch(e) {}
  },

  releaseWakeLock: function() {
    try {
      if (this.wakeLock) {
        this.wakeLock.release();
        this.wakeLock = null;
      }
    } catch(e) {}
  },

  subscribe: function(callback) {
    if (typeof callback === 'function') {
      this.listeners.push(callback);
    }
    return () => {
      this.listeners = this.listeners.filter(cb => cb !== callback);
    };
  },

  notify: function() {
    const state = this.getState();
    this.listeners.forEach(cb => {
      try { cb(state); } catch(e) {}
    });
  },

  getParts: function() {
    return (window.caConfig && window.caConfig.youtubeAudioParts) ? window.caConfig.youtubeAudioParts : [];
  },

  getCurrentPart: function() {
    const parts = this.getParts();
    if (!parts || !parts.length) return null;
    return parts[this.activePartIndex] || parts[0];
  },

  getState: function() {
    const currentPart = this.getCurrentPart();
    return {
      isActive: this.isActive,
      currentIndex: this.currentIndex,
      currentQ: this.playlist[this.currentIndex] || null,
      totalCount: this.playlist.length,
      isPlaying: this.isPlaying,
      speed: this.speed,
      scopeTitle: this.scopeTitle,
      activePartIndex: this.activePartIndex,
      activePart: currentPart,
      allParts: this.getParts()
    };
  },

  start: function(playlist, startIndex, speed, scopeTitle, targetPartIndex) {
    if (!playlist || playlist.length === 0) return;
    this.stop(); // Stop any existing audio/podcast

    this.isActive = true;
    this.playlist = playlist;
    const defaultSpeed = (window.caConfig && window.caConfig.isYouTubeStudio) ? 1.0 : 1.25;
    this.speed = (typeof speed === 'number' && speed > 0) ? speed : defaultSpeed;
    this.scopeTitle = scopeTitle || 'पॉडकास्ट';

    const parts = this.getParts();
    const reqIndex = Math.max(0, Math.min(startIndex || 0, playlist.length - 1));
    const targetQNum = reqIndex + 1;
    const isFilteredCategory = this.playlist && window.caConfig && window.caConfig.questions && (this.playlist.length < window.caConfig.questions.length);

    if (parts && parts.length > 0 && !isFilteredCategory) {
      if (typeof targetPartIndex === 'number' && targetPartIndex >= 0 && targetPartIndex < parts.length) {
        this.activePartIndex = targetPartIndex;
        this.currentIndex = parts[targetPartIndex].startQ - 1;
      } else {
        // Find which part contains targetQNum
        let foundP = parts.findIndex(p => targetQNum >= p.startQ && targetQNum <= p.endQ);
        this.activePartIndex = foundP !== -1 ? foundP : 0;
        this.currentIndex = reqIndex;
      }
    } else {
      this.currentIndex = reqIndex;
    }

    this.isPlaying = true;
    this.requestWakeLock();
    this.playCurrent();
    this.setupMediaSession();
    this.notify();
  },

  setPart: function(partNum, shouldAutoPlay = false) {
    const parts = this.getParts();
    if (!parts || !parts.length) return;
    const pIdx = Math.max(0, Math.min(partNum - 1, parts.length - 1));
    this.activePartIndex = pIdx;
    this.currentIndex = parts[pIdx].startQ - 1;
    if (!this.playlist || this.playlist.length === 0) {
      this.playlist = (window.caConfig && window.caConfig.questions) || [];
    }
    this.isActive = true;
    if (this.audioObj) {
      try { this.audioObj.pause(); } catch(e) {}
      this.audioObj = null;
    }
    window.caStopSpeech();
    
    if (shouldAutoPlay) {
      this.isPlaying = true;
      this.requestWakeLock();
      this.playCurrent();
      this.setupMediaSession();
    } else {
      this.isPlaying = false;
    }
    this.notify();
  },

  playCurrent: function() {
    if (!this.isActive) return;
    if (this.pauseTimer) {
      clearTimeout(this.pauseTimer);
      this.pauseTimer = null;
    }

    const currentQ = this.playlist[this.currentIndex];
    if (!currentQ) {
      this.stop();
      return;
    }

    // Stop single card speech if any
    window.caStopSpeech();

    const parts = this.getParts();
    const isYouTubeStudio = !!(window.caConfig && window.caConfig.isYouTubeStudio);
    const isFilteredCategory = this.playlist && window.caConfig && window.caConfig.questions && (this.playlist.length < window.caConfig.questions.length);

    // 🎙️ BRANCH A: Multi-Part Continuous Audio Sync Mode (YouTube Studio Edition for Full 156 Qs)
    if (isYouTubeStudio && parts && parts.length > 0 && !isFilteredCategory) {
      const currentPart = this.getCurrentPart();
      if (!currentPart) return;

      const expectedAudioFile = currentPart.file || `custom_audio/Part_${currentPart.part}.mp3`;
      const currentQNum = this.currentIndex + 1;
      const qInPartIdx = Math.max(0, currentQNum - currentPart.startQ);
      const targetCueTime = (currentPart.cues && currentPart.cues[qInPartIdx] !== undefined)
        ? currentPart.cues[qInPartIdx]
        : (qInPartIdx * (currentPart.duration / currentPart.count));

      // If audio is already loaded for this part, just seek
      if (this.audioObj && this.audioObj.dataset && this.audioObj.dataset.partFile === expectedAudioFile) {
        if (Math.abs(this.audioObj.currentTime - targetCueTime) > 1.5) {
          try { this.audioObj.currentTime = targetCueTime; } catch(e) {}
        }
        if (this.audioObj.paused) {
          this.audioObj.playbackRate = this.speed || 1.0;
          this.audioObj.play().catch(() => {});
        }
        this.scrollToActiveCard(currentQ.id);
        this.notify();
        return;
      }

      // Load new Part Audio
      if (this.audioObj) {
        try { this.audioObj.pause(); } catch(e) {}
      }

      const tryPlayFallback = () => {
        // Fallback 1: Try individual MP3 or Browser Speech
        const fallbackAudio = new Audio(`audio/q_${currentQ.id}.mp3`);
        this.audioObj = fallbackAudio;
        fallbackAudio.playbackRate = this.speed || 1.0;
        fallbackAudio.onplay = () => { this.isPlaying = true; this.notify(); };
        fallbackAudio.onended = () => {
          this.audioObj = null;
          if (this.currentIndex < this.playlist.length - 1) {
            this.pauseTimer = setTimeout(() => {
              if (this.isActive) { this.currentIndex++; this.playCurrent(); this.notify(); }
            }, 1000);
          } else { this.isPlaying = false; this.notify(); }
        };
        fallbackAudio.onerror = () => {
          this.audioObj = null;
          if (window.caSpeak) {
            this.isPlaying = true;
            this.notify();
            window.caSpeak(currentQ, () => {
              if (this.isActive) {
                if (this.currentIndex < this.playlist.length - 1) {
                  this.currentIndex++;
                  this.playCurrent();
                  this.notify();
                } else { this.isPlaying = false; this.notify(); }
              }
            });
          }
        };
        fallbackAudio.play().catch(() => {
          fallbackAudio.onerror();
        });
      };

      const audio = new Audio(expectedAudioFile);
      audio.dataset.partFile = expectedAudioFile;
      this.audioObj = audio;
      audio.playbackRate = this.speed || 1.0;

      audio.onloadedmetadata = () => {
        try { audio.currentTime = targetCueTime; } catch(e) {}
      };

      audio.ontimeupdate = () => {
        if (!this.isActive || !this.isPlaying) return;
        const ct = audio.currentTime;
        const cues = currentPart.cues || [];
        let matchingQInPart = 0;
        for (let i = 0; i < cues.length; i++) {
          if (ct >= cues[i] - 0.3) {
            matchingQInPart = i;
          }
        }
        const syncedQIdx = (currentPart.startQ - 1) + matchingQInPart;
        if (this.currentIndex !== syncedQIdx && syncedQIdx < this.playlist.length) {
          this.currentIndex = syncedQIdx;
          const newlyActiveQ = this.playlist[this.currentIndex];
          if (newlyActiveQ) {
            this.scrollToActiveCard(newlyActiveQ.id);
            this.updateMediaSessionMetadata(newlyActiveQ);
          }
          this.notify();
        }
      };

      audio.onplay = () => {
        this.isPlaying = true;
        this.updateMediaSessionMetadata(currentQ);
        this.notify();
      };

      audio.onpause = () => {
        if (!this.pauseTimer) {
          this.isPlaying = false;
          this.notify();
        }
      };

      audio.onended = () => {
        this.audioObj = null;
        const isStudio = !!(window.caConfig && window.caConfig.isYouTubeStudio);
        if (isStudio) {
          this.isPlaying = false;
          this.notify();
          return;
        }
        if (this.activePartIndex < parts.length - 1) {
          this.activePartIndex++;
          const nextP = parts[this.activePartIndex];
          this.currentIndex = nextP.startQ - 1;
          this.isPlaying = true;
          this.notify();
          this.pauseTimer = setTimeout(() => {
            if (this.isActive) this.playCurrent();
          }, 1000);
        } else {
          this.isPlaying = false;
          this.notify();
        }
      };

      audio.onerror = () => {
        console.warn("Part Audio missing, falling back smoothly:", expectedAudioFile);
        this.audioObj = null;
        tryPlayFallback();
      };

      this.scrollToActiveCard(currentQ.id);
      const p = audio.play();
      if (p !== undefined) {
        p.catch(() => {
          tryPlayFallback();
        });
      }
      return;
    }

    // 📱 BRANCH B: Standard Per-Question Rapid MP3 Mode
    const tryStandardPlayback = () => {
      const isStudio = !!(window.caConfig && window.caConfig.isYouTubeStudio);
      const customBase = (window.caConfig && window.caConfig.audioBaseUrl) ? window.caConfig.audioBaseUrl.replace(/\/+$/, '') : '';

      const candidatePaths = [
        customBase ? `${customBase}/q_${currentQ.id}.mp3` : null,
        isStudio ? `audio_youtube/q_${currentQ.id}.mp3` : `audio/q_${currentQ.id}.mp3`,
        isStudio ? `./audio_youtube/q_${currentQ.id}.mp3` : `./audio/q_${currentQ.id}.mp3`,
        isStudio ? `../audio_youtube/q_${currentQ.id}.mp3` : `../audio/q_${currentQ.id}.mp3`,
        `January_Current_Affairs_2026_onelinear/audio/q_${currentQ.id}.mp3`,
        `Website_Apps_HTML/audio/q_${currentQ.id}.mp3`,
        `audio/q_${currentQ.id}.mp3`,
        `audio_youtube/q_${currentQ.id}.mp3`
      ].filter(Boolean);

      let pathIdx = 0;
      const tryNextStandard = () => {
        if (pathIdx >= candidatePaths.length) {
          this.audioObj = null;
          this.isPlaying = false;
          this.notify();
          try {
            window.dispatchEvent(new CustomEvent('ca-audio-missing', {
              detail: {
                questionId: currentQ ? currentQ.id : null,
                message: 'ऑडियो फाइल सर्वर पर उपलब्ध नहीं है।'
              }
            }));
          } catch(e) {}
          return;
        }

        const audioPath = candidatePaths[pathIdx++];
        try {
          if (!window.caSharedAudio) {
            window.caSharedAudio = new Audio();
          }
          const audio = window.caSharedAudio;
          this.audioObj = audio;

          // ⚡ Lock speed firmly on element and prevent browser resetting to 1.0
          const currentSpeed = this.speed || 1.25;
          try {
            audio.defaultPlaybackRate = currentSpeed;
            audio.playbackRate = currentSpeed;
          } catch(e) {}

          const enforceSpeed = () => {
            if (this.speed) {
              try {
                audio.defaultPlaybackRate = this.speed;
                audio.playbackRate = this.speed;
              } catch(e) {}
            }
          };

          this.scrollToActiveCard(currentQ.id);

          audio.onloadedmetadata = enforceSpeed;
          audio.oncanplay = enforceSpeed;

          audio.onplay = () => {
            enforceSpeed();
            this.isPlaying = true;
            this.updateMediaSessionMetadata(currentQ);
            this.notify();

            // 🚀 Pre-buffer NEXT question's audio in background so next transition starts in 0ms!
            if (this.currentIndex < this.playlist.length - 1) {
              const nextQ = this.playlist[this.currentIndex + 1];
              if (nextQ && nextQ.id) {
                const nextAudioUrl = customBase ? `${customBase}/q_${nextQ.id}.mp3` : `audio/q_${nextQ.id}.mp3`;
                if (!window.caPreloadAudio) window.caPreloadAudio = new Audio();
                window.caPreloadAudio.preload = 'auto';
                window.caPreloadAudio.src = nextAudioUrl;
              }
            }
          };

          audio.onpause = () => {
            if (!this.pauseTimer) {
              this.isPlaying = false;
              this.notify();
            }
          };

          audio.onended = () => {
            if (this.currentIndex >= this.playlist.length - 1) {
              this.isPlaying = false;
              this.notify();
              return;
            }

            this.isPlaying = true;
            this.notify();
            this.pauseTimer = setTimeout(() => {
              if (this.isActive) {
                this.currentIndex++;
                this.playCurrent();
                this.notify();
              }
            }, 450);
          };

          audio.onerror = () => {
            tryNextStandard();
          };

          audio.pause();
          audio.preload = 'auto';
          audio.src = audioPath;
          audio.load();
          const p = audio.play();
          if (p !== undefined) {
            p.then(() => {
              enforceSpeed();
            }).catch(() => {
              tryNextStandard();
            });
          }
        } catch(e) {
          tryNextStandard();
        }
      };

      tryNextStandard();
    };

    tryStandardPlayback();
  },

  togglePlay: function() {
    if (!this.isActive) {
      if (this.playlist && this.playlist.length > 0) {
        this.start(this.playlist, this.currentIndex);
      }
      return;
    }
    if (this.isPlaying) {
      this.pause();
    } else {
      this.resume();
    }
  },

  pause: function() {
    if (this.pauseTimer) {
      clearTimeout(this.pauseTimer);
      this.pauseTimer = null;
    }
    if (this.audioObj) {
      try { this.audioObj.pause(); } catch(e) {}
    }
    window.caStopSpeech();
    this.isPlaying = false;
    this.notify();
  },

  resume: function() {
    if (this.audioObj && this.audioObj.paused) {
      try {
        const curSpd = this.speed || 1.25;
        this.audioObj.defaultPlaybackRate = curSpd;
        this.audioObj.playbackRate = curSpd;
        this.audioObj.play();
        this.isPlaying = true;
        this.notify();
        return;
      } catch(e) {}
    }
    this.playCurrent();
  },

  next: function() {
    if (!this.isActive) return;
    if (this.currentIndex < this.playlist.length - 1) {
      if (this.pauseTimer) clearTimeout(this.pauseTimer);
      this.currentIndex++;
      this.playCurrent();
      this.notify();
    }
  },

  prev: function() {
    if (!this.isActive) return;
    if (this.currentIndex > 0) {
      if (this.pauseTimer) clearTimeout(this.pauseTimer);
      this.currentIndex--;
      this.playCurrent();
      this.notify();
    }
  },

  jumpTo: function(target) {
    if (!this.isActive) {
      if (!this.playlist || this.playlist.length === 0) {
        this.playlist = (window.caConfig && window.caConfig.questions) || [];
      }
      this.isActive = true;
    }

    let targetIdx = -1;
    if (typeof target === 'number') {
      if (target >= 0 && target < this.playlist.length) {
        targetIdx = target;
      } else {
        const found = this.playlist.findIndex(q => parseInt(q.id, 10) === target);
        if (found !== -1) targetIdx = found;
      }
    } else if (typeof target === 'string') {
      const found = this.playlist.findIndex(q => String(q.id) === String(target));
      if (found !== -1) targetIdx = found;
    }

    if (targetIdx !== -1) {
      if (this.pauseTimer) {
        clearTimeout(this.pauseTimer);
        this.pauseTimer = null;
      }
      this.currentIndex = targetIdx;
      this.isPlaying = true;
      this.requestWakeLock();
      this.playCurrent();
      this.notify();
    }
  },

  setSpeed: function(newSpeed) {
    const val = parseFloat(newSpeed);
    if (isNaN(val) || val <= 0) return;
    this.speed = val;
    if (this.audioObj) {
      try {
        this.audioObj.defaultPlaybackRate = val;
        this.audioObj.playbackRate = val;
      } catch(e) {}
    }
    try {
      localStorage.setItem('ca_podcast_speed', String(val));
    } catch(e) {}
    this.notify();
  },

  stop: function() {
    if (this.pauseTimer) {
      clearTimeout(this.pauseTimer);
      this.pauseTimer = null;
    }
    if (this.audioObj) {
      try {
        this.audioObj.pause();
        this.audioObj.currentTime = 0;
      } catch(e) {}
      this.audioObj = null;
    }
    window.caStopSpeech();
    this.releaseWakeLock();
    this.isActive = false;
    this.isPlaying = false;
    this.notify();
  },

  scrollToActiveCard: function(qId) {
    if (typeof document === 'undefined') return;
    try {
      const cardEl = document.getElementById(`ca-card-${qId}`) || document.querySelector(`[data-qid="${qId}"]`) || document.getElementById(`card-q-${qId}`);
      if (!cardEl) return;

      const scrollContainer = document.querySelector('.main-scroll');
      if (scrollContainer) {
        const containerRect = scrollContainer.getBoundingClientRect();
        const cardRect = cardEl.getBoundingClientRect();

        const topSafe = containerRect.top + 20;
        const bottomSafe = containerRect.bottom - 100;

        // 🎥 STEADY CAMERA TECHNIQUE:
        // If card is already comfortably visible within .main-scroll, DO NOT jump!
        if (cardRect.top >= topSafe && cardRect.bottom <= bottomSafe) {
          return;
        }

        // When moving to the next row (e.g. Card 4, 7, 10), scroll .main-scroll smoothly
        const scrollDelta = cardRect.top - containerRect.top;
        scrollContainer.scrollTo({
          top: Math.max(0, scrollContainer.scrollTop + scrollDelta - 20),
          behavior: 'smooth'
        });
      } else {
        cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    } catch(e) {}
  },

  setupMediaSession: function() {
    if (typeof navigator === 'undefined' || !('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.setActionHandler('play', () => this.resume());
      navigator.mediaSession.setActionHandler('pause', () => this.pause());
      navigator.mediaSession.setActionHandler('previoustrack', () => this.prev());
      navigator.mediaSession.setActionHandler('nexttrack', () => this.next());
    } catch(e) {}
  },

  updateMediaSessionMetadata: function(currentQ) {
    if (typeof navigator === 'undefined' || !('mediaSession' in navigator) || !window.MediaMetadata) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: `Q.${currentQ.id}: ${currentQ.question}`,
        artist: 'GyanLayer Current Affairs Podcast',
        album: `${this.scopeTitle} (${this.currentIndex + 1}/${this.playlist.length})`
      });
    } catch(e) {}
  }
};

// ================================================================

//  Main React Application Shell
//
//  ✅ EDIT THIS FILE FOR: Tab logic, State management,
