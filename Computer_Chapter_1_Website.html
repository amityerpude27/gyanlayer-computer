// ── Canonical Testbook Deduplication Engine ──
const deduplicateAttemptList = (list) => {
  if (!list || !Array.isArray(list) || list.length === 0) return [];
  if (list.length === 1) {
    const single = list[0];
    if (!single) return [];
    return [{
      ...single,
      attemptNumber: 1,
      attempt_number: 1,
      isOfficial: true
    }];
  }

  // Sort chronologically: oldest first, latest last
  const sorted = [...list].filter(Boolean).sort((a, b) => {
    const ta = new Date(a.timestamp || a.created_at || 0).getTime();
    const tb = new Date(b.timestamp || b.created_at || 0).getTime();
    return ta - tb;
  });

  const deduped = [];
  for (const item of sorted) {
    const itemTime = new Date(item.timestamp || item.created_at || 0).getTime();
    const itemScore = Number(item.score !== undefined ? item.score : 0);
    const itemTaken = Number(item.taken !== undefined ? item.taken : (item.time_taken || 0));
    const itemId = item.id || item.submission_id || null;

    const dupIndex = deduped.findIndex(existing => {
      const exId = existing.id || existing.submission_id || null;
      if (itemId && exId && itemId === exId) return true;

      const exTime = new Date(existing.timestamp || existing.created_at || 0).getTime();
      const exScore = Number(existing.score !== undefined ? existing.score : 0);
      const exTaken = Number(existing.taken !== undefined ? existing.taken : (existing.time_taken || 0));

      const timeDiff = Math.abs(itemTime - exTime);
      // Same test submission if timestamps are within 10 minutes (600,000 ms) AND score matches
      if (timeDiff < 600000 && Math.abs(itemScore - exScore) < 0.05) {
        if (Math.abs(itemTaken - exTaken) < 10 || itemTime === exTime || timeDiff < 60000) {
          return true;
        }
      }
      return false;
    });

    if (dupIndex !== -1) {
      // Merge richest fields into existing item
      const existing = deduped[dupIndex];
      deduped[dupIndex] = {
        ...existing,
        ...item,
        id: existing.id || item.id,
        userRank: (item.userRank !== undefined ? item.userRank : existing.userRank),
        totalParticipants: (item.totalParticipants !== undefined ? item.totalParticipants : existing.totalParticipants),
        leaderboard: item.leaderboard || existing.leaderboard,
        topRankers: item.topRankers || existing.topRankers,
        timestamp: Math.min(itemTime || Date.now(), new Date(existing.timestamp || existing.created_at || 0).getTime() || Date.now())
      };
    } else {
      deduped.push(item);
    }
  }

  // Canonical 1-based indexing for attempt numbers
  return deduped.map((att, idx) => ({
    ...att,
    attemptNumber: idx + 1,
    attempt_number: idx + 1,
    isOfficial: idx === 0
  }));
};

// ── Testbook Smart Attempt Date & Status Formatter ──
const formatAttemptStatus = (att, list) => {
  if (!att) return '';
  const cleanList = deduplicateAttemptList(list || []);
  const isReattempt = cleanList.length > 1 && att.attemptNumber !== 1 && att.attempt_number !== 1;
  const ts = att.timestamp || att.created_at;
  let dateText = 'Today';
  if (ts) {
    const d = new Date(ts);
    const now = new Date();
    const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    const startOfYesterday = startOfToday - 86400000;
    const startOfAtt = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    if (startOfAtt === startOfToday) {
      dateText = 'Today';
    } else if (startOfAtt === startOfYesterday) {
      dateText = 'Yesterday';
    } else {
      dateText = 'on ' + d.toLocaleDateString('en-US', { day: 'numeric', month: 'short' });
    }
  }
  const prefix = isReattempt ? 'Reattempted ' : 'Attempted ';
  return `${prefix}${dateText}`;
};

  window.seededRandom = seededRandom;
  window.seededShuffle = seededShuffle;
  window.stableShuf = stableShuf;
  window.getStudentAnswer = getStudentAnswer;
  window.isFixedOptionD = isFixedOptionD;
  window.makeOpts = makeOpts;
  window.buildMonthly = buildMonthly;
  window.buildTopic = buildTopic;
  window.PaletteGrid = PaletteGrid;

}

//  SCREEN 1: Test Selection
const TestSelector = ({monthly, topic, onStart, onResume, onStartFresh, inProgressMap, attempts, leaderboardMap, onViewSolution, onViewAnalysis, dk, wm}) => {
  const [tab, setTab] = useState('monthly');
  const [syllabusTest, setSyllabusTest] = useState(null);
  const listRef = useRef(null);
  
  const handleTabChange = (newTab) => {
    if (tab === newTab) return;
    setTab(newTab);
    // Instant 0ms reset (strictly no visible scrolling animation)
    if (listRef.current) {
      listRef.current.scrollTop = 0;
    }
    const mainScroll = document.querySelector('.main-scroll');
    if (mainScroll) {
      mainScroll.scrollTop = 0;
    }
    window.scrollTo(0, 0);
  };

  useEffect(() => {
    if (listRef.current) {
      listRef.current.scrollTop = 0;
    }
    const mainScroll = document.querySelector('.main-scroll');
    if (mainScroll) {
      mainScroll.scrollTop = 0;
    }
  }, [tab]);

  const tests = tab === 'monthly' ? monthly : topic;
  const card = dk ? 'bg-slate-800 border-slate-700' : wm ? 'bg-[#faf7ef] border-[#e0d5b0]' : 'bg-white border-slate-200';
  const tm = dk ? 'text-slate-100' : 'text-slate-800';
  const ts = dk ? 'text-slate-400' : 'text-slate-500';
  const borderCol = dk ? 'border-slate-700' : 'border-slate-200';
  const cats = (window.caConfig && window.caConfig.categories) || [];

  return (
    <div className="w-full max-w-4xl mx-auto px-4 py-6">
      {/* Segmented Controller (Tab Switcher) */}
      <div className="flex justify-center mb-6">
        <div className={`p-1.5 rounded-2xl flex items-center max-w-md w-full border relative transition-colors duration-300 ${dk ? 'bg-slate-900 border-slate-800' : wm ? 'bg-[#f4efe0] border-[#e0d5b0]' : 'bg-slate-100 border-slate-200'}`}>
          {/* Animated Sliding Background Pill */}
          <div 
            className={`absolute top-1.5 bottom-1.5 rounded-xl transition-all duration-300 ease-out shadow-sm
              ${tab === 'monthly' ? 'left-1.5 w-[calc(50%-6px)]' : 'left-[calc(50%+3px)] w-[calc(50%-6px)]'}
              ${dk 
                ? 'bg-violet-600 shadow-violet-900/50' 
                : wm 
                  ? 'bg-amber-600 shadow-amber-900/20' 
                  : 'bg-white shadow-slate-200'}`}
          />

          {/* Tab Button 1 */}
          <button 
            onClick={() => handleTabChange('monthly')}
            className={`relative z-10 flex-grow py-2 rounded-xl text-[11px] sm:text-xs font-black tracking-wider transition-all duration-300 flex items-center justify-center gap-1.5 outline-none focus:outline-none hover:scale-[1.02] active:scale-[0.98]
              ${tab === 'monthly' 
                ? (dk || wm ? 'text-white' : 'text-violet-700 font-extrabold') 
                : dk 
                  ? 'text-slate-400 hover:text-slate-250' 
                  : wm 
                    ? 'text-[#6e5d4f] hover:text-[#4a3b32]' 
                    : 'text-slate-500 hover:text-slate-800'}`}
          >
            <i className={`fa-solid fa-calendar-days text-xs ${tab === 'monthly' ? (dk || wm ? 'text-white' : 'text-violet-600') : dk ? 'text-violet-400' : wm ? 'text-amber-600' : 'text-violet-500'}`}></i>
            <span>{window.caConfig && (window.caConfig.mode === 'chapter' || (window.caConfig.title && window.caConfig.title.toLowerCase().includes('computer')) || (window.caConfig.month && window.caConfig.month.toLowerCase().includes('chapter'))) ? 'Sectional Test' : 'Monthly Mock'}</span>
          </button>

          {/* Tab Button 2 */}
          <button 
            onClick={() => handleTabChange('topic')}
            className={`relative z-10 flex-grow py-2 rounded-xl text-[11px] sm:text-xs font-black tracking-wider transition-all duration-300 flex items-center justify-center gap-1.5 outline-none focus:outline-none hover:scale-[1.02] active:scale-[0.98]
              ${tab === 'topic' 
                ? (dk || wm ? 'text-white' : 'text-violet-700 font-extrabold') 
                : dk 
                  ? 'text-slate-400 hover:text-slate-250' 
                  : wm 
                    ? 'text-[#6e5d4f] hover:text-[#4a3b32]' 
                    : 'text-slate-500 hover:text-slate-800'}`}
          >
            <i className={`fa-solid fa-tags text-xs ${tab === 'topic' ? (dk || wm ? 'text-white' : 'text-violet-600') : dk ? 'text-violet-400' : wm ? 'text-amber-600' : 'text-violet-500'}`}></i>
            <span>Topic-wise</span>
          </button>
        </div>
      </div>

      {/* Info bar (Strictly no reset button for students) */}
      <div className={'rounded-xl px-4 py-2.5 mb-5 text-[11px] sm:text-xs font-medium ' + (dk?'bg-violet-950/40 text-violet-300 border border-violet-850':'bg-violet-50 text-violet-700 border border-violet-100')}>
        <span>
          {tab === 'monthly'
            ? (window.caConfig && (window.caConfig.mode === 'chapter' || (window.caConfig.title && window.caConfig.title.toLowerCase().includes('computer')) || (window.caConfig.month && window.caConfig.month.toLowerCase().includes('chapter')))
                ? '📅 RRB NTPC & SSC Computer Awareness Sectional Tests. Har set mein 25 questions latest TCS PYQ pattern.'
                : '📅 RRB/SSC Important questions. Har set mein 25 questions tak mock test pattern.')
            : '🏷️ Category-wise questions. Sabhi topics ke sets detailed speed practice ke liye.'}
        </span>
      </div>

      {/* Syllabus Modal */}
      {syllabusTest && ReactDOM.createPortal(
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className={`rounded-2xl p-6 max-w-sm w-full border-2 shadow-2xl transition-all duration-300 animate-in zoom-in-95 ${card}`}>
            <div className="flex items-center justify-between mb-4">
              <h3 className={`text-base font-black flex items-center gap-1.5 ${tm}`}>
                <i className="fa-solid fa-book-bookmark text-violet-500"></i> Syllabus Breakdown
              </h3>
              <button onClick={() => setSyllabusTest(null)} className={`w-7 h-7 rounded-full flex items-center justify-center text-xs ${dk ? 'bg-slate-800 hover:bg-slate-700 text-slate-300' : 'bg-slate-100 hover:bg-slate-200 text-slate-600'}`}>
                <i className="fa-solid fa-xmark"></i>
              </button>
            </div>
            <p className={`text-xs font-bold mb-3 ${tm}`}>{syllabusTest.name}</p>
            <div className="grid grid-cols-1 gap-2 mb-4 max-h-[220px] overflow-y-auto pr-1 custom-scroll">
              {cats.filter(c => c.id !== 'all').map(cat => (
                <div key={cat.id} className={`flex items-center gap-2.5 p-2.5 rounded-xl text-xs font-bold border ${dk ? 'bg-slate-900 border-slate-800 text-slate-300' : 'bg-white border-slate-200 text-slate-700 shadow-sm'}`}>
                  <span className="w-5 text-center text-violet-500 text-sm">
                    <i className={cat.icon}></i>
                  </span>
                  <span>{cat.label}</span>
                </div>
              ))}
            </div>
            <button onClick={() => setSyllabusTest(null)} className="w-full py-2 bg-violet-600 hover:bg-violet-700 text-white font-bold rounded-xl text-xs transition-all active:scale-95">
              Close
            </button>
          </div>
        </div>,
        document.body
      )}

      {tests.length === 0 ? (
        <div className="text-center py-12">
          <p className="text-4xl mb-3">📝</p>
          <p className={'text-sm font-semibold '+tm}>
            {tab === 'monthly'
              ? (window.caConfig && (window.caConfig.mode === 'chapter' || (window.caConfig.title && window.caConfig.title.toLowerCase().includes('computer'))) ? 'Koi chapter mock test nahi mila. globals.js check karein.' : 'Koi monthly test nahi. globals.js mein "RRB/SSC IMP" examTag wale questions add karein.')
              : 'Koi topic test nahi. Har category mein 5+ questions add karein.'}
          </p>
        </div>
      ) : (
        <div ref={listRef} key={tab} className="space-y-4 max-h-[60vh] overflow-y-auto pr-2 custom-scroll">
          {tests.map((t, i) => {
            const rawAttemptList = (attempts && attempts[t.id]) 
              || (attempts && attempts[t.id.replace('_', '-')])
              || (attempts && attempts[t.id.replace('-', '_')])
              || (attempts && Object.keys(attempts).filter(k => k.toLowerCase() === t.id.toLowerCase() || k.replace(/[-_]/g, '') === t.id.replace(/[-_]/g, '')).map(k => attempts[k]).flat())
              || [];
            const attemptList = deduplicateAttemptList(rawAttemptList);
            const isCompleted = attemptList.length > 0;
            const latestAttempt = isCompleted ? attemptList[attemptList.length - 1] : null;
            const inProg = inProgressMap && inProgressMap[t.id];
            const isReattempt = attemptList.length > 1 && latestAttempt && latestAttempt.attemptNumber !== 1 && latestAttempt.attempt_number !== 1;

            // 🎯 Testbook Dynamic Rank & Live Supabase Leaderboard Resolution:
            const lb = (leaderboardMap && (
              leaderboardMap[t.id] || 
              leaderboardMap[t.id.replace('_', '-')] || 
              leaderboardMap[t.id.replace('-', '_')] ||
              (Object.keys(leaderboardMap).find(k => k.endsWith(t.id) || t.id.endsWith(k)) ? leaderboardMap[Object.keys(leaderboardMap).find(k => k.endsWith(t.id) || t.id.endsWith(k))] : null)
            )) || (latestAttempt && (latestAttempt.leaderboard || null));

            const totalParticipants = (lb && (Number(lb.totalParticipants) || (Array.isArray(lb.topRankers) ? lb.topRankers.length : 0)))
              || (latestAttempt && Number(latestAttempt.totalParticipants))
              || Math.max(attemptList.length, 1);

            const attemptRank = (lb && (Number(lb.userRank) || Number(lb.rank)))
              || (latestAttempt && Number(latestAttempt.userRank || latestAttempt.rank))
              || (() => {
                const myScore = Number((latestAttempt && latestAttempt.score) || 0);
                if (lb && Array.isArray(lb.topRankers) && lb.topRankers.length > 0) {
                  const higher = lb.topRankers.filter(r => Number(r.score || 0) > myScore).length;
                  return higher + 1;
                }
                if (attemptList.length <= 1) return 1;
                const higherCount = attemptList.filter(a => Number(a.score || 0) > myScore).length;
                return higherCount + 1;
              })();

            const displayTotal = Math.max(totalParticipants, attemptRank);

            const isComputerMode = window.caConfig && (
              window.caConfig.mode === 'chapter' || 
              (window.caConfig.title && window.caConfig.title.toLowerCase().includes('computer')) || 
              (window.caConfig.month && window.caConfig.month.toLowerCase().includes('chapter'))
            );

            const displayName = t.type === 'monthly'
              ? (isComputerMode
                  ? (t.name || `Sectional Mock Test ${i + 1}`)
                  : `Current Affair — ${(window.caConfig && window.caConfig.month) || 'January'} ${(window.caConfig && window.caConfig.year) || '2026'} (${t.name})`)
              : t.name;

            // Border color based on status (Completed gets Testbook subtle emerald highlight)
            const statusBorder = inProg
              ? 'border-l-[5px] border-l-amber-500'
              : isCompleted 
              ? 'border-l-[5px] border-l-emerald-500 border-emerald-400/40 dark:border-emerald-700/50 bg-emerald-50/10 dark:bg-emerald-950/10' 
              : 'border-l-[5px] border-l-slate-350 dark:border-l-slate-700';

            const answeredCount = inProg ? (
              inProg.states 
                ? inProg.states.filter(s => s === QS.ANS || s === QS.MA || s === 'ans' || s === 'ma').length 
                : t.qs.filter((_, idx) => inProg.answers && (inProg.answers[idx] !== undefined || (t.qs[idx] && inProg.answers[t.qs[idx].id] !== undefined))).length
            ) : 0;

            return (
              <div key={t.id} className={`border-2 border-r-2 border-t-2 border-b-2 rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:shadow-md hover:border-violet-300 dark:hover:border-violet-700 transition-all ${card} ${statusBorder}`}>
                <div className="flex-1 min-w-0">
                  {/* Top row: CT badge + In Progress / Attempt Badges */}
                  <div className="flex items-center gap-2 mb-1.5 flex-wrap">
                    <span className={`text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-md ${dk ? 'bg-violet-950/60 text-violet-400 border border-violet-800/60' : 'bg-violet-100 text-violet-700 border border-violet-200'}`}>
                      {isComputerMode ? 'ST ' + (i+1) : 'CT ' + (i+1)}
                    </span>
                    {inProg ? (
                      <span className="text-[9.5px] sm:text-xs px-2.5 py-0.5 rounded-lg font-black flex items-center gap-1 shadow-sm bg-amber-500/15 text-amber-600 dark:text-amber-400 border border-amber-400/40 animate-pulse">
                        <i className="fa-solid fa-hourglass-half text-[10px]"></i> In Progress ({answeredCount}/{t.qs.length} Qs • {fmt(inProg.secs)} left)
                      </span>
                    ) : isCompleted && latestAttempt ? (
                      <React.Fragment>
                        <span className={`text-[9.5px] sm:text-xs px-2.5 py-0.5 rounded-lg font-black flex items-center gap-1 shadow-sm ${latestAttempt.score >= (latestAttempt.max || 1) * 0.7 ? 'bg-emerald-50 text-emerald-700 border border-emerald-200 dark:bg-emerald-950/50 dark:text-emerald-300 dark:border-emerald-800' : 'bg-amber-50 text-amber-700 border border-amber-200 dark:bg-amber-950/50 dark:text-amber-300 dark:border-amber-800'}`}>
                          <i className={`fa-solid ${isReattempt ? 'fa-rotate-right text-indigo-500' : 'fa-circle-check text-emerald-500'} text-[10px]`}></i>
                          {isReattempt ? 'Re-attempted' : 'Completed'}
                        </span>
                        <span className="text-[9px] sm:text-[10px] px-2 py-0.5 rounded-lg bg-indigo-50 dark:bg-indigo-950/40 text-indigo-700 dark:text-indigo-400 font-extrabold border border-indigo-200 dark:border-indigo-800 flex items-center gap-1 select-none">
                          <i className="fa-solid fa-layer-group text-[9px]"></i> {isReattempt ? `Attempt ${attemptList.length}` : '1 Attempt'}
                        </span>
                      </React.Fragment>
                    ) : null}
                  </div>

                  {/* Title */}
                  <p className={`text-sm sm:text-base font-extrabold mb-1.5 leading-tight ${tm}`}>
                    {displayName}
                  </p>

                  {/* 📊 Testbook-Style Rank, Marks & Visual Score Progress Line */}
                  {isCompleted && latestAttempt ? (
                    <div className="space-y-1.5 mb-2.5">
                      <div className="flex items-center gap-2 sm:gap-3 text-[11px] sm:text-xs font-bold flex-wrap">
                        {displayTotal >= 5 ? (
                          <span className="text-slate-600 dark:text-slate-300 flex items-center gap-1 font-bold">
                            <i className="fa-solid fa-user-group text-slate-400 text-[11px]"></i> #{attemptRank}/{displayTotal} Rank
                          </span>
                        ) : (
                          <span className="text-amber-600 dark:text-amber-400 flex items-center gap-1 font-extrabold bg-amber-500/10 dark:bg-amber-950/40 px-2 py-0.5 rounded-md border border-amber-300/40 dark:border-amber-800">
                            <i className="fa-solid fa-lock text-[10px]"></i> Rank: Locked (Unlocks at 5 • {displayTotal}/5 Completed)
                          </span>
                        )}
                        <span className={ts}>•</span>
                        <span className="text-slate-700 dark:text-slate-200 font-black flex items-center gap-1">
                          <i className="fa-solid fa-bullseye text-emerald-600 dark:text-emerald-400 text-[11px]"></i> {latestAttempt.score}/{latestAttempt.max} Marks
                        </span>
                        <span className={ts}>•</span>
                        <span className={`font-black ${latestAttempt.acc >= 70 ? 'text-emerald-600 dark:text-emerald-400' : 'text-amber-600'}`}>
                          {latestAttempt.acc}% Acc
                        </span>
                      </div>
                      {/* Testbook Score Progress Line */}
                      <div className="w-full max-w-xs sm:max-w-sm h-1.5 rounded-full bg-slate-200/80 dark:bg-slate-700/80 overflow-hidden">
                        <div 
                          className={`h-full rounded-full transition-all duration-500 ${latestAttempt.score >= (latestAttempt.max || 1) * 0.7 ? 'bg-emerald-500' : 'bg-amber-500'}`}
                          style={{ width: `${Math.min(100, Math.max(0, (latestAttempt.score / (latestAttempt.max || 1)) * 100))}%` }}
                        />
                      </div>
                    </div>
                  ) : (
                    /* Stats icons row for unattempted */
                    <div className="flex flex-wrap gap-x-4 gap-y-1.5 mb-3 text-xs">
                      <span className={`flex items-center gap-1 font-bold ${ts}`}>
                        <i className="fa-solid fa-clipboard-list text-[13px] text-violet-500"></i> {t.qs.length} Questions
                      </span>
                      <span className={`flex items-center gap-1 font-bold ${ts}`}>
                        <i className="fa-regular fa-file-lines text-[13px] text-violet-500"></i> {t.qs.length * t.mark} Marks
                      </span>
                      <span className={`flex items-center gap-1 font-bold ${ts}`}>
                        <i className="fa-regular fa-clock text-[13px] text-violet-500"></i> {t.mins} Mins
                      </span>
                    </div>
                  )}

                  {/* Footer Row: Attempted Date | Reattempt | Syllabus | Language | Share */}
                  <div className={`flex items-center justify-between gap-2 sm:gap-3 flex-wrap text-[10.5px] sm:text-[11px] font-extrabold pt-2 sm:pt-2.5 border-t ${borderCol}`}>
                    <div className="flex items-center gap-2 sm:gap-3 flex-wrap">
                      {isCompleted && latestAttempt && (
                        <React.Fragment>
                          <span className="text-slate-500 dark:text-slate-400 font-bold">
                            {formatAttemptStatus(latestAttempt, attemptList)}
                          </span>
                          <button onClick={() => onStart(t)} className="text-violet-600 dark:text-violet-400 hover:text-violet-700 dark:hover:text-violet-300 hover:underline font-black flex items-center gap-1 cursor-pointer">
                            <i className="fa-solid fa-rotate-right text-[10px]"></i> Reattempt ➔
                          </button>
                          <span className={ts}>|</span>
                        </React.Fragment>
                      )}
                      {inProg && (
                        <React.Fragment>
                          <button onClick={() => onStartFresh(t)} className="text-rose-600 hover:text-rose-700 hover:underline flex items-center gap-1 cursor-pointer">
                            <i className="fa-solid fa-rotate-left text-[10px]"></i> Start Fresh (शुरू से दें)
                          </button>
                          <span className={ts}>|</span>
                        </React.Fragment>
                      )}
                      <button onClick={() => setSyllabusTest(t)} className="text-violet-600 hover:text-violet-700 hover:underline flex items-center gap-0.5 cursor-pointer">
                        Syllabus
                      </button>
                      <span className={ts}>|</span>
                      <span className={ts}><i className="fa-solid fa-globe"></i> Hindi</span>
                    </div>
                    <button 
                      onClick={() => { if (window.dispatchEvent) window.dispatchEvent(new CustomEvent('ca_open_share', { detail: t })); }} 
                      className="text-slate-400 hover:text-violet-500 flex items-center gap-1 text-[10.5px] cursor-pointer"
                    >
                      <i className="fa-solid fa-share-nodes"></i> Share
                    </button>
                  </div>
                </div>

                {/* Right side buttons (Testbook Exact: Side-by-Side Solution & Analysis) */}
                <div className="flex items-center gap-2.5 w-full sm:w-auto shrink-0 justify-end">
                  {inProg ? (
                    <button onClick={() => onResume(t)}
                      className="flex-grow sm:flex-none w-full sm:w-auto px-6 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-violet-600 hover:from-amber-600 hover:to-violet-700 text-white text-xs font-black transition-all active:scale-95 shadow-[0_4px_12px_rgba(245,158,11,0.35)] text-center flex items-center justify-center gap-1.5 cursor-pointer"
                    >
                      <i className="fa-solid fa-play text-xs"></i>
                      <span>Resume Test</span>
                    </button>
                  ) : isCompleted ? (
                    <div className="flex items-center gap-2 w-full sm:w-auto">
                      <button onClick={() => onViewSolution(t)}
                        className={`flex-1 sm:flex-none px-4 sm:px-5 py-2 sm:py-2.5 rounded-xl text-xs font-black transition-all active:scale-95 border-2 text-center cursor-pointer shadow-xs ${
                          dk 
                            ? 'border-slate-700 bg-slate-800 text-slate-200 hover:bg-slate-700 hover:border-violet-500' 
                            : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50 hover:border-violet-500'
                        }`}
                      >
                        Solution
                      </button>
                      <button onClick={() => onViewAnalysis(t)}
                        className={`flex-1 sm:flex-none px-4 sm:px-5 py-2 sm:py-2.5 rounded-xl text-xs font-black transition-all active:scale-95 border-2 text-center cursor-pointer shadow-xs ${
                          dk 
                            ? 'border-cyan-600 bg-cyan-950/30 text-cyan-400 hover:bg-cyan-900/40' 
                            : 'border-cyan-500 bg-cyan-50/70 text-cyan-700 hover:bg-cyan-100/80'
                        }`}
                      >
                        Analysis
                      </button>
                    </div>
                  ) : (
                    <button onClick={() => onStart(t)}
                      className="flex-grow sm:flex-none w-full sm:w-auto px-6 py-2.5 rounded-xl bg-violet-600 hover:bg-violet-700 text-white text-xs font-black transition-all active:scale-95 shadow-[0_4px_12px_rgba(124,58,237,0.25)] text-center flex items-center justify-center gap-1.5 cursor-pointer">
                      <i className="fa-solid fa-play text-xs"></i>
                      <span>Start Now</span>
                    </button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
};

if (typeof window !== 'undefined') {
  window.TestSelector = TestSelector;
}

// components/mock/Instructions.js — Pre-Test Examination Guidelines & Instructions

// ════════════════════════════════════════════════════════
//  SCREEN 2: Instructions
// ════════════════════════════════════════════════════════
const Instructions = ({test, onBegin, onBack, dk, wm}) => {
  const [ok, setOk] = useState(false);
  const card = dk ? 'bg-slate-800 border-slate-700' : wm ? 'bg-[#faf7ef] border-[#e0d5b0]' : 'bg-white border-slate-200';
  const tm = dk ? 'text-slate-100' : 'text-slate-800';
  const ts = dk ? 'text-slate-400' : 'text-slate-500';
  const rules = [
    `Total Questions: ${test.qs.length} | Duration: ${test.mins} Minutes | Total Marks: ${test.qs.length * test.mark}.`,
    `Each question has 4 options with only one correct answer.`,
    `Marking: +${test.mark} for correct answer, -1/3 (${test.neg}) for incorrect answer (No penalty for unattempted).`,
    `Mark for Review: You can flag questions to revisit them before final submission.`,
    `Auto-Submit: The test automatically submits when the timer reaches 00:00 or when you click Submit.`
  ];
  const legend = [
    [QS.NV,'Not Visited'],
    [QS.NA,'Not Answered'],
    [QS.ANS,'Answered'],
    [QS.MRK,'Marked for Review'],
    [QS.MA,'Marked + Answered'],
  ];

  return (
    <div className={`flex flex-col w-full h-full overflow-hidden pb-16 sm:pb-0 ${dk ? 'bg-slate-950' : 'bg-white'}`}>
      
      {/* Scrollable Content Area */}
      <div className="flex-1 overflow-y-auto p-4 sm:p-5 flex flex-col gap-3 sm:gap-4 w-full max-w-3xl mx-auto min-h-0">
        
        {/* Header Section (Title & Stats) */}
        <div className="shrink-0">
          <h2 className={`font-black mb-1.5 text-base sm:text-lg ${tm}`}>{test.name}</h2>
          <div className="flex items-center gap-2 sm:gap-3 flex-wrap">
            <span className={`font-bold text-xs sm:text-sm px-2.5 py-0.5 rounded-md border ${dk ? 'bg-slate-900 border-slate-800 text-slate-300' : 'bg-slate-100 border-slate-200 text-slate-700'}`}>⏱ {test.mins} Min</span>
            <span className={`font-bold text-xs sm:text-sm px-2.5 py-0.5 rounded-md border ${dk ? 'bg-slate-900 border-slate-800 text-slate-300' : 'bg-slate-100 border-slate-200 text-slate-700'}`}>📊 Max: {test.qs.length * test.mark} Marks</span>
            <span className="text-xs sm:text-sm text-rose-500 font-bold px-2.5 py-0.5 rounded-md border border-rose-500/20 bg-rose-500/10">❌ -1/3 ({test.neg}) Negative</span>
          </div>
        </div>

        {/* Instructions list */}
        <div className={`border rounded-2xl p-4 sm:p-5 shadow-xs flex flex-col ${card}`}>
          <p className={`font-black uppercase tracking-wider mb-3 shrink-0 text-xs sm:text-sm ${(dk?'text-violet-400':'text-violet-700')}`}>
            <i className="fa-solid fa-circle-info mr-1.5"></i> GENERAL INSTRUCTIONS
          </p>
          <ol className="flex flex-col gap-2.5 min-h-0">
            {rules.map((r,i) => (
              <li key={i} className="flex gap-2.5 items-start">
                <span className={`shrink-0 rounded-full flex items-center justify-center font-black w-5 h-5 text-[11px] mt-0.5 ${(dk?'bg-violet-950/80 text-violet-300 border border-violet-800/60':'bg-violet-100 text-violet-700 border border-violet-200')}`}>{i+1}</span>
                <span className={`font-medium text-xs sm:text-sm leading-relaxed ${(dk?'text-slate-300':'text-slate-600')}`}>{r}</span>
              </li>
            ))}
          </ol>
        </div>

        {/* Palette Legend */}
        <div className={`border rounded-2xl p-4 sm:p-5 shadow-xs shrink-0 ${card}`}>
          <p className={`font-black uppercase tracking-wider mb-3 text-xs sm:text-sm ${(dk?'text-slate-400':'text-slate-500')}`}>
            <i className="fa-solid fa-palette mr-1.5"></i> QUESTION PALETTE COLORS
          </p>
          <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
            {legend.map(([s,lbl]) => {
              const pc = palColor(s,dk);
              return (
                <div key={s} className="flex items-center gap-2">
                  <div style={{
                    width: '22px',
                    height: '22px',
                    background: pc.bg, color: pc.fg, border: '1.5px solid '+pc.br,
                    borderRadius: '6px', display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontSize: '11px', fontWeight: '900', flexShrink: 0
                  }}>
                    {s===QS.MA?'✓':'1'}
                  </div>
                  <span className={`font-semibold text-xs sm:text-sm leading-tight ${(dk?'text-slate-300':'text-slate-600')}`}>{lbl}</span>
                </div>
              );
            })}
          </div>
        </div>

      </div>

      {/* Sticky Bottom Footer */}
      <div className={`shrink-0 w-full mt-auto border-t ${dk ? 'border-slate-800 bg-slate-950/90' : 'border-slate-100 bg-white/90'} backdrop-blur-md`}>
        <div className="max-w-3xl mx-auto flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 p-3.5 sm:p-4">
          <label className="flex items-center gap-2 cursor-pointer select-none group">
            <input type="checkbox" checked={ok} onChange={e=>setOk(e.target.checked)} className="w-4 h-4 accent-violet-600 cursor-pointer rounded border-gray-300"/>
            <span className={`font-semibold transition-colors text-xs sm:text-sm ${ok ? (dk ? 'text-violet-400' : 'text-violet-700') : (dk ? 'text-slate-400' : 'text-slate-600')} group-hover:text-violet-600`}>

            </span>
          </label>
          <div className="flex gap-2.5 h-11 w-full sm:w-auto">
            <button onClick={onBack}
              className={`px-5 font-bold rounded-xl border-2 transition-all active:scale-95 text-xs sm:text-sm ${dk?'border-slate-700 text-slate-300 hover:bg-slate-800':'border-slate-200 text-slate-600 hover:bg-slate-50'}`}>
              ← Back
            </button>
            <button onClick={onBegin} disabled={!ok}
              className={`flex-1 sm:flex-none sm:px-6 font-black rounded-xl transition-all text-xs sm:text-sm ${ok ? 'bg-violet-600 hover:bg-violet-700 text-white shadow-md shadow-violet-600/20 active:scale-95' : 'bg-slate-200 text-slate-400 cursor-not-allowed dark:bg-slate-800 dark:text-slate-500 opacity-60'}`}>
              I am ready to begin →
            </button>
          </div>
        </div>
      </div>
    </div>
  );
};

if (typeof window !== 'undefined') {
  window.Instructions = Instructions;
}


// ===== components/mock/LiveTest.js =====
// components/mock/LiveTest.js — CBT Exam Interface & Real-Time Palette Engine

// ════════════════════════════════════════════════════════
//  SCREEN 3: Live Test
// ════════════════════════════════════════════════════════
const LiveTest = ({test, dk, wm, onFinish, onExit, addMistake}) => {
  const inProgressKey = `ca_mock_inprogress_${(window.caConfig && window.caConfig.month) || 'default'}_${(window.caConfig && window.caConfig.year) || ''}`;
  
  const getExistingSession = () => {
    try {
      const all = JSON.parse(localStorage.getItem(inProgressKey)) || {};
      return all[test.id] || null;
    } catch(e) { return null; }
  };
  const existing = getExistingSession();

  const [answers, setAnswers] = useState(() => (existing && existing.answers ? existing.answers : {}));
  const [states, setStates] = useState(() => (existing && existing.states ? existing.states : test.qs.map(()=>QS.NV)));
  const [cq, setCq] = useState(() => (existing && existing.cq !== undefined ? existing.cq : 0));
  const [qTimes, setQTimes] = useState(() => (existing && existing.qTimes ? existing.qTimes : test.qs.map(()=>0)));
  const [secs, setSecs] = useState(() => (existing && existing.secs !== undefined ? existing.secs : test.mins * 60));
  const [done, setDone] = useState(false);
  const [paused, setPaused] = useState(false);
  const [showQuitModal, setShowQuitModal] = useState(false);
  
  const [showPal, setShowPal] = useState(false);
  const [showSub, setShowSub] = useState(false);
  const [showLast, setShowLast] = useState(false);

  // Initial setup for first question state
  useEffect(() => {
    if (!existing) {
      const n=[...states]; if(n[0]===QS.NV) n[0]=QS.NA; setStates(n);
    }
  }, []);

  // Auto-save in-progress state to localStorage
  useEffect(() => {
    if (done) return;
    try {
      const all = JSON.parse(localStorage.getItem(inProgressKey)) || {};
      all[test.id] = {
        testId: test.id,
        cq,
        answers,
        states,
        qTimes,
        secs,
        totalQs: test.qs.length,
        lastUpdated: Date.now()
      };
      localStorage.setItem(inProgressKey, JSON.stringify(all));
    } catch(e) {}
  }, [cq, answers, states, qTimes, secs, done, test.id, inProgressKey]);

  // Timer
  useEffect(() => {
    if (paused || done || secs <= 0) return;
    const id = setInterval(() => {
      setSecs(s => {
        if (s <= 1) { setDone(true); return 0; }
        return s - 1;
      });
      setQTimes(prev => {
        const n = [...prev];
        n[cq] += 1;
        return n;
      });
    }, 1000);
    return () => clearInterval(id);
  }, [paused, done, secs, cq]);

  // Submit trigger
  useEffect(() => {
    if (done) doSubmit();
  }, [done]);

  const doSubmit = () => {
    // Clear in-progress session on submission
    try {
      const all = JSON.parse(localStorage.getItem(inProgressKey)) || {};
      delete all[test.id];
      localStorage.setItem(inProgressKey, JSON.stringify(all));
    } catch(e) {}

    let score=0, acc=0, cor=0, wrg=0;
    test.qs.forEach((q, i) => {
      const userAns = getStudentAnswer(answers, q, i);
      if (userAns !== null && userAns !== undefined) {
        if (userAns === q.answer) { score += test.mark; cor++; }
        else { score -= test.neg; wrg++; addMistake(q); }
      }
    });
    if (cor+wrg > 0) acc = Math.round((cor / (cor+wrg)) * 100);

    // Bulletproof Time Capture Fix: Calculate elapsed seconds with qTimes fallback
    const totalSecs = (Number(test.mins) || 15) * 60;
    const timeSpent = Math.max(0, totalSecs - secs);
    const sumQTimes = (qTimes || []).reduce((acc, t) => acc + (Number(t) || 0), 0);
    const finalTaken = timeSpent > 0 ? timeSpent : (sumQTimes > 0 ? sumQTimes : 1);

    const result = {
      test,
      timestamp: Date.now(),
      score: Number(score.toFixed(2)),
      max: test.qs.length * test.mark,
      correct: cor,
      cor: cor,
      wrong: wrg,
      wrg: wrg,
      skip: test.qs.length - (cor+wrg),
      skp: test.qs.length - (cor+wrg),
      acc,
      taken: finalTaken,
      answers,
      states,
      qTimes,
      att: cor+wrg
    };
    onFinish(result);
  };

  // Expose global hooks for top navigation and tab switches
  useEffect(() => {
    window.submitCurrentLiveMockTest = () => doSubmit();
    window.saveAndPauseCurrentLiveMockTest = () => { if (onExit) onExit(); };
    return () => {
      delete window.submitCurrentLiveMockTest;
      delete window.saveAndPauseCurrentLiveMockTest;
    };
  });

  const q = test.qs[cq];
  const aCnt = states.filter(s=>s===QS.ANS||s===QS.MA).length;
  const mCnt = states.filter(s=>s===QS.MRK||s===QS.MA).length;
  const naCnt = states.filter(s=>s===QS.NA).length;
  const nvCnt = states.filter(s=>s===QS.NV).length;
  const crit = secs < 120;

  const hdr = dk ? 'bg-slate-900 border-slate-800' : wm ? 'bg-[#faf7ef] border-[#e0d5b0]' : 'bg-white border-slate-200';
  const card = dk ? 'bg-slate-800 border-slate-700' : wm ? 'bg-[#faf7ef] border-[#e0d5b0]' : 'bg-white border-slate-200';
  const sbg = dk ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200';
  const mbg = dk ? 'bg-slate-900' : wm ? 'bg-[#f5f0e0]' : 'bg-slate-100';
  const tm = dk ? 'text-slate-100' : 'text-slate-800';
  const ts = dk ? 'text-slate-400' : 'text-slate-500';

  const userCurAns = getStudentAnswer(answers, q, cq);

  const optClass = (opt) => {
    const sel = userCurAns === opt;
    if (sel) return 'w-full text-left px-4 py-3 rounded-xl border-2 text-sm flex items-center gap-3 transition-all active:scale-95 ' + (dk ? 'border-violet-500 bg-violet-950/40 text-violet-300' : 'border-violet-500 bg-violet-50/50 text-violet-700');
    if (dk) return 'w-full text-left px-4 py-3 rounded-xl border-2 text-sm flex items-center gap-3 transition-all active:scale-95 border-slate-700 bg-slate-800 text-slate-205 hover:border-violet-500';
    return 'w-full text-left px-4 py-3 rounded-xl border-2 text-sm flex items-center gap-3 transition-all active:scale-95 border-slate-200 bg-white text-slate-700 hover:border-violet-300';
  };

  const circClass = (opt) => {
    const sel = userCurAns === opt;
    if (sel) return 'w-6 h-6 rounded-full border-2 flex items-center justify-center text-[10px] font-black flex-shrink-0 border-violet-500 bg-violet-600 text-white';
    if (dk) return 'w-6 h-6 rounded-full border-2 flex items-center justify-center text-[10px] font-black flex-shrink-0 border-slate-600 text-slate-400';
    return 'w-6 h-6 rounded-full border-2 flex items-center justify-center text-[10px] font-black flex-shrink-0 border-slate-300 text-slate-400';
  };

  const selectOpt = opt => setAnswers(prev => { 
    const n = { ...prev }; 
    n[cq] = opt; 
    if (q && q.id !== undefined) {
      n[`qid_${q.id}`] = opt;
    }
    return n; 
  });
  const clearResp = () => {
    setAnswers(prev => { 
      const n = { ...prev }; 
      delete n[cq]; 
      if (q && q.id !== undefined) {
        delete n[`qid_${q.id}`];
      }
      return n; 
    });
    setStates(prev => {
      const n=[...prev];
      if (n[cq]===QS.MA) n[cq]=QS.MRK;
      else if (n[cq]===QS.ANS) n[cq]=QS.NA;
      return n;
    });
  };

  const goNext = () => {
    if (cq < test.qs.length - 1) {
      setCq(cq+1);
      setStates(prev => {
        const n=[...prev];
        if (n[cq+1]===QS.NV) n[cq+1]=QS.NA;
        return n;
      });
    } else {
      setShowLast(true);
    }
  };

  const saveNext = () => {
    setStates(prev => {
      const n=[...prev];
      if (answers[cq]) n[cq] = QS.ANS;
      else if (n[cq] !== QS.MRK) n[cq] = QS.NA;
      return n;
    });
    goNext();
  };

  const markNext = () => {
    setStates(prev => {
      const n=[...prev];
      if (answers[cq]) n[cq] = QS.MA;
      else n[cq] = QS.MRK;
      return n;
    });
    goNext();
  };

  const jumpTo = i => {
    setStates(prev => {
      const n=[...prev];
      if (answers[cq]) {
        if (n[cq]!==QS.MRK && n[cq]!==QS.MA) n[cq]=QS.ANS;
      } else {
        if (n[cq]!==QS.MRK && n[cq]!==QS.MA) n[cq]=QS.NA;
      }
      if (n[i]===QS.NV) n[i]=QS.NA;
      return n;
    });
    setCq(i);
    setShowPal(false);
  };

  return (
    <div className="w-full h-full flex flex-col max-w-5xl mx-auto md:p-2 sm:p-4">
      <style>{`
        .bottom-nav-safe { display: none !important; }
        #root > div { padding-bottom: 0 !important; }
      `}</style>
      
      {/* Header */}
      <div className={'flex-shrink-0 border-b w-full ' + hdr}>
        <div className="max-w-7xl mx-auto w-full hidden sm:flex items-center px-4 py-2.5 gap-4">
          <div className="flex items-center gap-2 flex-shrink-0">
            <span className={'text-[11px] font-semibold uppercase tracking-wider '+ts}>Section</span>
            <span className="bg-teal-600 text-white text-[11px] font-bold px-3 py-0.5 rounded">Test</span>
          </div>
          <p className={'flex-1 text-center text-sm font-bold truncate '+tm}>{test.name}</p>
          <div className="flex items-center gap-2 flex-shrink-0">
            <span className={'text-sm font-black tabular-nums mr-2 '+(crit?'text-red-500 exam-timer-pulse':tm)}>Time Left: {fmt(secs)}</span>
            <button onClick={()=>setPaused(p=>!p)}
              className={'px-3 py-1 text-[11px] font-bold rounded-lg border transition-all active:scale-95 '+(dk?'border-slate-700 text-slate-300 bg-slate-800':'border-slate-200 text-slate-600 bg-white')}>
              {paused?'▶ Resume':'⏸ Pause'}
            </button>
            <button onClick={()=>setShowQuitModal(true)}
              className="px-3 py-1 text-[11px] font-bold rounded-lg border border-rose-500/50 bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 hover:bg-rose-100 dark:hover:bg-rose-900/60 transition-all active:scale-95"
              title="Quit Test"
            >
              ✕ Quit
            </button>
          </div>
        </div>
        <div className="max-w-7xl mx-auto w-full flex sm:hidden items-center px-3 py-2 gap-2">
          <p className={'flex-1 text-[11px] font-bold truncate '+tm}>{test.name}</p>
          <span className={'text-sm font-black tabular-nums flex-shrink-0 '+(crit?'text-red-500 exam-timer-pulse':tm)}>{fmt(secs)}</span>
          <button onClick={()=>setPaused(p=>!p)}
            className={'w-7 h-7 rounded-full flex items-center justify-center text-xs flex-shrink-0 active:scale-95 '+(dk?'bg-slate-800 text-slate-300':'bg-slate-100 text-slate-605')}>
            {paused?'▶':'⏸'}
          </button>
          <button onClick={()=>setShowQuitModal(true)}
            className="w-7 h-7 rounded-full flex items-center justify-center text-xs flex-shrink-0 bg-rose-100 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 active:scale-95 font-bold"
            title="Quit Test"
          >
            ✕
          </button>
        </div>
      </div>

      {/* Safety Quit / Pause / Submit Test Modal */}
      {showQuitModal && (
        <div className="fixed inset-0 z-[120] bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className={`rounded-3xl max-w-md w-full p-6 text-center shadow-2xl border ${dk ? 'bg-slate-900 border-slate-700 text-slate-100' : 'bg-white border-slate-200 text-slate-800'}`}>
            <div className="text-4xl mb-2">⏸️</div>
            <h3 className="text-base sm:text-lg font-black mb-1">Live Test in Progress (टेस्ट अभी चालू है!)</h3>
            <p className="text-xs text-slate-500 dark:text-slate-400 mb-4 leading-relaxed">
              आपने <strong>{test.qs.length}</strong> में से <strong>{aCnt}</strong> प्रश्न हल कर लिए हैं (Time Left: <span className="font-bold text-violet-600 dark:text-violet-400">{fmt(secs)}</span>)।
              आप क्या करना चाहते हैं?
            </p>
            <div className="flex flex-col gap-2.5">
              <button 
                onClick={() => setShowQuitModal(false)} 
                className="w-full py-3 rounded-xl bg-violet-600 hover:bg-violet-700 text-white text-xs sm:text-sm font-bold transition-all active:scale-95 shadow-md flex items-center justify-center gap-2"
              >
                <i className="fa-solid fa-play text-xs"></i>
                <span>Resume Test (टेस्ट जारी रखें)</span>
              </button>
              <div className="grid grid-cols-2 gap-2.5">
                <button 
                  onClick={() => { setShowQuitModal(false); if (onExit) onExit(); }} 
                  className={`py-2.5 px-3 rounded-xl border text-xs font-bold transition-all active:scale-95 shadow-xs flex items-center justify-center gap-1.5 ${
                    dk ? 'bg-amber-950/40 text-amber-300 border-amber-800/60 hover:bg-amber-900/50' : 'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100'
                  }`}
                  title="Save progress and resume later"
                >
                  <i className="fa-regular fa-floppy-disk text-xs"></i>
                  <span>Save & Pause</span>
                </button>
                <button 
                  onClick={() => { setShowQuitModal(false); doSubmit(); }} 
                  className="py-2.5 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold transition-all active:scale-95 shadow-xs flex items-center justify-center gap-1.5"
                  title="Submit whatever is done and calculate score"
                >
                  <i className="fa-solid fa-check-double text-xs"></i>
                  <span>Submit Now</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Pause overlay (Testbook Style) */}
      {paused && (
        <div className="fixed inset-0 z-[100] bg-black/70 backdrop-blur-sm flex items-center justify-center sm:p-6 p-4">
          {/* Desktop Version */}
          <div className={'hidden sm:block rounded-xl overflow-hidden shadow-2xl max-w-4xl w-full border '+(dk?'bg-slate-900 border-slate-700':'bg-white border-slate-200')}>
            <table className="w-full text-center">
              <thead>
                <tr className="bg-[#12b1b2] text-white">
                  <th className="py-3 px-2 text-sm font-bold border-r border-[#0e9697]">Section</th>
                  <th className="py-3 px-2 text-sm font-bold border-r border-[#0e9697]">No. of questions</th>
                  <th className="py-3 px-2 text-sm font-bold border-r border-[#0e9697]">Answered</th>
                  <th className="py-3 px-2 text-sm font-bold border-r border-[#0e9697]">Not Answered</th>
                  <th className="py-3 px-2 text-sm font-bold border-r border-[#0e9697]">Marked for Review</th>
                  <th className="py-3 px-2 text-sm font-bold">Not Visited</th>
                </tr>
              </thead>
              <tbody className={dk?'text-slate-200':'text-slate-800'}>
                <tr>
                  <td className={'py-4 font-semibold border-r '+(dk?'border-slate-700':'border-slate-200')}>Test</td>
                  <td className={'py-4 border-r '+(dk?'border-slate-700':'border-slate-200')}>{test.qs.length}</td>
                  <td className={'py-4 border-r '+(dk?'border-slate-700':'border-slate-200')}>{aCnt}</td>
                  <td className={'py-4 border-r '+(dk?'border-slate-700':'border-slate-200')}>{naCnt}</td>
                  <td className={'py-4 border-r '+(dk?'border-slate-700':'border-slate-200')}>{mCnt}</td>
                  <td className="py-4">{nvCnt}</td>
                </tr>
              </tbody>
            </table>
            <div className={'px-4 py-3 flex justify-between items-center border-t '+(dk?'border-slate-700 bg-slate-800/50':'border-slate-200 bg-slate-50')}>
              <button onClick={()=>{ setPaused(false); setShowQuitModal(true); }} className="px-5 py-2 rounded bg-rose-600 text-white text-sm font-bold hover:bg-rose-700 transition-all">Quit Test</button>
              <button onClick={()=>setPaused(false)} className="px-5 py-2 rounded bg-[#12b1b2] text-white text-sm font-bold hover:bg-[#0e9697] transition-all">Resume Test</button>
            </div>
          </div>

          {/* Mobile Version */}
          <div className={'sm:hidden rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl '+(dk?'bg-[#2a2c33] text-slate-200':'bg-[#2a2c33] text-slate-200')}>
            <div className="px-5 py-4 space-y-4">
              <div className="flex justify-between items-center text-lg pb-4 border-b border-slate-700/50">
                <div className="flex items-center gap-3"><i className="fa-regular fa-clock text-slate-400"></i> <span className="font-semibold text-slate-300">Time Left</span></div>
                <span className="font-bold text-blue-400">{fmt(secs)}</span>
              </div>
              <div className="flex justify-between items-center text-lg pb-4 border-b border-slate-700/50">
                <div className="flex items-center gap-3"><i className="fa-solid fa-check text-slate-400"></i> <span className="font-semibold text-slate-300">Attempted</span></div>
                <span className="font-bold text-white">{aCnt}</span>
              </div>
              <div className="flex justify-between items-center text-lg pb-4 border-b border-slate-700/50">
                <div className="flex items-center gap-3"><i className="fa-solid fa-circle-minus text-slate-400"></i> <span className="font-semibold text-slate-300">Unattempted</span></div>
                <span className="font-bold text-white">{test.qs.length - aCnt}</span>

// ── Official National Testing Agency (NTA) & Testbook Percentile Engine ──
// Formula: (Count of aspirants with raw score <= candidate's score / Total aspirants) * 100
// Equivalent with Rank R and Total N: ((N - R + 1) / N) * 100
// ════════════════════════════════════════════════════════
const computeOfficialPercentile = (myScore, userRank, totalCount, candidateList) => {
  const totalN = Math.max(1, Number(totalCount) || (candidateList ? candidateList.length : 1));
  if (totalN <= 1) return '100.0';

  // Method 1: If candidateList is available, count exact candidates with score <= myScore (handles ties natively)
  if (Array.isArray(candidateList) && candidateList.length > 0) {
    const numScore = Number(myScore !== undefined ? myScore : 0);
    const countLessOrEqual = candidateList.filter(c => Number(c.score !== undefined ? c.score : 0) <= numScore).length;
    // Ensure effective count is at least 1 (the candidate themselves) and does not exceed totalN
    const effectiveCount = Math.max(1, Math.min(totalN, countLessOrEqual));
    const pctile = (effectiveCount / totalN) * 100;
    return Math.max(0.1, Math.min(100.0, pctile)).toFixed(1);
  }

  // Method 2: Authentic Rank-based NTA formula: ((N - R + 1) / N) * 100
  const r = Math.max(1, Math.min(totalN, Number(userRank) || 1));
  const pctile = ((totalN - r + 1) / totalN) * 100;
  return Math.max(0.1, Math.min(100.0, pctile)).toFixed(1);
};


// ── Podium Name Formatter (First Name + Surname Initial e.g. "Amit Y.") ──
const formatPodiumName = (fullName) => {
  if (!fullName || typeof fullName !== 'string') return 'Aspirant';
  const trimmed = fullName.trim();
  const parts = trimmed.split(/\s+/);
  if (parts.length === 1) {
    return parts[0];
  }
  const firstName = parts[0];
  const lastName = parts[parts.length - 1];
  const lastInitial = lastName.charAt(0).toUpperCase();
  return `${firstName} ${lastInitial}.`;
};

// ── Disambiguated Candidate Name Helper (Testbook Standard: 100% Clean Names Without Cryptic Hashes) ──
const getCandidateDisplayName = (cand, allCandidates = [], isPodium = false) => {
  if (!cand) return 'Aspirant';
  const rawName = cand.name || cand.user_name || 'Aspirant';
  return isPodium ? formatPodiumName(rawName) : rawName;
};

const TestResult = ({res, onRetry, onBack, onViewSolution, leaderboardMap, onSyncLeaderboard, dk, wm}) => {

  const [activeIdx, setActiveIdx] = useState(() => Math.max(0, attemptsList.length - 1));
  const [showAttemptsDrop, setShowAttemptsDrop] = useState(false);
  const [showLeaderboardModal, setShowLeaderboardModal] = useState(false);

  const [realLeaderboard, setRealLeaderboard] = useState(() => {
    const tid = (activeAttempt.test && activeAttempt.test.id) || activeAttempt.testId;

      return leaderboardMap[tid] || 
             leaderboardMap[tid.replace('_', '-')] || 
             leaderboardMap[tid.replace('-', '_')] || 
             (Object.keys(leaderboardMap).find(k => k.endsWith(tid) || tid.endsWith(k)) ? leaderboardMap[Object.keys(leaderboardMap).find(k => k.endsWith(tid) || tid.endsWith(k))] : null) || 
             null;

  const [userId, setUserId] = useState(() => {
    return (window.caConfig && (window.caConfig.userId || window.caConfig.id)) || window.caUserId || (typeof localStorage !== 'undefined' ? (localStorage.getItem('ca_user_id') || localStorage.getItem('ca_client_uid')) : null);
  });
  const [userName, setUserName] = useState(() => {
    return (window.caConfig && window.caConfig.userName) || window.caUserName || (typeof localStorage !== 'undefined' ? localStorage.getItem('ca_user_name') : null) || 'You';
  });
  const [userEmail, setUserEmail] = useState(() => {
    return (window.caConfig && (window.caConfig.userEmail || window.caConfig.email)) || window.caUserEmail || (typeof localStorage !== 'undefined' ? localStorage.getItem('ca_user_email') : null);
  });
  const [userAvatar, setUserAvatar] = useState(() => {
    return (window.caConfig && window.caConfig.userAvatar) || window.caUserAvatar || (typeof localStorage !== 'undefined' ? localStorage.getItem('ca_user_avatar') : null) || null;
  });
  const dropRef = useRef(null);

  const corCount = activeAttempt.correct !== undefined ? activeAttempt.correct : (activeAttempt.cor !== undefined ? activeAttempt.cor : 0);
  const wrgCount = activeAttempt.wrong !== undefined ? activeAttempt.wrong : (activeAttempt.wrg !== undefined ? activeAttempt.wrg : 0);
  const skpCount = activeAttempt.skip !== undefined ? activeAttempt.skip : (activeAttempt.skp !== undefined ? activeAttempt.skp : 0);
  const attCount = activeAttempt.att !== undefined ? activeAttempt.att : (corCount + wrgCount);
  const totalQs = (activeAttempt.test && activeAttempt.test.qs && activeAttempt.test.qs.length) || (corCount + wrgCount + skpCount) || 1;
  const speedPerQ = ((activeAttempt.taken || 0) / Math.max(1, attCount)).toFixed(1);
  const attemptDateStr = (() => {
    if (!activeAttempt.timestamp) return 'Today';
    const d = new Date(activeAttempt.timestamp);
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) + 
      ' at ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  })();

  const card = dk ? 'bg-slate-800 border-slate-700' : wm ? 'bg-[#faf7ef] border-[#e0d5b0]' : 'bg-white border-slate-200';
  const tm = dk ? 'text-slate-100' : 'text-slate-800';
  const ts = dk ? 'text-slate-400' : 'text-slate-500';

  const pct = activeAttempt.max > 0 ? Math.round(activeAttempt.score / activeAttempt.max * 100) : 0;
  const rcls = pct >= 70 ? 'text-green-500' : pct >= 40 ? 'text-amber-500' : 'text-rose-500';

  // Listen for Supabase Real Data via postMessage from parent GyanLayer app
  useEffect(() => {
    // 📢 Ping Parent App on Mount to Request User Profile & Leaderboard
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'REQUEST_USER_PROFILE' }, '*');
        
        const testMonth = (window.caConfig && window.caConfig.month) || 'January';
        const testYear = (window.caConfig && window.caConfig.year) || '2026';
        const rawTid = (activeAttempt.test && activeAttempt.test.id) || activeAttempt.testId || 'mt_0';
        const resolvedTestId = (rawTid.includes('_mt_') || rawTid.includes('_tp_'))
          ? rawTid
          : `${testMonth.toLowerCase().replace(/\s+/g, '_')}_${testYear}_${rawTid}`;

        window.parent.postMessage({
          type: 'REQUEST_LEADERBOARD',
          payload: {
            test_id: resolvedTestId,
            raw_test_id: rawTid,
            month: testMonth,
            year: testYear
          }
        }, '*');
      }
    } catch(e) {}

    const handleMsg = (e) => {
      try {
        if (!e.data) return;
        if (e.data.type === 'SET_REAL_LEADERBOARD') {
          const lbData = e.data.payload || e.data.data || e.data.leaderboard || e.data;
          if (lbData) {
            const curTid = (activeAttempt && activeAttempt.test && activeAttempt.test.id) || (activeAttempt && activeAttempt.testId);
            const lbTid = lbData.test_id || lbData.raw_test_id;
            if (curTid && lbTid) {
              const match = lbTid === curTid || 
                            lbTid.endsWith(curTid) || 
                            curTid.endsWith(lbTid) || 
                            lbTid.replace(/^[a-z]+_\d{4}_/i, '') === curTid.replace(/^[a-z]+_\d{4}_/i, '');
              if (!match) return;
            }
            setRealLeaderboard(lbData);
            if (onSyncLeaderboard && activeAttempt && activeAttempt.test) {
              onSyncLeaderboard(lbData, activeAttempt.test.id);
            }
          }
        }
        if (e.data.type === 'SET_USER_NAME' || e.data.type === 'SET_USER_INFO' || e.data.type === 'SET_USER') {
          const uPayload = e.data.payload || e.data.data || e.data;
          if (uPayload) {
            if (typeof uPayload === 'object') {
              if (uPayload.name) setUserName(uPayload.name);
              if (uPayload.userId || uPayload.id || uPayload.user_id) setUserId(uPayload.userId || uPayload.id || uPayload.user_id);
              if (uPayload.email || uPayload.user_email) setUserEmail(uPayload.email || uPayload.user_email);
              const foundAv = uPayload.avatar || uPayload.avatar_url || uPayload.photo || uPayload.picture || uPayload.image;
              if (foundAv) {
                setUserAvatar(foundAv);
                window.caUserAvatar = foundAv;
                try { localStorage.setItem('ca_user_avatar', foundAv); } catch(e) {}
              }
            } else if (typeof uPayload === 'string') {
              setUserName(uPayload);
            }
          }
        }
      } catch (err) {
        console.error('[MockTest] Leaderboard message error:', err);
      }
    };
    const handleCustom = (e) => {
      if (e.detail) {
        const lb = e.detail.payload || e.detail.data || e.detail;
        const curTid = (activeAttempt && activeAttempt.test && activeAttempt.test.id) || (activeAttempt && activeAttempt.testId);
        const lbTid = lb.test_id || lb.raw_test_id;
        if (curTid && lbTid) {
          const match = lbTid === curTid || 
                        lbTid.endsWith(curTid) || 
                        curTid.endsWith(lbTid) || 
                        lbTid.replace(/^[a-z]+_\d{4}_/i, '') === curTid.replace(/^[a-z]+_\d{4}_/i, '');
          if (!match) return;
        }
        setRealLeaderboard(lb);
        if (onSyncLeaderboard && activeAttempt && activeAttempt.test) {
          onSyncLeaderboard(lb, activeAttempt.test.id);
        }
      }
    };
    const handleNameCustom = (e) => {
      if (e.detail) {
        const uPayload = e.detail.payload || e.detail.data || e.detail;
        if (typeof uPayload === 'object') {
          if (uPayload.name) setUserName(uPayload.name);
          if (uPayload.userId || uPayload.id || uPayload.user_id) setUserId(uPayload.userId || uPayload.id || uPayload.user_id);
          if (uPayload.email || uPayload.user_email) setUserEmail(uPayload.email || uPayload.user_email);
          const foundAv = uPayload.avatar || uPayload.avatar_url || uPayload.photo || uPayload.picture || uPayload.image;
          if (foundAv) {
            setUserAvatar(foundAv);
            window.caUserAvatar = foundAv;
            try { localStorage.setItem('ca_user_avatar', foundAv); } catch(e) {}
          }
        } else if (typeof uPayload === 'string') {
          setUserName(uPayload);
        }
      }
    };
    window.addEventListener('message', handleMsg);
    window.addEventListener('ca_real_leaderboard', handleCustom);
    window.addEventListener('ca_set_user_name', handleNameCustom);
    return () => {
      window.removeEventListener('message', handleMsg);
      window.removeEventListener('ca_real_leaderboard', handleCustom);
      window.removeEventListener('ca_set_user_name', handleNameCustom);
    };
  }, [activeAttempt]);

  // 🎯 Testbook Dynamic Ranking & 4-Tier Tie-Breaker Engine:
  // Dynamically computes authentic rank and topper comparing current attempt against real aspirants
  const { currentRank, currentTotal, unifiedTopRankers, calculatedTopper, isUserTopper } = useMemo(() => {
    const myScore = Number(activeAttempt.score !== undefined ? activeAttempt.score : 0);
    const myTime = Number(activeAttempt.taken || 0);
    const myAcc = Number(activeAttempt.acc || 0);
    const myWrg = Number(wrgCount || 0);
    const myTs = Number(activeAttempt.timestamp || Date.now());

    let allCandidates = [];

    if (realLeaderboard && Array.isArray(realLeaderboard.topRankers) && realLeaderboard.topRankers.length > 0) {
      allCandidates = realLeaderboard.topRankers.map(r => ({
        userId: r.userId || r.user_id || (r.id ? 'sub_' + r.id : null),
        id: r.id || null,
        name: r.name || r.user_name || 'Aspirant',
        email: r.email || r.user_email || null,
        score: Number(r.score !== undefined ? r.score : 0),
        accuracy: Number(r.accuracy !== undefined ? r.accuracy : (r.acc || 0)),
        time: Number(r.time !== undefined ? r.time : (r.time_taken || 0)),
        wrong: Number(r.wrong !== undefined ? r.wrong : (r.wrg || 0)),
        timestamp: Number(r.timestamp || (r.created_at ? new Date(r.created_at).getTime() : 0) || 0),
        avatar: r.avatar || '👨‍🎓',
        isCurrentUser: false
      }));
    }

    // Ensure current user is in candidate list with unique tracking
    const myUserId = userId || (window.caConfig && (window.caConfig.userId || window.caConfig.id)) || window.caUserId || null;
    const myEmail = (window.caConfig && (window.caConfig.userEmail || window.caConfig.email)) || window.caUserEmail || null;

    // 🎯 AUTHORITATIVE MATCH FOR THIS SPECIFIC STUDENT ACCOUNT:
    // We only replace if there is an authoritative identity match:
    // 1. Exact userId match (if myUserId is valid)
    // 2. OR exact email match (if myEmail is valid)
    // 3. OR exact submission timestamp match
    // ⚠️ CRITICAL: NEVER match by name alone! Multiple students across India can share the exact same name.
    const existingUserIdx = allCandidates.findIndex(c => {
      if (myUserId && c.userId && String(c.userId) === String(myUserId)) return true;
      if (myEmail && c.email && String(c.email).toLowerCase().trim() === String(myEmail).toLowerCase().trim()) return true;
      if (myTs && c.timestamp && Number(c.timestamp) === Number(myTs)) return true;
      return false;
    });

    // 🎯 PRESERVE AUTHENTIC PROFILE AVATAR:
    // If this candidate entry already came from Supabase realLeaderboard, preserve its authentic avatar URL!
    const existingAvatar = (existingUserIdx >= 0 && allCandidates[existingUserIdx].avatar && allCandidates[existingUserIdx].avatar !== '👨‍🎓')
      ? allCandidates[existingUserIdx].avatar
      : null;

    const resolvedAvatar = existingAvatar || userAvatar || window.caUserAvatar || (typeof localStorage !== 'undefined' ? localStorage.getItem('ca_user_avatar') : null) || '👨‍🎓';

    // If we discovered a real avatar from Supabase for current user, cache it in state & localStorage
    if (existingAvatar && !userAvatar) {
      setUserAvatar(existingAvatar);
      window.caUserAvatar = existingAvatar;
      try { localStorage.setItem('ca_user_avatar', existingAvatar); } catch(e) {}
    }

    const myEntry = {
      userId: myUserId || `local_${myTs}`,
      email: myEmail,
      name: userName || 'You',
      score: myScore,
      accuracy: myAcc,
      time: myTime,
      wrong: myWrg,
      timestamp: myTs,
      avatar: resolvedAvatar,
      isCurrentUser: true
    };

    if (existingUserIdx >= 0) {
      allCandidates[existingUserIdx] = myEntry;
    } else {
      allCandidates.push(myEntry);
    }

    // 🎯 4-Tier Tie-Breaker Sorting:
    allCandidates.sort((a, b) => {
      // Rule 1: Highest Net Score
      if (b.score !== a.score) return b.score - a.score;
      // Rule 2: Fewer Wrong Answers / Higher Accuracy
      if (a.wrong !== b.wrong) return a.wrong - b.wrong;
      if (b.accuracy !== a.accuracy) return b.accuracy - a.accuracy;
      // Rule 3: Faster Time Taken (Less seconds)
      if (a.time !== b.time) return a.time - b.time;
      // Rule 4: Earlier Submission Timestamp
      return a.timestamp - b.timestamp;
    });

    // 🎯 Standard Competition / Joint Ranking Assignment:
    let assignedRank = 1;
    allCandidates.forEach((cand, idx) => {
      if (idx > 0) {
        const prev = allCandidates[idx - 1];
        const isIdentical = 
          cand.score === prev.score &&
          cand.wrong === prev.wrong &&
          cand.accuracy === prev.accuracy &&
          cand.time === prev.time &&
          cand.timestamp === prev.timestamp;
        
        if (!isIdentical) {
          assignedRank = idx + 1; // Strict standard competition rank
        }
      }
      cand.rank = assignedRank;
    });

    const me = allCandidates.find(c => c.isCurrentUser) || myEntry;
    const computedUserRank = me.rank || 1;
    const computedTotal = allCandidates.length;
    const topperItem = allCandidates[0] || myEntry;
    const userIsTopper = computedUserRank === 1;

    return {
      currentRank: computedUserRank,
      currentTotal: Math.max(computedTotal, Number(realLeaderboard && realLeaderboard.totalParticipants) || computedTotal),
      unifiedTopRankers: allCandidates,
      calculatedTopper: topperItem,
      isUserTopper: userIsTopper
    };
  }, [realLeaderboard, activeAttempt, userName, userId, userEmail, userAvatar, wrgCount]);

  // 🎯 Auto-Sync Real Rank & Live Total back to parent TestSelector & localStorage

            const topperScoreDisp = `${topperScoreNum}/${activeAttempt.max}`;

                  const estWrg = Math.min(totalQs - estCor, Math.max(0, Math.round((estCor * markVal - topperScoreNum) / negVal)));
                  const estSkp = Math.max(0, totalQs - estCor - estWrg);
                  return `${estCor} / ${estWrg} / ${estSkp}`;

      incorrectCount++;
