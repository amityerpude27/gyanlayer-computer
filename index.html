26\\]","examTag":"EXAM FOCUS","category":"limitations","question":"GIGO (गार्बेज इन गार्बेज आउट) पद कंप्यूटर के किस अभिलक्षण से सबसे निकटता से संबंधित है?","options":["अध्यवसाय","स्वानुभविक अभाव","भंडारण क्षमता","परिशुद्धता"],"answer":"परिशुद्धता","memoryTrick":"कचरा इनपुट दोगे तो कचरा ही निकलेगा, सही परिणाम के लिए 'परिशुद्धता' 🎯 जरूरी है! 🤩💡","explanation":{"keyPoints":["GIGO का पूर्ण रूप 'Garbage In, Garbage Out' है, जो कंप्यूटर की परिशुद्धता / सटीकता (Accuracy) से संबंधित है।","इसका अर्थ है कि आउटपुट की शुद्धता पूरी तरह इनपुट डेटा की शुद्धता पर निर्भर करती है; अशुद्ध इनपुट देने पर परिणाम भी अशुद्ध ही प्राप्त होगा।"]}},{"id":"14","date":"RRB NTPC Stage-1 • Jan 2021","shiftInfo":"📌 2 Shifts Repeat","rawDate":"\\[RRB NTPC 05.01.2021 (Shift-I) Stage Ist\\] & \\[RRB NTPC 16.04.2016 (Shift-I) Stage Ist\\] • \\[📌 Base Question | Total 2 Shifts Repeat\\]","examTag":"EXAM FOCUS","category":"limitations","question":"इनमें से कौन-सी कंप्यूटर की एक विशेषता नहीं है?","options":["इंटेलिजेंस कोशेंट (IQ)","डेटा स्टोरेज","एक्यूरेसी","स्पीड"],"answer":"इंटेलिजेंस कोशेंट (IQ)","memoryTrick":"कंप्यूटर में गजब की स्पीड ⚡ है लेकिन खुद सोचने वाला कोई 'आईक्यू' (IQ) 🧠 मौजूद नहीं! 😱💥","explanation":{"keyPoints":["कंप्यूटर की मुख्य विशेषताएं: गति (Speed), भंडारण क्षमता (Data Storage), परिशुद्धता (Accuracy), कर्मठता (Diligence) और विविधता (Versatility) हैं।","इंटेलिजेंस कोशेंट (बुद्धिलब्धि/IQ) कंप्यूटर की विशेषता नहीं है क्योंकि कंप्यूटर में स्वयं सोचने या निर्णय लेने की क्षमता शून्य (Zero IQ) होती है।"]}},{"id":"15","date":"RRB NTPC UG • May-Jun 2026","shiftInfo":"","rawDate":"\\[RRB NTPC (UG) CEN 07/2025 | Exam Date: 7th May - 20th June 2026\\]","examTag":"EXAM FOCUS","category":"generations","question":"कंप्यूटर की पीढ़ियों (generations) के विकास के साथ, निम्नलिखित में से कौन-सा रुझान (trend) आम तौर पर सही साबित हुआ है?","options":["कंप्यूटर की मेमोरी क्षमता कम हो गई","कंप्यूटर छोटे और तेज होते गए","कंप्यूटरों में बिजली का उपयोग होना बंद हो गया","कंप्यूटर बड़े और धीमे होते गए"],"answer":"कंप्यूटर छोटे और तेज होते गए","memoryTrick":"पीढ़ियां बीतने के साथ कमरा घेरने वाले भारी कंप्यूटर आज हथेली जितने 'छोटे और तेज' 🚀 बन गए! 🤩💡","explanation":{"keyPoints":["कंप्यूटर की पीढ़ियों के विकास (वैक्यूम ट्यूब से माइक्रोप्रोसेसर तक) के साथ मुख्य इलेक्ट्रॉनिक घटकों का आकार घटता गया, जिससे कंप्यूटर आकार में छोटे और कार्य में अत्यंत तेज होते गए।","इसके साथ ही इनकी मेमोरी क्षमता और विश्वसनीयता में वृद्धि हुई तथा बिजली की खपत व ऊष्मा उत्सर्जन में भारी कमी आई।"]}},{"id":"16","date":"RRB NTPC UG • May-Jun 2026","shiftInfo":"","rawDate":"\\[RRB NTPC (UG) CEN 07/2025 | Exam Date: 7th May - 20th June 2026\\]","examTag":"EXAM FOCUS","category":"generations","question":"कंप्यूटर की पहली और दूसरी पीढ़ी के संबंध में कौन-सा कथन सत्य या असत्य है?  \n(i) पहली पीढ़ी में वैक्यूम ट्यूब (Vacuum Tubes) का उपयोग किया गया था, जो भारी और ऊष्मा उत्पन्न करने वाली थीं।  \n(ii) ट्रांजिस्टर, जिसने दूसरी पीढ़ी को परिभाषित किया, ने कंप्यूटरों को अधिक बड़ा, धीमा और अधिक महंगा बना दिया।","options":["(i) असत्य, (ii) सत्य","(i) सत्य, (ii) सत्य","(i) सत्य, (ii) असत्य","(i) असत्य, (ii) असत्य"],"answer":"(i) सत्य, (ii) असत्य","memoryTrick":"पहली पीढ़ी की 'वैक्यूम ट्यूब' 💡 हीटर जैसी गर्म थी, जबकि ट्रांजिस्टर ने कंप्यूटर को सुपरफास्ट बनाया! 🧠🔥","explanation":{"keyPoints":["कथन (i) सत्य है: प्रथम पीढ़ी (1940-1956) में परिपथ के मुख्य घटक के रूप में वैक्यूम ट्यूब का प्रयोग हुआ, जो बड़े आकार की थीं और अत्यधिक ऊष्मा उत्पन्न करती थीं।","कथन (ii) असत्य है: द्वितीय पीढ़ी (1956-1963) में प्रयुक्त ट्रांजिस्टर ने कंप्यूटरों को पहली पीढ़ी की तुलना में अधिक छोटा, तेज, सस्ता और कम ऊर्जा खपत वाला बनाया था।"]}},{"id":"17","date":"RRB NTPC UG • May-Jun 2026","shiftInfo":"","rawDate":"\\[RRB NTPC (UG) CEN 07/2025 | Exam Date: 7th May - 20th June 2026\\]","examTag":"EXAM FOCUS","category":"generations","question":"FORTRAN और COBOL जैसी उच्च-स्तरीय प्रोग्रामिंग भाषाओं के विकास ने कंप्यूटर के उपयोग में किस महत्वपूर्ण तरीके से परिवर्तन किया?","options":["इसने सभी प्रोग्रामरों को केवल बाइनरी संख्याओं का उपयोग करने के लिए बाध्य कर दिया।","इससे प्रोग्रामों को अधिक मानव-पठनीय रूपों में लिखना संभव हो गया, जिससे जटिल सॉफ्टवेयर विकसित करना आसान हो गया।","इसने संकलकों की आवश्यकता को समाप्त कर दिया।","इसने कंप्यूटरों को केवल वैज्ञानिक गणनाओं के लिए ही कार्य करने तक सीमित कर दिया।"],"answer":"इससे प्रोग्रामों को अधिक मानव-पठनीय रूपों में लिखना संभव हो गया, जिससे जटिल सॉफ्टवेयर विकसित करना आसान हो गया।","memoryTrick":"फोरट्रान और कोबोल 💻 आने से बाइनरी का झंझट खत्म, प्रोग्रामिंग 'मानव-पठनीय' 📖 होकर आसान बनी! 🤩💡","explanation":{"keyPoints":["FORTRAN (Formula Translation) और COBOL (Common Business Oriented Language) द्वितीय पीढ़ी के दौरान विकसित उच्च-स्तरीय भाषाएं (High-Level Languages) हैं।","इन भाषाओं ने मशीन भाषा (बाइनरी 0 और 1\\) की जटिलता को समाप्त कर अंग्रेजी जैसे आसान शब्दों (Human-Readable Form) में कोडिंग को संभव बनाया, जिससे सॉफ्टवेयर विकास सरल हो गया।"]}},{"id":"18","date":"RRB NTPC GL • Mar 2026","shiftInfo":"📌 2 Shifts Repeat","rawDate":"\\[RRB NTPC (Graduate) CEN 06/2025 | Exam Date: 16 to 27 March 2026\\] • \\[📌 Base Question | Total 2 Shifts Repeat\\]","examTag":"EXAM FOCUS","category":"generations","question":"कौन-सी प्रमुख प्रौद्योगिकीय उन्नति चौथी पीढ़ी के कंप्यूटरों में अभिलक्षित होती है?","options":["माइक्रोप्रोसेसर (Microprocessors)","ट्रांजिस्टर (Transistors)","वैक्यूम ट्यूब (Vacuum tubes)","इंटीग्रेटेड सर्किट (Integrated circuits)"],"answer":"माइक्रोप्रोसेसर (Microprocessors)","memoryTrick":"चौथी पीढ़ी 💻 के आते ही कंप्यूटर के पूरे दिमाग को एक छोटे 'माइक्रोप्रोसेसर' 🧠 में समेट दिया! 🧠🔥","explanation":{"keyPoints":["चौथी पीढ़ी के कंप्यूटरों की प्रमुख पहचान VLSI (Very Large Scale Integration) तकनीक पर आधारित 'माइक्रोप्रोसेसर' है।","पीढ़ियों के मुख्य इलेक्ट्रॉनिक घटक: प्रथम पीढ़ी \\- वैक्यूम ट्यूब; द्वितीय पीढ़ी \\- ट्रांजिस्टर; तृतीय पीढ़ी \\- इंटीग्रेटेड सर्किट (IC); चौथी पीढ़ी \\- माइक्रोप्रोसेसर (VLSI); पांचवीं पीढ़ी \\- ULSI एवं AI।"]}},{"id":"19","date":"RRB NTPC GL • Mar 2026","shiftInfo":"🔁 Variant 2","rawDate":"\\[RRB NTPC (Graduate) CEN 06/2025 | Exam Date: 16 to 27 March 2026\\] • \\[🔁 Variant 2 of Q18\\]","examTag":"EXAM FOCUS","category":"generations","question":"कंप्यूटर की चौथी पीढ़ी में इंटीग्रेटेड सर्किट और कॉम्पैक्ट कंप्यूटिंग का उपयोग हुआ है। इस पीढ़ी की शुरुआत किस प्रमुख घटक के आविष्कार से हुई?","options":["टैब्युलेटिंग मशीन डिवाइस (Tabulating Machine Device)","ट्रांजिस्टर डिवाइस यूनिट (Transistor Device Unit)","माइक्रोप्रोसेसर चिप (Microprocessor Chip)","ईएनआईएसी कंप्यूटर सिस्टम (ENIAC Computer System)"],"answer":"माइक्रोप्रोसेसर चिप (Microprocessor Chip)","memoryTrick":"चौथी पीढ़ी ⚡ में कंप्यूटर टेबल पर तभी आया जब 'माइक्रोप्रोसेसर चिप' 🎛️ का सफल आविष्कार हुआ! 🤩💡","explanation":{"keyPoints":["चौथी पीढ़ी की शुरुआत वर्ष 1971 में विश्व के प्रथम व्यावसायिक माइक्रोप्रोसेसर 'इंटेल 4004' (Intel 4004\\) के आविष्कार के साथ हुई थी।","माइक्रोप्रोसेसर चिप द्वारा हजारों एकीकृत परिपथों को एक छोटी सिलिकॉन चिप पर समाहित कर पर्सनल कंप्यूटर (PC) का मार्ग प्रशस्त हुआ।"]}},{"id":"20","date":"RRB NTPC Stage-1 • Mar 2021","shiftInfo":"📌 3 Shifts Repeat","rawDate":"\\[RRB NTPC 14.03.2021 (Shift-I) Stage Ist\\] • \\[📌 Base Question | Total 3 Shifts Repeat\\]","examTag":"EXAM FOCUS","category":"generations","question":"पहली पीढ़ी की कंप्यूटर प्रणालियां किस पर आधारित थीं?","options":["ट्रांजिस्टर पर आधारित","इंटीग्रेटेड सर्किट पर आधारित","वैक्यूम ट्यूब पर आधारित","वीएलएसआई माइक्रोप्रोसेसर पर आधारित"],"answer":"वैक्यूम ट्यूब पर आधारित","memoryTrick":"पहली पीढ़ी ⏳ के कंप्यूटर इतने विशाल थे क्योंकि उनके अंदर भारी 'वैक्यूम ट्यूब' 💡 लगी थी! 😱💥","explanation":{"keyPoints":["प्रथम पीढ़ी के कंप्यूटर परिपथ (Circuitry) और मेमोरी के बुनियादी घटकों के रूप में वैक्यूम ट्यूब (निर्वात ट्यूब) पर आधारित थे।","इस पीढ़ी में मुख्य मेमोरी के रूप में मैग्नेटिक ड्रम तथा इनपुट/आउटपुट के लिए पंच कार्ड का उपयोग किया जाता था (जैसे ENIAC, EDVAC, UNIVAC-I)।"]}},{"id":"21","date":"RRB NTPC Stage-1 • Mar 2021","shiftInfo":"⚡ Shift-I","rawDate":"\\[RRB NTPC 12.03.2021 (Shift-I) Stage Ist\\]","examTag":"EXAM FOCUS","category":"generations","question":"द्वितीय पीढ़ी के कंप्यूटर  किया गया।"]}},{"id":"40","date":"RRB NTPC Stage-1 • Jul 2021","shiftInfo":"⚡ Shift-II","rawDate":"\\[RRB NTPC 23.07.2021 (Shift-II) Stage Ist\\]","examTag":"EXAM FOCUS","category":"history","question":"'पेन ड्राइव' का आविष्कार IBM द्वारा वर्ष ______ में किया गया था।","options":["1990","1988","2003","1998"],"answer":"1998","memoryTrick":"भारी फाइलों 📁 से राहत दिलाने के लिए आईबीएम ने वर्ष '1998' 💾 में पेन ड्राइव बनाई! 🤩💡","explanation":{"keyPoints":["पेन ड्राइव (USB Flash Drive) का आविष्कार और पेटेंट वर्ष 1998 में IBM और इजरायली कंपनी एम-सिस्टम्स (M-Systems) द्वारा किया गया था।","पेन ड्राइव एक पोर्टेबल सॉलिड-स्टेट सेकेंडरी स्टोरेज डिवाइस है, जो डेटा सुरक्षित रखने के लिए NAND-आधारित फ्लैश मेमोरी का उपयोग करती है।"]}},{"id":"41","date":"RRB NTPC Stage-1 • Mar 2021","shiftInfo":"⚡ Shift-II","rawDate":"\\[RRB NTPC 05.03.2021 (Shift-II) Stage Ist\\]","examTag":"EXAM FOCUS","category":"history","question":"संचार नेटवर्क में अंतरराष्ट्रीय कनेक्टिविटी की सुविधा प्रदान करने के लिए –––––– में अंतरराष्ट्रीय दूरसंचार संघ (ITU) की स्थापना की गई थी।","options":["1945","1995","1865","1885"],"answer":"1865","memoryTrick":"अंतरराष्ट्रीय स्तर पर दूर-दूर तार 📞 जोड़ने के लिए '1865' 📅 में आईटीयू बनाया गया! 🧠🔥","explanation":{"keyPoints":["अंतरराष्ट्रीय दूरसंचार संघ (ITU \\- International Telecommunication Union) की स्थापना 17 मई, 1865 को पेरिस में अंतरराष्ट्रीय टेलीग्राफ सम्मेलन के दौरान हुई थी।","यह संयुक्त राष्ट्र (UN) की सूचना एवं संचार प्रौद्योगिकी (ICT) से संबंधित सबसे पुरानी विशेष एजेंसी है।","इसका मुख्यालय जेनेवा, स्विट्जरलैंड में स्थित है।"]}},{"id":"42","date":"RRB NTPC Stage-1 • Apr 2016","shiftInfo":"⚡ Shift-III","rawDate":"\\[RRB NTPC 19.04.2016 (Shift-III) Stage Ist\\]","examTag":"EXAM FOCUS","category":"history","question":"प्राचीन गणितीय गणना के लिए इस्तेमाल साधन............कहा जाता है।","options":["कैलकुलेटर","एबेकस","टेबल","रेखांकन"],"answer":"एबेकस","memoryTrick":"प्राचीन काल में बिना कैलकुलेटर 🧮 के हिसाब लगाने सिर्फ लकड़ी का 'एबेकस' 🪵 चला! 🤩💡","explanation":{"keyPoints ory":"history","question":"दुनिया का पहला प्रोग्रामर किसे माना जाता है?","options":["एलन ट्यूरिंग","एडा लवलेस","टिम बर्नर्स-ली","स्टीव वोज़नियाक"],"answer":"एडा लवलेस","memoryTrick":"कंप्यूटर में दुनिया का सबसे पहला प्रोग्राम 💻 लिखकर इतिहास बनाने वाली 'एडा लवलेस' 👩💻 थीं! 🧠🔥","explanation":{"keyPoints":["लेडी एडा लवलेस (Augusta Ada King, Countess of Lovelace) को 'विश्व की प्रथम कंप्यूटर प्रोग्रामर' माना जाता है।","वे चार्ल्स बैबेज की सहयोगी और शिष्या थीं; इन्होंने एनालिटिकल इंजन पर बर्नोली संख्याओं की गणना के लिए पहला एल्गोरिदम/प्रोग्राम लिखा था।"]}},{"id":"46","date":"RRB NTPC Stage-1 • Apr 2016","shiftInfo":"⚡ Shift-II","rawDate":"\\[RRB NTPC 03.04.2016 (Shift-II) Stage Ist\\]","examTag":"EXAM FOCUS","category":"history","question":"1953 में बनाया गया \"बाइनरी इलेक्ट्रॉनिक अनुक्रम कैलकुलेटर\" (BESK) क्या है?","options":["इलेक्ट्रॉनिक कंप्यूटर","अनुरूप कंप्यूटर","डिजिटल कंप्यूटर","क्वांटम कंप्यूटर"],"answer":"इलेक्ट्रॉनिक कंप्यूटर","memoryTrick":"वर्ष 1953 📅 में बना बाइनरी कैलकुलेटर BESK ⚙️ असल में पहला 'इलेक्ट्रॉनिक कंप्यूटर' 💻 ही था! 😱💥","explanation":{"keyPoints":["BESK (Binär Elektronisk SekvensKalkylator) स्वीडन में वर्ष 1953 में निर्मित एक प्रारंभिक 'इलेक्ट्रॉनिक कंप्यूटर' था।","यह वैक्यूम ट्यूब और विलियम्स ट्यूब मेमोरी पर आधारित था और अपने समय में थोड़े समय के लिए दुनिया का सबसे तेज कंप्यूटर माना गया था।"]}},{"id":"47","date":"RRB NTPC Stage-1 • Apr 2016","shiftInfo":"⚡ Shift-II","rawDate":"\\[RRB NTPC 04.04.2016 (Shift-II) Stage Ist\\]","examTag":"EXAM FOCUS","category":"history","question":"माउस का आविष्कार किसने किया था?","options":["डगलस एंजेलबर्ट","एलन ट्यूरिंग","चार्ल्स बैबेज","टिम बर्नर्स-ली"],"answer":"डगलस एंजेलबर्ट","memoryTrick":"कंप्यूटर स्क्रीन 🖥️ पर कर्सर दौड़ाने वाले लकड़ी के माउस 🖱️ को 'डगलस एंजेलबर्ट' 🧑💻 ने बनाया! 🤩💡","explanation":{"keyPoints":["कंप्यूटर माउस का आविष्कार 1964 में स्टैनफोर्ड रिसर्च इंस्टीट्यूट (SRI) में डगलस एंजेलबर्ट (Douglas Engelbart) द्वारा किया गया था।","पहला कंप्यूटर माउस लकड़ी का बना था, जिसमें दो धातु के पहिये लगे थे।"]}},{"id":"48","date":"RRB NTPC Stage-1 • Apr 2016","shiftInfo":"⚡ Shift-II","rawDate":"\\[RRB NTPC 04.04.2016 (Shift-II) Stage Ist\\]","examTag":"EXAM FOCUS","category":"history","question":"माउस का पहली बार प्रयोग 1973 में किस कंप्यूटर सिस्टम के साथ किया गया था?","options":["जेरॉक्स ऑल्टो (Xerox Alto)","एप्पल मैकिंटोश","आईबीएम पीसी","ENIAC"],"answer":"जेरॉक्स ऑल्टो (Xerox Alto)","memoryTrick":"वर्ष 1973 📅 में पहली बार माउस 🖱️ का सफल प्रयोग 'जेरॉक्स ऑल्टो' 🖥️ कंप्यूटर में हुआ! 🧠🔥","explanation":{"keyPoints":["माउस का पहली बार प्रायोगिक रूप से उपयोग वर्ष 1973 में जेरॉक्स ऑल्टो (Xerox Alto) कंप्यूटर सिस्टम के साथ किया गया था।","जेरॉक्स ऑल्टो पहला ऐसा वर्कस्टेशन था जिसने ग्राफिकल यूजर इंटरफेस (GUI) और माउस आधारित नेविगेशन का समर्थन किया था।"]}},{"id":"49","date":"RRB NTPC Stage-1 • Mar 2016","shiftInfo":"⚡ Shift-II","rawDate":"\\[RRB NTPC 30.03.2016 (Shift-II) Stage Ist\\]","examTag":"EXAM FOCUS","category":"history","question":"ऑडियो हेडफोन की सबसे पहली जोड़ी 1910 में......के द्वारा बनाई गई थी।","options":["हम्फ्री डेवी","नथानिएल बाल्डविन","माइकल फैराडे","जॉन कॉस"],"answer":"नथानिएल बाल्डविन","memoryTrick":"वर्ष 1910 📅 में कानों पर संगीत 🎧 सुनने वाला हेडफोन 'नथानिएल बाल्डविन' 🧑🔧 ने तैयार किया! 😱💥","explanation":{"keyPoints":["ऑडियो हेडफोन की पहली व्यावहारिक जोड़ी वर्ष 1910 में नथानिएल बाल्डविन (Nathaniel Baldwin) द्वारा अपने घर की रसोई में हाथ से बनाई गई थी।","इसे शुरुआत में अमेरिकी नौसेना (US Navy) द्वारा संचार और रेडियो संचालन के लिए खरीदा गया था।"]}},{"id":"50","date":"RRB NTPC Stage-1 • Apr 2016","shiftInfo":"⚡ Shift-III","rawDate":"\\[RRB NTPC Stage I 26.04.2016 (Shift-III)\\]","examTag":"EXAM FOCUS","category":"history","question":"सर्वप्रथम एप्पल कंप्यूटर कौन-सा था?","options":["एप्पल I","एप्पल II","मैकिंटोश","एप्पल लिसा"],"answer":"एप्पल I","memoryTrick":"कंपनी शुरू होते ही सबसे पहले बाजार 🛒 में बिकने वाला कंप्यूटर 'एप्पल I' 🍏 था! 🤩💡","explanation":{"keyPoints":["एप्पल कंपनी द्वारा निर्मित सर्वप्रथम कंप्यूटर 'एप्पल I' (Apple I) था, जिसे स्टीव वोज़नियाक द्वार र ही खुद को 'कंप्यूटर साक्षर' माने! 🤩💡","explanation":{"keyPoints":["कोई भी व्यक्ति \"कंप्यूटर साक्षर\" (Computer Literate) तब माना जाता है जब वह अपनी दैनिक आवश्यकताओं से संबंधित आवश्यक एप्लिकेशनों (जैसे वर्ड प्रोसेसिंग, इंटरनेट ब्राउज़िंग, ईमेल) को चलाने और बुनियादी कार्य करने में सक्षम हो।","इसके लिए प्रोग्रामिंग भाषाएं सीखने या सॉफ्टवेयर विकसित करने की आवश्यकता नहीं होती।","प्रतिवर्ष 2 दिसंबर को 'विश्व कंप्यूटर साक्षरता दिवस' मनाया जाता है।"]}},{"id":"56","date":"RRB NTPC Stage-1 • Apr 2016","shiftInfo":"⚡ Shift-I","rawDate":"\\[RRB NTPC 04.04.2016 (Shift-I) Stage Ist\\]","examTag":"EXAM FOCUS","category":"applications","question":"डाटाविंड द्वारा उत्पादित टैबलेट कंप्यूटर का क्या नाम था, जिसे भारत सरकार द्वारा ई-लर्निंग कार्यक्रम के हिस्से के रूप में बढ़ावा दिया गया था?","options":["साक्षात","इन्द्रधनुष","आकाश","परम"],"answer":"आकाश","memoryTrick":"ई-लर्निंग 📚 के लिए सरकार ने जमीन से सीधे 'आकाश' ☁️ नाम का सस्ता टैबलेट उतारा! 😱💥","explanation":{"keyPoints":["'आकाश' (Aakash) भारत में डाटाविंड (Datawind) कंपनी द्वारा निर्मित और आईआईटी बॉम्बे के सहयोग से विकसित एक कम लागत वाला एंड्रॉयड टैबलेट कंप्यूटर था।","इसे भारत सरकार के मानव संसाधन विकास मंत्रालय (अब शिक्षा मंत्रालय) द्वारा 'राष्ट्रीय ई-लर्निंग मिशन' (NMEICT) के तहत छात्रों के लिए पेश किया गया था।"]}},{"id":"57","date":"RRB NTPC Stage-1 • Apr 2016","shiftInfo":"🔁 Variant 2","rawDate":"\\[RRB NTPC 04.04.2016 (Shift-II) Stage Ist\\] • \\[🔁 Variant 2 of Q54\\]","examTag":"EXAM FOCUS","category":"applications","question":"वैश्विक मौसम पूर्वानुमान में किस प्रकार के कंप्यूटर का उपयोग किया जाता है?","options":["मिनी कंप्यूटर","माइक्रो कंप्यूटर","मेनफ्रेम कंप्यूटर","सुपर कंप्यूटर"],"answer":"सुपर कंप्यूटर","memoryTrick":"दुनिया भर के तूफानी मौसम ⛈️ की सही भविष्यवाणी सिर्फ विशाल 'सुपर कंप्यूटर' 🖥️ ही करता है! 🧠🔥","explanation":{"keyPoints":["वैश्विक मौसम पूर्वानुमान (Weather Forecasting) और वायुमंडलीय विश्लेषण में केवल 'सुपर कंप्यूटर' का उपयोग किया जाता है।","इसमें उपग्रहों, रडारों और मौसम केंद्रों से प्राप्त खरबों डेटा त किया जाता है और अनुक्रमिक रूप से निष्पादित किया जाता है।","लगभग सभी आधुनिक सामान्य-प्रयोजन कंप्यूटर वॉन न्यूमैन आर्किटेक्चर पर आधारित हैं।"]}},{"id":"60","date":"RRB NTPC UG • May-Jun 2026","shiftInfo":"📌 4 Shifts Repeat","rawDate":"\\[RRB NTPC (UG) CEN 07/2025 | Exam Date: 7th May - 20th June 2026\\] • \\[📌 Base Question | Total 4 Shifts Repeat\\]","examTag":"EXAM FOCUS","category":"cpu_arch","question":"CPU मुख्य रूप से निम्नलिखित में से कौन-सा कार्य करता है?","options":["प्रोसेसिंग और कंट्रोल","स्टोरेज और आउटपुट","डिस्प्ले और स्टोरेज","इनपुट और कैलकुलेशन"],"answer":"प्रोसेसिंग और कंट्रोल","memoryTrick":"कंप्यूटर का दिमाग सीपीयू 🧠 सारे डेटा की 'प्रोसेसिंग' ⚙️ और सिस्टम का 'कंट्रोल' 🕹️ संभालता है! 🤩💡","explanation":{"keyPoints":["CPU (Central Processing Unit) कंप्यूटर का मुख्य मस्तिष्क है, जिसके दो प्राथमिक कार्य डेटा 'प्रोसेसिंग' (Processing \\- गणना व तार्किक संक्रियाएं) और सिस्टम 'कंट्रोल' (Control \\- अन्य घटकों का समन्वय व निर्देशन) हैं।","यह ALU (अरिथमेटिक लॉजिक यूनिट) द्वारा डेटा प्रोसेस करता है और CU (कंट्रोल यूनिट) द्वारा डेटा व निर्देशों के प्रवाह को नियंत्रित करता है।"]}},{"id":"61","date":"RRB NTPC UG • May-Jun 2026","shiftInfo":"📌 3 Shifts Repeat","rawDate":"\\[RRB NTPC (UG) CEN 07/2025 | Exam Date: 7th May - 20th June 2026\\] • \\[📌 Base Question | Total 3 Shifts Repeat\\]","examTag":"EXAM FOCUS","category":"cpu_arch","question":"CPU के अंदर, गणितीय संक्रियाओं और तार्किक तुलनाओं के लिए उत्तरदायी घटक, __________ है।","options":["रैंडम एक्सेस मेमोरी","मदरबोर्ड","कंट्रोल यूनिट","अरिथमेटिक लॉजिक यूनिट"],"answer":"अरिथमेटिक लॉजिक यूनिट","memoryTrick":"गणित 🧮 और लॉजिक 💡 के सभी कठिन सवाल सीपीयू का 'अरिथमेटिक लॉजिक यूनिट' ⚙️ चुटकियों में सुलझाता है! 🧠🔥","explanation":{"keyPoints":["ALU (Arithmetic Logic Unit) सीपीयू का वह मुख्य भाग है जो सभी प्रकार की अंकगणितीय गणनाओं (जोड़, घटाव, गुणा, भाग) और तार्किक तुलनाओं (Decision Making) को निष्पादित करता है।","यह कंट्रोल यूनिट (CU) से प्राप्त नियंत्रण संकेतों के आधार पर प्राथमिक मेमोरी या रजिस्टरों से डेटा लेकर प्रो ीय यूनिट, ग्राफिक्स यूनिट और नियंत्रण बस"],"answer":"नियंत्रण यूनिट, अंकीय यूनिट और लॉजिक यूनिट","memoryTrick":"सीपीयू 🧠 के तीन पहिए हैं जो 'नियंत्रण', 'अंकीय' 🔢 और 'लॉजिक यूनिट' 💡 बनकर पूरा सिस्टम चलाते हैं! 🧠🔥","explanation":{"keyPoints":["CPU के आंतरिक आर्किटेक्चर में मुख्य रूप से तीन उपतंत्र शामिल होते हैं:  \n  1\\. नियंत्रण यूनिट (Control Unit \\- CU): सभी घटकों का नियंत्रण एवं समन्वय।  \n  2\\. अंकीय यूनिट (Arithmetic Unit \\- AU): गणितीय संक्रियाएं।  \n  3\\. लॉजिक यूनिट (Logic Unit \\- LU): तार्किक तुलनाएं।","अंकीय और लॉजिक यूनिट को संयुक्त रूप से ALU कहा जाता है।"]}},{"id":"66","date":"RRB NTPC UG • Aug 2025","shiftInfo":"🔁 Variant 2","rawDate":"\\[RRB NTPC CEN 06/2024 - UNDERGRADUATE EXAM | Exam Date: 07 Aug 2025 to 09 Sep 2025\\] • \\[🔁 Variant 2 of Q65\\]","examTag":"EXAM FOCUS","category":"cpu_arch","question":"निम्नलिखित में से कौन-सा विकल्प, CPU के दो मुख्य घटकों और उनके कार्यों को परिशुद्ध रूप से निरूपित करता है?","options":["मॉनीटर और कीबोर्ड – डेटा प्रोसेसिंग की गति को नियंत्रित करते हैं","RAM और ROM – डेटा और निर्देशों को स्थायी रूप से संगृहीत करते हैं","HDD और SSD – डेटा इनपुट और आउटपुट टास्क करते हैं","ALU और CU – गणना करते हैं और सभी कंप्यूटर संक्रियाओं को नियंत्रित करते हैं"],"answer":"ALU और CU – गणना करते हैं और सभी कंप्यूटर संक्रियाओं को नियंत्रित करते हैं","memoryTrick":"'ALU' 🧮 सभी गणनाएं करता है जबकि 'CU' 🕹️ कंप्यूटर की संक्रियाओं को पूरी तरह नियंत्रित करता है! 🤩💡","explanation":{"keyPoints":["ALU (Arithmetic Logic Unit) और CU (Control Unit) सीपीयू के दो प्रमुख क्रियात्मक घटक हैं।","ALU का कार्य अंकगणितीय गणनाएं और तार्किक निर्णय लेना है, जबकि CU का कार्य कंप्यूटर की सभी संक्रियाओं और हार्डवेयर घटकों को निर्देशित व नियंत्रित करना है।"]}},{"id":"67","date":"RRB NTPC UG • Aug 2025","shiftInfo":"📌 3 Shifts Repeat","rawDate":"\\[RRB NTPC CEN 06/2024 - UNDERGRADUATE EXAM | Exam Date: 07 Aug 2025 to 09 Sep 2025\\] • \\[📌 Base Question | Total 3 Shifts Repeat\\]","examTag":"EXAM FOCUS","category":"cpu_arch","question":"CPU के अंदर कंट्रोल यूनिट (Control Unit) का प्राथमिक कार्य क्या है?","options":["निर्देशों और डेटा के प्रवाह को निर्देशित करना","बाह्य डिवाइस कनेक्शन को मैनेज करना","अक्सर उपयोग किए जाने वाले डेटा को संगृहीत करना","अंकगणितीय गणना करना"],"answer":"निर्देशों और डेटा के प्रवाह को निर्देशित करना","memoryTrick":"ट्रैफिक पुलिस 👮 की तरह 'कंट्रोल यूनिट' 🚦 कंप्यूटर में 'निर्देशों और डेटा के प्रवाह' 🌊 को संभालता है! 🧠🔥","explanation":{"keyPoints":["कंट्रोल यूनिट (CU) का मुख्य कार्य मेमोरी, ALU और इनपुट/आउटपुट डिवाइसेज के बीच डेटा तथा निर्देशों के प्रवाह को निर्देशित और नियंत्रित करना है।","यह निर्देशों को फेच (Fetch) और डिकोड (Decode) करके संबंधित घटकों को नियंत्रण संकेत (Control Signals) भेजता है।"]}},{"id":"68","date":"RRB NTPC UG • Aug 2025","shiftInfo":"🔁 Variant 2","rawDate":"\\[RRB NTPC CEN 06/2024 - UNDERGRADUATE EXAM | Exam Date: 07 Aug 2025 to 09 Sep 2025\\] • \\[🔁 Variant 2 of Q67\\]","examTag":"EXAM FOCUS","category":"cpu_arch","question":"निम्नलिखित में से कौन-सा, सेंट्रल प्रोसेसिंग यूनिट (Central Processing Unit) के भीतर कंट्रोल यूनिट की भूमिका का सटीक वर्णन करता है?","options":["यह सभी गणितीय और तार्किक गणनाएं करता है।","यह यूजर को प्रोसेस्ड आउटपुट (Processed Output) डिस्प्ले करता है।","यह प्रोसेसिंग के दौरान अस्थायी रूप से डेटा और इंस्ट्रक्शन को स्टोर करता है।","यह कंप्यूटर के सभी घटकों की गतिविधियों को निर्देशित और समन्वित करता है।"],"answer":"यह कंप्यूटर के सभी घटकों की गतिविधियों को निर्देशित और समन्वित करता है।","memoryTrick":"ऑर्केस्ट्रा कंडक्टर 🎼 की भांति 'कंट्रोल यूनिट' 🕹️ सभी घटकों को एक साथ 'निर्देशित और समन्वित' 🤝 करता है! 🤩💡","explanation":{"keyPoints":["कंट्रोल यूनिट को कंप्यूटर का 'नर्व सेंटर' (Nerve Center) या 'ट्रैफिक पुलिस' कहा जाता है।","यह स्वयं कोई प्रोसेसिंग नहीं करता, बल्कि कंप्यूटर के सभी भागों (ALU, मेमोरी, रजिस्टर्स, I/O) के बीच समन्वय और समय-प्रबंधन स्थापित करता है।"]}},{"id":"69","date":"RRB NTPC GL • Jun 2025","shiftInfo":"🔁 Variant 2","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\] • \\[🔁 Variant 2 of Q59\\]","examTag":"EXAM FOCUS","category":"cpu_arch","question":"निम्नलिखित में से कौन-सा, वॉन न्यूमैन आर्किटेक्चर द्वारा प्रस्तुत 'स्टोर्ड-प्रोग्राम कंप्यूटर' की अवधारणा को सर्वोत्तम रूप से प्रस्तुत करता है?","options":["एक कंप्यूटर जो प्रोग्राम निष्पादन के लिए मुख्य रूप से बाह्य भंडारण उपकरणों पर निर्भर करता है","एक कंप्यूटर जो प्रसंस्करण गति को अनुकूलित करने के लिए डेटा और निर्देशों के लिए अलग-अलग मेमोरी इकाइयों का उपयोग करता है","एक कंप्यूटर जो केवल अपने सर्किट में हार्डवायर्ड निर्देशों के एक निश्चित सेट को निष्पादित कर सकता है","एक ऐसा कंप्यूटर जिसमें डेटा और निर्देश दोनों को अनुक्रमिक निष्पादन के लिए एक ही प्राथमिक मेमोरी में संगृहीत किया जाता है"],"answer":"एक ऐसा कंप्यूटर जिसमें डेटा और निर्देश दोनों को अनुक्रमिक निष्पादन के लिए एक ही प्राथमिक मेमोरी में संगृहीत किया जाता है","memoryTrick":"वॉन न्यूमैन 🧠 ने कमाल किया, 'डेटा और निर्देश' 📜 दोनों को 'एक ही प्राथमिक मेमोरी' 💾 में बैठाया! 🧠🔥","explanation":{"keyPoints":["जॉन वॉन न्यूमैन (1945) द्वारा प्रस्तुत 'स्टोर्ड-प्रोग्राम' अवधारणा के तहत प्रोग्राम निर्देश और डेटा दोनों को एक ही प्राथमिक मेमोरी (RAM) में संग्रहीत किया जाता है।","CPU एक ही साझा बस के माध्यम से निर्देशों और डेटा को अनुक्रमिक (Sequential) रूप से निष्पादित करता है।"]}},{"id":"70","date":"RRB NTPC GL • Jun 2025","shiftInfo":"🔁 Variant 3","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\] • \\[🔁 Variant 3 of Q59\\]","examTag":"EXAM FOCUS","category":"cpu_arch","question":"निम्नलिखित में से कौन-सा कथन, कंप्यूटर सिस्टम में वॉन न्यूमैन और हार्वर्ड आर्किटेक्चर के बीच मूलभूत अंतर को सर्वोत्तम रूप से व्यक्त करता है?","options":["हार्वर्ड आर्किटेक्चर निर्देशों और डेटा को एक साथ प्राप्त करने की सुविधा देता है, जिससे संभावित रूप से प्रदर्शन में सुधार होता है, जबकि वॉन न्यूमैन आर्किटेक्चर आमतौर पर उन्हें एक ही मेमोरी स्पेस से क्रमिक रूप से प्राप्त करता है।","हार्वर्ड आर्किटेक्चर, वॉन न्यूमैन आर्किटेक्चर की तुलना में अधिक जटिल नियंत्रण इकाई का उपयोग करता है।","वॉन न्यूमैन आर्किटेक्चर निर्देशों और डेटा के लिए अलग-अलग एड्रेस स्थान का उपयोग करता है, जबकि हार्वर्ड आर्किटेक्चर एकल एड्रेस स्थान का उपयोग करता है।","वॉन न्यूमैन आर्किटेक्चर का प्रयोग मुख्यतः आधुनिक माइक्रोकंट्रोलर्स में किया जाता है, जबकि हार्वर्ड आर्किटेक्चर सामान्य प्रयोजन वाले कंप्यूटरों में प्रचलित है।"],"answer":"हार्वर्ड आर्किटेक्चर निर्देशों और डेटा को एक साथ प्राप्त करने की सुविधा देता है, जिससे संभावित रूप से प्रदर्शन में सुधार होता है, जबकि वॉन न्यूमैन आर्किटेक्चर आमतौर पर उन्हें एक ही मेमोरी स्पेस से क्रमिक रूप से प्राप्त करता है।","memoryTrick":"'हार्वर्ड आर्किटेक्चर' 🏛️ डेटा और निर्देश 'एक साथ' ⚡ लाता है जबकि वॉन न्यूमैन उन्हें 'क्रमिक' 🚶 खींचता है! 🤩💡","explanation":{"keyPoints":["वॉन न्यूमैन आर्किटेक्चर में डेटा और निर्देश एक ही मेमोरी और बस साझा करते हैं, जिससे वे केवल क्रमिक रूप से प्राप्त हो सकते हैं (वॉन न्यूमैन बॉटलनेक)।","हार्वर्ड आर्किटेक्चर में डेटा और निर्देशों के लिए अलग-अलग मेमोरी और अलग-अलग बसें होती हैं, जिससे दोनों को एक ही समय में एक साथ (Simultaneously) फेच किया जा सकता है।"]}},{"id":"71","date":"RRB NTPC GL • Jun 2025","shiftInfo":"🔁 Variant 2","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\] • \\[🔁 Variant 2 of Q63\\]","examTag":"EXAM FOCUS","category":"cpu_arch","question":"कंप्यूटर सिस्टम के संदर्भ में, CPU का पूर्ण रूप क्या है?","options":["Computer Processing Utility (कंप्यूटर प्रोसेसिंग यूटिलिटी)","Central Programming Unit (सेंट्रल प्रोग्रामिंग यूनिट)","Central Processing Unit (सेंट्रल प्रोसेसिंग यूनिट)","Control Processing Unit (कंट्रोल प्रोसेसिंग यूनिट)"],"answer":"Central Processing Unit (सेंट्रल प्रोसेसिंग यूनिट)","memoryTrick":"पूरे कंप्यूटर 🖥️ सिस्टम का मुख्य बॉस और सर्वेसर्वा 'सेंट्रल प्रोसेसिंग यूनिट' 👑 ही कहलाता है! 🧠🔥","explanation":{"keyPoints":["CPU का पूर्ण रूप 'Central Processing Unit' है। इसे कंप्यूटर का 'हृदय' या 'मस्तिष्क' कहा जाता है।","यह सभी प्रकार के डेटा प्रोसेसिंग ऑपरेशन्स को निष्पादित करता है और कंप्यूटर के सभी आंतरिक व बाह्य भागों के कार्यों को नियंत्रित व समन्वित करता है।"]}},{"id":"72","date":"RRB NTPC GL • Jun 2025","shiftInfo":"🔁 Variant 3","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\] • \\[🔁 Variant 3 of Q60\\]","examTag":"EXAM FOCUS","category":"cpu_arch","question":"निम्नलिखित में से कौन-सी डिवाइस, कंप्यूटर सिस्टम में डेटा को प्रोसेस करती है?","options":["RAM","CPU","HDD","FDD"],"answer":"CPU","memoryTrick":"कच्चे डेटा 📊 को समझदार रिजल्ट में बदलने का कठिन काम सिर्फ 'सीपीयू' 🧠 ही करता है! 🤩💡","explanation":{"keyPoints":["कंप्यूटर सिस्टम में डेटा को प्रोसेस करने वाली मुख्य डिवाइस CPU (Central Processing Unit) है।","RAM (Random Access Memory) केवल डेटा और निर्देशों को अस्थायी रूप से होल्ड करती है।","HDD (Hard Disk Drive) और FDD (Floppy Disk Drive) डेटा के स्थायी भंडारण (Secondary Storage) के लिए उपयोग की जाती हैं।"]}},{"id":"73","date":"RRB NTPC GL • Jun 2025","shiftInfo":"🔁 Variant 4","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\] • \\[🔁 Variant 4 of Q60\\]","examTag":"EXAM FOCUS","category":"cpu_arch","question":"कंप्यूटर सिस्टम में CPU का प्राथमिक कार्य क्या है?","options":["निर्देशों को निष्पादित करना और डेटा को प्रोसेस करना","डेटा को स्थायी रूप से संगृहीत करना","इनपुट और आउटपुट डिवाइस कनेक्ट करना","पावर सप्लाई का प्रबंधन करना"],"answer":"निर्देशों को निष्पादित करना और डेटा को प्रोसेस करना","memoryTrick":"सीपीयू 🧠 दिनभर बैठकर सारे 'निर्देशों को निष्पादित' 📜 और कंप्यूटर 'डेटा को प्रोसेस' ⚙️ करता है! 🧠🔥","explanation":{"keyPoints":["CPU का प्राथमिक कार्य मेमोरी से निर्देशों को फेच (Fetch) और डिकोड (Decode) करके उन्हें निष्पादित (Execute) करना तथा कच्चे डेटा को उपयोगी सूचना में प्रोसेस करना है।","डेटा को स्थायी रूप से संगृहीत करने का कार्य सेकेंडरी मेमोरी करती है, जबकि पावर सप्लाई का प्रबंधन SMPS (Switched-Mode Power Supply) करता है।"]}},{"id":"74","date":"RRB NTPC GL • Jun 2025","shiftInfo":"📌 3 Shifts Repeat","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\] • \\[📌 Base Question | Total 3 Shifts Repeat\\]","examTag":"EXAM FOCUS","category":"cpu_arch","question":"निम्नलिखित में से कौन-सा घटक सीपीयू का हिस्सा नहीं है?","options":["कैश मेमोरी (Cache memory)","अर्थमैटिक लॉजिक यूनिट (ALU)","कंट्रोल यूनिट (CU)","हार्ड डिस्क ड्राइव (HDD)"],"answer":"हार्ड डिस्क ड्राइव (HDD)","memoryTrick":"सीपीयू 🧠 के छोटे से केबिन में भारी-भरकम 'हार्ड डिस्क ड्राइव' 💽 कभी फिट नहीं बैठती! 😱💥","explanation":{"keyPoints":["हार्ड डिस्क ड्राइव (HDD) एक बाह्य/द्वितीयक स्टोरेज डिवाइस (Secondary Storage) है, यह CPU का आंतरिक घटक नहीं है।","CPU के आंतरिक भागों में ALU (Arithmetic Logic Unit), CU (Control Unit), आंतरिक रजिस्टर्स (Registers) और L1/L2 कैश मेमोरी (Cache Memory) शामिल होते हैं।"]}},{"id":"75","date":"RRB NTPC GL • Jun 2025","shiftInfo":"🔁 Variant 2","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\] • \\[🔁 Variant 2 of Q74\\]","examTag":"EXAM FOCUS","category":"cpu_arch","question":"निम्नलिखित में से कौन-सा घटक सेंट्रल प्रोसेसिंग यूनिट (CPU) का पार्ट नहीं है?","options":["अर्थमैटिक लॉजिक यूनिट (ALU)","रजिस्टर (Registers)","ग्राफिक कार्ड (Graphic Card)","कंट्रोल यूनिट (CU)"],"answer":"ग्राफिक कार्ड (Graphic Card)","memoryTrick":"गेमिंग 🎮 का तगड़ा 'ग्राफिक कार्ड' 🖥️ अलग से लगता है, वो सीपीयू 🧠 का अंदरूनी भाग नहीं! 🤩💡","explanation":{"keyPoints":["ग्राफिक कार्ड (GPU / Video Card) एक स्वतंत्र एक्सपेंशन कार्ड या चिपसेट होता है, जो डिस्प्ले और विजुअल आउटपुट के लिए मदरबोर्ड के PCIe स्लॉट में लगाया जाता है; यह CPU का मूल भाग नहीं है।","ALU, CU और रजिस्टर्स (Registers) CPU के बुनियादी आंतरिक घटक हैं।"]}},{"id":"76","date":"RRB NTPC GL • Jun 2025","shiftInfo":"🔁 Variant 3","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\] • \\[🔁 Variant 3 of Q74\\]","examTag":"EXAM FOCUS","category":"cpu_arch","question":"निम्नलिखित में से कौन-सा घटक, सेंट्रल प्रोसेसिंग यूनिट (CPU) का हिस्सा नहीं है?","options":["रजिस्टर्स (Registers)","अर्थमैटिक लॉजिक यूनिट (ALU)","ग्राफिक कार्ड (Graphic Card)","कंट्रोल यूनिट (CU)"],"answer":"ग्राफिक कार्ड (Graphic Card)","memoryTrick":"भारी विजुअल्स 🎨 दिखाने वाला बाहरी 'ग्राफिक कार्ड' 🖥️ बेचारे सीपीयू 🧠 के अंदर कभी नहीं रहता! 🧠🔥","explanation":{"keyPoints":["ग्राफिक कार्ड (Graphic Card) डिस्प्ले मॉनिटर पर ग्राफिकल इमेज और वीडियो रेंडर करने के लिए समर्पित एक परिधीय/विस्तारित हार्डवेयर घटक है।","CPU के मुख्य तीन भाग होते हैं: अरिथमेटिक लॉजिक यूनिट (ALU), कंट्रोल यूनिट (CU), और रजिस्टर्स/आंतरिक मेमोरी।"]}},{"id":"77","date":"RRB NTPC GL • Jun 2025","shiftInfo":"","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\]","examTag":"EXAM FOCUS","category":"cpu_arch","question":"सेंट्रल प्रोसेसिंग यूनिट (CPU) के आर्किटेक्चर में, निम्नलिखित में से कौन-सा कथन अर्थमैटिक लॉजिक यूनिट (ALU) के कार्य और कंट्रोल यूनिट (CU) के कार्य के बीच के अंतर को दर्शाता है?","options":["ALU गणना और तर्क संबंधित कार्यों को संभालता है; CU इंस्ट्रक्शन फ्लो और समन्वय का प्रबंधन करता है।","ALU इंस्ट्रक्शन्स को डिकोड करता है, जबकि CU डेटा स्टोरेज संबंधी कार्यों को संभालता है।","CU पेरिफेरल डिवाइसों के साथ सीधे इंटरेक्ट करता है, और ALU अस्थायी डेटा को स्टोर करता है।","CU अर्थमैटिक ऑपरेशंस निष्पादित करता है, और ALU प्रोग्राम इंस्ट्रक्शन्स को नियंत्रित करता है।"],"answer":"ALU गणना और तर्क संबंधित कार्यों को संभालता है; CU इंस्ट्रक्शन फ्लो और समन्वय का प्रबंधन करता है।","memoryTrick":"'ALU' 🧮 बैठकर हिसाब-किताब लगाता है जबकि 'CU' 🚦 ट्रैफिक पुलिस बनकर पूरे निर्देश संभालता है! 🤩💡","explanation":{"keyPoints":["ALU (अंकगणितीय एवं तार्किक इकाई): गणितीय परिकलन (जोड़, घटाव, गुणा, भाग) और तुलनात्मक/तार्किक निर्णय (AND, OR, NOT आदि) करता है।","CU (नियंत्रण इकाई): कंप्यूटर में निष्पादित होने वाले निर्देशों के प्रवाह (Flow) को डिकोड करता है तथा सभी आंतरिक व बाह्य घटकों के मध्य तालमेल व समन्वय स्थापित करता है।"]}},{"id":"78","date":"RRB NTPC GL • Jun 2025","shiftInfo":"","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\]","examTag":"EXAM FOCUS","category":"cpu_arch","question":"एक परिदृश्य पर विचार करें जहां एक उपयोगकर्ता एक ग्राफिकल एप्लिकेशन के साथ इंटरैक्ट कर रहा है। कंप्यूटर सिस्टम का कौन-सा घटक मॉनिटर पर प्रदर्शित दृश्य तत्वों को प्रस्तुत करने के लिए मुख्य रूप से जिम्मेदार है?","options":["ग्राफिक्स प्रोसेसिंग यूनिट (GPU)","रैंडम एक्सेस मेमोरी (RAM)","सेन्ट्रल प्रोसेसिंग यूनिट (CPU)","मदरबोर्ड चिपसेट"],"answer":"ग्राफिक्स प्रोसेसिंग यूनिट (GPU)","memoryTrick":"स्क्रीन 🖥️ पर रंग-बिरंगे सुंदर दृश्य दिखाने की पूरी जिम्मेदारी 'ग्राफिक्स प्रोसेसिंग यूनिट' 🎨 निभाती है! 🧠🔥","explanation":{"keyPoints":["GPU (Graphics Processing Unit) विशेष रूप से मॉनिटर स्क्रीन पर 2D/3D ग्राफिक्स, वीडियो, इमेज और विजुअल तत्वों को तेजी से रेंडर (प्रस्तुत) करने के लिए अभिकल्पित एक समर्पित प्रोसेसर है।","यह मुख्य CPU से ग्राफिकल प्रोसेसिंग का भारी भार अपने ऊपर ले लेता है, जिससे सिस्टम का समग्र प्रदर्शन बेहतर होता है।"]}},{"id":"79","date":"RRB NTPC Stage-1 • Dec 2020","shiftInfo":"📌 3 Shifts Repeat","rawDate":"\\[RRB NTPC 28.12.2020 (Shift-I) Stage Ist\\] & \\[RRB NTPC 09.01.2021 (Shift-I) Stage Ist\\] • \\[📌 Base Question | Total 3 Shifts Repeat\\]","examTag":"EXAM FOCUS","category":"cpu_arch","question":"कंप्यूटर के किस भाग को उसका मस्तिष्क कहा जाता है?","options":["रोम","हार्ड डिस्क","सीपीयू","मॉनिटर"],"answer":"सीपीयू","memoryTrick":"इंसान की खोपड़ी 💀 की तरह पूरे कंप्यूटर 🖥️ का असली 'मस्तिष्क' 🧠 सिर्फ सीपीयू होता है! 🤩💡","explanation":{"keyPoints":["CPU (Central Processing Unit) को कंप्यूटर का 'मस्तिष्क' (Brain of Computer) या 'हृदय' कहा जाता है।","यह सभी प्रोग्राम निर्देशों को समझता है, डेटा को प्रोसेस करता है तथा संपूर्ण कंप्यूटर प्रणाली के संचालन का नियंत्रण व प्रबंधन करता है।","सीपीयू के बिना कंप्यूटर कोई भी कार्य नहीं कर सकता।"]}},{"id":"80","date":"RRB NTPC Stage-1 • Jan 2021","shiftInfo":"🔁 Variant 3","rawDate":"\\[RRB NTPC 25.01.2021 (Shift-II) Stage Ist\\] • \\[🔁 Variant 3 of Q65\\]","examTag":"EXAM FOCUS","category":"cpu_arch","question":"निम्नलिखित में से कौन-सा 'सेंट्रल प्रोसेसिंग यूनिट' (Central Processing Unit) का एक घटक है?","options":["मेमोरी","माउस","मॉनिटर","कीबोर्ड"],"answer":"मेमोरी","memoryTrick":"हिसाब-किताब 🧮 याद रखने के लिए सीपीयू 🧠 अपने पास हमेशा तेज 'मेमोरी' 💾 रखता है! 🧠🔥","explanation":{"keyPoints":["CPU के मूल घटकों में CU (कंट्रोल यूनिट), ALU (अर्थमैटिक लॉजिक यूनिट) और मेमोरी यूनिट (विशेष रूप से रजिस्टर्स एवं आंतरिक कैश मेमोरी) शामिल होते हैं।","माउस और कीबोर्ड इनपुट डिवाइस हैं तथा मॉनिटर एक आउटपुट डिवाइस है, जो कि पेरिफेरल (बाहरी) उपकरण हैं।"]}},{"id":"81","date":"RRB NTPC Stage-1 • Jan 2021","shiftInfo":"🔁 Variant 4","rawDate":"\\[RRB NTPC 21.01.2021 (Shift-II) Stage Ist\\] & \\[RRB NTPC 02.03.2021 (Shift-II) Stage Ist\\] & \\[RRB NTPC 03.04.2021 (Shift-I) Stage Ist\\] • \\[🔁 Variant 4 of Q65\\]","examTag":"EXAM FOCUS","category":"cpu_arch","question":"कंप्यूटर में सीपीयू (CPU) के तीन घटक...............होते हैं।","options":["मॉनिटर, ALU, मेमोरी","कंट्रोल यूनिट, ALU, मेमोरी","मॉनिटर, मेमोरी, कंट्रोल यूनिट","कंट्रोल यूनिट, ALU, कीबोर्ड"],"answer":"कंट्रोल यूनिट, ALU, मेमोरी","memoryTrick":"कंप्यूटर की तिगड़ी क्लास में टॉप करने सिर्फ 'कंट्रोल यूनिट, ALU, मेमोरी' 🧠 साथ रखती है! 🤩💡","explanation":{"keyPoints":["CPU (Central Processing Unit) के तीन प्रमुख घटक होते हैं:  \n  1\\. ALU (Arithmetic Logic Unit): अंकगणितीय गणनाएं और तार्किक तुलनाएं करना।  \n  2\\. Control Unit (CU): कंप्यूटर के सभी आंतरिक व बाह्य भागों के संचालन को निर्देशित व नियंत्रित करना।  \n  3\\. Memory Unit / Registers: डेटा, मध्यवर्ती परिणाम और निर्देशों को प्रोसेसिंग के दौरान अस्थायी रूप से संग्रहीत करना।"]}},{"id":"82","date":"RRB NTPC Stage-1 • Apr 2016","shiftInfo":"🔁 Variant 3","rawDate":"\\[RRB NTPC 04.04.2016 (Shift-I) Stage Ist\\] • \\[🔁 Variant 3 of Q63\\]","examTag":"EXAM FOCUS","category":"cpu_arch","question":"कंप्यूटर विज्ञान में सीपीयू (CPU) का पूरा नाम क्या है?","options":["कोर प्रोग्रामिंग यूटिलिटी","सेंट्रल प्रोसेसिंग यूनिट","सर्किट परिधीय यूनिट","नियंत्रित विद्युत उपयोग"],"answer":"सेंट्रल प्रोसेसिंग यूनिट","memoryTrick":"पूरे कंप्यूटर सिस्टम 🖥️ का असली बॉस और परीक्षा का केंद्र सिर्फ 'सेंट्रल प्रोसेसिंग यूनिट' 👑 है! 🧠🔥","explanation":{"keyPoints":["कंप्यूटर विज्ञान में CPU का पूर्ण रूप 'Central Processing Unit' (सेंट्रल प्रोसेसिंग यूनिट) है।","इसे कंप्यूटर का मस्तिष्क (Brain of Computer) कहा जाता है। यह इनपुट डिवाइस से डेटा ग्रहण कर उसे प्रोसेस करता है और आउटपुट डिवाइस को निर्देशित करता है।"]}},{"id":"83","date":"RRB NTPC Stage-1 • Apr 2016","shiftInfo":"🔁 Variant 2","rawDate":"\\[RRB NTPC Stage I 26.04.2016 (Shift-II)\\] • \\[🔁 Variant 2 of Q79\\]","examTag":"EXAM FOCUS","category":"cpu_arch","question":"कंप्यूटर............के बिना काम नहीं कर सकते–","options":["स्कैनर","इंटरनेट","माउस","सीपीयू"],"answer":"सीपीयू","memoryTrick":"बिना दिमाग 🧠 के छात्र फेल होता है, वैसे ही बिना 'सीपीयू' 💻 कंप्यूटर एकदम डब्बा है! 😱💥","explanation":{"keyPoints":["कंप्यूटर CPU के बिना कार्य नहीं कर सकता, क्योंकि डेटा प्रोसेसिंग, नियंत्रण और गणना से जुड़े सभी मूल कार्य CPU द्वारा ही संपन्न किए जाते हैं।","स्कैनर, माउस और इंटरनेट सहायक/पेरिफेरल सुविधाएं हैं, जिनके बिना भी कंप्यूटर का बुनियादी सिस्टम चालू रह सकता है।"]}},{"id":"84","date":"RRB NTPC Stage-1 • Mar 2016","shiftInfo":"🔁 Variant 3","rawDate":"\\[RRB NTPC 29.03.2016 (Shift-III) Stage Ist\\] • \\[🔁 Variant 3 of Q79\\]","examTag":"EXAM FOCUS","category":"cpu_arch","question":"निम्नलिखित में से कौन-सा एक पर्सनल कंप्यूटर में कंप्यूटिंग करता है?","options":["CPU","Motherboard","RAM","BIOS"],"answer":"CPU","memoryTrick":"पर्सनल कंप्यूटर 🖥️ में तेज हिसाब-किताब और असली कंप्यूटिंग का सारा काम केवल 'CPU' 🧠 संभालता है! 🤩💡","explanation":{"keyPoints":["पर्सनल कंप्यूटर (PC) में वास्तविक कंप्यूटिंग (डेटा प्रोसेसिंग और गणना) का कार्य केवल CPU (Central Processing Unit) करता है।","मदरबोर्ड सभी हार्डवेयर घटकों को आपस में जोड़ता है, RAM प्राथमिक कार्यशील मेमोरी प्रदान करती है और BIOS सिस्टम बूटिंग प्रक्रिया को आरंभ करता है।"]}},{"id":"85","date":"RRB NTPC Stage-1 • Apr 2016","shiftInfo":"🔁 Variant 3","rawDate":"\\[RRB NTPC 18.04.2016 (Shift-II) Stage Ist\\] • \\[🔁 Variant 3 of Q67\\]","examTag":"EXAM FOCUS","category":"cpu_arch","question":"कंप्यूटर के किस भाग को नर्व सेंटर कहा जाता है?","options":["सॉफ्टवेयर","हार्डवेयर","कंट्रोल यूनिट","प्रोग्राम्स"],"answer":"कंट्रोल यूनिट","memoryTrick":"परीक्षा हॉल के सख्त इनविजिलेटर 👮 की तरह पूरा नर्व सेंटर संभालना 'कंट्रोल यूनिट' 🕹️ का काम है! 🧠🔥","explanation":{"keyPoints":["कंट्रोल यूनिट (CU) को कंप्यूटर का 'नर्व सेंटर' (Nerve Center) या 'नाड़ी तंत्र' कहा जाता है।","यह कंप्यूटर के सभी भागों (इनपुट, आउटपुट, मेमोरी, ALU) की गतिविधियों के बीच तालमेल बैठाता है तथा निर्देशों के प्रवाह को नियंत्रित व प्रबंधित करता है।"]}},{"id":"86","date":"RRB NTPC Stage-1 • Mar 2016","shiftInfo":"🔁 Variant 3","rawDate":"\\[RRB NTPC 28.03.2016 (Shift-II) Stage Ist\\] • \\[🔁 Variant 3 of Q61\\]","examTag":"EXAM FOCUS","category":"cpu_arch","question":"अंकगणितीय एवं तार्किक (लॉजिकल) संक्रियाएं करने वाले संसाधक (प्रोसेसर) को क्या कहा जाता है?","options":["CPU","ALU","Microprocessor","RAM"],"answer":"ALU","memoryTrick":"गणित के भारी सवाल 🧮 और लॉजिकल रीजनिंग हल करने वाला प्रोफेसर सिर्फ 'ALU' ⚙️ कहलाता है! 🤩💡","explanation":{"keyPoints":["ALU (Arithmetic Logic Unit) संसाधक का वह विशिष्ट भाग है जो मूलभूत अंकगणितीय गणनाएं (जोड़, घटाव, गुणा, भाग) तथा तार्किक संक्रियाएं (तुलना, कम/अधिक, बराबर) निष्पादित करता है।","यह कंट्रोल यूनिट से प्राप्त नियंत्रण संकेतों के अनुसार कार्य करता है।"]}},{"id":"87","date":"RRB NTPC UG • May-Jun 2026","shiftInfo":"","rawDate":"\\[RRB NTPC (UG) CEN 07/2025 | Exam Date: 7th May - 20th June 2026\\]","examTag":"EXAM FOCUS","category":"cpu_perf","question":"सेंट्रल प्रोसेसिंग यूनिट (CPU) द्वारा अनुदेशों को निष्पादित करने की स्पीड मुख्यतः उसके क्लॉक रेट द्वारा निर्धारित होती है, जिसे प्रायः गीगाहर्ट्ज़ (GHz) में मापा जाता है। यदि किसी CPU की क्लॉक रेट 3.5 GHz है, तो प्रति सेकंड लगभग कितने क्लॉक साइकिल घटित होंगे?","options":["350 साइकिल प्रति सेकंड","3.5 मिलियन साइकिल प्रति सेकंड","3.5 बिलियन साइकिल प्रति सेकंड","3.5 हजार साइकिल प्रति सेकंड"],"answer":"3.5 बिलियन साइकिल प्रति सेकंड","memoryTrick":"साढ़े तीन गीगाहर्ट्ज़ ⚡ स्पीड पर सीपीयू प्रति सेकंड पूरे '3.5 बिलियन साइकिल प्रति सेकंड' 🚴💨 दौड़ाता है! 😱💥","explanation":{"keyPoints":["1 हर्ट्ज़ (Hz) \\= 1 साइकिल प्रति सेकंड।","1 GHz (गीगाहर्ट्ज़) \\= 10⁹ (1 बिलियन या 100 करोड़) साइकिल प्रति सेकंड।","अतः 3.5 GHz क्लॉक रेट वाले प्रोसेसर में प्रति सेकंड लगभग 3.5 बिलियन (3.5 × 10⁹) क्लॉक साइकिल घटित होंगे।"]}},{"id":"88","date":"RRB NTPC GL • Jun 2025","shiftInfo":"📌 2 Shifts Repeat","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\] • \\[📌 Base Question | Total 2 Shifts Repeat\\]","examTag":"EXAM FOCUS","category":"cpu_perf","question":"CPU की कौन-सी विशेषता यह निर्धारित करती है कि वह प्रति सेकंड कितने निर्देशों को संसाधित कर सकता है?","options":["क्लॉक स्पीड (Clock speed)","विद्युत की खपत (Power consumption)","रजिस्टरों की संख्या (Number of registers)","कैश साइज (Cache size)"],"answer":"क्लॉक स्पीड (Clock speed)","memoryTrick":"प्रति सेकंड कितने सवाल 📜 हल होंगे, यह सिर्फ प्रोसेसर की तेज 'क्लॉक स्पीड' ⏱️ तय करती है! 🧠🔥","explanation":{"keyPoints":["क्लॉक स्पीड (Clock Speed) यह निर्धारित करती है कि प्रोसेसर एक सेकंड में कितने क्लॉक साइकिल चला सकता है और कितने निर्देशों को संसाधित कर सकता है।","क्लॉक स्पीड जितनी अधिक होगी, सीपीयू प्रति सेकंड उतने ही अधिक निर्देशों का निष्पादन तेजी से कर पाएगा।"]}},{"id":"89","date":"RRB NTPC GL • Jun 2025","shiftInfo":"🔁 Variant 2","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\] • \\[🔁 Variant 2 of Q88\\]","examTag":"EXAM FOCUS","category":"cpu_perf","question":"CPU की निम्न में से किस विशेषता द्वारा यह निर्धारित किया जाता है कि वह प्रति सेकंड कितने इन्स्ट्रक्शन प्रोसेस कर सकता है?","options":["क्लॉक स्पीड (Clock speed)","कैश साइज (Cache size)","रजिस्टरों की संख्या (Number of registers)","विद्युत खपत (Power consumption)"],"answer":"क्लॉक स्पीड (Clock speed)","memoryTrick":"कंप्यूटर की घड़ी ⏰ जितनी तेज भागेगी, उसकी 'क्लॉक स्पीड' ⚡ उतने ही ज्यादा निर्देश प्रोसेस करेगी! 🤩💡","explanation":{"keyPoints":["प्रोसेसर की क्लॉक स्पीड (घड़ी की गति) सीधे तौर पर यह तय करती है कि वह प्रति सेकंड कितने निर्देश प्रोसेस करने में सक्षम है।","आधुनिक कंप्यूटरों में क्लॉक स्पीड को गीगाहर्ट्ज़ (GHz) में तथा प्रोसेसर की क्षमता को MIPS (Million Instructions Per Second) में मापा जाता है।"]}},{"id":"90","date":"RRB NTPC Stage-1 • Mar 2021","shiftInfo":"📌 3 Shifts Repeat","rawDate":"\\[RRB NTPC 15.03.2021 (Shift-II) Stage Ist\\] • \\[📌 Base Question | Total 3 Shifts Repeat\\]","examTag":"EXAM FOCUS","category":"cpu_perf","question":"सीपीयू की गति को किसमें मापा जा सकता है?","options":["मेगाहर्ट्ज़ (MHz)","बिट्स प्रति सेकंड","लक्स","हॉर्सपावर"],"answer":"मेगाहर्ट्ज़ (MHz)","memoryTrick":"रॉकेट जैसे तेज चलने 🚀 वाले सीपीयू की धड़कन हमेशा 'मेगाहर्ट्ज़' 📻 में मापी जाती है! 🧠🔥","explanation":{"keyPoints":["CPU की गति को मापने की बुनियादी इकाई हर्ट्ज़ (Hz) है, जिसे सामान्यतः मेगाहर्ट्ज़ (MHz) या गीगाहर्ट्ज़ (GHz) में व्यक्त किया जाता है।","बिट्स प्रति सेकंड (bps) डेटा ट्रांसमिशन स्पीड की इकाई है; लक्स प्रदीप्ति (Illuminance) की इकाई है और हॉर्सपावर शक्ति (Power) की इकाई है।"]}},{"id":"91","date":"RRB NTPC Stage-1 • Feb 2021","shiftInfo":"🔁 Variant 2","rawDate":"\\[RRB NTPC 15.02.2021 (Shift-II) Stage Ist\\] • \\[🔁 Variant 2 of Q90\\]","examTag":"EXAM FOCUS","category":"cpu_perf","question":"माइक्रोप्रोसेसर की गति को............के रूप में जाना जाता है-","options":["घड़ी की गति (Clock Speed)","मेगा स्पीड","बिट गति","चक्रगति"],"answer":"घड़ी की गति (Clock Speed)","memoryTrick":"माइक्रोप्रोसेसर 💻 की तेज रफ्तार को छात्र परीक्षा हॉल में दीवार की 'घड़ी की गति' ⏰ समझता है! 🤩💡","explanation":{"keyPoints":["माइक्रोप्रोसेसर जिस गति से निर्देशों को निष्पादित करता है, उसे 'घड़ी की गति' (Clock Speed) कहा जाता है।","क्लॉक स्पीड को सामान्यतः मेगाहर्ट्ज़ (MHz) या गीगाहर्ट्ज़ (GHz) में मापा जाता है।","क्लॉक स्पीड जितनी अधिक होगी, प्रोसेसर प्रति सेकंड उतने ही अधिक क्लॉक साइकिल और कार्य तेजी से निष्पादित करेगा।"]}},{"id":"92","date":"RRB NTPC Stage-1 • Apr 2016","shiftInfo":"🔁 Variant 3","rawDate":"\\[RRB NTPC 18.04.2016 (Shift-II) Stage Ist\\] • \\[🔁 Variant 3 of Q90\\]","examTag":"EXAM FOCUS","category":"cpu_perf","question":"कंप्यूटर शब्दावली में MIPS का अर्थ क्या है?","options":["मार्जिनल इनपुट स्टोरेज","मिलियन इंस्ट्रक्शन पर सेकंड","माइक्रो इंफॉर्मेशन प्रोसेसिंग स्टेट","मेमोरी इमेज प्रोसेसिंग स्टेट"],"answer":"मिलियन इंस्ट्रक्शन पर सेकंड","memoryTrick":"सुपर कंप्यूटर एक सेकंड ⏱️ में लाखों सवाल यानी पूरे 'मिलियन इंस्ट्रक्शन पर सेकंड' 📜 निपटा देता है! 🧠🔥","explanation":{"keyPoints":["कंप्यूटर शब्दावली में MIPS का पूर्ण रूप 'Million Instructions Per Second' (मिलियन इंस्ट्रक्शन पर सेकंड) है।","यह पारंपरिक कंप्यूटरों और मेनफ्रेम प्रणालियों के प्रोसेसर की कार्य गति और प्रोसेसिंग क्षमता मापने की एक प्रमुख इकाई है।","वैज्ञानिक सुपरकंप्यूटरों की गणना क्षमता को FLOPS (Floating Point Operations Per Second) में मापा जाता है।"]}},{"id":"93","date":"RRB NTPC UG • May-Jun 2026","shiftInfo":"","rawDate":"\\[RRB NTPC (UG) CEN 07/2025 | Exam Date: 7th May - 20th June 2026\\]","examTag":"EXAM FOCUS","category":"instruction_cycle","question":"CPU एग्ज़ीक्यूशन के लिए आगामी अनुदेश को किस सिस्टम कंपोनेंट से पुनः प्राप्त करता है?","options":["सिस्टम आउटपुट रजिस्टर","सिस्टम सेकेंडरी मेमोरी","सिस्टम प्रोग्राम काउंटर","सिस्टम इनपुट बफर यूनिट"],"answer":"सिस्टम प्रोग्राम काउंटर","memoryTrick":"अगला सवाल 📝 उठाने के लिए सीपीयू सीधे टिकट खिड़की जैसे 'सिस्टम प्रोग्राम काउंटर' 🎫 पर जाता है! 🤩💡","explanation":{"keyPoints":["CPU निष्पादन (Execution) के लिए अगले निष्पादित होने वाले निर्देश का मेमोरी एड्रेस 'प्रोग्राम काउंटर' (Program Counter \\- PC) नामक विशेष रजिस्टर से प्राप्त करता है।","जैसे ही वर्तमान निर्देश मेमोरी से फेच हो जाता है, प्रोग्राम काउंटर स्वतः अगले क्रमिक निर्देश के एड्रेस को इंगित करने के लिए अपडेट (इन्क्रीमेंट) हो जाता है।"]}},{"id":"94","date":"RRB NTPC GL • Jun 2025","shiftInfo":"📌 2 Shifts Repeat","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\] • \\[📌 Base Question | Total 2 Shifts Repeat\\]","examTag":"EXAM FOCUS","category":"instruction_cycle","question":"आधुनिक CPU में, एक साथ कई निर्देशों को निष्पादित करने के लिए किस तकनीक का उपयोग किया जाता है?","options":["पाइपलाइनिंग (Pipelining)","सीरियल प्रोसेसिंग (Serial Processing)","क्लॉक सिंक्रोनाइजेशन (Clock Synchronization)","सीक्वेंशियल एग्जीक्यूशन (Sequential Execution)"],"answer":"पाइपलाइनिंग (Pipelining)","memoryTrick":"एक साथ कई सारे सवाल 📚 हल करने के लिए सीपीयू पानी जैसी 'पाइपलाइनिंग' 🚰 तकनीक चलाता है! 🧠🔥","explanation":{"keyPoints":["आधुनिक CPU में एक साथ कई निर्देशों को समानांतर रूप से निष्पादित करने की उन्नत हार्डवेयर तकनीक को 'पाइपलाइनिंग' (Pipelining) कहा जाता है।","इसमें निर्देश चक्र के विभिन्न चरणों (फेच, डिकोड, एग्जीक्यूट, राइट-बैक) को एक असेंबली लाइन की तरह एक साथ ओवरलैप करके प्रोसेस किया जाता है।"]}},{"id":"95","date":"RRB NTPC GL • Jun 2025","shiftInfo":"🔁 Variant 2","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\] • \\[🔁 Variant 2 of Q94\\]","examTag":"EXAM FOCUS","category":"instruction_cycle","question":"CPU आर्किटेक्चर में पाइपलाइनिंग (pipelining) का क्या महत्व है?","options":["रजिस्टरों के बीच डेटा ट्रांसफर करता है","मल्टीपल कोरों (multiple cores) का उपयोग करके क्लॉक स्पीड को बढ़ाता है","ओवरलैपिंग स्टेज (overlapping stage) द्वारा एक साथ कई अनुदेशों को एग्जीक्यूट करता है","अनुदेशों को मेमोरी में स्टोर करता है"],"answer":"ओवरलैपिंग स्टेज (overlapping stage) द्वारा एक साथ कई अनुदेशों को एग्जीक्यूट करता है","memoryTrick":"पाइपलाइनिंग 🚰 से सीपीयू बिना रुके कई चरणों को 'ओवरलैपिंग स्टेज' 🪜 में एक साथ दौड़ाता है! 🤩💡","explanation":{"keyPoints":["पाइपलाइनिंग का मुख्य महत्व यह है कि यह ओवरलैपिंग चरणों (Overlapping Stages) के माध्यम से एक ही समय में कई निर्देशों को प्रोसेस करता है।","इससे प्रोसेसर का थ्रूपुट (प्रति यूनिट समय में पूरे होने वाले कार्यों की संख्या) काफी बढ़ जाता है, जिससे समग्र सिस्टम का प्रदर्शन तीव्र होता है।"]}},{"id":"96","date":"RRB NTPC UG • May-Jun 2026","shiftInfo":"📌 5 Shifts Repeat","rawDate":"\\[RRB NTPC (UG) CEN 07/2025 | Exam Date: 7th May - 20th June 2026\\] • \\[📌 Base Question | Total 5 Shifts Repeat\\]","examTag":"EXAM FOCUS","category":"motherboard","question":"कंप्यूटर सिस्टम में PCB का पूर्ण रूप क्या है?","options":["Physical Circuit Block","Printed Circuit Board","Peripheral Circuit Board","Programmed Control Board"],"answer":"Printed Circuit Board","memoryTrick":"कंप्यूटर के सभी पुर्जे ⚙️ हरी स्लेट जैसे 'Printed Circuit Board' 🟩 पर मजबूती से छपे रहते हैं! 🧠🔥","explanation":{"keyPoints":["कंप्यूटर सिस्टम में PCB का पूर्ण रूप 'Printed Circuit Board' (प्रिंटेड सर्किट बोर्ड) है।","यह इलेक्ट्रॉनिक घटकों (जैसे IC, कैपेसिटर, रेसिस्टर आदि) को यांत्रिक सहारा देने तथा उन्हें प्रवाहकीय तांबे के ट्रैक (Conductive Tracks) द्वारा आपस में जोड़ने वाला मुख्य बोर्ड है।","कंप्यूटर का मुख्य मदरबोर्ड भी एक जटिल मल्टी-लेयर PCB ही होता है।"]}},{"id":"97","date":"RRB NTPC UG • May-Jun 2026","shiftInfo":"🔁 Variant 2","rawDate":"\\[RRB NTPC (UG) CEN 07/2025 | Exam Date: 7th May - 20th June 2026\\] • \\[🔁 Variant 2 of Q96\\]","examTag":"EXAM FOCUS","category":"motherboard","question":"कंप्यूटर हार्डवेयर के संदर्भ में, संक्षिप्त रूप \"PCB\" का पूर्ण रूप क्या है?","options":["Primary Cache Buffer","Processor Control Base","Printed Circuit Board","Peripheral Communication Bus"],"answer":"Printed Circuit Board","memoryTrick":"हार्डवेयर की दुनिया में मदरबोर्ड 🖥️ की हरी थाली को 'Printed Circuit Board' 🟩 कहा जाता है! 🤩💡","explanation":{"keyPoints":["कंप्यूटर हार्डवेयर के संदर्भ में PCB का पूरा नाम 'Printed Circuit Board' है।","यह गैर-चालक आधार (Non-conductive substrate) पर तांबे की पतली परतों द्वारा विभिन्न इलेक्ट्रॉनिक घटकों के मध्य विद्युत परिपथ स्थापित करता है।","इसका उपयोग डेस्कटॉप, लैपटॉप, टैबलेट, स्मार्टफोन तथा लगभग सभी डिजिटल उपकरणों में होता है।"]}},{"id":"98","date":"RRB NTPC GL • Jun 2025","shiftInfo":"","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\]","examTag":"EXAM FOCUS","category":"motherboard","question":"CMOS, जो प्रायः सिस्टम कॉन्फ़िगरेशन को स्टोर करने से संबंधित होता है, का पूर्ण रूप क्या है?","options":["Complementary Metal-Oxide Semiconductor (कॉम्प्लिमेंट्री मेटल-ऑक्साइड सेमीकंडक्टर)","Configurable Modular Operating Software (कॉन्फ़िगरेबल मॉड्युलर ऑपरेटिंग सॉफ्टवेयर)","Central Memory Output System (सेंट्रल मेमोरी आउटपुट सिस्टम)","Computerised Main Operating System (कंप्यूटराइज्ड मेन ऑपरेटिंग सिस्टम)"],"answer":"Complementary Metal-Oxide Semiconductor (कॉम्प्लिमेंट्री मेटल-ऑक्साइड सेमीकंडक्टर)","memoryTrick":"कंप्यूटर बंद होने पर भी समय ⏰ याद रखने वाला छोटा सिक्का 'कॉम्प्लिमेंट्री मेटल-ऑक्साइड सेमीकंडक्टर' 🔋 है! 🧠🔥","explanation":{"keyPoints":["CMOS का पूर्ण रूप 'Complementary Metal-Oxide Semiconductor' है।","यह मदरबोर्ड पर स्थित एक छोटी ऑन-बोर्ड चिप और मेमोरी होती है, जो कंप्यूटर बंद होने पर भी सिस्टम की बुनियादी सेटिंग्स, दिनांक और समय (Real-Time Clock) को सुरक्षित रखती है।","इसे निरंतर चालू रखने के लिए मदरबोर्ड पर एक छोटी CR2032 लिथियम बैटरी लगी होती है।"]}},{"id":"99","date":"RRB NTPC GL • Jun 2025","shiftInfo":"","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\]","examTag":"EXAM FOCUS","category":"motherboard","question":"आधुनिक मदरबोर्ड में, उच्च स्पीड संचार की सुविधा के लिए निम्न में से कौन-सा घटक सीधे CPU से जुड़ा होता है?","options":["PCB","GPU","ROM","नॉर्थब्रिज (Northbridge)"],"answer":"नॉर्थब्रिज (Northbridge)","memoryTrick":"तेज संचार 🚀 के लिए सीपीयू से सीधे जुड़ने वाला उत्तर दिशा का पुल 'नॉर्थब्रिज' 🌉 कहलाता है! 🤩💡","explanation":{"keyPoints":["पारंपरिक मदरबोर्ड चिपसेट आर्किटेक्चर में 'नॉर्थब्रिज' (Northbridge / Memory Controller Hub) उच्च-स्पीड संचार वाले घटकों (CPU, RAM और PCIe ग्राफिक्स) को सीधे CPU से जोड़ता है।","धीमी गति वाले परिधीय उपकरणों (USB, SATA, ऑडियो, PCI) को जोड़ने का कार्य 'साउथब्रिज' (Southbridge) द्वारा किया जाता है।","आधुनिक प्रोसेसरों में नॉर्थब्रिज का अधिकांश नियंत्रण सीधे CPU चिप के भीतर ही एकीकृत (Integrated) कर दिया गया है।"]}},{"id":"100","date":"RRB NTPC GL • Jun 2025","shiftInfo":"🔁 Variant 3","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\] • \\[🔁 Variant 3 of Q96\\]","examTag":"EXAM FOCUS","category":"motherboard","question":"विद्युत परिपथों में PCB का पूर्ण रूप क्या है?","options":["Peripheral Circuit Bridge (पेरिफेरल सर्किट ब्रिज)","Printed Circuit Board (प्रिंटेड सर्किट बोर्ड)","Process Control Board (प्रोसेस कंट्रोल बेस)","Programmed Control Base (प्रोग्राम्ड कंट्रोल बेस)"],"answer":"Printed Circuit Board (प्रिंटेड सर्किट बोर्ड)","memoryTrick":"बिजली के परिपथों ⚡ में तारों का जाल बिछाने वाला आधार 'प्रिंटेड सर्किट बोर्ड' 🟩 ही बनता है! 🧠🔥","explanation":{"keyPoints":["विद्युत एवं इलेक्ट्रॉनिक्स परिपथों में PCB का पूर्ण रूप 'Printed Circuit Board' (प्रिंटेड सर्किट बोर्ड) होता है।","यह तारों के उलझे हुए जाल को हटाकर सर्किट को कॉम्पैक्ट, विश्वसनीय और टिकाऊ बनाता है।","इसका निर्माण फाइबरग्लास या कंपोजिट एपॉक्सी सामग्री की परतों पर तांबे के ट्रैक्स को एचिंग (etching) करके किया जाता है।"]}},{"id":"101","date":"RRB NTPC GL • Jun 2025","shiftInfo":"🔁 Variant 4","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\] • \\[🔁 Variant 4 of Q96\\]","examTag":"EXAM FOCUS","category":"motherboard","question":"इलेक्ट्रॉनिक्स में PCB का पूर्ण रूप क्या है?","options":["Printed Circuit Board (प्रिंटेड सर्किट बोर्ड)","Personal Control Board (पर्सनल कंट्रोल बोर्ड)","Portable Control Base (पोर्टेबल कंट्रोल बेस)","Power Circuit Board (पावर सर्किट बोर्ड)"],"answer":"Printed Circuit Board (प्रिंटेड सर्किट बोर्ड)","memoryTrick":"इलेक्ट्रॉनिक्स ⚡ लैब में प्रोजेक्ट बनाते समय छात्रों ने हरे रंग का 'प्रिंटेड सर्किट बोर्ड' 🟩 जोड़ा! 🧠🔥","explanation":{"keyPoints":["इलेक्ट्रॉनिक्स में PCB का पूर्ण रूप 'Printed Circuit Board' (प्रिंटेड सर्किट बोर्ड) है।","यह इलेक्ट्रॉनिक घटकों को व्यवस्थित करने, स्थिर रखने और तांबे के चालक ट्रैक्स के माध्यम से उन्हें आपस में जोड़ने का बुनियादी आधार प्रदान करता है।","इसका उपयोग कंप्यूटर, मोबाइल, टीवी तथा लगभग सभी इलेक्ट्रॉनिक उपकरणों में मुख्य सर्किट बोर्ड के रूप में किया जाता है।"]}},{"id":"102","date":"RRB NTPC GL • Jun 2025","shiftInfo":"","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\]","examTag":"EXAM FOCUS","category":"motherboard","question":"प्रिंटेड सर्किट बोर्ड (PCB) के संबंध में निम्नलिखित में से कौन-सा कथन गलत है?","options":["PCB केवल डेस्कटॉप कंप्यूटर को सर्विस देते हैं, पोर्टेबल डिवाइस की नहीं।","PCB हार्डवेयर भागों को सपोर्ट देने और व्यवस्थित करने के लिए एक आधार प्रदान करते हैं।","PCB इलेक्ट्रॉनिक घटकों को प्रवाहकीय ट्रैक का उपयोग करके होल्ड करते हैं और कनेक्ट करते हैं।","जटिल डिवाइस अधिक सर्किटरी फिट करने के लिए मल्टीलेयर PCB का उपयोग कर सकते हैं।"],"answer":"PCB केवल डेस्कटॉप कंप्यूटर को सर्विस देते हैं, पोर्टेबल डिवाइस की नहीं।","memoryTrick":"लैपटॉप 💻 हो या मोबाइल 📱, 'पीसीबी' हर पोर्टेबल डिवाइस में छिपकर अपनी पक्की सर्विस देता है! 🤩💡","explanation":{"keyPoints":["कथन (A) गलत है क्योंकि PCB का उपयोग डेस्कटॉप कंप्यूटर के साथ-साथ लैपटॉप, स्मार्टफोन, टैबलेट और स्मार्टवॉच जैसे सभी पोर्टेबल उपकरणों में भी अनिवार्य रूप से होता है।","PCB इलेक्ट्रॉनिक कंपोनेंट्स को भौतिक सहारा (Mechanical Support) प्रदान करता है और तांबे के ट्रैक्स के जरिए सर्किट पूरा करता है।","आधुनिक और जटिल उपकरणों में स्थान बचाने के लिए मल्टीलेयर PCB (Multilayer PCB) का व्यापक उपयोग किया जाता है।"]}},{"id":"103","date":"RRB NTPC UG • Aug 2025","shiftInfo":"","rawDate":"\\[RRB NTPC CEN 06/2024 - UNDERGRADUATE EXAM | Exam Date: 07 Aug 2025 to 09 Sep 2025\\]","examTag":"EXAM FOCUS","category":"motherboard","question":"ऑपरेटिंग सिस्टम में संक्षिप्त रूप 'पीसीबी' (PCB) का क्या अर्थ है?","options":["Process Communication Block (प्रोसेस कम्यूनिकेशन ब्लॉक)","Program Control Block (प्रोग्राम कंट्रोल ब्लॉक)","ऑपरेटिंग सिस्टम में संक्षिप्त रूप 'पीसीबी' (PCB) का क्या अर्थ है?  \n1\\. Process Communication Block (प्रोसेस कम्यूनिकेशन ब्लॉक)  \n2\\. Program Control Block (प्रोग्राम कंट्रोल ब्लॉक)  \n3\\. Primary Communication Bus (प्राइमरी कम्यूनिकेशन बस)","Process Control Block (प्रोसेस कंट्रोल ब्लॉक)"],"answer":"Process Control Block (प्रोसेस कंट्रोल ब्लॉक)","memoryTrick":"ऑपरेटिंग सिस्टम 💻 में हर प्रोसेस को अनुशासित रखने वाला मास्टर कार्ड 'प्रोसेस कंट्रोल ब्लॉक' 🗂️ है! 🧠🔥","explanation":{"keyPoints":["ऑपरेटिंग सिस्टम (OS) के संदर्भ में PCB का पूर्ण रूप 'Process Control Block' (प्रोसेस कंट्रोल ब्लॉक) होता है।","इसे 'टास्क कंट्रोल ब्लॉक' भी कहा जाता है, जो ऑपरेटिंग सिस्टम द्वारा किसी विशिष्ट प्रक्रिया (Process) की स्थिति, प्रोसेस आईडी (PID), प्रोग्राम काउंटर और रजिस्टर्स से जुड़ी सभी जानकारियों को संग्रहीत करने वाला डेटा स्ट्रक्चर है।","नोट: हार्डवेयर में PCB का अर्थ 'Printed Circuit Board' होता है, जबकि ऑपरेटिंग सिस्टम में इसका अर्थ 'Process Control Block' है।"]}},{"id":"104","date":"RRB NTPC Stage-1 • Apr 2016","shiftInfo":"🔁 Variant 5","rawDate":"\\[RRB NTPC 07.04.2016 (Shift-II) Stage Ist\\] • \\[🔁 Variant 5 of Q96\\]","examTag":"EXAM FOCUS","category":"motherboard","question":"PCB का पूरा नाम क्या है?","options":["Primary Care Biotechnology","Punjab Commercial Bank","Printed Circuit Board","Public Carrier Bureau"],"answer":"Printed Circuit Board","memoryTrick":"कंप्यूटर की प्लेट 🖥️ पर तारों के छपे जाल को सीधे 'प्रिंटेड सर्किट बोर्ड' 🟩 कहते हैं! 🤩💡","explanation":{"keyPoints":["कंप्यूटर और इलेक्ट्रॉनिक हार्डवेयर में PCB का पूरा नाम 'Printed Circuit Board' (प्रिंटेड सर्किट बोर्ड) है।","यह एक गैर-चालक (Insulating) बोर्ड होता है जिस पर तांबे की प्रवाहकीय लाइनों द्वारा विभिन्न घटकों को जोड़कर विद्युत परिपथ तैयार किया जाता है।"]}},{"id":"105","date":"RRB NTPC UG • May-Jun 2026","shiftInfo":"","rawDate":"\\[RRB NTPC (UG) CEN 07/2025 | Exam Date: 7th May - 20th June 2026\\]","examTag":"EXAM FOCUS","category":"buses","question":"कौन-सी युक्ति, प्रोसेसिंग, मेमोरी और इनपुट/आउटपुट घटकों को एक संहित एकक में एकीकृत करने के लिए अभिकल्पित की गई है?","options":["माइक्रोकंट्रोलर","सिस्टम बस","माइक्रो बोर्ड","मदरबोर्ड"],"answer":"माइक्रोकंट्रोलर","memoryTrick":"प्रोसेसिंग, मेमोरी 💾 और आई-ओ यूनिट्स को एक ही चिप 🎛️ पर बैठाकर 'माइक्रोकंट्रोलर' 🤖 बना दिया! 🧠🔥","explanation":{"keyPoints":["माइक्रोकंट्रोलर (Microcontroller) एक एकल चिप आधारित एकीकृत सर्किट (IC) है, जिसमें प्रोसेसर कोर (CPU), मेमोरी (RAM/ROM) और इनपुट/आउटपुट (I/O) पोर्ट्स सभी एक ही चिप में समाहित होते हैं।","इसे 'कंप्यूटर-ऑन-ए-चिप' भी कहा जाता है, जिसका उपयोग एम्बेडेड सिस्टम्स (जैसे वॉशिंग मशीन, माइक्रोवेव ओवन, ऑटोमोबाइल इंजन कंट्रोल) में समर्पित कार्यों के लिए किया जाता है।","माइक्रोप्रोसेसर में केवल CPU होता है (मेमोरी और I/O बाहर से जोड़ने पड़ते हैं), जबकि माइक्रोकंट्रोलर में सब कुछ एक ही चिप पर अंतर्निर्मित होता है।"]}},{"id":"106","date":"RRB NTPC GL • Mar 2026","shiftInfo":"","rawDate":"\\[RRB NTPC (Graduate) CEN 06/2025 | Exam Date: 16 to 27 March 2026\\]","examTag":"EXAM FOCUS","category":"microprocessor","question":"विश्व के पहले कमर्शियल माइक्रोप्रोसेसर, इंटेल 4004 को निम्नलिखित में से किस वर्ष लॉन्च किया गया था?","options":["1985","1960","1945","1971"],"answer":"1971","memoryTrick":"इंटेल 4004 💻 चिप ने बाजार में कदम रखकर वर्ष '1971' 📅 में कंप्यूटिंग की क्रांति ला दी! 🤩💡","explanation":{"keyPoints":["विश्व का पहला व्यावसायिक माइक्रोप्रोसेसर 'इंटेल 4004' (Intel 4004\\) था, जिसे 15 नवंबर, 1971 को इंटेल कॉर्पोरेशन द्वारा लॉन्च किया गया था।","इसे टेड हॉफ (Ted Hoff), फेडेरिको फैगिन (Federico Faggin) और स्टैन माजोर द्वारा डिज़ाइन किया गया था।","यह एक 4-बिट (4-bit) माइक्रोप्रोसेसर था, जिसने आधुनिक पर्सनल कंप्यूटर की नींव रखी।"]}},{"id":"107","date":"RRB NTPC GL • Jun 2025","shiftInfo":"","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\]","examTag":"EXAM FOCUS","category":"microprocessor","question":"मल्टी-कोर प्रोसेसर वाले कंप्यूटर सिस्टम पर विचार करें। एक साथ कई स्वतंत्र कार्य निष्पादित करते समय समान क्लॉक स्पीड वाले सिंगल-कोर प्रोसेसर की तुलना में मल्टीपल कोर होने का प्राथमिक लाभ क्या है?","options":["सम्पूर्ण प्रणाली के लिए कम बिजली खपत","एक साथ कई अलग-अलग प्रोसेस को हैंडल और निष्पादित करने की बेहतर क्षमता","सिस्टम की मुख्य मेमोरी (RAM) की क्षमता में वृद्धि","एकल, हेविली थ्रेडेड एप्लिकेशन को निष्पादित करने के लिए उन्नत गति"],"answer":"एक साथ कई अलग-अलग प्रोसेस को हैंडल और निष्पादित करने की बेहतर क्षमता","memoryTrick":"मल्टीपल कोर 🧠 होने से कंप्यूटर बिना रुके एक साथ 'कई प्रोसेस को निष्पादित' 🤹 कर लेता है! 🧠🔥","explanation":{"keyPoints":["मल्टी-कोर प्रोसेसर (Dual-core, Quad-core, Octa-core आदि) में एक ही चिप पर कई स्वतंत्र प्रोसेसिंग कोर होती हैं।","इसका मुख्य लाभ पैरेलल प्रोसेसिंग (समानांतर प्रसंस्करण) है, जिससे कंप्यूटर एक ही समय में कई स्वतंत्र कार्यों और प्रक्रियाओं को बिना अटके या धीमे हुए एक साथ संभाल सकता है।","सिंगल-कोर प्रोसेसर में केवल टाइम-शेयरिंग होती है, जबकि मल्टी-कोर में वास्तविक समानांतर निष्पादन संभव होता है।"]}},{"id":"108","date":"RRB NTPC Stage-1 • Jan 2021","shiftInfo":"⚡ Shift-I","rawDate":"\\[RRB NTPC 11.01.2021 (Shift-I) Stage Ist\\]","examTag":"EXAM FOCUS","category":"microprocessor","question":"निम्नलिखित में से कौन-सा एकल चिप आधारित उपकरण है जो अपने आप में एक पूर्ण प्रोसेसर है और CPU के द्वारा अंकगणित और तार्किक संचालन करने में सक्षम है?","options":["माइक्रोप्रोसेसर","मल्टी-प्रोसेसिंग","मोडेम","ऑपरेटिंग सिस्टम"],"answer":"माइक्रोप्रोसेसर","memoryTrick":"एक अकेली छोटी सिलिकॉन चिप 🎛️ जो पूरा सीपीयू संभाल ले, वही तो 'माइक्रोप्रोसेसर' 🧠 है! 🤩💡","explanation":{"keyPoints":["माइक्रोप्रोसेसर (Microprocessor) एक एकल सिलिकॉन सेमीकंडक्टर चिप पर निर्मित संपूर्ण CPU है।","यह मदरबोर्ड के मध्य में लगा होता है और अंकगणितीय व तार्किक संक्रियाओं को हल करने के साथ-साथ सभी हार्डवेयर व सॉफ्टवेयर के बीच समन्वय स्थापित करता है।","पर्सनल कंप्यूटर, लैपटॉप, स्मार्टफोन आदि में CPU के रूप में माइक्रोप्रोसेसर का ही उपयोग होता है।"]}},{"id":"109","date":"RRB NTPC Stage-1 • Jan 2021","shiftInfo":"📌 2 Shifts Repeat","rawDate":"\\[RRB NTPC 30.01.2021 (Shift-I) Stage Ist\\] • \\[📌 Base Question | Total 2 Shifts Repeat\\]","examTag":"EXAM FOCUS","category":"microprocessor","question":"एक एकीकृत परिपथ (Integrated Circuit) सामान्यतः जाना जाता है?","options":["चिप","प्रतिरोधक","ट्रांजिस्टर","प्लेट"],"answer":"चिप","memoryTrick":"विज्ञान की भाषा का एकीकृत परिपथ 🔌 असल में बाजार में छोटी 'चिप' 🎛️ नाम से मशहूर है! 🧠🔥","explanation":{"keyPoints":["एकीकृत परिपथ (Integrated Circuit \\- IC) को सामान्यतः 'चिप' (Chip) या 'माइक्रोचिप' के नाम से जाना जाता है।","यह सिलिकॉन अर्धचालक पदार्थ पर बना एक अत्यंत छोटा इलेक्ट्रॉनिक सर्किट होता है, जिसमें बड़ी संख्या में ट्रांजिस्टर, डायोड और रेसिस्टर एकीकृत होते हैं।","IC का आविष्कार 1958 में जैक किल्बी (Jack Kilby) और रॉबर्ट नॉयस द्वारा किया गया था।"]}},{"id":"110","date":"RRB NTPC Stage-1 • Jan 2021","shiftInfo":"📌 3 Shifts Repeat","rawDate":"\\[RRB NTPC 25.01.2021 (Shift-II) Stage Ist\\] • \\[📌 Base Question | Total 3 Shifts Repeat\\]","examTag":"EXAM FOCUS","category":"microprocessor","question":"माइक्रोचिप (Microchips) बनाने के लिए किस धातु का उपयोग किया जाता है?","options":["सिलिकॉन","ड्युरालुमिन","इस्पात","टंगस्टन"],"answer":"सिलिकॉन","memoryTrick":"कंप्यूटर की सुपरफास्ट माइक्रोचिप 🎛️ तैयार करने के लिए जादुई उपधातु 'सिलिकॉन' 🧪 का इस्तेमाल होता है! 🤩💡","explanation":{"keyPoints":["माइक्रोचिप और IC बनाने के लिए 'सिलिकॉन' (Silicon \\- Si) का उपयोग किया जाता है।","सिलिकॉन एक अर्धचालक (Semiconductor) और टेट्रावैलेंट (चार संयोजकता वाली) उपधातु है, जो इलेक्ट्रॉनिक संकेतों को नियंत्रित करने के लिए आदर्श मानी जाती है।","उच्च तकनीक वाले कंप्यूटर हार्डवेयर उद्योग के केंद्र को इसी कारण 'सिलिकॉन वैली' कहा जाता है।"]}},{"id":"111","date":"RRB NTPC Stage-1 • Mar 2016","shiftInfo":"🔁 Variant 2","rawDate":"\\[RRB NTPC 28.03.2016 (Shift-II) Stage Ist\\] • \\[🔁 Variant 2 of Q109\\]","examTag":"EXAM FOCUS","category":"microprocessor","question":"कंप्यूटर चिप (Computer Chip) का दूसरा नाम............ है–","options":["माइक्रोचिप","मदरबोर्ड","सीपीयू","माइक्रोप्रोसेसर"],"answer":"माइक्रोचिप","memoryTrick":"कंप्यूटर की जादुई चिप 🎛️ को प्यार से सभी छात्र छोटी 'माइक्रोचिप' 🔬 कहकर बुलाते हैं! 🤩💡","explanation":{"keyPoints":["कंप्यूटर चिप (Computer Chip) को सामान्यतः 'माइक्रोचिप' (Microchip) या केवल 'चिप' कहा जाता है।","यह अर्धचालक पदार्थ (मुख्यतः सिलिकॉन) से बनी एक छोटी इलेक्ट्रॉनिक सर्किट प्लेट होती है, जिस पर लाखों ट्रांजिस्टर और इलेक्ट्रॉनिक घटक बने होते हैं।"]}},{"id":"112","date":"RRB NTPC Stage-1 • Apr 2016","shiftInfo":"🔁 Variant 2","rawDate":"\\[RRB NTPC Stage I 30.04.2016 (Shift-I)\\] • \\[🔁 Variant 2 of Q110\\]","examTag":"EXAM FOCUS","category":"microprocessor","question":"कंप्यूटर में इस्तेमाल होने वाली इंटीग्रेटेड सर्किट (IC) चिप बनाने में निम्नलिखित में से किस रासायनिक तत्व, एक टेट्रावैलेंट उपधातु का इस्तेमाल किया जाता है?","options":["सोना","चांदी","सिलिकॉन","कॉपर"],"answer":"सिलिकॉन","memoryTrick":"लैब में आईसी 🔌 चिप बनाते समय मास्टरजी ने छात्रों को उपधातु 'सिलिकॉन' 🧪 का टुकड़ा दिया! 🧠🔥","explanation":{"keyPoints":["कंप्यूटर की इंटीग्रेटेड सर्किट (IC) चिप बनाने के लिए 'सिलिकॉन' (Silicon) का उपयोग किया जाता है।","सिलिकॉन एक टेट्रावैलेंट (चार संयोजकता वाला) रासायनिक तत्व और उपधातु (अर्धचालक/Semiconductor) है।","यह कमरे के तापमान पर स्थिर रहता है और इलेक्ट्रॉनिक सिग्नलों को कुशलतापूर्वक नियंत्रित करता है।"]}},{"id":"113","date":"RRB NTPC Stage-1 • Apr 2016","shiftInfo":"🔁 Variant 3","rawDate":"\\[RRB NTPC 19.04.2016 (Shift-III) Stage Ist\\] • \\[🔁 Variant 3 of Q110\\]","examTag":"EXAM FOCUS","category":"microprocessor","question":"........माइक्रोचिप्स बनाने के लिए प्रयोग किया जाता है।","options":["ग्रेफाइट","पॉलीविनाइल","सिलिकॉन","बैकेलाइट"],"answer":"सिलिकॉन","memoryTrick":"माइक्रोचिप 🎛️ बनाने के लिए वैज्ञानिकों ने रेत से चमचमाता हुआ शुद्ध 'सिलिकॉन' 🧪 निकाला! 🤩💡","explanation":{"keyPoints":["माइक्रोचिप्स (Microchips) और आईसी चिप्स के निर्माण में मुख्य रूप से 'सिलिकॉन' (Silicon) का उपयोग किया जाता है।","सिलिकॉन की प्रचुर उपलब्धता और उत्कृष्ट अर्धचालक गुणों के कारण इसका व्यापक उपयोग कंप्यूटर व माइक्रोइलेक्ट्रॉनिक्स उद्योग में होता है।"]}},{"id":"114","date":"RRB NTPC UG • Aug 2025","shiftInfo":"","rawDate":"\\[RRB NTPC CEN 06/2024 - UNDERGRADUATE EXAM | Exam Date: 07 Aug 2025 to 09 Sep 2025\\]","examTag":"EXAM FOCUS","category":"basic_functions","question":"कंप्यूटर सिस्टम के मुख्य रूप से तीन घटक कौन-से हैं?","options":["इनपुट, प्रोसेसिंग, आउटपुट","माउस, CPU, मोबाइल","CPU, स्कैनर, एयर कंडीशनर","कंप्यूटर सिस्टम के मुख्य रूप से तीन घटक कौन-से हैं?  \n1\\. इनपुट, प्रोसेसिंग, आउटपुट  \n2\\. माउस, CPU, मोबाइल  \n3\\. CPU, स्कैनर, एयर कंडीशनर  \n4\\. मॉनीटर, USB, लाइट"],"answer":"इनपुट, प्रोसेसिंग, आउटपुट","memoryTrick":"कंप्यूटर पढ़ाई का नियम है पहले 'इनपुट' 📥 लो, फिर 'प्रोसेसिंग' ⚙️ करो और रिजल्ट 'आउटपुट' 📤 दो! 🧠🔥","explanation":{"keyPoints":["कंप्यूटर का संपूर्ण कार्य चक्र IPO (Input-Process-Output) चक्र पर आधारित है:  \n  1\\. इनपुट (Input): उपयोगकर्ता से डेटा व निर्देश ग्रहण करना।  \n  2\\. प्रोसेसिंग (Processing): CPU द्वारा डेटा पर संक्रियाएं करना।  \n  3\\. आउटपुट (Output): प्रोसेस्ड डेटा को उपयोगी सूचना के रूप में प्रस्तुत करना।"]}},{"id":"115","date":"RRB NTPC UG • Aug 2025","shiftInfo":"","rawDate":"\\[RRB NTPC CEN 06/2024 - UNDERGRADUATE EXAM | Exam Date: 07 Aug 2025 to 09 Sep 2025\\]","examTag":"EXAM FOCUS","category":"basic_functions","question":"FIFO शेड्यूलिंग में, कौन-सा प्रोसेस पहले निष्पादित होता है?","options":["अंत में आने वाला प्रोसेस","सबसे पहले आने वाला प्रोसेस","सबसे कम निष्
