ट्रॉनिक बाइनरी कोड फॉर डेटा इंटरचेंज कम्यूनिकेशन)","Extended Binary Code for Digital Information Communication (एक्सटेंडेड बाइनरी कोड फॉर डिजिटल इंफॉर्मेशन कम्यूनिकेशन)"],"answer":"Extended Binary Coded Decimal Interchange Code (एक्सटेंडेड बाइनरी कोडेड डेसिमल इंटरचेंज कोड)","memoryTrick":"मेनफ्रेम कंप्यूटर 🖥️ की भारी कोडिंग का असली विस्तार 'Extended Binary Coded Decimal Interchange Code' 🗃️ कहलाता है! 🧠🔥","explanation":{"keyPoints":["EBCDIC का पूर्ण रूप 'Extended Binary Coded Decimal Interchange Code' (एक्सटेंडेड बाइनरी कोडेड डेसिमल इंटरचेंज कोड) है।","यह IBM द्वारा विकसित एक 8-बिट कैरेक्टर एन्कोडिंग प्रणाली है, जिसका उपयोग मुख्य रूप से IBM मेनफ्रेम और मिड-रेंज कंप्यूटर प्रणालियों में किया जाता है।","इसमें कुल 256 अलग-अलग वर्णों (characters) को निरूपित किया जा सकता है।"]}},{"id":"121","date":"RRB NTPC GL • Jun 2025","shiftInfo":"🔁 Variant 4","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\] • \\[🔁 Variant 4 of Q117\\]","examTag":"EXAM FOCUS","category":"basic_functions","question":"कंप्यूटिंग के संदर्भ में ASCII का पूर्ण रूप क्या है?","options":["Algorithmic Standard Code for International Information","American Standard Code for Information Integrity","American Systematic Code for International Interoperability","American Standard Code for Information Interchange (अमेरिकन स्टैंडर्ड कोड फॉर इंफॉर्मेशन इंटरचेंज)"],"answer":"American Standard Code for Information Interchange (अमेरिकन स्टैंडर्ड कोड फॉर इंफॉर्मेशन इंटरचेंज)","memoryTrick":"परीक्षा में हर अक्षर 🔤 को कोड में बदलने हेतु 'American Standard Code for Information Interchange' 📜 बना! 🤩💡","explanation":{"keyPoints":["ASCII का पूर्ण रूप 'American Standard Code for Information Interchange' है।","यह कंप्यूटर उद्योग में टेक्स्ट वर्णों को बाइनरी कोड में प्रदर्शित करने के लिए उपयोग किया जाने वाला सबसे लोकप्रिय मानक कोड है।","इसे अमेरिकन नेशनल स्टैंडर्ड्स इंस्टीट्यूट (ANSI) द्वारा 1963 में मानकीकृत किया गया था।"]}},{"id":"122","date":"RRB NTPC GL • Jun 2025","shiftInfo":"","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\]","examTag":"EXAM FOCUS","category":"basic_functions","question":"अमेरिकन स्टैंडर्ड कोड फॉर इंफॉर्मेशन इंटरचेंज (ASCII) का प्राथमिक उद्देश्य क्या है?","options":["ऑपरेटिंग सिस्टम के लिए ग्राफिकल यूजर इंटरफेस डिजाइन करना","टेक्स्ट-बेस्ड एप्लिकेशन के लिए प्रोग्रामिंग लैंग्वेज बनाना","टेक्स्ट और कंट्रोल कैरेक्टर को प्रदर्शित करने के लिए कोड का एक मानकीकृत सेट परिभाषित करना","इंटरनेट ट्रांसमिशन के लिए डेटा का सुरक्षित एन्क्रिप्शन सक्षम करना"],"answer":"टेक्स्ट और कंट्रोल कैरेक्टर को प्रदर्शित करने के लिए कोड का एक मानकीकृत सेट परिभाषित करना","memoryTrick":"कंप्यूटर में टाइप किए 'टेक्स्ट और कैरेक्टर' 🔤 को सही कोड में प्रदर्शित करना ही आस्की का काम है! 🧠🔥","explanation":{"keyPoints":["ASCII का प्राथमिक उद्देश्य विभिन्न कंप्यूटरों, टर्मिनलों और नेटवर्कों के बीच टेक्स्ट तथा नियंत्रण संकेतों (Control Characters) के आदान-प्रदान को मानकीकृत करना है।","इसके माध्यम से प्रत्येक अक्षर, अंक और विशेष प्रतीक को एक अद्वितीय संख्यात्मक बाइनरी कोड दिया जाता है ताकि सभी सिस्टम उसे समान रूप से समझ सकें।"]}},{"id":"123","date":"RRB NTPC GL • Jun 2025","shiftInfo":"📌 2 Shifts Repeat","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\] • \\[📌 Base Question | Total 2 Shifts Repeat\\]","examTag":"EXAM FOCUS","category":"basic_functions","question":"निम्नलिखित में से कौन-सा कथन सही है?","options":["LAN बड़े भौगोलिक क्षेत्रों में नेटवर्किंग को सपोर्ट करता है।","CD एक वोलेटाइल स्टोरेज मीडियम है।","ASCII का उपयोग मुख्यतः हाई-स्पीड डेटा ट्रांसमिशन नेटवर्क के लिए किया जाता है।","ASCII संख्यात्मक कोड के रूप में कैरेक्टरों को निरूपित करता है।"],"answer":"ASCII संख्यात्मक कोड के रूप में कैरेक्टरों को निरूपित करता है।","memoryTrick":"कंप्यूटर कीबोर्ड के हर अक्षर ⌨️ को बाइनरी भाषा में 'संख्यात्मक कोड' 🔢 बनाकर ही आस्की आगे भेजता है! 🤩💡","explanation":{"keyPoints":["ASCII प्रत्येक वर्ण (अक्षर, अंक या प्रतीक) को एक विशिष्ट संख्यात्मक मान (न्यूमेरिक कोड) के रूप में निरूपित करता है (जैसे 'A' \\= 65, 'a' \\= 97)।","LAN (Local Area Network) छोटे और सीमित भौगोलिक क्षेत्र (जैसे कार्यालय, भवन) के लिए होता है, बड़े क्षेत्रों के लिए WAN का उपयोग होता है।","CD (Compact Disc) एक नॉन-वोलेटाइल (स्थायी) ऑप्टिकल स्टोरेज माध्यम है।"]}},{"id":"124","date":"RRB NTPC GL • Jun 2025","shiftInfo":"🔁 Variant 2","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\] • \\[🔁 Variant 2 of Q123\\]","examTag":"EXAM FOCUS","category":"basic_functions","question":"कंप्यूटर शब्दावली में ASCII, LAN और CD के संबंध में निम्नलिखित में से कौन-सा कथन सत्य है?","options":["ASCII का उपयोग LAN नेटवर्क में डिस्क को फ़ॉर्मेट करने के लिए किया जाता है।","CD रीराइटेबल (rewritable) मैग्नेटिक स्टोरेज का माध्यम है।","ASCII बाइनरी में न्यूमेरिक कोड का उपयोग करके कैरेक्टरों (characters) को निरूपित करता है।","LAN इंटरनेट जैसे व्यापक भौगोलिक नेटवर्क को संदर्भित करता है।"],"answer":"ASCII बाइनरी में न्यूमेरिक कोड का उपयोग करके कैरेक्टरों (characters) को निरूपित करता है।","memoryTrick":"आस्की कोडिंग में सभी अक्षरों 🔤 को आसानी से पहचानने हेतु 'न्यूमेरिक कोड' 🔢 का प्रयोग होता है! 🧠🔥","explanation":{"keyPoints":["ASCII कोडिंग प्रणाली में कंप्यूटर के प्रत्येक वर्ण को बाइनरी (0 और 1\\) संख्यात्मक कोड में रूपांतरित किया जाता है।","LAN एक स्थानीय क्षेत्र नेटवर्क है, जबकि इंटरनेट एक व्यापक नेटवर्क (WAN) है।","CD एक ऑप्टिकल स्टोरेज डिस्क है, न कि मैग्नेटिक स्टोरेज।"]}},{"id":"125","date":"RRB NTPC GL • Jun 2025","shiftInfo":"","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\]","examTag":"EXAM FOCUS","category":"basic_functions","question":"मानक ASCII कोड का उपयोग करके कितने अद्वितीय वर्णों (unique characters) को दर्शाया जा सकता है?","options":["64","128","256","512"],"answer":"128","memoryTrick":"मानक आस्की कोड की परीक्षा 📝 में पूरे सात बिट्स मिलकर कुल '128' 🔢 अद्वितीय वर्ण दर्शाते हैं! 😱💥","explanation":{"keyPoints":["मानक ASCII (Standard ASCII) एक 7-बिट (7-bit) कोडिंग प्रणाली है।","7-बिट होने के कारण इसमें कुल 2⁷ \\= 128 अद्वितीय वर्णों (0 से 127 तक के मान) को दर्शाया जा सकता है।","इनमें 0 से 31 तक नियंत्रण वर्ण (Control characters) और 32 से 126 तक मुद्रण योग्य वर्ण (Printable characters) शामिल होते हैं।","विस्तारित ASCII (Extended ASCII) 8-बिट का होता है, जो 2⁸ \\= 256 वर्णों को दर्शाता है।"]}},{"id":"126","date":"RRB NTPC GL • Jun 2025","shiftInfo":"","rawDate":"\\[RRB NTPC Graduate Level Exam June 2025\\]","examTag":"EXAM FOCUS","category":"basic_functions","question":"निम्नलिखित में से कौन-सी संख्या, अपरकेस अक्षर 'B' के ASCII मान को निरूपित करने के लिए उपयोग की जाती है?","options":["97","90","66","65"],"answer":"66","memoryTrick":"अंग्रेजी का ए 65 पर बैठा तो बड़े अक्षर 'B' 🅱️ ने परीक्षा में पूरे '66' 🎯 नंबर पाए! 🤩💡","explanation":{"keyPoints":["मानक ASCII तालिका में अंग्रेजी के बड़े (Uppercase) अक्षरों 'A' से 'Z' के कोड 65 से 90 तक होते हैं:  \n  \\- 'A' \\= 65  \n  \\- 'B' \\= 66  \n  \\- 'C' \\= 67 ... 'Z' \\= 90","छोटे (Lowercase) अक्षरों 'a' से 'z' के कोड 97 से 122 तक होते हैं (जैसे 'a' \\= 97, 'b' \\= 98)।","अंकों 0 से 9 के ASCII मान 48 से 57 तक होते हैं।"]}},{"id":"127","date":"RRB NTPC Stage-1 • Jan 2021","shiftInfo":"⚡ Shift-I","rawDate":"\\[RRB NTPC 18.01.2021 (Shift-I) Stage Ist\\]","examTag":"EXAM FOCUS","category":"basic_functions","question":"कंप्यूटर के बारे में निम्नलिखित में से कौन-सा कथन सही है?","options":["कंप्यूटर केवल सॉफ्टवेयर से बना होता है।","कंप्यूटर स्वयं सारी जानकारी व्यवस्थित कर सकता है।","कंप्यूटर केवल हार्डवेयर से बना होता है।","यह एक इलेक्ट्रॉनिक उपकरण है जो डेटा को संगृहीत, पुनः प्राप्त और संसाधित करता है।"],"answer":"यह एक इलेक्ट्रॉनिक उपकरण है जो डेटा को संगृहीत, पुनः प्राप्त और संसाधित करता है।","memoryTrick":"कंप्यूटर ऐसा 'इलेक्ट्रॉनिक उपकरण' ⚡ है जो डेटा को सुरक्षित संगृहीत 💾 और तेजी से संसाधित करता है! 🧠🔥","explanation":{"keyPoints":["कंप्यूटर एक स्वचालित इलेक्ट्रॉनिक मशीन है जो यूजर से इनपुट के रूप में कच्चा डेटा ग्रहण करती है, उसे निर्देशों के अनुसार प्रोसेस करती है, स्टोर करती है और अर्थपूर्ण परिणाम आउटपुट के रूप में देती है।","कंप्यूटर हार्डवेयर और सॉफ्टवेयर दोनों के समन्वय से कार्य करता है; यह केवल किसी एक से संचालित नहीं हो सकता।"]}},{"id":"128","date":"RRB NTPC Stage-2 • Jun 2022","shiftInfo":"⚡ Shift-I","rawDate":"\\[RRB NTPC (Stage-2) 14/06/2022 (Shift-I)\\]","examTag":"EXAM FOCUS","category":"classification","question":"हाल ही में राष्ट्रीय सुपरकंप्यूटिंग मिशन के अंतर्गत स्थापित (commissioned) सुपर कंप्यूटर परम प्रवेग की क्षमता कितनी है?","options":["4.3 पेट्राफ्लॉप्स","1.3 पेट्राफ्लॉप्स","2.3 पेट्राफ्लॉप्स","3.3 पेट्राफ्लॉप्स"],"answer":"3.3 पेट्राफ्लॉप्स","memoryTrick":"सुपर कंप्यूटर 'परम प्रवेग' 🚀 ने अपनी तूफानी गति दिखाकर पूरे '3.3 पेट्राफ्लॉप्स' ⚡ की क्षमता हासिल की! 😱💥","explanation":{"keyPoints":["राष्ट्रीय सुपरकंप्यूटिंग मिशन (NSM) के तहत सुपरकंप्यूटर 'परम प्रवेग' (Param Pravega) को भारतीय विज्ञान संस्थान (IISc), बेंगलुरु में स्थापित किया गया है।","इसकी कुल कंप्यूटिंग क्षमता 3.3 पेटाफ्लॉप्स (PetaFLOPS) है।","इसे सेंटर फॉर डेवलपमेंट ऑफ एडवांस्ड कंप्यूटिंग (C-DAC) द्वारा स्वदेशी रूप से डिजाइन और विकसित किया गया है।"]}},{"id":"129","date":"RRB NTPC Stage-1 • Mar 2021","shiftInfo":"⚡ Shift-II","rawDate":"\\[RRB NTPC 13.03.2021 (Shift-II) Stage Ist\\]","examTag":"EXAM FOCUS","category":"classification","question":"डेस्कटॉप कंप्यूटर, लैपटॉप, टैबलेट और स्मार्टफोन इनमें से किसके विभिन्न प्रकार हैं?","options":["माइक्रो कंप्यूटर","सुपर कंप्यूटर","मिनी कंप्यूटर","मेनफ्रेम कंप्यूटर"],"answer":"माइक्रो कंप्यूटर","memoryTrick":"लैपटॉप, टैबलेट और मोबाइल 📱 सब छात्रों के बस्ते में समाने वाले छोटे 'माइक्रो कंप्यूटर' 💻 के रूप हैं! 🤩💡","explanation":{"keyPoints":["डेस्कटॉप, लैपटॉप, टैबलेट और स्मार्टफोन आदि सभी 'माइक्रो कंप्यूटर' (Microcomputer) के विभिन्न प्रकार हैं।","माइक्रो कंप्यूटर में केंद्रीय प्रसंस्करण इकाई (CPU) के रूप में एक सिंगल-चिप 'माइक्रोप्रोसेसर' का उपयोग किया जाता है।","यह आकार में छोटे, किफायती और व्यक्तिगत उपयोग (Personal Computer) के लिए उपयुक्त होते हैं।"]}},{"id":"130","date":"RRB NTPC Stage-1 • Feb 2021","shiftInfo":"⚡ Shift-II","rawDate":"\\[RRB NTPC 09.02.2021 (Shift-II) Stage Ist\\]","examTag":"EXAM FOCUS","category":"classification","question":"निम्न में से कौन-सा एक प्रकार का पर्सनल कंप्यूटर नहीं है?","options":["डेस्कटॉप कंप्यूटर","मेनफ्रेम कंप्यूटर","पामटॉप कंप्यूटर","लैपटॉप"],"answer":"मेनफ्रेम कंप्यूटर","memoryTrick":"घर की छोटी टेबल 🛋️ पर कभी पर्सनल कंप्यूटर जैसा बड़ा 'मेनफ्रेम कंप्यूटर' 🏢 फिट नहीं हो सकता! 🧠🔥","explanation":{"keyPoints":["डेस्कटॉप, लैपटॉप, पामटॉप और टैबलेट व्यक्तिगत उपयोग के लिए 'पर्सनल कंप्यूटर' (PC / माइक्रो कंप्यूटर) की श्रेणी में आते हैं।","'मेनफ्रेम कंप्यूटर' (Mainframe Computer) पर्सनल कंप्यूटर नहीं है; यह एक उच्च क्षमता वाला केंद्रीय कंप्यूटर होता है जिसका उपयोग बड़े संस्थानों, बैंकों, बीमा कंपनियों और सरकारी विभागों में भारी डेटा प्रोसेसिंग के लिए किया जाता है।"]}},{"id":"131","date":"RRB NTPC Stage-1 • Mar 2021","shiftInfo":"🔁 Variant 2","rawDate":"\\[RRB NTPC 21.03.2021 (Shift-II) Stage Ist\\] • \\[🔁 Variant 2 of Q51\\]","examTag":"EXAM FOCUS","category":"classification","question":"मैक (Mac) एक प्रकार का पर्सनल कंप्यूटर है, जिसे बनाया गया है?","options":["एप्पल","डेल","एसर","एचपी"],"answer":"एप्पल","memoryTrick":"टॉपर छात्र ने महंगे 'मैक' 💻 कंप्यूटर पर पढ़ाई करने के लिए केवल 'एप्पल' 🍎 कंपनी चुनी! 🤩💡","explanation":{"keyPoints":["मैकिंटोश (Macintosh / Mac) पर्सनल कंप्यूटर की एक प्रसिद्ध श्रृंखला है जिसे एप्पल (Apple Inc.) द्वारा विकसित किया गया है।","इसे पहली बार 24 जनवरी, 1984 को लॉन्च किया गया था।","यह GUI (Graphical User Interface) और माउस के साथ व्यावसायिक रूप से सफल होने वाला पहला पर्सनल कंप्यूटर था।"]}},{"id":"132","date":"RRB NTPC Stage-1 • Jul 2021","shiftInfo":"⚡ Shift-I","rawDate":"\\[RRB NTPC 24.07.2021 (Shift-I) Stage Ist\\]","examTag":"EXAM FOCUS","category":"classification","question":"परम सिद्धि का तात्पर्य है:","options":["एक परमाणु रिएक्टर","एक कृत्रिम बुद्धि सुपर कंप्यूटर","औद्योगिक भेदक","कृषि उपकरण"],"answer":"एक कृत्रिम बुद्धि सुपर कंप्यूटर","memoryTrick":"कठिन तपस्या के बाद भारत को 'परम सिद्धि' 🚀 के रूप में 'कृत्रिम बुद्धि सुपर कंप्यूटर' 🧠 मिला! 🧠🔥","explanation":{"keyPoints":["'परम सिद्धि-एआई' (PARAM Siddhi-AI) भारत का एक उच्च-प्रदर्शन आर्टिफिशियल इंटेलिजेंस (AI) सुपरकंप्यूटर है।","इसे राष्ट्रीय सुपरकंप्यूटिंग मिशन (NSM) के तहत C-DAC (पुणे) द्वारा डिजाइन और विकसित किया गया है।","इसका उपयोग डीप लर्निंग, विजुअल कंप्यूटिंग, साइबर सुरक्षा और उन्नत स्वास्थ्य अनुसंधान में किया जाता है।"]}},{"id":"133","date":"RRB NTPC Stage-1 • Mar 2021","shiftInfo":"⚡ Shift-II","rawDate":"\\[RRB NTPC 15.03.2021 (Shift-II) Stage Ist\\]","examTag":"EXAM FOCUS","category":"classification","question":"भारत के सबसे युवा एवं पहले मल्टी-पेटाफ्लॉप्स सुपर कंप्यूटर 'प्रत्युष' का प्रयोग किस उद्देश्य के लिए किया जाता है?","options":["मौसम के पूर्वानुमान","फार्मास्युटिकल विकास","भूकम्पीय आंकड़ों के विश्लेषण","वैज्ञानिक डेटा के प्रसंस्करण"],"answer":"मौसम के पूर्वानुमान","memoryTrick":"सुपर कंप्यूटर 'प्रत्युष' ☀️ सुबह उठते ही बादलों को देखकर सही 'मौसम के पूर्वानुमान' ⛈️ बताता है! 🤩💡","explanation":{"keyPoints":["सुपरकंप्यूटर 'प्रत्युष' (Pratyush) का मुख्य उद्देश्य मौसम और जलवायु के सटीक पूर्वानुमान (Weather Forecasting) प्रदान करना है।","यह भारतीय उष्णकटिबंधीय मौसम विज्ञान संस्थान (IITM), पुणे में स्थापित भारत का पहला मल्टी-पेटाफ्लॉप्स सुपरकंप्यूटर है।","इसकी गणना क्षमता लगभग 4.0 पेटाफ्लॉप्स है।"]}},{"id":"134","date":"RRB NTPC Stage-1 • Mar 2021","shiftInfo":"⚡ Shift-II","rawDate":"\\[RRB NTPC 15.03.2021 (Shift-II) Stage Ist\\]","examTag":"EXAM FOCUS","category":"classification","question":"भारत के पहले सुपर कंप्यूटर 'परम 8000' (PARAM 8000\\) का विमोचन किस वर्ष में किया गया था?","options":["2003","1991","1996","1988"],"answer":"1991","memoryTrick":"भारत ने दुनिया को चौंकाते हुए वर्ष '1991' 📅 में पहला शक्तिशाली सुपर कंप्यूटर 'परम 8000' 🚀 उतारा! 🧠🔥","explanation":{"keyPoints":["'परम 8000' (PARAM 8000\\) भारत का पहला स्वदेशी सुपरकंप्यूटर था, जिसे 1 जुलाई, 1991 को विमोचित किया गया था।","इसे C-DAC (पुणे) द्वारा डॉ. विजय पांडुरंग भटकर के नेतृत्व में विकसित किया गया था।","इसके विकास के साथ ही भारत सुपरकंप्यूटिंग क्षमता हासिल करने वाला दुनिया का दूसरा देश (अमेरिका के बाद) बना था।"]}},{"id":"135","date":"RRB NTPC Stage-1 • Mar 2021","shiftInfo":"⚡ Shift-I","rawDate":"\\[RRB NTPC 08.03.2021 (Shift-I) Stage Ist\\]","examTag":"EXAM FOCUS","category":"classification","question":"2007 में टाटा समूह द्वारा विकसित सुपर कंप्यूटर का नाम लिखिए।","options":["क्रे–3","हिटैची एस–300","एका","परम"],"answer":"एका","memoryTrick":"टाटा समूह 🏢 ने अपनी पूरी ताकत लगाकर वर्ष 2007 में नंबर वन सुपर कंप्यूटर 'एका' 🚀 बनाया! 🤩💡","explanation":{"keyPoints":["'एका' (EKA) सुपरकंप्यूटर को वर्ष 2007 में टाटा समूह की सहायक कंपनी कंप्यूटेशनल रिसर्च लेबोरेटरीज (CRL), पुणे द्वारा विकसित किया गया था।","संस्कृत में 'एका' का अर्थ 'एक' होता है।","लॉन्च के समय यह एशिया का सबसे तेज और विश्व का चौथा सबसे तेज सुपरकंप्यूटर आंका गया था।"]}},{"id":"136","date":"RRB NTPC Stage-1 • Mar 2021","shiftInfo":"⚡ Shift-I","rawDate":"\\[RRB NTPC 05.03.2021 (Shift-I) Stage Ist\\]","examTag":"EXAM FOCUS","category":"classification","question":"निम्नलिखित में से कौन-सा सुपर कंप्यूटर नहीं है?","options":["एका","पीडीए","परम","क्रे-3"],"answer":"पीडीए","memoryTrick":"परम और एका महाबली हैं, मगर जेब में रहने वाला 'पीडीए' 📱 कोई 'सुपर कंप्यूटर' 🖥️ नहीं! 😱💥","explanation":{"keyPoints":["PDA (Personal Digital Assistant) एक छोटा पोर्टेबल हैंडहेल्ड डिवाइस (माइक्रो कंप्यूटर) है, जो पर्सनल सूचना प्रबंधक के रूप में कार्य करता है; यह सुपरकंप्यूटर नहीं है।","'एका' (Tata), 'परम' (C-DAC, भारत), और 'क्रे-3' (Cray Research, USA) विश्व प्रसिद्ध सुपरकंप्यूटर हैं।"]}},{"id":"137","date":"RRB NTPC Stage-1 • Feb 2021","shiftInfo":"⚡ Shift-I","rawDate":"\\[RRB NTPC 22.02.2021 (Shift-I) Stage Ist\\]","examTag":"EXAM FOCUS","category":"classification","question":"निम्नलिखित में से किसे 'भारतीय सुपर कंप्यूटरों का जनक' माना जाता है?","options":["जयंत नार्लीकर","आर.ए मेशेलकर","नंदन नीलेकणी","विजय भटकर"],"answer":"विजय भटकर","memoryTrick":"भारत को सुपर कंप्यूटर में 'विजय' 🏆 दिलाकर असली जनक बनने वाले वैज्ञानिक डॉ. 'विजय भटकर' 👨🔬 हैं! 🧠🔥","explanation":{"keyPoints":["डॉ. विजय पांडुरंग भटकर (Vijay Bhatkar) को 'भारतीय सुपरकंप्यूटिंग का जनक' (Father of Indian Supercomputing) माना जाता है।","इन्होंने C-DAC के संस्थापक कार्यकारी निदेशक के रूप में भारत के पहले स्वदेशी सुपरकंप्यूटर 'परम 8000' (1991) और 'परम 10000' (1998) के निर e":"\\[RRB NTPC Stage I 27.04.2016 (Shift-I)\\]","examTag":"EXAM FOCUS","category":"classification","question":"मेमोरी आकार और प्रदर्शन के आधार पर, किस प्रकार के कंप्यूटर को \"बिग आयरन (Big iron)\" के रूप में जाना जाता है?","options":["माइक्रो कंप्यूटर","मिनी कंप्यूटर","मेनफ्रेम कंप्यूटर","सुपर कंप्यूटर"],"answer":"मेनफ्रेम कंप्यूटर","memoryTrick":"लोहे जैसे भारी आकार 🏋️ के कारण छात्रों ने विशाल 'मेनफ्रेम कंप्यूटर' 🏢 को 'बिग आयरन' नाम दिया! 🤩💡","explanation":{"keyPoints":["मेनफ्रेम कंप्यूटर (Mainframe Computer) को उसके विशाल भौतिक आकार, उच्च प्रोसेसिंग क्षमता और कार्यकुशलता के कारण अनौपचारिक रूप से \"बिग आयरन\" (Big Iron) कहा जाता है।","इनका उपयोग बड़े संगठनों, बैंकों, बीमा कंपनियों और सरकारी विभागों में थोक डेटा प्रोसेसिंग (Bulk Data Processing) और केंद्रीय डेटाबेस प्रबंधन के लिए किया जाता है।"]}},{"id":"144","date":"RRB NTPC Stage-1 • Apr 2016","shiftInfo":"⚡ Shift-III","rawDate":"\\[RRB NTPC 16.04.2016 (Shift-III) Stage Ist\\]","examTag":"EXAM FOCUS","category":"classification","question":"निम्नलिखित में से वर्ष 1976 में विकसित सर्वप्रथम सुपर कंप्यूटर कौन-सा है?","options":["एक्रॉन एटम","क्रे-1 (Cray-1)","पीसीडब्ल्यू","पीईटी"],"answer":"क्रे-1 (Cray-1)","memoryTrick":"साल 1976 📅 में वैज्ञानिकों ने सुपर कंप्यूटर बनाने का पहला महा-क्रेज 'क्रे-1' 🚀 से पूरा किया! 🧠🔥","explanation":{"keyPoints":["विश्व का प्रथम व्यावसायिक रूप से सफल सुपरकंप्यूटर 'क्रे-1' (Cray-1) था, जिसे वर्ष 1976 में क्रे रिसर्च कंपनी (अमेरिका) द्वारा विकसित किया गया था।","इसके मुख्य वास्तुकार सीमोर क्रे (Seymour Cray) थे, जिन्हें 'विश्व में सुपरकंप्यूटिंग का जनक' कहा जाता है।"]}},{"id":"145","date":"RRB NTPC Stage-1 • Apr 2016","shiftInfo":"⚡ Shift-III","rawDate":"\\[RRB NTPC 16.04.2016 (Shift-III) Stage Ist\\]","examTag":"EXAM FOCUS","category":"classification","question":"निम्नलिखित में से कौन-सी श्रेणी, पुणे में विकसित भारत की सर्वप्रथम सुपर कंप्यूटर श्रेणी है?","options":["विज्ञान","परम","धनुष","शक्ति"],"answer":"परम","memoryTrick":"पुणे 🏛️ के वैज्ञानिकों ने देश में सुपर कंप्यूटिंग की पहली सीरीज का नाम 'परम' 🚀 रखा! 🤩💡","explanation":{"keyPoints":["पुणे स्थित C-DAC (Centre for Development of Advanced Computing) द्वारा विकसित भारत की सर्वप्रथम सुपरकंप्यूटर श्रेणी 'परम' (PARAM) है।","इस श्रृंखला का पहला मॉडल 'परम 8000' (1991) था, जिसके बाद परम 10000, परम पद्म, परम युवा, परम ईशान, परम ब्रह्मा और परम सिद्धि विकसित किए गए।"]}},{"id":"146","date":"RRB NTPC Stage-1 • Jan 2021","shiftInfo":"⚡ Shift-I","rawDate":"\\[RRB NTPC 07.01.2021 (Shift-I) Stage Ist\\]","examTag":"EXAM FOCUS","category":"components","question":"निम्नलिखित में से क्या कंप्यूटर का एक घटक नहीं है?","options":["ALU","CPU","मेमोरी","कागज"],"answer":"कागज","memoryTrick":"कंप्यूटर सीपीयू 🧠 और मेमोरी से चलता है, हार्डवेयर में सादा 'कागज' 📄 कभी फिट नहीं होता! 😱💥","explanation":{"keyPoints":["ALU (अंकगणितीय तार्किक इकाई), CPU (केंद्रीय प्रसंस्करण इकाई) और मेमोरी कंप्यूटर प्रणाली के अनिवार्य घटक हैं।","कागज (Paper) केवल प्रिंटर से हार्ड कॉपी आउटपुट प्राप्त करने का एक बाहरी उपभोज्य माध्यम (Consumable item) है, यह कंप्यूटर का घटक नहीं है।"]}},{"id":"147","date":"RRB NTPC Stage-1 • Jan 2021","shiftInfo":"⚡ Shift-I","rawDate":"\\[RRB NTPC 16.01.2021 (Shift-I) Stage Ist\\]","examTag":"EXAM FOCUS","category":"components","question":"निम्नलिखित में से कौन-सा एक पर्सनल कंप्यूटर का हिस्सा नहीं है?","options":["सीपीयू","यूएसबी","रैम","रोम"],"answer":"यूएसबी","memoryTrick":"सीपीयू, रैम और रोम 💾 अंदर रहते हैं जबकि बाहरी केबल वाला 'यूएसबी' 🔌 मूल हिस्सा नहीं! 🧠🔥","explanation":{"keyPoints":["पर्सनल कंप्यूटर (PC) के मुख्य आंतरिक घटकों में CPU, RAM और ROM शामिल होते हैं।","USB (Universal Serial Bus) कोई कंप्यूटर घटक या स्वतंत्र उपकरण नहीं है, बल्कि कंप्यूटर और बाह्य उपकरणों के बीच डेटा संचार स्थापित करने वाला एक पोर्ट/कनेक्शन मानक है।"]}},{"id":"148","date":"RRB NTPC Stage-1 • Feb 2021","shiftInfo":"⚡ Shift-II","rawDate":"\\[RRB NTPC 27.02.2021 (Shift-II) Stage Ist\\]","examTag":"EXAM FOCUS","category":"components","question":"निम्नलिखित में से कौन-सा एक कंप्यूटर का आंतरिक हिस्सा नहीं है?","options":["रैम","मदरबोर्ड"," class=\"module-hindi\">(कंप्यूटर के मूलभूत अभिलक्षण)</span></span>\n        </div>\n        <span class=\"pyq-tag pyq-repeat-5\">🔥 RRB NTPC 2026 ★★★★★ Category 1 (10 PYQs)</span>\n      </div>\n      <div class=\"module-body\">\n        <div class=\"cards-grid\">\n          <!-- Diligence -->\n          <div class=\"yct-card border-red\">\n            <div class=\"yct-card-head\">\n              <div>\n                <div class=\"yct-card-name\">1. Diligence (कर्मठता / अध्यवसाय)</div>\n                <div class=\"yct-card-sub\">बिना थके कार्य करने की क्षमता</div>\n              </div>\n              <span class=\"pyq-tag pyq-repeat-5\">RRB 5+ बार</span>\n            </div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>हिंदी:</strong> कंप्यूटर बिना एकाग्रता खोए, बिना थके (Fatigue) और बिना ऊबे (Boredom) लगातार अरबों गणनाएं समान सटीकता के साथ कर सकता है।</div>\n              <div class=\"point-en\"><strong>English:</strong> Free from tiredness, lack of concentration, and fatigue even after prolonged continuous execution.</div>\n            </div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>परीक्षा प्रश्न:</strong> \"कंप्यूटर बिना क्लान्ति के निरंतर कार्य कर सकता है\" ➔ उत्तर: <span class=\"hl-ans\">डिलिजेंस (Diligence)</span>।</div>\n            </div>\n          </div>\n\n          <!-- Accuracy -->\n          <div class=\"yct-card border-orange\">\n            <div class=\"yct-card-head\">\n              <div>\n                <div class=\"yct-card-name\">2. Accuracy & Precision (सटीकता)</div>\n                <div class=\"yct-card-sub\">100% त्रुटिरहित परिणाम</div>\n              </div>\n              <span class=\"pyq-tag pyq-repeat-3\">RRB 3x</span>\n            </div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>हिंदी:</strong> कंप्यूटर का परिणाम तब तक 100% सही और सटीक होता है, जब तक कि <span class=\"hl-ans\">इनपुट डेटा और अनुदेश सही हों</span>।</div>\n              <div class=\"point-en\"><strong>English:</strong> Produces accurate results consistently, provided the input data and program instructions are valid.</div>\n            </div>\n          </div>\n\n          <!-- Speed -->\n          <div class=\"yct-card border-green\">\n            <div class=\"yct-card-head\">\n              <div>\n                <div class=\"yct-card-name\">3. High Speed (अति तीव्र गति)</div>\n                <div class=\"yct-card-sub\">माइक्रो व नैनोसेकंड में गणना</div>\n              </div>\n              <span class=\"pyq-tag pyq-repeat-3\">PYQ Repeated</span>\n            </div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>हिंदी:</strong> गणना की गति <span class=\"hl-term\">MIPS (Million Instructions Per Second)</span> एवं <span class=\"hl-term\">BIPS</span> में मापी जाती है। 1 नैनोसेकंड = 10⁻⁹ सेकंड।</div>\n              <div class=\"point-en\"><strong>English:</strong> Operates at lightning-fast speeds measured in microseconds (10⁻⁶s), nanoseconds (10⁻⁹s), and picoseconds (10⁻¹²s).</div>\n            </div>\n          </div>\n\n          <!-- Versatility & Automation -->\n          <div class=\"yct-card border-purple\">\n            <div class=\"yct-card-head\">\n              <div>\n                <div class=\"yct-card-name\">4. Versatility & Automation (बहुमुखी प्रतिभा व स्वचालन)</div>\n                <div class=\"yct-card-sub\">मल्टीटास्किंग एवं स्वचालित संचालन</div>\n              </div>\n              <span class=\"pyq-tag pyq-repeat-3\">RRB NTPC</span>\n            </div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>Versatility:</strong> विभिन्न प्रकार के स्वतंत्र कार्यों (जैसे बिलिंग, टाइपिंग, संगीत, साइंटिफिक रिसर्च) को एक साथ करने की क्षमता।</div>\n              <div class=\"point-en\"><strong>Automation:</strong> एक बार प्रोग्राम शुरू होने के बाद मानवीय हस्तक्षेप के बिना कार्य को पूरा करना।</div>\n            </div>\n          </div>\n        </div>\n\n        <div class=\"facts-drive\">\n          <div class=\"facts-drive-title\">⚡ Facts Drive: Category 1 गोल्डन परीक्षा तथ्य</div>\n          <div class=\"facts-drive-content\">\n            <div class=\"facts-drive-item\">• <strong>बिना थके काम करना:</strong> Diligence (कर्मठता/अध्यवसाय) कहलाता है।</div>\n            <div class=\"facts-drive-item\">• <strong>बिना मानवीय हस्तक्षेप के काम करना:</strong> Automation (स्वचालन) कहलाता है।</div>\n            <div class=\"facts-drive-item\">• <strong>अलग-अलग प्रकार के काम करना:</strong> Versatility (विविधता/बहुमुखी प्रतिभा) कहलाता है।</div>\n            <div class=\"facts-drive-item\">• <strong>एक ही इनपुट पर हर बार समान परिणाम:</strong> Reliability & Consistency (विश्वसनीयता) कहलाता है।</div>\n          </div>\n        </div>\n      </div>"},{"id":"m02","num":"M02","engTitle":"Limitations & GIGO Principle <span class=\"module-hindi\">(कंप्यूटर की सीमाएं एवं GIGO सिद्धांत)","hindiTitle":"","badge":"","isHighPyq":true,"extraClass":"high-pyq","innerHtml":"<div class=\"module-header\">\n        <div class=\"module-title-box\">\n          <span class=\"module-number\">M02</span>\n          <span class=\"module-title\">Limitations & GIGO Principle <span class=\"module-hindi\">(कंप्यूटर की सीमाएं एवं GIGO सिद्धांत)</span></span>\n        </div>\n        <span class=\"pyq-tag pyq-repeat-5\">🔥 RRB NTPC ★★★★★ Category 2 (4 PYQs)</span>\n      </div>\n      <div class=\"module-body\">\n        <div class=\"grid-2col\">\n          <!-- GIGO Feature Box -->\n          <div style=\"background: linear-gradient(135deg, #fef2f2, #fee2e2); border: 2px solid #ef4444; border-radius: 8px; padding: 14px;\">\n            <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n              <strong style=\"color: #b91c1c; font-size: 1.05rem;\">GIGO: Garbage In, Garbage Out</strong>\n              <span class=\"pyq-tag pyq-repeat-5\">कचरा अंदर, कचरा बाहर</span>\n            </div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>हिंदी अर्थ:</strong> यदि कंप्यूटर को गलत या अमान्य इनपुट डेटा दिया जाएगा, तो आउटपुट भी निश्चित रूप से गलत ही निकलेगा। कंप्यूटर मानवीय इनपुट गलतियों को खुद से ठीक नहीं कर सकता।</div>\n              <div class=\"point-en\"><strong>English Definition:</strong> If incorrect, faulty, or invalid input is provided, the resulting output will inevitably be incorrect. The computer cannot automatically correct human errors.</div>\n            </div>\n            <div style=\"margin-top: 6px; font-size: 0.82rem; color: #991b1b;\">\n              <strong>🎯 RRB 2026 प्रश्न:</strong> \"कंप्यूटर की सटीकता किस बात पर निर्भर करती है?\" ➔ <span class=\"hl-ans\">सही इनपुट डेटा पर (GIGO)</span>।\n            </div>\n          </div>\n\n          <!-- Other Limitations -->\n          <div>\n            <div class=\"yct-card border-red\" style=\"margin-bottom: 10px;\">\n              <div class=\"yct-card-name\">1. No IQ / Zero Intelligence (बुद्धिहीन)</div>\n              <div class=\"bilingual-point\">\n                <div class=\"point-hi\"><strong>हिंदी:</strong> कंप्यूटर का अपना कोई दिमाग या <span class=\"hl-warn\">IQ (Intelligence Quotient) शून्य</span> होता है। यह स्वयं से कोई निर्णय या तर्क नहीं ले सकता।</div>\n                <div class=\"point-en\"><strong>English:</strong> Possesses Zero IQ. Cannot think, reason, or take independent decisions outside its program.</div>\n              </div>\n            </div>\n\n            <div class=\"yct-card border-orange\">\n              <div class=\"yct-card-name\">2. Dependency & Vulnerability (निर्भरता व खतरे)</div>\n              <div class=\"bilingual-point\">\n                <div class=\"point-hi\"><strong>मानव निर्भरता:</strong> प्रोग्रामर के निर्देशों के बिना कंप्यूटर एक निष्क्रिय बक्सा है।</div>\n                <div class=\"point-en\"><strong>बिजली व वायरस:</strong> विद्युत आपूर्ति बंद होने पर काम रुक जाता है; मैलवेयर व वायरस के प्रति संवेदनशील है।</div>\n              </div>\n            </div>\n          </div>\n        </div>\n        <!-- OFFICIAL PYQS ONELINER: CHARACTERISTICS & FEATURES (NON-RRB NTPC) -->\n        <div class=\"pyq-showcase-box\" style=\"margin-top: 18px; border-color: #3b82f6;\">\n          <div class=\"pyq-showcase-header\" style=\"border-bottom-color: rgba(59, 130, 246, 0.4);\">\n            <div class=\"pyq-showcase-title\" style=\"color: #60a5fa;\">\n              <span>🎯</span> OFFICIAL PYQS ONELINER\n            </div>\n            <span class=\"pyq-tag\" style=\"background: #3b82f6; color: #fff; font-weight: 800;\">DSSSB & CPCT Exams</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #60a5fa;\">1.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">कंप्यूटर की वह विशेषता जो बिना किसी सुस्ती, थकान या एकाग्रता खोए लाखों गणनाएं लगातार करती है, क्या कहलाती है? — <strong style=\"color: #86efac;\">कर्मठता (Diligence)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">DSSSB Patwari 2022</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #60a5fa;\">2.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">इनमें से कौन सा लक्षण या विशेषता कंप्यूटर की नहीं है? — <strong style=\"color: #86efac;\">भावनाएं / संवेदनशीलता (Emotions - कंप्यूटर में कोई भावना नहीं होती)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">DSSSB Patwari 2022</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #60a5fa;\">3.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">आधुनिक कंप्यूटर अत्यधिक विश्वसनीय (Reliable) होते हैं, लेकिन वे क्या नहीं होते? — <strong style=\"color: #86efac;\">सस्ते (Cheap)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">CPCT 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #60a5fa;\">4.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">कंप्यूटर की विशेषताओं का प्रामाणिक मिलान: <strong>विविधता (Versatility):</strong> विभिन्न कार्यों की क्षमता | <strong>सटीकता (Accuracy):</strong> त्रुटिरहित गणनाएं | <strong>कर्मठता (Diligence):</strong> बिना थकान कार्य | <strong>विश्वसनीयता (Reliability):</strong> सतत सुसंगत परिणाम।</div>\n            </div>\n            <span class=\"pyq-badge-source\">DSSSB Patwari 2020</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #60a5fa;\">5.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">कंप्यूटर प्रत्यक्ष रूप से केवल किस भाषा को सीधे समझ सकता है? — <strong style=\"color: #86efac;\">मशीनी भाषा (Machine Language - बाइनरी 0 और 1)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">CPCT 2024</span>\n          </div>\n        </div>\n      </div>"},{"id":"m03","num":"M03","engTitle":"Basic Functions & The IPO Cycle <span class=\"module-hindi\">(कंप्यूटर के मूलभूत कार्य एवं घटक)","hindiTitle":"","badge":"","isHighPyq":false,"extraClass":"","innerHtml":"<div class=\"module-header\">\n        <div class=\"module-title-box\">\n          <span class=\"module-number\">M03</span>\n          <span class=\"module-title\">Basic Functions & The IPO Cycle <span class=\"module-hindi\">(कंप्यूटर के मूलभूत कार्य एवं घटक)</span></span>\n        </div>\n        <span class=\"pyq-tag pyq-repeat-3\">🏷️ Category 12 & 14 (22 PYQs Analyzed)</span>\n      </div>\n      <div class=\"module-body\">\n        <!-- Pure CSS IPO Diagram -->\n        <div class=\"css-diagram\">\n          <div class=\"diagram-title\">The IPO Cycle (इनपुट ➔ प्रोसेसिंग ➔ आउटपुट ➔ स्टोरेज चक्र)</div>\n          <div class=\"ipo-container\">\n            <div class=\"ipo-node\" style=\"border-color: #3b82f6;\">\n              <div style=\"font-weight: 800; color: #1d4ed8;\">1. INPUT (इनपुट)</div>\n              <div style=\"font-size: 0.75rem; color: var(--text-light);\">कच्चा डेटा ग्रहण करना<br>(Raw Data via Keyboard/Mouse)</div>\n            </div>\n            <div class=\"ipo-arrow\">➔</div>\n            <div class=\"ipo-node\" style=\"border-color: #8b5cf6;\">\n              <div style=\"font-weight: 800; color: #6d28d9;\">2. PROCESS (प्रक्रिया)</div>\n              <div style=\"font-size: 0.75rem; color: var(--text-light);\">CPU द्वारा डेटा प्रसंस्करण<br>(Calculation & Logic by CPU)</div>\n            </div>\n            <div class=\"ipo-arrow\">➔</div>\n            <div class=\"ipo-node\" style=\"border-color: #10b981;\">\n              <div style=\"font-weight: 800; color: #047857;\">3. OUTPUT (आउटपुट)</div>\n              <div style=\"font-size: 0.75rem; color: var(--text-light);\">उपयोगी सूचना प्रदर्शन<br>(Useful Info via Monitor/Print)</div>\n            </div>\n            <div class=\"ipo-arrow\">➔</div>\n            <div class=\"ipo-node\" style=\"border-color: #f59e0b;\">\n              <div style=\"font-weight: 800; color: #b45309;\">4. STORAGE (भंडारण)</div>\n              <div style=\"font-size: 0.75rem; color: var(--text-light);\">भविष्य हेतु सुरक्षित करना<br>(HDD, SSD, Flash Memory)</div>\n            </div>\n          </div>\n        </div>\n\n        <div class=\"grid-2col\" style=\"margin-top: 14px;\">\n          <div class=\"yct-card border-purple\">\n            <div class=\"yct-card-name\">डेटा (Data) बनाम सूचना (Information)</div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>Data (असंसाधित आंकड़े):</strong> असंगठित तथ्य, अंक या चिन्ह (Raw facts) जिनका अपने आप में कोई स्पष्ट अर्थ नहीं होता।</div>\n              <div class=\"point-en\"><strong>Information (सूचना):</strong> जब डेटा को व्यवस्थित और संसाधित (Processed Data) कर दिया जाता है, तो वह अर्थपूर्ण सूचना बनती है।</div>\n            </div>\n            <div style=\"margin-top: 6px; font-size: 0.82rem; color: #1d4ed8;\">\n              • <strong>Formula:</strong> <span class=\"hl-ans\">Processed Data = Information (डेटा + प्रोसेसिंग = सूचना)</span>\n            </div>\n          </div>\n\n          <div class=\"yct-card border-green\">\n            <div class=\"yct-card-name\">हार्डवेयर, सॉफ्टवेयर एवं फर्मवेयर</div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>हार्डवेयर (Hardware):</strong> कंप्यूटर के भौतिक घटक जिन्हें स्पर्श किया जा सकता है (कीबोर्ड, सीपीयू, मॉनिटर)।</div>\n              <div class=\"point-hi\"><strong>सॉफ्टवेयर (Software):</strong> कंप्यूटर को संचालित करने वाले प्रोग्रामों व निर्देशों का समूह (OS, MS Word)।</div>\n              <div class=\"point-hi\"><strong>फर्मवेयर (Firmware):</strong> हार्डवेयर की ROM चिप में स्थायी रूप से बर्न किया गया सॉफ्टवेयर (जैसे <span class=\"hl-ans\">BIOS</span>)।</div>\n            </div>\n          </div>\n        </div>\n      </div>"},{"id":"m04","num":"M04","engTitle":"History, Pioneers & Official Exam PYQs <span class=\"module-hindi\">(इतिहास, जनक एवं 15 प्रामाणिक PYQs)","hindiTitle":"","badge":"","isHighPyq":true,"extraClass":"high-pyq","innerHtml":"<div class=\"module-header\">\n        <div class=\"module-title-box\">\n          <span class=\"module-number\">M04</span>\n          <span class=\"module-title\">History, Pioneers & Official Exam PYQs <span class=\"module-hindi\">(इतिहास, जनक एवं 15 प्रामाणिक PYQs)</span></span>\n        </div>\n        <span class=\"pyq-tag pyq-repeat-5\">🔥 Babbage, Turing, Lovelace & Real Exam Hits</span>\n      </div>\n      <div class=\"module-body\">\n\n        <!-- ⭐ PIONEERS HALL OF FAME -->\n        <div style=\"background: linear-gradient(135deg, #1e1b4b, #172554); border: 2px solid #6366f1; border-radius: 10px; padding: 14px 18px; margin-bottom: 16px; color: white;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px;\">\n            <div style=\"font-size: 1.05rem; font-weight: 800; color: #a5b4fc; display: flex; align-items: center; gap: 8px;\">\n              <span>👑</span> PIONEERS & ARCHITECTS: बार-बार पूछे जाने वाले जनक (HALL OF FAME)\n            </div>\n            <span class=\"pyq-tag pyq-repeat-5\" style=\"background: #ef4444; color: white; border: none;\">★ अति-महत्वपूर्ण (Direct PYQs) ★</span>\n          </div>\n\n          <div class=\"cards-grid\">\n            <!-- Charles Babbage -->\n            <div class=\"yct-card border-red\" style=\"background: rgba(15, 23, 42, 0.85); color: #f8fafc;\">\n              <div class=\"yct-card-head\">\n                <div>\n                  <div class=\"yct-card-name\" style=\"color: #f87171;\">Charles Babbage (चार्ल्स बैबेज)</div>\n                  <div class=\"yct-card-sub\" style=\"color: #60a5fa;\">फादर ऑफ कंप्यूटर (Father of Computer)</div>\n                </div>\n                <span class=\"pyq-tag pyq-repeat-5\">5+ बार रिपीट</span>\n              </div>\n              <div class=\"bilingual-point\">\n                <div class=\"point-hi\" style=\"color: #e2e8f0;\">• <strong>Difference Engine (1822):</strong> भाप से चलने वाला यांत्रिक कैलकुलेटर।</div>\n                <div class=\"point-hi\" style=\"color: #e2e8f0;\">• <strong>Analytical Engine (1837):</strong> प्रथम स्वचालित यांत्रिक कंप्यूटर जिसमें <strong>Store (Memory), Mill (ALU), Reader व Printer</strong> थे।</div>\n              </div>\n            </div>\n\n            <!-- Alan Turing -->\n            <div class=\"yct-card border-red\" style=\"background: rgba(15, 23, 42, 0.85); color: #f8fafc;\">\n              <div class=\"yct-card-head\">\n                <div>\n                  <div class=\"yct-card-name\" style=\"color: #f87171;\">Alan Turing (एलन ट्यूरिंग)</div>\n                  <div class=\"yct-card-sub\" style=\"color: #60a5fa;\">आधुनिक कंप्यूटर विज्ञान एवं AI के जनक</div>\n                </div>\n                <span class=\"pyq-tag pyq-repeat-5\">5+ बार रिपीट</span>\n              </div>\n              <div class=\"bilingual-point\">\n                <div class=\"point-hi\" style=\"color: #e2e8f0;\">• <strong>Turing Machine (1936):</strong> आधुनिक संगणना का सैद्धांतिक मॉडल। नाजी <strong>Enigma कोड</strong> क्रैक किया।</div>\n                <div class=\"point-hi\" style=\"color: #e2e8f0;\">• कंप्यूटर जगत का नोबेल पुरस्कार: <strong>Turing Award</strong>।</div>\n              </div>\n            </div>\n\n            <!-- Ada Lovelace -->\n            <div class=\"yct-card border-orange\" style=\"background: rgba(15, 23, 42, 0.85); color: #f8fafc;\">\n              <div class=\"yct-card-head\">\n                <div>\n                  <div class=\"yct-card-name\" style=\"color: #fb923c;\">Lady Ada Lovelace (एडा लवलेस)</div>\n                  <div class=\"yct-card-sub\" style=\"color: #60a5fa;\">विश्व की प्रथम प्रोग्रामर (First Programmer)</div>\n                </div>\n                <span class=\"pyq-tag pyq-repeat-3\">SSC / RRB</span>\n              </div>\n              <div class=\"bilingual-point\">\n                <div class=\"point-hi\" style=\"color: #e2e8f0;\">• बैबेज के एनालिटिकल इंजन हेतु पहला एल्गोरिदम लिखा। अमेरिकी रक्षा विभाग की भाषा <span class=\"hl-ans\">ADA</span> इन्हीं के सम्मान में है।</div>\n              </div>\n            </div>\n\n            <!-- John von Neumann -->\n            <div class=\"yct-card border-red\" style=\"background: rgba(15, 23, 42, 0.85); color: #f8fafc;\">\n              <div class=\"yct-card-head\">\n                <div>\n                  <div class=\"yct-card-name\" style=\"color: #f87171;\">John von Neumann (वॉन न्यूमैन)</div>\n                  <div class=\"yct-card-sub\" style=\"color: #60a5fa;\">कंप्यूटर आर्किटेक्चर के जनक (1945)</div>\n                </div>\n                <span class=\"pyq-tag pyq-repeat-5\">RRB 5x</span>\n              </div>\n              <div class=\"bilingual-point\">\n                <div class=\"point-hi\" style=\"color: #e2e8f0;\">• <strong>Stored-Program Concept (संग्रहीत प्रोग्राम):</strong> निर्देश और डेटा को एक ही साझा मेमोरी में बाइनरी रूप में स्टोर करना।</div>\n              </div>\n            </div>\n\n            <!-- Dr. Vijay Bhatkar -->\n            <div class=\"yct-card border-red\" style=\"background: rgba(15, 23, 42, 0.85); color: #f8fafc;\">\n              <div class=\"yct-card-head\">\n                <div>\n                  <div class=\"yct-card-name\" style=\"color: #f87171;\">Dr. Vijay Bhatkar (डॉ. विजय भटकर)</div>\n                  <div class=\"yct-card-sub\" style=\"color: #60a5fa;\">भारतीय सुपरकंप्यूटिंग के जनक</div>\n                </div>\n                <span class=\"pyq-tag pyq-repeat-5\">RRB 5+ बार</span>\n              </div>\n              <div class=\"bilingual-point\">\n                <div class=\"point-hi\" style=\"color: #e2e8f0;\">• C-DAC पुणे में भारत का पहला स्वदेशी सुपरकंप्यूटर <span class=\"hl-ans\">PARAM 8000 (1991)</span> विकसित किया।</div>\n              </div>\n            </div>\n\n            <!-- Seymour Cray -->\n            <div class=\"yct-card border-orange\" style=\"background: rgba(15, 23, 42, 0.85); color: #f8fafc;\">\n              <div class=\"yct-card-head\">\n                <div>\n                  <div class=\"yct-card-name\" style=\"color: #fb923c;\">Seymour Cray (सीमोर क्रे)</div>\n                  <div class=\"yct-card-sub\" style=\"color: #60a5fa;\">विश्व सुपरकंप्यूटिंग के जनक</div>\n                </div>\n                <span class=\"pyq-tag pyq-repeat-3\">RRB 3x</span>\n              </div>\n              <div class=\"bilingual-point\">\n                <div class=\"point-hi\" style=\"color: #e2e8f0;\">• पहला सुपरकंप्यूटर: <strong>CDC 6600 (1964)</strong> एवं पहला सफल वेक्टर सुपरकंप्यूटर: <strong>CRAY-1 (1976)</strong>।</div>\n              </div>\n            </div>\n          </div>\n        </div>\n\n        <!-- History Milestones Table -->\n        <table class=\"styled-table\">\n          <thead>\n            <tr>\n              <th style=\"width: 140px;\">Machine / Year</th>\n              <th style=\"width: 160px;\">Inventor / जनक</th>\n              <th>Dual-Language Exam Facts (परीक्षा तथ्य)</th>\n              <th style=\"width: 120px;\">Exam Tag</th>\n            </tr>\n          </thead>\n          <tbody>\n            <tr>\n              <td><strong>Pascaline (1642)</strong></td>\n              <td>Blaise Pascal (फ्रांस)</td>\n              <td>\n                <div class=\"point-hi\">विश्व की <strong>प्रथम यांत्रिक गणना मशीन</strong> (Adding Machine)। यह गियर्स और पहियों पर आधारित थी।</div>\n                <div class=\"point-en\">First mechanical adding calculator based on rotating toothed wheels.</div>\n              </td>\n              <td><span class=\"pyq-tag pyq-repeat-3\">CPCT / SSC 3x</span></td>\n            </tr>\n            <tr>\n              <td><strong>Difference & Analytical Engine (1822 / 1837)</strong></td>\n              <td>Charles Babbage</td>\n              <td>\n                <div class=\"point-hi\"><strong>एनालिटिकल इंजन</strong> विश्व का पहला स्वचालित यांत्रिक कंप्यूटर था। इसमें Store (मेमोरी), Mill (ALU), Reader एवं Printer शामिल थे।</div>\n                <div class=\"point-en\">First general-purpose automatic mechanical computer. Charles Babbage is \"Father of Computer\".</div>\n              </td>\n              <td><span class=\"pyq-tag pyq-repeat-5\">RRB / SSC 5+ बार</span></td>\n            </tr>\n            <tr>\n              <td><strong>Harvard Mark-I (1944)</strong></td>\n              <td>Howard Aiken & IBM</td>\n              <td>\n                <div class=\"point-hi\">विश्व का <strong>प्रथम पूर्ण स्वचालित इलेक्ट्रो-मैकेनिकल (विद्युत-यांत्रिक)</strong> कंप्यूटर। (ASCC: Automatic Sequence Controlled Calculator).</div>\n                <div class=\"point-en\">First fully automatic electromechanical computer.</div>\n              </td>\n              <td><span class=\"pyq-tag pyq-repeat-3\">RRB 2026</span></td>\n            </tr>\n            <tr>\n              <td><strong>ENIAC (1945)</strong></td>\n              <td>J.P. Eckert & John Mauchly</td>\n              <td>\n                <div class=\"point-hi\">विश्व का <strong>पहला सामान्य प्रयोजन पूर्ण इलेक्ट्रॉनिक डिजिटल कंप्यूटर</strong> (Electronic Numerical Integrator and Computer)। 18,000 वैक्यूम ट्यूब्स; <strong>पेनसिल्वेनिया विश्वविद्यालय</strong> द्वारा डिजाइन व निर्मित।</div>\n                <div class=\"point-en\">First general-purpose fully electronic digital computer (Univ of Pennsylvania).</div>\n              </td>\n              <td><span class=\"pyq-tag pyq-repeat-5\">RRB 4x Repeat</span></td>\n            </tr>\n            <tr>\n              <td><strong>EDVAC (1947–49)</strong></td>\n              <td>John von Neumann</td>\n              <td>\n                <div class=\"point-hi\"><strong>EDVAC:</strong> Electronic Discrete Variable Automatic Computer — <strong>संग्रहीत प्रोग्राम (Stored-Program) संकल्पना</strong> तथा बाइनरी नंबर सिस्टम का उपयोग करने वाला पहला कंप्यूटर।</div>\n                <div class=\"point-en\">First computer to utilize stored-program architecture and binary number system.</div>\n              </td>\n              <td><span class=\"pyq-tag pyq-repeat-3\">RRB NTPC</span></td>\n            </tr>\n            <tr>\n              <td><strong>UNIVAC-I (1951)</strong></td>\n              <td>Eckert & Mauchly</td>\n              <td>\n                <div class=\"point-hi\">विश्व का <strong>प्रथम व्यावसायिक (Commercial)</strong> रूप से उपलब्ध कंप्यूटर (Universal Automatic Computer)।</div>\n                <div class=\"point-en\">First commercially produced and marketed computer.</div>\n              </td>\n              <td><span class=\"pyq-tag pyq-repeat-3\">RRB NTPC</span></td>\n            </tr>\n            <tr>\n              <td><strong>Intel 4004 (1971)</strong></td>\n              <td>Ted Hoff, Faggin, Shima</td>\n              <td>\n                <div class=\"point-hi\">विश्व का <strong>प्रथम एकल-चिप माइक्रोप्रोसेसर</strong> (4-बिट, 2300 ट्रांजिस्टर)।</div>\n                <div class=\"point-en\">World's first commercial single-chip microprocessor (4-bit).</div>\n              </td>\n              <td><span class=\"pyq-tag pyq-repeat-5\">RRB 5+ बार</span></td>\n            </tr>\n          </tbody>\n        </table>\n\n        <!-- ⭐ OFFICIAL 15 PYQ ONELINERS BOX (DUAL LANGUAGE) -->\n        <div class=\"pyq-showcase-box\">\n          <div class=\"pyq-showcase-header\">\n            <div class=\"pyq-showcase-title\">\n              <span>🎯</span> OFFICIAL PYQS ONELINER\n            </div>\n            <span class=\"pyq-tag pyq-repeat-5\" style=\"background: #f59e0b; color: #000; font-weight: 800;\">Core Exam Facts</span>\n          </div>\n\n          <!-- 1 -->\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #fbbf24;\">1.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">चार्ल्स बैबेज द्वारा डिज़ाइन किया गया पहला यांत्रिक कंप्यूटर (Mechanical Computer) <strong style=\"color: #86efac;\">एनालिटिकल इंजन (Analytical Engine)</strong> था।</div>\n              <div class=\"pyq-english\">The first mechanical computer designed by Charles Babbage is <strong style=\"color: #38bdf8;\">Analytical Engine</strong>.</div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CHSL 2024</span>\n          </div>\n\n          <!-- 2 -->\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #fbbf24;\">2.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">कंप्यूटर प्रत्यक्ष रूप से केवल <strong style=\"color: #86efac;\">मशीनी भाषा (Machine Language - बाइनरी 0 और 1)</strong> को ही सीधे समझ सकता है।</div>\n              <div class=\"pyq-english\">A computer can only understand <strong style=\"color: #38bdf8;\">machine language</strong> directly.</div>\n            </div>\n            <span class=\"pyq-badge-source\">CPCT 2024</span>\n          </div>\n\n          <!-- 3 -->\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #fbbf24;\">3.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">विश्व का पहला प्रोग्रामेबल सामान्य-उद्देश्यीय (General Purpose) इलेक्ट्रॉनिक डिजिटल कंप्यूटर <strong style=\"color: #86efac;\">ENIAC</strong> था।</div>\n              <div class=\"pyq-english\">The first programmable general purpose computer in the world is <strong style=\"color: #38bdf8;\">ENIAC</strong>.</div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CHSL 2024</span>\n          </div>\n\n          <!-- 4 -->\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #fbbf24;\">4.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">विश्व का पहला यांत्रिक कैलकुलेटर (Mechanical Calculator) <strong style=\"color: #86efac;\">पास्कलाइन (Pascaline)</strong> कहलाता था।</div>\n              <div class=\"pyq-english\">The first mechanical calculator was called <strong style=\"color: #38bdf8;\">Pascaline</strong>.</div>\n            </div>\n            <span class=\"pyq-badge-source\">UPSSSC 2023</span>\n          </div>\n\n          <!-- 5 -->\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #fbbf24;\">5.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\"><strong style=\"color: #86efac;\">चार्ल्स बैबेज (Charles Babbage)</strong> को कंप्यूटर का जनक / पितामह (Father of Computer) कहा जाता है।</div>\n              <div class=\"pyq-english\"><strong style=\"color: #38bdf8;\">Charles Babbage</strong> is the father of computer.</div>\n            </div>\n            <span class=\"pyq-badge-source\">BPSC PGT 2023</span>\n          </div>\n\n          <!-- 6 -->\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #fbbf24;\">6.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">कंप्यूटर की पहली पीढ़ी (First Generation) मुख्य इलेक्ट्रॉनिक घटक के रूप में <strong style=\"color: #86efac;\">वैक्यूम ट्यूब्स (Vacuum Tubes)</strong> पर आधारित थी।</div>\n              <div class=\"pyq-english\">First generation of computer is based on <strong style=\"color: #38bdf8;\">Vacuum Tubes</strong>.</div>\n            </div>\n            <span class=\"pyq-badge-source\">CPCT 2023</span>\n          </div>\n\n          <!-- 7 -->\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #fbbf24;\">7.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">कंप्यूटर की दूसरी पीढ़ी (Second Generation) में इलेक्ट्रॉनिक स्विचिंग घटक के रूप में <strong style=\"color: #86efac;\">ट्रांजिस्टर (Transistor)</strong> का उपयोग हुआ था।</div>\n              <div class=\"pyq-english\"><strong style=\"color: #38bdf8;\">Transistor</strong> was used in second generation of computers.</div>\n            </div>\n            <span class=\"pyq-badge-source\">MPPSC 2023</span>\n          </div>\n\n          <!-- 8 -->\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #fbbf24;\">8.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">पांचवीं पीढ़ी के कंप्यूटरों में अन्य पीढ़ियों से मुख्य अंतर <strong style=\"color: #86efac;\">तकनीकी उन्नति (Technological Advancement / AI, ULSI व रोबोटिक्स)</strong> है।</div>\n              <div class=\"pyq-english\">In fifth generation computers, <strong style=\"color: #38bdf8;\">Technological advancement</strong> is the difference from other generation computers.</div>\n            </div>\n            <span class=\"pyq-badge-source\">BPSC TGT 2023</span>\n          </div>\n\n          <!-- 9 -->\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #fbbf24;\">9.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">ब्लेज पास्कल ने यांत्रिक कैलकुलेटर का आविष्कार मुख्य रूप से <strong style=\"color: #86efac;\">संख्याओं को जोड़ने (Adding Numbers / एडिंग मशीन)</strong> के लिए किया था।</div>\n              <div class=\"pyq-english\">Blaise Pascal invented mechanical calculator for <strong style=\"color: #38bdf8;\">adding numbers</strong>.</div>\n            </div>\n            <span class=\"pyq-badge-source\">CPCT 2022</span>\n          </div>\n\n          <!-- 10 -->\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #fbbf24;\">10.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">भारत में C-DAC (पुणे) द्वारा विकसित पहला स्वदेशी सुपरकंप्यूटर <strong style=\"color: #86efac;\">PARAM 8000 (1991)</strong> माना जाता है।</div>\n              <div class=\"pyq-english\"><strong style=\"color: #38bdf8;\">PARAM 8000</strong> is considered to be the first supercomputer developed by C-DAC in India.</div>\n            </div>\n            <span class=\"pyq-badge-source\">CPCT 2022</span>\n          </div>\n\n          <!-- 11 -->\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #fbbf24;\">11.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">विश्व के पहले पूर्ण इलेक्ट्रॉनिक कंप्यूटर (ENIAC) का डिज़ाइन एवं निर्माण <strong style=\"color: #86efac;\">पेंसिल्वेनिया विश्वविद्यालय (University of Pennsylvania)</strong> में हुआ था।</div>\n              <div class=\"pyq-english\"><strong style=\"color: #38bdf8;\">University of Pennsylvania</strong> designed and developed the first electronic computer (ENIAC).</div>\n            </div>\n            <span class=\"pyq-badge-source\">RRB NTPC 2021</span>\n          </div>\n\n          <!-- 12 -->\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #fbbf24;\">12.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">बिना किसी यांत्रिक भाग (Mechanical Parts) वाला पहला इलेक्ट्रॉनिक कंप्यूटर (ENIAC) <strong style=\"color: #86efac;\">जे. डब्ल्यू. मौचली और जे. प्रेसपर एकर्ट</strong> द्वारा बनाया गया था।</div>\n              <div class=\"pyq-english\">ENIAC was first computer without mechanical parts built by <strong style=\"color: #38bdf8;\">J.W. Mauchly and J. Presper Eckert</strong>.</div>\n            </div>\n            <span class=\"pyq-badge-source\">RRB NTPC 2021</span>\n          </div>\n\n          <!-- 13 -->\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #fbbf24;\">13.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\"><strong style=\"color: #86efac;\">एलन ट्यूरिंग (Alan Turing)</strong> को आधुनिक कंप्यूटर विज्ञान का जनक (Father of Modern Computer Science) माना जाता है।</div>\n              <div class=\"pyq-english\"><strong style=\"color: #38bdf8;\">Alan Turing</strong> is considered the father of modern computers.</div>\n            </div>\n            <span class=\"pyq-badge-source\">RRB NTPC 2021</span>\n          </div>\n\n          <!-- 14 -->\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #fbbf24;\">14.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\"><strong style=\"color: #86efac;\">डॉ. विजय भटकर (Dr. Vijay Bhatkar)</strong> को भारतीय सुपरकंप्यूटिंग का पितामह (Father of Indian Supercomputers) कहा जाता है।</div>\n              <div class=\"pyq-english\"><strong style=\"color: #38bdf8;\">Vijay Bhatkar</strong> is considered the father of Indian supercomputers.</div>\n            </div>\n            <span class=\"pyq-badge-source\">RRB NTPC 2021</span>\n          </div>\n\n          <!-- 15 -->\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #fbbf24;\">15.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">सुपरकंप्यूटर का प्राथमिक उपयोग <strong style=\"color: #86efac;\">मौसम पूर्वानुमान (Weather Forecasting) एवं जलवायु अनुसंधान</strong> जैसे जटिल वैज्ञानिक कार्यों में होता है।</div>\n              <div class=\"pyq-english\">Supercomputer is used for <strong style=\"color: #38bdf8;\">climate research and weather forecasting</strong>.</div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CHSL 2021</span>\n          </div>\n        </div>\n\n      </div>"},{"id":"m05","num":"M05","engTitle":"The 5 Computer Generations <span class=\"module-hindi\">(कंप्यूटर की 5 पीढ़ियां — V-T-I-V-U ट्रिक)","hindiTitle":"","badge":"","isHighPyq":true,"extraClass":"high-pyq","innerHtml":"<div class=\"module-header\">\n        <div class=\"module-title-box\">\n          <span class=\"module-number\">M05</span>\n          <span class=\"module-title\">The 5 Computer Generations <span class=\"module-hindi\">(कंप्यूटर की 5 पीढ़ियां — V-T-I-V-U ट्रिक)</span></span>\n        </div>\n        <span class=\"pyq-tag pyq-repeat-5\">🔥 Category 3 (12 PYQs) | 15+ बार पूछा गया विषय</span>\n      </div>\n      <div class=\"module-body\">\n        <table class=\"styled-table\">\n          <thead>\n            <tr>\n              <th>Generation / अवधि</th>\n              <th>मुख्य इलेक्ट्रॉनिक घटक</th>\n              <th>प्राथमिक मेमोरी</th>\n              <th>प्रोग्रामिंग भाषा</th>\n              <th>गति की इकाई</th>\n              <th>प्रमुख उदाहरण</th>\n            </tr>\n          </thead>\n          <tbody>\n            <tr>\n              <td><strong>1st Gen</strong><br>(1940–1956)</td>\n              <td><span class=\"hl-term\">Vacuum Tubes</span><br>(निर्वात नलिकाएं)</td>\n              <td>Magnetic Drums & Delay Lines</td>\n              <td>मशीन भाषा व असेंबली (0 और 1)</td>\n              <td>मिलीसेकंड<br><strong>(ms = 10⁻³ s)</strong></td>\n              <td>ENIAC, EDVAC, UNIVAC-1, IBM 701</td>\n            </tr>\n            <tr>\n              <td><strong>2nd Gen</strong><br>(1956–1963)</td>\n              <td><span class=\"hl-term\">Transistors (ट्रांजिस्टर)</span><br>(शॉकले, बार्डीन, ब्रैटन)</td>\n              <td>Magnetic Core & टेप</td>\n              <td>प्रारंभिक उच्च स्तरीय:<br><strong>FORTRAN, COBOL</strong></td>\n              <td>माइक्रोसेकंड<br><strong>(μs = 10⁻⁶ s)</strong></td>\n              <td>IBM 1401, IBM 1620, CDC 1604</td>\n            </tr>\n            <tr>\n              <td><strong>3rd Gen</strong><br>(1964–1971)</td>\n              <td><span class=\"hl-term\">Integrated Circuits (IC)</span><br>(जैक किल्बी व रॉबर्ट नोयस)</td>\n              <td>मैग्नेटिक कोर व सेमीकंडक्टर</td>\n              <td>High Level:<br><strong>BASIC, Pascal, PL/1</strong></td>\n              <td>नैनोसेकंड<br><strong>(ns = 10⁻⁹ s)</strong></td>\n              <td>IBM 360, PDP-8, TDC-316</td>\n            </tr>\n            <tr>\n              <td><strong>4th Gen</strong><br>(1971–वर्तमान)</td>\n              <td><span class=\"hl-term\">VLSI & Microprocessor</span><br>(वेरी लार्ज स्केल इंटीग्रेशन)</td>\n              <td>Semiconductor RAM / ROM</td>\n              <td>C, C++, SQL, RDBMS, GUI</td>\n              <td>पिकोसेकंड<br><strong>(ps = 10⁻¹² s)</strong></td>\n              <td>IBM PC, Apple II, Intel 8086, CRAY-1</td>\n            </tr>\n            <tr>\n              <td><strong>5th Gen</strong><br>(वर्तमान–भविष्य)</td>\n              <td><span class=\"hl-term\">ULSI, AI & Quantum</span><br>(अल्ट्रा लार्ज स्केल / क्यूबिट्स)</td>\n              <td>Optical Disc, Flash, Cloud</td>\n              <td>Natural Language, Python, AI</td>\n              <td>फेम्टोसेकंड /<br><strong>ExaFLOPS</strong></td>\n              <td>Robotics, Param Rudra, Fugaku, Quantum</td>\n            </tr>\n          </tbody>\n        </table>\n\n        <div class=\"grid-2col\" style=\"margin-top: 12px;\">\n          <div class=\"yct-card border-purple\">\n            <div class=\"yct-card-name\">💡 याद रखने की मास्टर ट्रिक: \"V-T-I-V-U\"</div>\n            <div style=\"font-size: 0.85rem; margin-top: 4px;\">\n              <strong>V</strong>acuum Tubes (1st) ➔ <strong>T</strong>ransistors (2nd) ➔ <strong>I</strong>Cs (3rd) ➔ <strong>V</strong>LSI / Microprocessor (4th) ➔ <strong>U</strong>LSI / AI (5th).\n            </div>\n          </div>\n\n          <div class=\"yct-card border-green\">\n            <div class=\"yct-card-name\">📈 गोल्डन ट्रेंड रूल (RRB का पसंदीदा प्रश्न)</div>\n            <div style=\"font-size: 0.85rem; margin-top: 4px;\">\n              जैसे-जैसे पीढ़ी बढ़ती है (1st ➔ 5th):<br>\n              <strong>आकार (Size):</strong> ⬇ घटता है | <strong>लागत (Cost):</strong> ⬇ घटती है | <strong>बिजली खपत:</strong> ⬇ घटती है | <strong>गति व विश्वसनीयता:</strong> ⬆ अत्यधिक बढ़ती है!\n            </div>\n          </div>\n        </div>\n        <!-- OFFICIAL PYQS ONELINER: GENERATIONS OF COMPUTERS (NON-RRB NTPC) -->\n        <div class=\"pyq-showcase-box\" style=\"margin-top: 18px; border-color: #10b981;\">\n          <div class=\"pyq-showcase-header\" style=\"border-bottom-color: rgba(16, 185, 129, 0.4);\">\n            <div class=\"pyq-showcase-title\" style=\"color: #34d399;\">\n              <span>🎯</span> OFFICIAL PYQS ONELINER\n            </div>\n            <span class=\"pyq-tag\" style=\"background: #10b981; color: #000; font-weight: 800;\">SSC, CPCT, UPSSSC, MPPSC & IBPS</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #34d399;\">1.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">प्रथम पीढ़ी (1st Gen) के कंप्यूटरों में प्रोग्रामिंग भाषा के रूप में किसका उपयोग किया जाता था? — <strong style=\"color: #86efac;\">मशीन कोड / मशीनी भाषा (Machine Language)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CHSL 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #34d399;\">2.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">प्रथम पीढ़ी के कंप्यूटरों में प्राथमिक स्टोरेज / मेमोरी डिवाइस के रूप में क्या प्रयुक्त होता था? — <strong style=\"color: #86efac;\">मैग्नेटिक ड्रम (Magnetic Drum)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">DSSSB Patwari 2020</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #34d399;\">3.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">प्रथम पीढ़ी के कंप्यूटरों में मुख्य इलेक्ट्रॉनिक स्विचिंग घटक क्या था? — <strong style=\"color: #86efac;\">वैक्यूम ट्यूब्स (Vacuum Tubes)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CHSL 2023 / CPCT</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #34d399;\">4.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">द्वितीय पीढ़ी (2nd Gen) के कंप्यूटरों में मुख्य इलेक्ट्रॉनिक घटक क्या प्रयुक्त हुआ था? — <strong style=\"color: #86efac;\">ट्रांजिस्टर (Transistor)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">MPPSC 2023 / SSC 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #34d399;\">5.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">Honeywell 400 किस पीढ़ी के कंप्यूटर सिस्टम का प्रमुख उदाहरण है? — <strong style=\"color: #86efac;\">द्वितीय पीढ़ी (Second Generation)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CHSL 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #34d399;\">6.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">द्वितीय पीढ़ी के कंप्यूटरों की मुख्य कार्य-अवधि (Working Life) क्या मानी जाती है? — <strong style=\"color: #86efac;\">1956 से 1964</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">UPSSSC 2018</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #34d399;\">7.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">कंप्यूटर के इतिहास में पहली बार CPU के निर्माण में इंटीग्रेटेड सर्किट (IC) का उपयोग किस पीढ़ी में हुआ? — <strong style=\"color: #86efac;\">तृतीय पीढ़ी (Third Generation)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">Rajasthan Police 2020 / IBPS</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #34d399;\">8.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">तृतीय पीढ़ी (3rd Gen) के कंप्यूटरों में किस प्रकार के ऑपरेटिंग सिस्टम का उपयोग शुरू हुआ? — <strong style=\"color: #86efac;\">टाइम-शेयरिंग सिस्टम (Time-Sharing OS)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">IBPS Bank Scale 2021</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #34d399;\">9.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">IBM 360 मेनफ्रेम कंप्यूटर किस पीढ़ी में विकसित किया गया था? — <strong style=\"color: #86efac;\">तृतीय पीढ़ी (Third Generation)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CHSL 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #34d399;\">10.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">Honeywell 6000 किस पीढ़ी के कंप्यूटरों के अंतर्गत विकसित हुआ था? — <strong style=\"color: #86efac;\">तृतीय पीढ़ी (Third Generation)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CHSL 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #34d399;\">11.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">Apple II पर्सनल कंप्यूटर किस पीढ़ी का प्रमुख उदाहरण है? — <strong style=\"color: #86efac;\">चतुर्थ पीढ़ी (Fourth Generation)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CHSL 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #34d399;\">12.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">ग्राफिकल यूजर इंटरफेस (GUI) का विकास किस पीढ़ी के कंप्यूटरों के दौरान हुआ था? — <strong style=\"color: #86efac;\">चतुर्थ पीढ़ी (Fourth Generation)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CHSL 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #34d399;\">13.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">नोटबुक (Notebook / Laptop) कंप्यूटर किस पीढ़ी के विकास की देन है? — <strong style=\"color: #86efac;\">चतुर्थ पीढ़ी (Fourth Generation)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">CPCT 2024</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #34d399;\">14.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">आर्टिफिशियल इंटेलिजेंस (AI) और क्वांटम कंप्यूटिंग जैसी उन्नत तकनीकें मुख्य रूप से किस पीढ़ी की विशेषता हैं? — <strong style=\"color: #86efac;\">पांचवीं पीढ़ी (Fifth Generation)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">UPPCL TG 2019</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #34d399;\">15.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">पांचवीं पीढ़ी के कंप्यूटरों में अन्य पीढ़ियों से मुख्य अंतर क्या है? — <strong style=\"color: #86efac;\">तकनीकी उन्नति (Technological Advancement / AI व ULSI)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">BPSC TGT 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #34d399;\">16.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">भारत का PARAM सुपरकंप्यूटर किस पीढ़ी के अंतर्गत आता है? — <strong style=\"color: #86efac;\">पांचवीं पीढ़ी (Fifth Generation)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CHSL 2021 / 2023</span>\n          </div>\n        </div>\n      </div>"},{"id":"m06","num":"M06","engTitle":"Classification of Computers <span class=\"module-hindi\">(कंप्यूटर का त्रि-आयामी वर्गीकरण)","hindiTitle":"","badge":"","isHighPyq":false,"extraClass":"","innerHtml":"<div class=\"module-header\">\n        <div class=\"module-title-box\">\n          <span class=\"module-number\">M06</span>\n          <span class=\"module-title\">Classification of Computers <span class=\"module-hindi\">(कंप्यूटर का त्रि-आयामी वर्गीकरण)</span></span>\n        </div>\n        <span class=\"pyq-tag pyq-repeat-5\">🔥 Category 13 (18 PYQs) | Hybrid, Mainframe & Embedded</span>\n      </div>\n      <div class=\"module-body\">\n        <div class=\"cards-grid\">\n          <!-- By Function -->\n          <div class=\"yct-card border-purple\">\n            <div class=\"yct-card-name\">1. कार्यप्रणाली के आधार पर (By Function)</div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>Analog Computer:</strong> भौतिक राशियों (तापमान, दाब, वोल्टेज) को लगातार मापता है। (उदा: स्पीडोमीटर, वोल्टमीटर).</div>\n              <div class=\"point-hi\"><strong>Digital Computer:</strong> बाइनरी अंकों (0 व 1) पर गणना करता है। उच्च सटीकता। (उदा: लैपटॉप, डेस्कटॉप).</div>\n              <div class=\"point-hi\"><strong>Hybrid Computer <span class=\"pyq-tag pyq-repeat-5\" style=\"font-size:0.65rem;\">RRB 5x</span>:</strong> Analog (मापन) + Digital (गणना) दोनों का संयोजन। <span class=\"hl-ans\">सर्वश्रेष्ठ उदाहरण: ICU अस्पताल मॉनिटर, पेट्रोल पंप मशीन, ECG/CT-स्कैन</span>।</div>\n            </div>\n          </div>\n\n          <!-- By Size -->\n          <div class=\"yct-card border-red\">\n            <div class=\"yct-card-name\">2. आकार व क्षमता के आधार पर (By Size)</div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>Microcomputer:</strong> एकल उपयोगकर्ता, एकल चिप। (PC, Laptop, Smartphone).</div>\n              <div class=\"point-hi\"><strong>Minicomputer:</strong> मध्यम आकार, बहु-उपयोगकर्ता (up to 200 users). (PDP-11).</div>\n              <div class=\"point-hi\"><strong>Mainframe Computer:</strong> <em>\"Big Iron\"</em> कहलाता है। विशाल डेटा और एक साथ लाखों लेन-देन संसाधित करता है। <span class=\"hl-ans\">उदा: रेलवे आरक्षण, कोर बैंकिंग प्रणाली</span>।</div>\n              <div class=\"point-hi\"><strong>Supercomputer:</strong> विश्व में सर्वाधिक शक्तिशाली, समानांतर प्रोसेसिंग। मौसम पूर्वानुमान व अनुसंधान।</div>\n            </div>\n          </div>\n\n          <!-- By Purpose -->\n          <div class=\"yct-card border-green\">\n            <div class=\"yct-card-name\">3. उद्देश्य के आधार पर (By Purpose)</div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>General Purpose:</strong> सामान्य दैनिक कार्यों (ऑफिस, टाइपिंग, पढ़ाई) हेतु।</div>\n              <div class=\"point-hi\"><strong>Special Purpose:</strong> विशिष्ट कार्य हेतु समर्पित (ATM, मिसाइल गाइडेंस).</div>\n              <div class=\"point-hi\"><strong>Embedded Computer:</strong> किसी बड़ी मशीन के अंदर स्थायी रूप से लगा माइक्रोकंट्रोलर। <span class=\"hl-ans\">उदा: वाशिंग मशीन, माइक्रोवेव, कार का ABS ब्रेक सिस्टम</span>।</div>\n              <div class=\"point-hi\"><strong>Quantum Computer:</strong> बिट्स के स्थान पर <span class=\"hl-term\">क्यूबिट्स (Qubits)</span> का उपयोग।</div>\n            </div>\n          </div>\n        </div>\n      </div>"},{"id":"m07","num":"M07","engTitle":"Supercomputing Titans: World & India <span class=\"module-hindi\">(सुपरकंप्यूटर: भारत एवं विश्व)","hindiTitle":"","badge":"","isHighPyq":true,"extraClass":"high-pyq","innerHtml":"<div class=\"module-header\">\n        <div class=\"module-title-box\">\n          <span class=\"module-number\">M07</span>\n          <span class=\"module-title\">Supercomputing Titans: World & India <span class=\"module-hindi\">(सुपरकंप्यूटर: भारत एवं विश्व)</span></span>\n        </div>\n        <span class=\"pyq-tag pyq-repeat-5\">🔥 PARAM Series, NSM & FLOPS</span>\n      </div>\n      <div class=\"module-body\">\n        <div class=\"grid-2col\">\n          <!-- India Supercomputing -->\n          <div class=\"yct-card border-red\">\n            <div class=\"yct-card-name\">🇮🇳 भारत की सुपरकंप्यूटिंग धरोहर (C-DAC & NSM)</div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\">• <strong>प्रथम सुपरकंप्यूटर:</strong> <span class=\"hl-ans\">PARAM 8000 (1991)</span> — C-DAC पुणे द्वारा डॉ. विजय भटकर के नेतृत्व में।</div>\n              <div class=\"point-hi\">• <strong>राष्ट्रीय सुपरकंप्यूटिंग मिशन (NSM):</strong> 2015 में शुरू, DST व MeitY द्वारा संचालित।</div>\n              <div class=\"point-hi\">• <strong>प्रमुख PARAM स्थापनाएं:</strong>\n                <br>&nbsp;&nbsp;PARAM Shivay ➔ IIT (BHU) वाराणसी\n                <br>&nbsp;&nbsp;PARAM Shakti ➔ IIT खड़गपुर\n                <br>&nbsp;&nbsp;PARAM Brahma ➔ IISER पुणे\n                <br>&nbsp;&nbsp;PARAM Siddhi-AI ➔ C-DAC पुणे (AI सुपरकंप्यूटर)\n              </div>\n              <div class=\"point-hi\">• <strong>मौसम पूर्वानुमान:</strong> <strong>प्रत्युष (Pratyush - 4.0 PF)</strong> IITM पुणे एवं <strong>मिहिर (Mihir - 2.8 PF)</strong> NCMRWF नोएडा।</div>\n              <div class=\"point-hi\">• <strong>नवीनतम 2024:</strong> पीएम मोदी द्वारा 3 <strong>PARAM Rudra</strong> (पुणे, दिल्ली, कोलकाता) तथा <strong>अर्क (Arka) व अरुणिका (Arunika)</strong> का उद्घाटन।</div>\n            </div>\n          </div>\n\n          <!-- World & Speed Metric -->\n          <div>\n            <div class=\"yct-card border-purple\" style=\"margin-bottom: 12px;\">\n              <div class=\"yct-card-name\">⚡ सुपरकंप्यूटर गति मापक: FLOPS</div>\n              <div class=\"bilingual-point\">\n                <div class=\"point-hi\"><strong>FLOPS:</strong> <span class=\"hl-ans\">Floating-Point Operations Per Second</span>.</div>\n                <div class=\"point-hi\">\n                  • 1 MegaFLOPS (MFLOPS) = 10⁶ ops/sec<br>\n                  • 1 GigaFLOPS (GFLOPS) = 10⁹ ops/sec<br>\n                  • 1 TeraFLOPS (TFLOPS) = 10¹² ops/sec<br>\n                  • 1 PetaFLOPS (PFLOPS) = 10¹⁵ ops/sec<br>\n                  • 1 ExaFLOPS (EFLOPS) = 10¹⁸ ops/sec\n                </div>\n              </div>\n            </div>\n\n            <div class=\"yct-card border-orange\">\n              <div class=\"yct-card-name\">🌍 विश्व के शीर्ष सुपरकंप्यूटर</div>\n              <div class=\"bilingual-point\">\n                <div class=\"point-hi\">• <strong>El Capitan (USA):</strong> विश्व का सबसे तेज (1.742 ExaFLOPS, AMD)</div>\n                <div class=\"point-hi\">• <strong>Frontier (USA):</strong> 1.206 ExaFLOPS (Oak Ridge Lab)</div>\n                <div class=\"point-hi\">• <strong>Aurora (USA):</strong> 1.012 ExaFLOPS (Intel/Argonne)</div>\n                <div class=\"point-hi\">• <strong>Fugaku (Japan):</strong> 442 PetaFLOPS (RIKEN/Fujitsu)</div>\n              </div>\n            </div>\n          </div>\n        </div>\n        <!-- OFFICIAL PYQS ONELINER: CLASSIFICATION & SUPERCOMPUTING (NON-RRB NTPC) -->\n        <div class=\"pyq-showcase-box\" style=\"margin-top: 18px; border-color: #ec4899;\">\n          <div class=\"pyq-showcase-header\" style=\"border-bottom-color: rgba(236, 72, 153, 0.4);\">\n            <div class=\"pyq-showcase-title\" style=\"color: #f472b6;\">\n              <span>🎯</span> OFFICIAL PYQS ONELINER\n            </div>\n            <span class=\"pyq-tag\" style=\"background: #ec4899; color: #fff; font-weight: 800;\">SSC, CPCT, DSSSB & UPSSSC</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #f472b6;\">1.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">डेस्कटॉप कंप्यूटर, लैपटॉप, टैबलेट और स्मार्टफोन किस श्रेणी के कंप्यूटर हैं? — <strong style=\"color: #86efac;\">माइक्रो-कंप्यूटर (Microcomputers)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CGL 2018</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #f472b6;\">2.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">किस प्रकार के कंप्यूटर को \"नोटबुक\" (Notebook) भी कहा जाता है? — <strong style=\"color: #86efac;\">लैपटॉप कंप्यूटर (Laptop)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CGL 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #f472b6;\">3.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">लैपटॉप की मुख्य पहचान / विशेषता क्या है? — <strong style=\"color: #86efac;\">पोर्टेबल, हल्का और ब्रीफकेस में आसानी से आ जाने वाला</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">CPCT 2021</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #f472b6;\">4.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">स्टाइलस अथवा डिजिटल पेन से इनपुट स्वीकार करने वाला अत्यधिक पोर्टेबल उपकरण कौन सा है? — <strong style=\"color: #86efac;\">टैबलेट (Tablet)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">CPCT 2021</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #f472b6;\">5.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">इनमें से कौन सा माइक्रो-कंप्यूटर की श्रेणी में नहीं आता है? — <strong style=\"color: #86efac;\">Cray-1 (यह विश्व प्रसिद्ध सुपरकंप्यूटर है)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">CPCT 2024</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #f472b6;\">6.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">इनमें से कौन सा पोर्टेबल कंप्यूटर नहीं है? — <strong style=\"color: #86efac;\">डेस्कटॉप कंप्यूटर (Desktop)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">CPCT 2024</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #f472b6;\">7.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">PDP-11 किस प्रकार के कंप्यूटर का प्रमुख उदाहरण है? — <st
