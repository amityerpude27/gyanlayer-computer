rong style=\"color: #86efac;\">मिनी-कंप्यूटर (Minicomputer)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">CPCT 2024</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #f472b6;\">8.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">बैंक, रेलवे और बड़े सरकारी संस्थानों द्वारा भारी मात्रा में डेटा प्रोसेसिंग के लिए कौन सा कंप्यूटर प्रयुक्त होता है? — <strong style=\"color: #86efac;\">मेनफ्रेम कंप्यूटर (Mainframe)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">CPCT 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #f472b6;\">9.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">सैन्य एजेंसियों और वैज्ञानिक अनुसंधान प्रयोगशालाओं में किस प्रकार के कंप्यूटर का उपयोग किया जाता था? — <strong style=\"color: #86efac;\">सुपरकंप्यूटर (Supercomputer)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">DSSSB Patwari 2020</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #f472b6;\">10.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">मौसम पूर्वानुमान और जलवायु अनुसंधान के लिए किस प्रकार के कंप्यूटर का उपयोग होता है? — <strong style=\"color: #86efac;\">सुपरकंप्यूटर (Supercomputer)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CHSL 2021</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #f472b6;\">11.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">विश्व में सुपरकंप्यूटिंग के जनक (Father of Supercomputing) के रूप में किसे जाना जाता है? — <strong style=\"color: #86efac;\">सीमोर क्रे (Seymour Cray)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CGL 2018</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #f472b6;\">12.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">1991 में विजय भटकर द्वारा विकसित भारत का पहला स्वदेशी सुपरकंप्यूटर कौन सा था? — <strong style=\"color: #86efac;\">PARAM 8000</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CGL 2018 / CPCT 2022</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #f472b6;\">13.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">भारत द्वारा निर्मित सुपरकंप्यूटर का प्रमुख उदाहरण कौन सा है? — <strong style=\"color: #86efac;\">PARAM Yuva 2</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CGL 2018</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #f472b6;\">14.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">भारत का पहला एनालॉग कंप्यूटर किसने डिज़ाइन किया था? — <strong style=\"color: #86efac;\">समरेंद्र कुमार मित्रा (Samarendra Kumar Mitra - ISI कोलकाता)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CHSL 2021</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #f472b6;\">15.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">सबसे सामान्य प्रकार का कंप्यूटर जो गणनाओं में बाइनरी संख्या प्रणाली का उपयोग करता है: — <strong style=\"color: #86efac;\">डिजिटल कंप्यूटर (Digital Computer)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">UPSSSC 2018</span>\n          </div>\n        </div>\n      </div>"},{"id":"m08","num":"M08","engTitle":"Von Neumann Architecture (1945) <span class=\"module-hindi\">(कंप्यूटर की मूल वास्तुकला)","hindiTitle":"","badge":"","isHighPyq":true,"extraClass":"high-pyq","innerHtml":"<div class=\"module-header\">\n        <div class=\"module-title-box\">\n          <span class=\"module-number\">M08</span>\n          <span class=\"module-title\">Von Neumann Architecture (1945) <span class=\"module-hindi\">(कंप्यूटर की मूल वास्तुकला)</span></span>\n        </div>\n        <span class=\"pyq-tag pyq-ch2\">🏛️ Computer Architecture Foundation | 5+ PYQ Repeat</span>\n      </div>\n      <div class=\"module-body\">\n        <div class=\"grid-2col\">\n          <div class=\"yct-card border-purple\">\n            <div class=\"yct-card-name\">The Stored-Program Concept (संग्रहीत प्रोग्राम संकल्पना)</div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>हिंदी:</strong> 1945 में गणितज्ञ <span class=\"hl-term\">जॉन वॉन न्यूमैन (John von Neumann)</span> ने आधुनिक कंप्यूटर की संरचना प्रस्तावित की।</div>\n              <div class=\"point-en\"><strong>English:</strong> In 1945, John von Neumann proposed the universal architecture for modern digital computers.</div>\n            </div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>मुख्य सिद्धांत:</strong> डेटा (Data) एवं निर्देश (Instructions) दोनों को एक ही मेमोरी में बाइनरी रूप में संग्रहीत किया जाता है।</div>\n              <div class=\"point-en\"><strong>Key Rule:</strong> Unified memory space stores both program instructions and data words in binary form.</div>\n            </div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>वॉन न्यूमैन बॉटलनेक (Bottleneck):</strong> सीपीयू की गति साझा सिस्टम बस की तुलना में बहुत तेज होती है, जिससे मेमोरी एक्सेस के दौरान गति में रुकावट आती है।</div>\n            </div>\n          </div>\n\n          <!-- Pure CSS Architecture Diagram -->\n          <div class=\"css-diagram\">\n            <div class=\"diagram-title\">Von Neumann Architecture Flow Diagram</div>\n            <div class=\"ipo-container\" style=\"flex-direction: column; gap: 10px;\">\n              <div style=\"display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;\">\n                <div class=\"ipo-node\" style=\"border-color: #3b82f6;\">\n                  <strong>INPUT UNIT</strong><br><span style=\"font-size:0.7rem;\">(Keyboard, Mouse)</span>\n                </div>\n                <span class=\"ipo-arrow\">➔</span>\n                <div style=\"border: 2px dashed #8b5cf6; background: rgba(139, 92, 246, 0.08); border-radius: 8px; padding: 10px;\">\n                  <div style=\"font-size: 0.75rem; font-weight: 800; color: #7c3aed; margin-bottom: 4px;\">CPU (CENTRAL PROCESSING UNIT)</div>\n                  <div style=\"display: flex; gap: 6px;\">\n                    <div class=\"ipo-node\" style=\"min-width: 75px; padding: 4px; border-color: #ec4899; font-size: 0.75rem;\"><strong>CU</strong><br>Control Unit</div>\n                    <div class=\"ipo-node\" style=\"min-width: 75px; padding: 4px; border-color: #10b981; font-size: 0.75rem;\"><strong>ALU</strong><br>Math/Logic</div>\n                  </div>\n                  <div class=\"ipo-node\" style=\"margin-top: 6px; padding: 4px; border-color: #f59e0b; font-size: 0.75rem;\"><strong>REGISTERS</strong> (Fastest Memory)</div>\n                </div>\n                <span class=\"ipo-arrow\">➔</span>\n                <div class=\"ipo-node\" style=\"border-color: #ef4444;\">\n                  <strong>OUTPUT UNIT</strong><br><span style=\"font-size:0.7rem;\">(Monitor, Printer)</span>\n                </div>\n              </div>\n              <div style=\"font-size: 0.75rem; color: var(--text-muted);\">\n                ↕ जुड़ी हुई है <strong>Primary Memory (RAM)</strong> एवं <strong>Secondary Storage (SSD/HDD)</strong> से\n              </div>\n            </div>\n          </div>\n        </div>\n      </div>"},{"id":"m09","num":"M09","engTitle":"CPU Deep Dive: ALU, CU & Internal Registers <span class=\"module-hindi\">(सीपीयू के घटक)","hindiTitle":"","badge":"","isHighPyq":true,"extraClass":"high-pyq","innerHtml":"<div class=\"module-header\">\n        <div class=\"module-title-box\">\n          <span class=\"module-number\">M09</span>\n          <span class=\"module-title\">CPU Deep Dive: ALU, CU & Internal Registers <span class=\"module-hindi\">(सीपीयू के घटक)</span></span>\n        </div>\n        <span class=\"pyq-tag pyq-repeat-5\">🔥 Category 6 (17 PYQs) | मस्तिष्क, नर्वस सिस्टम व रजिस्टर्स</span>\n      </div>\n      <div class=\"module-body\">\n        <div class=\"cards-grid\">\n          <!-- ALU -->\n          <div class=\"yct-card border-green\">\n            <div class=\"yct-card-head\">\n              <div>\n                <div class=\"yct-card-name\">1. ALU: Arithmetic Logic Unit</div>\n                <div class=\"yct-card-sub\">अंकगणितीय एवं तार्किक इकाई</div>\n              </div>\n              <span class=\"pyq-tag pyq-repeat-5\">RRB 5+ बार</span>\n            </div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>Arithmetic Unit (अंकगणित):</strong> जोड़ (+), घटाव (-), गुणा (*), एवं भाग (/) की क्रियाएं करता है।</div>\n              <div class=\"point-hi\"><strong>Logic Unit (तर्क):</strong> तुलनात्मक निर्णय जैसे बराबर (=), छोटा (&lt;), बड़ा (&gt;), तथा बूलियन ऑपरेशन्स (AND, OR, NOT) निष्पादित करता है।</div>\n              <div class=\"point-en\"><strong>Key Fact:</strong> Direct calculations take place strictly inside the ALU.</div>\n            </div>\n          </div>\n\n          <!-- CU -->\n          <div class=\"yct-card border-purple\">\n            <div class=\"yct-card-head\">\n              <div>\n                <div class=\"yct-card-name\">2. CU: Control Unit</div>\n                <div class=\"yct-card-sub\">ट्रैफिक पुलिस / तंत्रिका तंत्र (Nervous System)</div>\n              </div>\n              <span class=\"pyq-tag pyq-repeat-5\">RRB 5+ बार</span>\n            </div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>भूमिका:</strong> इसे कंप्यूटर का <strong>\"सुपरवाइजर\"</strong> या <strong>\"ट्रैफिक कंट्रोलर\"</strong> कहा जाता है। यह मेमोरी से निर्देश लाता है, उन्हें डिकोड करता है, और पूरे सिस्टम में नियंत्रण संकेत भेजता है।</div>\n              <div class=\"point-hi\"><span class=\"hl-warn\">परीक्षा का मुख्य बिंदु:</span> <strong>कंट्रोल यूनिट (CU) स्वयं कोई भी गणितीय या तार्किक गणना नहीं करता!</strong></div>\n              <div class=\"point-en\"><strong>English:</strong> Directs data flow and coordinates hardware via timing pulses. Never performs arithmetic itself!</div>\n            </div>\n          </div>\n\n          <!-- Registers -->\n          <div class=\"yct-card border-red\">\n            <div class=\"yct-card-head\">\n              <div>\n                <div class=\"yct-card-name\">3. Internal Registers</div>\n                <div class=\"yct-card-sub\">सबसे तीव्र मेमोरी (Fastest CPU Storage)</div>\n              </div>\n              <span class=\"pyq-tag pyq-repeat-5\">RRB 5+ बार</span>\n            </div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>Program Counter (PC):</strong> अगले निष्पादित होने वाले निर्देश का मेमोरी एड्रेस रखता है।</div>\n              <div class=\"point-hi\"><strong>Instruction Register (IR):</strong> वर्तमान में चल रहे निर्देश को रखता है।</div>\n              <div class=\"point-hi\"><strong>Accumulator (AC):</strong> ALU के मध्यवर्ती परिणामों को अस्थायी रूप से स्टोर करता है।</div>\n              <div class=\"point-hi\"><strong>MAR & MDR:</strong> मेमोरी एड्रेस व मेमोरी डेटा बफर रजिस्टर्स।</div>\n            </div>\n          </div>\n        </div>\n\n        <div class=\"facts-drive\">\n          <div class=\"facts-drive-title\">⚡ Hierarchy of Memory Speed (सबसे तेज से धीमी मेमोरी) — गोल्डन नियम</div>\n          <div class=\"facts-drive-content\">\n            <div class=\"facts-drive-item\">\n              <strong>1. CPU Registers</strong> (सर्वाधिक तीव्र) ➔ <strong>2. L1 Cache</strong> ➔ <strong>3. L2 Cache</strong> ➔ <strong>4. L3 Cache</strong> ➔ <strong>5. RAM (मुख्य मेमोरी)</strong> ➔ <strong>6. Solid State Drive (SSD)</strong> ➔ <strong>7. Hard Disk Drive (HDD)</strong> ➔ <strong>8. मैग्नेटिक टेप</strong>\n            </div>\n          </div>\n        </div>\n        <!-- ⭐ OFFICIAL ARCHITECTURE & CPU PYQ ONELINERS BOX -->\n        <div class=\"pyq-showcase-box\" style=\"border-color: #818cf8; margin-top: 20px;\">\n          <div class=\"pyq-showcase-header\" style=\"border-bottom-color: rgba(129, 140, 248, 0.4);\">\n            <div class=\"pyq-showcase-title\" style=\"color: #818cf8;\">\n              <span>🎯</span> OFFICIAL PYQS ONELINER\n            </div>\n            <span class=\"pyq-tag\" style=\"background: #818cf8; color: #000; font-weight: 800;\">SSC CGL 2025, CHSL 2024 & State PSCs</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #818cf8;\">1.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">कंप्यूटर का इलेक्ट्रॉनिक मस्तिष्क (Brain) अथवा हृदय किसे कहा जाता है, जो संपूर्ण डेटा प्रोसेसिंग के लिए उत्तरदायी है? — <strong style=\"color: #86efac;\">CPU (Central Processing Unit)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CGL 2025 / CHSL 2020</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #818cf8;\">2.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">CPU का सही और प्रामाणिक पूर्ण रूप क्या है? — <strong style=\"color: #86efac;\">Central Processing Unit (न कि Control Processing Unit)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">UP RO/ARO Pre 2021</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #818cf8;\">3.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">सेंट्रल प्रोसेसिंग यूनिट (CPU) के तीन मुख्य घटक कौन से होते हैं? — <strong style=\"color: #86efac;\">ALU, कंट्रोल यूनिट (CU) और रजिस्टर्स / मेमोरी</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">DSSSB TGT 2023 / SSC CGL 2025</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #818cf8;\">4.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">CPU के आंतरिक अंगों में कौन सा विषम (Odd One Out) है? — <strong style=\"color: #86efac;\">आउटपुट यूनिट (Output Unit - यह बाह्य पेरिफेरल है, जबकि ALU व CU आंतरिक हैं)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CHSL 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #818cf8;\">5.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">CPU में डेटा को प्रोसेसिंग के दौरान अत्यंत तीव्र गति से अस्थायी रूप से कौन संग्रहीत करता है? — <strong style=\"color: #86efac;\">रजिस्टर्स (Registers)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CGL 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #818cf8;\">6.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">रजिस्टर में नया डेटा लिखने (Writing) की प्रक्रिया क्या करती है? — <strong style=\"color: #86efac;\">रजिस्टर की पुरानी सामग्री को मिटा (Erase/Overwrite) देती है</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CHSL 2018</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #818cf8;\">7.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">कंट्रोल यूनिट (CU) का प्राथमिक और प्रमुख कार्य क्या है? — <strong style=\"color: #86efac;\">प्रोग्राम निर्देशों को डिकोड करना (Decode Program Instructions)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">UKPSC Pre 2021</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #818cf8;\">8.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">प्रोसेसर के सभी कार्यों व ऑपरेशन्स को निर्देशित एवं नियंत्रित करने वाला भाग कौन सा है? — <strong style=\"color: #86efac;\">कंट्रोल यूनिट (Control Unit - CU)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CGL 2023 / CHSL Tier-II 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #818cf8;\">9.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">ALU (Arithmetic Logic Unit) का मुख्य उद्देश्य क्या है? — <strong style=\"color: #86efac;\">अंकगणितीय गणनाएं एवं तार्किक तुलनाएं (Calculations & Comparisons) करना</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CHSL 2024 / HSSC 2021</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #818cf8;\">10.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">सेंट्रल प्रोसेसिंग यूनिट (CPU) का सबसे प्रारंभिक और सबसे पुराना प्रकार कौन सा है? — <strong style=\"color: #86efac;\">सिंगल कोर प्रोसेसर (Single Core CPU)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CGL 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #818cf8;\">11.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">CPU क्लॉक स्पीड एवं कैश मेमोरी पर नवीनतम प्रामाणिक तथ्य: — <strong style=\"color: #86efac;\">क्लॉक स्पीड निष्पादन गति नियंत्रित करती है, तथा कैश मेमोरी बार-बार प्रयुक्त डेटा को तीव्र एक्सेस देती है</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CGL (Tier-II) 18.01.2025</span>\n          </div>\n        </div>\n      </div>"},{"id":"m10","num":"M10","engTitle":"Microprocessor Architecture & Word Size <span class=\"module-hindi\">(माइक्रोप्रोसेसर व शब्द आकार)","hindiTitle":"","badge":"","isHighPyq":true,"extraClass":"high-pyq","innerHtml":"<div class=\"module-header\">\n        <div class=\"module-title-box\">\n          <span class=\"module-number\">M10</span>\n          <span class=\"module-title\">Microprocessor Architecture & Word Size <span class=\"module-hindi\">(माइक्रोप्रोसेसर व शब्द आकार)</span></span>\n        </div>\n        <span class=\"pyq-tag pyq-repeat-5\">🔥 Category 11 (18 PYQs) | Intel 4004, 32-bit vs 64-bit</span>\n      </div>\n      <div class=\"module-body\">\n        <div class=\"grid-2col\">\n          <div class=\"yct-card border-orange\">\n            <div class=\"yct-card-name\">माइक्रोप्रोसेसर क्या है? एवं इसका इतिहास</div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>परिभाषा:</strong> जब पूरा CPU एक एकल सिलिकॉन सेमीकंडक्टर IC चिप पर फैब्रिकेट किया जाता है, तो उसे माइक्रोप्रोसेसर कहते हैं।</div>\n              <div class=\"point-hi\">• <strong>विश्व का प्रथम माइक्रोप्रोसेसर:</strong> <span class=\"hl-ans\">Intel 4004 (1971)</span> — 4-बिट, 2300 ट्रांजिस्टर, टेड हॉफ (Ted Hoff), फेडेरिको फैगिन द्वारा डिजाइन।</div>\n              <div class=\"point-hi\">• <strong>8-बिट प्रोसेसर:</strong> Intel 8008 एवं 8085</div>\n              <div class=\"point-hi\">• <strong>16-बिट प्रोसेसर:</strong> Intel 8086 (x86 आर्किटेक्चर का जनक)</div>\n              <div class=\"point-hi\">• <strong>32-बिट प्रोसेसर:</strong> Intel 80386, Pentium</div>\n              <div class=\"point-hi\">• <strong>वर्तमान मानक:</strong> 64-बिट (x86-64 / AMD64, Intel Core i3/i5/i7/i9, Apple M-Series, ARM64)</div>\n            </div>\n          </div>\n\n          <div class=\"yct-card border-purple\">\n            <div class=\"yct-card-name\">Word Length (वर्ड साइज) एवं ISA</div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>Word Length:</strong> वह बिट्स की संख्या जिसे सीपीयू एक समय में समानांतर रूप से प्रोसेस कर सकता है (जैसे 32-bit या 64-bit)।</div>\n              <div class=\"point-hi\"><strong>32-बिट बनाम 64-बिट का अंतर:</strong><br>\n                • 32-बिट सीपीयू अधिकतम <span class=\"hl-warn\">4 GB RAM (2³² बाइट्स)</span> को एड्रेस कर सकता है।<br>\n                • 64-बिट सीपीयू सैद्धांतिक रूप से <span class=\"hl-ans\">16 Exabytes (2⁶⁴ बाइट्स) RAM</span> को सपोर्ट करता है!\n              </div>\n              <div class=\"point-hi\"><strong>ISA (निर्देश सेट आर्किटेक्चर):</strong><br>\n                • <strong>RISC (Reduced Instruction Set Computer):</strong> कम और सरल निर्देश (उदा: ARM, Apple M-Series).<br>\n                • <strong>CISC (Complex Instruction Set Computer):</strong> जटिल और विस्तृत निर्देश (उदा: Intel x86).\n              </div>\n            </div>\n          </div>\n        </div>\n      </div>"},{"id":"m11","num":"M11","engTitle":"Motherboard & PCB Architecture <span class=\"module-hindi\">(मदरबोर्ड एवं प्रिंटेड सर्किट बोर्ड)","hindiTitle":"","badge":"","isHighPyq":true,"extraClass":"high-pyq","innerHtml":"<div class=\"module-header\">\n        <div class=\"module-title-box\">\n          <span class=\"module-number\">M11</span>\n          <span class=\"module-title\">Motherboard & PCB Architecture <span class=\"module-hindi\">(मदरबोर्ड एवं प्रिंटेड सर्किट बोर्ड)</span></span>\n        </div>\n        <span class=\"pyq-tag pyq-repeat-5\">🔥 PCB & CMOS ★★★★★ बार-बार पूछा गया कोर प्रश्न</span>\n      </div>\n      <div class=\"module-body\">\n\n        <!-- ⭐ SUPER-HIGHLIGHTED PCB FEATURE BOX -->\n        <div class=\"super-highlight-banner\">\n          <div class=\"super-head\">\n            <div class=\"super-title\">\n              ⚡ PCB: PRINTED CIRCUIT BOARD (प्रिंटेड सर्किट बोर्ड) — मदरबोर्ड का आधार\n            </div>\n            <span class=\"pyq-tag pyq-repeat-5\" style=\"background: #dc2626; color: white;\">RRB NTPC, SSC CGL ★★★★★ 5+ बार पूछा गया</span>\n          </div>\n          <div class=\"bilingual-point\">\n            <div class=\"point-hi\" style=\"font-size: 0.95rem; font-weight: 600;\">\n              <strong>🎯 सीधा परीक्षा प्रश्न:</strong> \"कंप्यूटर का वह प्राथमिक सर्किट बोर्ड क्या कहलाता है जो सीपीयू, मेमोरी, हार्ड डिस्क और सभी बाह्य कार्ड्स को आपस में जोड़ता है?\" ➔ <span class=\"hl-ans\" style=\"font-size: 1rem;\">मदरबोर्ड / PCB (Printed Circuit Board)</span>।\n            </div>\n          </div>\n          <div class=\"grid-2col\" style=\"margin-top: 8px;\">\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\">• <strong>अन्य नाम:</strong> इसे <strong>Mainboard (मेनबोर्ड)</strong> या <strong>System Board (सिस्टम बोर्ड)</strong> भी कहा जाता है। यह पूरे कंप्यूटर की 'रीढ़ की हड्डी' (Backbone) है।</div>\n              <div class=\"point-en\">• <strong>Definition:</strong> The primary Printed Circuit Board (PCB) in a computer that houses the CPU socket, memory slots, chipsets, and links all subsystems.</div>\n            </div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\">• <strong>तांबे के ट्रैक (Copper Traces):</strong> मदरबोर्ड पर दिखने वाली पतली रेखाएं वस्तुतः तांबे के विद्युत चालक पथ हैं जो सिस्टम बसों (Buses) का निर्माण करते हैं।</div>\n              <div class=\"point-en\">• <strong>Hardware Hub:</strong> Every internal and external component (GPU, RAM, SSD, Keyboard, Monitor) directly or indirectly docks into the PCB.</div>\n            </div>\n          </div>\n        </div>\n\n        <div class=\"grid-2col\">\n          <!-- Motherboard Components -->\n          <div>\n            <table class=\"styled-table\">\n              <thead>\n                <tr>\n                  <th>घटक (Component)</th>\n                  <th>परीक्षा उपयोगी कार्य (Function)</th>\n                </tr>\n              </thead>\n              <tbody>\n                <tr>\n                  <td><strong>CPU Socket</strong></td>\n                  <td>ZIF (Zero Insertion Force) सॉकेट जिसमें प्रोसेसर स्थापित किया जाता है।</td>\n                </tr>\n                <tr>\n                  <td><strong>DIMM Slots</strong></td>\n                  <td>RAM स्टिक्स लगाने वाले स्लॉट (Dual In-line Memory Module)।</td>\n                </tr>\n                <tr>\n                  <td><strong>PCIe Slots</strong></td>\n                  <td>ग्राफिक्स कार्ड, साउंड कार्ड आदि लगाने हेतु उच्च गति एक्सपेंशन स्लॉट।</td>\n                </tr>\n                <tr>\n                  <td><strong>SMPS</strong></td>\n                  <td>Switched-Mode Power Supply — घर के AC करंट को कंप्यूटर के लिए आवश्यक DC करंट में बदलता है।</td>\n                </tr>\n              </tbody>\n            </table>\n          </div>\n\n          <div>\n            <!-- CMOS Box -->\n            <div class=\"yct-card border-yellow\" style=\"margin-bottom: 12px;\">\n              <div class=\"yct-card-head\">\n                <div class=\"yct-card-name\">CMOS Battery & RTC (रियल टाइम क्लॉक)</div>\n                <span class=\"pyq-tag pyq-repeat-5\">RRB 4 बार</span>\n              </div>\n              <div class=\"bilingual-point\">\n                <div class=\"point-hi\"><strong>CMOS:</strong> Complementary Metal-Oxide-Semiconductor.</div>\n                <div class=\"point-hi\"><strong>बैटरी:</strong> छोटा 3-वोल्ट लिथियम सिक्का सेल (CR2032)।</div>\n                <div class=\"point-hi\"><strong>कार्य:</strong> जब कंप्यूटर बंद या अनप्लग्ड होता है, तब भी यह <strong>Real-Time Clock (RTC)</strong> को चालू रखता है और BIOS की सेटिंग्स (तारीख, समय, बूट आर्डर) को सुरक्षित रखता है।</div>\n              </div>\n            </div>\n\n            <!-- BIOS Box -->\n            <div class=\"yct-card border-purple\">\n              <div class=\"yct-card-head\">\n                <div class=\"yct-card-name\">BIOS & POST फर्मवेयर</div>\n                <span class=\"pyq-tag pyq-repeat-5\">RRB 4 बार</span>\n              </div>\n              <div class=\"bilingual-point\">\n                <div class=\"point-hi\"><strong>BIOS:</strong> Basic Input/Output System (ROM चिप में स्थायी रूप से स्टोर).</div>\n                <div class=\"point-hi\"><strong>POST:</strong> Power-On Self-Test — कंप्यूटर स्टार्ट होते ही सभी हार्डवेयर घटकों (RAM, कीबोर्ड आदि) की कार्यक्षमता की स्वचालित जांच करता है।</div>\n                <div class=\"point-hi\"><strong>आधुनिक रूप:</strong> UEFI (Unified Extensible Firmware Interface).</div>\n              </div>\n            </div>\n          </div>\n        </div>\n        <!-- OFFICIAL PYQS ONELINER: MOTHERBOARD & MICROPROCESSOR -->\n        <div class=\"pyq-showcase-box\" style=\"margin-top: 18px; border-color: #f59e0b;\">\n          <div class=\"pyq-showcase-header\" style=\"border-bottom-color: rgba(245, 158, 11, 0.4);\">\n            <div class=\"pyq-showcase-title\" style=\"color: #fbbf24;\">\n              <span>🎯</span> OFFICIAL PYQS ONELINER\n            </div>\n            <span class=\"pyq-tag\" style=\"background: #f59e0b; color: #000; font-weight: 800;\">SSC CGL, CHSL, UPSSSC & DSSSB</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #fbbf24;\">1.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">कंप्यूटर का मुख्य प्रिंटेड सर्किट बोर्ड (PCB) क्या कहलाता है जो सभी घटकों की रीढ़ (Backbone) है? — <strong style=\"color: #86efac;\">मदरबोर्ड (Motherboard)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CGL 2018</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #fbbf24;\">2.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">CPU और रैम (RAM) मॉड्यूल सीधे किस मुख्य सर्किट बोर्ड से जुड़े होते हैं? — <strong style=\"color: #86efac;\">मदरबोर्ड (Motherboard)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CHSL 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #fbbf24;\">3.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">कंप्यूटर के आवश्यक प्रोसेसिंग घटकों को धारण करने वाला प्रमुख सर्किट बोर्ड कौन सा है? — <strong style=\"color: #86efac;\">मदरबोर्ड (Motherboard)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CHSL 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #fbbf24;\">4.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">एकल IC चिप पर निर्मित संपूर्ण CPU को क्या कहा जाता है? — <strong style=\"color: #86efac;\">माइक्रोप्रोसेसर (Microprocessor)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">DSSSB Patwari 2022</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #fbbf24;\">5.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">CPU / माइक्रोप्रोसेसर की गति (Clock Speed) किसमें मापी जाती है? — <strong style=\"color: #86efac;\">मेगाहर्ट्ज़ (MHz) अथवा गीगाहर्ट्ज़ (GHz)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC Selection Post 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #fbbf24;\">6.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">उच्च शक्ति वाले माइक्रोप्रोसेसर (High Power Microprocessor) के प्रमुख उदाहरण: — <strong style=\"color: #86efac;\">Pentium, Pentium Pro, Pentium II एवं III</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">UPSSSC 2019</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #fbbf24;\">7.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">माइक्रोप्रोसेसर जिन निर्देशों के पूर्वनिर्धारित सेट पर संचालन निष्पादित करता है, उस संरचना को क्या कहा जाता है? — <strong style=\"color: #86efac;\">ISA (Instruction Set Architecture)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">DSSSB 2023</span>\n          </div>\n        </div>\n      </div>"},{"id":"m12","num":"M12","engTitle":"System Buses: Data, Address & Control <span class=\"module-hindi\">(सिस्टम बस प्रणाली)","hindiTitle":"","badge":"","isHighPyq":true,"extraClass":"high-pyq","innerHtml":"<div class=\"module-header\">\n        <div class=\"module-title-box\">\n          <span class=\"module-number\">M12</span>\n          <span class=\"module-title\">System Buses: Data, Address & Control <span class=\"module-hindi\">(सिस्टम बस प्रणाली)</span></span>\n        </div>\n        <span class=\"pyq-tag pyq-repeat-5\">🔥 Category 10 (9 PYQs) | द्विदिशीय बनाम एकदिशीय (High Repeat)</span>\n      </div>\n      <div class=\"module-body\">\n        <p style=\"font-size: 0.86rem; color: var(--text-muted); margin-bottom: 12px;\">\n          <strong>बस (Bus):</strong> मदरबोर्ड पर प्रिंटेड समानांतर तांबे की तारों का समूह जो बाइनरी विद्युत संकेतों को एक घटक से दूसरे घटक तक ले जाता है।\n        </p>\n\n        <div class=\"cards-grid\">\n          <!-- Data Bus -->\n          <div class=\"yct-card border-red\">\n            <div class=\"yct-card-head\">\n              <div>\n                <div class=\"yct-card-name\">1. Data Bus (डेटा बस)</div>\n                <div class=\"yct-card-sub\">Bidirectional (द्विदिशीय ↔)</div>\n              </div>\n              <span class=\"pyq-tag pyq-repeat-5\">RRB 5+ बार</span>\n            </div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>दिशा:</strong> <span class=\"hl-ans\">द्विदिशीय (Bidirectional ↔)</span> — डेटा CPU से मेमोरी की ओर और मेमोरी से CPU की ओर, दोनों तरफ यात्रा करता है।</div>\n              <div class=\"point-hi\"><strong>कार्य:</strong> वास्तविक डेटा मानों व ऑपरेंड्स को स्थानांतरित करना।</div>\n              <div class=\"point-hi\"><strong>बस चौड़ाई:</strong> बस की चौड़ाई (32-बिट, 64-बिट) डेटा ट्रांसफर की गति निर्धारित करती है।</div>\n            </div>\n          </div>\n\n          <!-- Address Bus -->\n          <div class=\"yct-card border-red\">\n            <div class=\"yct-card-head\">\n              <div>\n                <div class=\"yct-card-name\">2. Address Bus (पता बस)</div>\n                <div class=\"yct-card-sub\">Unidirectional (एकदिशीय ➔)</div>\n              </div>\n              <span class=\"pyq-tag pyq-repeat-5\">RRB 5+ बार</span>\n            </div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>दिशा:</strong> <span class=\"hl-warn\">एकदिशीय (Unidirectional ➔)</span> — मेमोरी एड्रेस हमेशा केवल <strong>CPU से बाहर मेमोरी/डिवाइस की ओर</strong> जाता है।</div>\n              <div class=\"point-hi\"><strong>कार्य:</strong> यह निर्दिष्ट करना कि डेटा को किस मेमोरी लोकेशन से पढ़ना (Read) या किसमें लिखना (Write) है।</div>\n              <div class=\"point-hi\"><strong>क्षमता:</strong> 2ⁿ एड्रेस (32-बिट बस = 4 GB मेमोरी स्पेस)।</div>\n            </div>\n          </div>\n\n          <!-- Control Bus -->\n          <div class=\"yct-card border-green\">\n            <div class=\"yct-card-head\">\n              <div>\n                <div class=\"yct-card-name\">3. Control Bus (नियंत्रण बस)</div>\n                <div class=\"yct-card-sub\">टाइमिंग एवं नियंत्रण संकेत</div>\n              </div>\n              <span class=\"pyq-tag pyq-repeat-3\">RRB 3 बार</span>\n            </div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>दिशा:</strong> बहुदिशीय / समर्पित लाइन्स।</div>\n              <div class=\"point-hi\"><strong>कार्य:</strong> कंट्रोल यूनिट द्वारा उत्पन्न समय चक्र व नियंत्रण संकेत ले जाना (उदा: Memory Read, Memory Write, I/O Read, Interrupt Request - IRQ, Clock)।</div>\n            </div>\n          </div>\n        </div>\n\n        <div class=\"examiner-trap\">\n          <div class=\"examiner-trap-title\">⚠️ EXAMINER'S TRAP: बस की दिशा (Direction) पर 100% प्रश्न आता है!</div>\n          • <strong>डेटा बस (Data Bus):</strong> <span class=\"hl-ans\">द्विदिशीय (Bidirectional ↔)</span> — दोनों तरफ डेटा ले जाती है।<br>\n          • <strong>एड्रेस बस (Address Bus):</strong> <span class=\"hl-warn\">एकदिशीय (Unidirectional ➔)</span> — केवल CPU से मेमोरी की ओर जाती है।<br>\n          • <strong>कंट्रोल बस (Control Bus):</strong> नियंत्रण व टाइमिंग सिग्नल वहन करती है।\n        </div>\n        <!-- OFFICIAL PYQS ONELINER: SYSTEM BUSES -->\n        <div class=\"pyq-showcase-box\" style=\"margin-top: 18px; border-color: #06b6d4;\">\n          <div class=\"pyq-showcase-header\" style=\"border-bottom-color: rgba(6, 182, 212, 0.4);\">\n            <div class=\"pyq-showcase-title\" style=\"color: #22d3ee;\">\n              <span>🎯</span> OFFICIAL PYQS ONELINER\n            </div>\n            <span class=\"pyq-tag\" style=\"background: #06b6d4; color: #000; font-weight: 800;\">SSC CGL 2023, CHSL 2023 & HSSC</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #22d3ee;\">1.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">सिस्टम बस (System Bus) का सबसे सटीक वर्णन क्या है? — <strong style=\"color: #86efac;\">एड्रेस बस, डेटा बस और कंट्रोल बस का संयुक्त संयोजन</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CGL 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #22d3ee;\">2.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">समानांतर तारों का वह समूह जो बिट्स को एक साथ वहन करके उपकरणों के बीच संचार पथ प्रदान करता है: — <strong style=\"color: #86efac;\">सिस्टम बस (System Bus)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CGL 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #22d3ee;\">3.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">CPU और मुख्य मेमोरी के बीच मेमोरी एड्रेस स्थानांतरित करने वाली एकदिशीय बस कौन सी है? — <strong style=\"color: #86efac;\">एड्रेस बस (Address Bus ➔)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CHSL 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #22d3ee;\">4.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">CPU और मेमोरी के बीच वास्तविक डेटा स्थानांतरित करने वाला द्विदिशीय पथ कौन सा है? — <strong style=\"color: #86efac;\">डेटा बस (Data Bus ↔)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">HSSC 2021</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #22d3ee;\">5.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">बाह्य उपकरणों, पेरिफेरल्स, एक्सपेंशन स्लॉट्स और I/O पोर्ट्स को जोड़ने वाली बस: — <strong style=\"color: #86efac;\">एक्सटर्नल बस / एक्सपेंशन बस (External Bus)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">HSSC 2021</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #22d3ee;\">6.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">कंट्रोल बस (Control Bus) पर कौन सी महत्वपूर्ण सिग्नल लाइन स्थित होती है? — <strong style=\"color: #86efac;\">रीड/राइट कंट्रोल लाइन (Read/Write Line)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">DSSSB 2023</span>\n          </div>\n        </div>\n      </div>"},{"id":"m13","num":"M13","engTitle":"The Instruction Cycle / Machine Cycle <span class=\"module-hindi\">(निर्देश चक्र — 4 चरण)","hindiTitle":"","badge":"","isHighPyq":true,"extraClass":"high-pyq","innerHtml":"<div class=\"module-header\">\n        <div class=\"module-title-box\">\n          <span class=\"module-number\">M13</span>\n          <span class=\"module-title\">The Instruction Cycle / Machine Cycle <span class=\"module-hindi\">(निर्देश चक्र — 4 चरण)</span></span>\n        </div>\n        <span class=\"pyq-tag pyq-repeat-5\">🔥 Category 8 (7 PYQs) | Fetch ➔ Decode ➔ Execute ➔ Store</span>\n      </div>\n      <div class=\"module-body\">\n        <p style=\"font-size: 0.86rem; color: var(--text-muted); margin-bottom: 12px;\">\n          <strong>निर्देश चक्र (Machine Cycle):</strong> एक निर्देश को पूरा करने के लिए सीपीयू द्वारा दोहराई जाने वाली 4 चरणों की बुनियादी प्रक्रिया:\n        </p>\n\n        <!-- 4 Step Circular Flow -->\n        <div class=\"cycle-flow-container\">\n          <div class=\"cycle-step step-1\">\n            <div class=\"step-num\">STEP 01</div>\n            <div class=\"step-name\">1. FETCH (लाना)</div>\n            <div class=\"step-desc-hi\">मेमोरी (RAM) से निर्देश को सीपीयू के <strong>Instruction Register (IR)</strong> में लाना। Program Counter अगला पता लोड करता है।</div>\n            <div class=\"step-desc-en\">CPU fetches opcode from RAM into IR; PC increments.</div>\n          </div>\n\n          <div class=\"cycle-step step-2\">\n            <div class=\"step-num\">STEP 02</div>\n            <div class=\"step-name\">2. DECODE (व्याख्या)</div>\n            <div class=\"step-desc-hi\"><strong>Control Unit (CU)</strong> निर्देश को समझता है कि क्या कार्य करना है और किस डेटा की आवश्यकता है।</div>\n            <div class=\"step-desc-en\">Control Unit decodes instruction opcode & identifies operands.</div>\n          </div>\n\n          <div class=\"cycle-step step-3\">\n            <div class=\"step-num\">STEP 03</div>\n            <div class=\"step-name\">3. EXECUTE (निष्पादन)</div>\n            <div class=\"step-desc-hi\"><strong>ALU</strong> वास्तविक गणितीय या तार्किक गणना को अंजाम देता है।</div>\n            <div class=\"step-desc-en\">ALU executes the arithmetic or logic operation.</div>\n          </div>\n\n          <div class=\"cycle-step step-4\">\n            <div class=\"step-num\">STEP 04</div>\n            <div class=\"step-name\">4. STORE (संग्रहण)</div>\n            <div class=\"step-desc-hi\">गणना के अंतिम परिणाम को रजिस्टर या मेमोरी (RAM) में वापस सुरक्षित (Write-back) करना।</div>\n            <div class=\"step-desc-en\">Results are written back to memory or register.</div>\n          </div>\n        </div>\n\n        <div class=\"facts-drive\">\n          <div class=\"facts-drive-title\">⚡ पाइपलाइनिंग (Pipelining) का संकल्प</div>\n          <div class=\"facts-drive-content\">\n            <div class=\"facts-drive-item\">• <strong>Pipelining:</strong> आधुनिक सीपीयू एक ही समय में कई निर्देशों को समानांतर चरणों में चलाते हैं (जैसे एक निर्देश को Execute करते समय ही अगले निर्देश को Fetch करना)। इससे सीपीयू की कार्यक्षमता कई गुना बढ़ जाती है।</div>\n          </div>\n        </div>\n      </div>"},{"id":"m14","num":"M14","engTitle":"Computer Ports & Official Exam PYQs <span class=\"module-hindi\">(कंप्यूटर पोर्ट्स एवं 6 प्रामाणिक PYQs)","hindiTitle":"","badge":"","isHighPyq":true,"extraClass":"high-pyq","innerHtml":"<div class=\"module-header\">\n        <div class=\"module-title-box\">\n          <span class=\"module-number\">M14</span>\n          <span class=\"module-title\">Computer Ports & Official Exam PYQs <span class=\"module-hindi\">(कंप्यूटर पोर्ट्स एवं 6 प्रामाणिक PYQs)</span></span>\n        </div>\n        <span class=\"pyq-tag pyq-repeat-5\">🔥 SSC CGL 2023, CPCT 2024 & DSSSB Hits</span>\n      </div>\n      <div class=\"module-body\">\n        <div class=\"cards-grid\">\n          <!-- USB -->\n          <div class=\"yct-card border-blue\">\n            <div class=\"yct-card-head\">\n              <div>\n                <div class=\"yct-card-name\">USB: Universal Serial Bus</div>\n                <div class=\"yct-card-sub\">हॉट-स्वैपेबल / प्लग एंड प्ले</div>\n              </div>\n              <span class=\"pyq-tag pyq-repeat-3\">RRB</span>\n            </div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\">• <strong>Hot-swappable:</strong> कंप्यूटर चालू रहते हुए भी डिवाइस को जोड़ा और हटाया जा सकता है।</div>\n              <div class=\"point-hi\">• <strong>USB 2.0:</strong> 480 Mbps गति | <strong>USB 3.0:</strong> 5 Gbps (<span class=\"hl-term\">नीले रंग का पोर्ट</span>)</div>\n              <div class=\"point-hi\">• <strong>USB Type-C:</strong> 24-पिन, रिवर्सिबल (उल्टा-सीधा दोनों तरफ लगता है), 40 Gbps तक गति, डेटा + चार्जिंग + वीडियो ट्रांसफर।</div>\n            </div>\n          </div>\n\n          <!-- HDMI -->\n          <div class=\"yct-card border-purple\">\n            <div class=\"yct-card-head\">\n              <div>\n                <div class=\"yct-card-name\">HDMI Port (हाई डेफिनिशन मल्टीमीडिया)</div>\n                <div class=\"yct-card-sub\">एक ही केबल में वीडियो + ऑडियो</div>\n              </div>\n              <span class=\"pyq-tag pyq-repeat-5\">RRB 4 बार</span>\n            </div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>HDMI:</strong> High-Definition Multimedia Interface.</div>\n              <div class=\"point-hi\"><strong>प्रमुख विशेषता:</strong> एक ही केबल से <strong>डिजिटल वीडियो और मल्टी-चैनल डिजिटल ऑडियो दोनों</strong> को असंपीड़ित (Uncompressed) रूप में प्रसारित करता है। (19 पिन्स).</div>\n            </div>\n          </div>\n\n          <!-- VGA -->\n          <div class=\"yct-card border-red\">\n            <div class=\"yct-card-head\">\n              <div>\n                <div class=\"yct-card-name\">VGA Port (वीडियो ग्राफिक्स ऐरे)</div>\n                <div class=\"yct-card-sub\">केवल एनालॉग वीडियो (15 पिन्स)</div>\n              </div>\n              <span class=\"pyq-tag pyq-repeat-5\">SSC CGL 2023</span>\n            </div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\"><strong>पिन्स की संख्या:</strong> <span class=\"hl-ans\">15 पिन्स (3 पंक्तियों में 5-5 पिन्स)</span> D-सब कनेक्टर।</div>\n              <div class=\"point-hi\"><strong>सिग्नल:</strong> केवल <span class=\"hl-warn\">एनालॉग वीडियो (Analog Only)</span> — इसमें कोई ऑडियो नहीं जाता। सामान्यतः नीले रंग का होता है।</div>\n            </div>\n          </div>\n\n          <!-- Parallel & PS/2 -->\n          <div class=\"yct-card border-yellow\">\n            <div class=\"yct-card-head\">\n              <div>\n                <div class=\"yct-card-name\">Parallel & PS/2 Ports</div>\n                <div class=\"yct-card-sub\">लाइन प्रिंटर व माउस पोर्ट्स</div>\n              </div>\n              <span class=\"pyq-tag pyq-repeat-5\">SSC CGL 2023</span>\n            </div>\n            <div class=\"bilingual-point\">\n              <div class=\"point-hi\">• <span class=\"hl-ans\">Parallel Port (DB-25):</span> 25-पिन फीमेल पोर्ट, 8 या अधिक डेटा तारों को जोड़कर उच्च गति ट्रांसमिशन देता है। इसे <span class=\"hl-term\">\"Line Printer Port\" (LPT)</span> कहते हैं।</div>\n              <div class=\"point-hi\">• <span class=\"hl-term\">PS/2 Port:</span> 6-पिन मिनी-डीआईएन कनेक्टर। इसे <span class=\"hl-term\">Mouse Port</span> भी कहा जाता है। (बैंगनी = कीबोर्ड, हरा = माउस)।</div>\n              <div class=\"point-hi\">• <span class=\"hl-term\">Ethernet / RJ-45:</span> 8P8C मॉड्यूलर कनेक्टर, वायर्ड लोकल एरिया नेटवर्क (LAN) हेतु (10/100/1000 Mbps)।</div>\n            </div>\n          </div>\n        </div>\n\n        <!-- ⭐ OFFICIAL COMPUTER PORTS & HARDWARE PYQS ONELINERS BOX -->\n        <div class=\"pyq-showcase-box\" style=\"border-color: #38bdf8;\">\n          <div class=\"pyq-showcase-header\" style=\"border-bottom-color: rgba(56, 189, 248, 0.4);\">\n            <div class=\"pyq-showcase-title\" style=\"color: #38bdf8;\">\n              <span>🎯</span> OFFICIAL PYQS ONELINER\n            </div>\n            <span class=\"pyq-tag pyq-ch2\" style=\"background: #38bdf8; color: #000; font-weight: 800;\">SSC CGL 2023, CPCT 2024, DSSSB & UPSSSC</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #38bdf8;\">1.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">साउंड कार्ड (Sound Card) का मुख्य कार्य क्या होता है? — <strong style=\"color: #86efac;\">माइक्रोफ़ोन से एनालॉग ऑडियो सिग्नल को डिजिटल कोड में बदलना (और इसके विपरीत)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">DSSSB Patwari 2022</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #38bdf8;\">2.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">कंप्यूटर से गाने या ऑडियो सुनने के लिए सिस्टम में किस घटक का स्थापित होना अनिवार्य है? — <strong style=\"color: #86efac;\">साउंड कार्ड (Sound Card)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">CPCT 2024</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #38bdf8;\">3.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">पैरेलल पोर्ट (Parallel Port / 25-पिन DB-25) को अन्य किस नाम से जाना जाता है? — <strong style=\"color: #86efac;\">लाइन प्रिंटर पोर्ट (Line Printer Port / LPT)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CGL 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #38bdf8;\">4.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">उच्च गति डेटा संचरण हेतु पैरेलल पोर्ट कितने समानांतर तारों का उपयोग करता है? — <strong style=\"color: #86efac;\">8 डेटा तार (8 Bits / 1 Byte एक साथ)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">DSSSB Patwari 2022</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #38bdf8;\">5.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">लंबी दूरी पर धीमी गति से एक समय में एक बाइट का केवल एक बिट (Single Bit Stream) भेजने वाला पोर्ट: — <strong style=\"color: #86efac;\">सीरियल पोर्ट (Serial Port / RS-232)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CGL 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #38bdf8;\">6.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">PS/2 पोर्ट (6-पिन मिनी-DIN) को मुख्य रूप से किस बाह्य उपकरण को जोड़ने के लिए जाना जाता है? — <strong style=\"color: #86efac;\">माउस पोर्ट (हरा रंग) एवं कीबोर्ड पोर्ट (बैंगनी रंग)</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">SSC CGL 2023</span>\n          </div>\n\n          <div class=\"pyq-item-row\">\n            <span class=\"pyq-item-num\" style=\"color: #38bdf8;\">7.</span>\n            <div class=\"pyq-item-content\">\n              <div class=\"pyq-hindi\">पावर स्ट्रिप (Power Strip) क्या है? — <strong style=\"color: #86efac;\">एक विद्युत उपकरण जो दीवार सॉकेट की क्षमता बढ़ाकर एक साथ कई डिवाइस को जोड़ने की सुविधा देता है</strong></div>\n            </div>\n            <span class=\"pyq-badge-source\">UPSSSC 2019</span>\n          </div>\n        </div>\n      </div>"},{"id":"m15","num":"M15","engTitle":"CPU Performance & Core Exam Abbreviations <span class=\"module-hindi\">(प्रदर्शन निर्धारक एवं प्रमाणित फुल फॉर्म)","hindiTitle":"","badge":"","isHighPyq":true,"extraClass":"high-pyq","innerHtml":"<div class=\"module-header\">\n        <div class=\"module-title-box\">\n          <span class=\"module-number\">M15</span>\n          <span class=\"module-title\">CPU Performance & Core Exam Abbreviations <span class=\"module-hindi\">(प्रदर्शन निर्धारक एवं प्रमाणित फुल फॉर्म)</span></span>\n        </div>\n        <span class=\"pyq-tag pyq-repeat-5\">🔥 Verified High-Yield Exam Abbreviations</span>\n      </div>\n      <div class=\"module-body\">\n\n        <!-- CPU Performance Factor Meters -->\n        <h4 style=\"font-size: 0.95rem; font-weight: 800; margin-bottom: 10px; color: var(--primary);\">\n          ⚡ सीपीयू प्रदर्शन को निर्धारित करने वाले प्रमुख कारक (Factors Affecting CPU Performance)\n        </h4>\n\n        <div class=\"grid-2col\" style=\"margin-bottom: 16px;\">\n          <div>\n            <div class=\"perf-meter-card\">\n              <div class=\"perf-head\">\n                <span>1. Clock Speed (घड़ी की गति) <span class=\"pyq-tag pyq-repeat-5\" style=\"font-size:0.62rem;\">RRB 5x</span></span>\n                <span style=\"color: #2563eb; font-weight: 800;\">Gigahertz (GHz)</span>\n              </div>\n              <div class=\"perf-bar-bg\"><div class=\"perf-bar-fill\" style=\"width: 95%; background: #2563eb;\"></div></div>\n              <div style=\"font-size: 0.78rem; color: var(--text-muted); margin-top: 4px;\">\n                जितना अधिक GHz, प्रति सेकंड उतने ही अधिक निर्देश निष्पादित होंगे (1 GHz = प्रति सेकंड 1 अरब चक्र)।\n              </div>\n            </div>\n\n            <div class=\"perf-meter-card\">\n              <div class=\"perf-head\">\n                <span>2. Number of Cores (कोर की संख्या)</span>\n                <span style=\"color: #7c3aed; font-weight: 800;\">Dual, Quad, Octa</span>\n              </div>\n              <div class=\"perf-bar-bg\"><div class=\"perf-bar-fill\" style=\"width: 85%; background: #7c3aed;\"></div></div>\n              <div style=\"font-size: 0.78rem; color: var(--text-muted); margin-top: 4px;\">\n                प्रत्येक कोर एक स्वतंत्र सीपीयू की तरह कार्य करता है। सिंगल कोर सबसे पुराना प्रकार है [SSC CGL]। Dual-core = 2 कोर, Quad-core = 4 कोर।\n              </div>\n            </div>\n          </div>\n\n          <div>\n            <div class=\"perf-meter-card\">\n              <div class=\"perf-head\">\n                <span>3. Cache Memory (कैश मेमोरी)</span>\n                <span style=\"color: #10b981; font-weight: 800;\">L1 &gt; L2 &gt; L3</span>\n              </div>\n              <div class=\"perf-bar-bg\"><div class=\"perf-bar-fill\" style=\"width: 80%; background: #10b981;\"></div></div>\n              <div style=\"font-size: 0.78rem; color: var(--text-muted); margin-top: 4px;\">\n                अति-तीव्र SRAM जो सीपीयू चिप पर स्थित होती है। यह धीमी RAM पर निर्भरता समाप्त करती है।\n              </div>\n            </div>\n\n            <div class=\"perf-meter-card\">\n              <div class=\"perf-head\">\n                <span>4. Bus Speed & Power Supply</span>\n                <span style=\"color: #d97706; font-weight: 800;\">Bandwidth & Stability</span>\n              </div>\n              <div class=\"perf-bar-bg\"><div class=\"perf-bar-fill\" style=\"width: 88%; background: #d97706;\"></div></div>\n              <div style=\"font-size: 0.78rem; color: var(--text-muted); margin-top: 4px;\">\n                सिस्टम बस की गति सीपीयू और मेमोरी के बीच डेटा ट्रांसफर तय करती है। विद्युत आपूर्ति की स्थिरता भी सीपीयू को प्रभावित करती है।\n              </div>\n            </div>\n          </div>\n        </div>\n\n        <!-- ⭐ EXACT PAGE 7 & PAGE 17 HIGHLIGHTED ABBREVIATIONS -->\n        <h4 style=\"font-size: 0.98rem; font-weight: 800; margin-bottom: 8px; color: var(--accent); display: flex; align-items: center; gap: 6px;\">\n          <span>🔤</span> MUST-KNOW EXAM ABBREVIATIONS (प्रमाणित एवं सर्वाधिक पूछे जाने वाले फुल फॉर्म)\n        </h4>\n\n        <div class=\"grid-2col\">\n          <!-- Page 7 Set -->\n          <div class=\"yct-card border-red\">\n            <div class=\"yct-card-head\">\n              <div class=\"yct-card-name\" style=\"color: #dc2626;\">ऐतिहासिक मशीनें, इंटीग्रेशन व कोड्स</div>\n              <span class=\"pyq-tag pyq-repeat-5\">बार-बार पूछे गए</span>\n            </div>\n            <ul style=\"list-style: none; font-size: 0.85rem; line-height: 1.6;\">\n              <li>• <strong class=\"hl-term\">ENIAC:</strong> Electronic Numerical Integrator and Computer</li>\n              <li>• <strong class=\"hl-term\">UNIVAC:</strong> Universal Automatic Computer</li>\n              <li>• <strong class=\"hl-term\">EDVAC:</strong> Electronic Discrete Variable Automatic Computer</li>\n              <li>• <strong class=\"hl-term\">EDSAC:</strong> Electronic Delay Storage Automatic Calculator</li>\n              <li>• <strong class=\"hl-term\">IBM:</strong> International Business Machines</li>\n              <li>• <strong class=\"hl-term\">VLSI:</strong> Very Large Scale Integration (4th Gen)</li>\n              <li>• <strong class=\"hl-term\">ULSI:</strong> Ultra Large Scale Integration (5th Gen)</li>\n              <li>• <strong class=\"hl-term\">SLSI:</strong> Super Large Scale Integration</li>\n              <li>• <strong class=\"hl-ans\">GIGO:</strong> Garbage In, Garbage Out [RRB NTPC]</li>\n              <li>• <strong class=\"hl-ans\">BharOS:</strong> Bharat Operating System Solutions</li>\n              <li>• <strong class=\"hl-ans\">FORTRAN:</strong> Formula Translation (First Programming Language)</li>\n            </ul>\n          </div>\n\n          <!-- Page 17 Set -->\n          <div class=\"yct-card border-purple\">\n            <div class=\"yct-card-head\">\n              <div class=\"yct-card-name\" style=\"color: #7c3aed;\">सीपीयू, हार्डवेयर एवं पोर्ट्स</div>\n              <span class=\"pyq-tag pyq-repeat-5\">कोर आर्किटेक्चर</span>\n            </div>\n            <ul style=\"list-style: none; font-size: 0.85rem; line-height: 1.6;\">\n              <li>• <strong class=\"hl-term\">CPU:</strong> Central Processing Unit (केंद्रीय प्रसंस्करण इकाई)</li>\n              <li>• <strong class=\"hl-term\">ALU:</strong> Arithmetic Logic Unit (अंकगणितीय तार्किक इकाई)</li>\n              <li>• <strong class=\"hl-term\">CU:</strong> Control Unit (नियंत्रण इकाई)</li>\n              <li>• <strong class=\"hl-term\">IC:</strong> Integrated Circuit (एकीकृत परिपथ — जैक किल्बी)</li>\n              <li>• <strong class=\"hl-term\">ISA:</strong> Instruction Set Architecture</li>\n              <li>• <strong class=\"hl-ans\">PCB:</strong> Printed Circuit Board (मदरबोर्ड / बैकबोन)</li>\n              <li>• <strong class=\"hl-term\">PCI:</strong> Peripheral Components Interconnect</li>\n              <li>• <strong class=\"hl-term\">USB:</strong> Universal Serial Bus (प्लग एंड प्ले)</li>\n              <li>• <strong class=\"hl-term\">HDMI:</strong> High Definition Multimedia Interface</li>\n              <li>• <strong class=\"hl-term\">VGA:</strong> Video Graphics Array (15 पिन्स)</li>\n              <li>• <strong class=\"hl-term\">DVI:</strong> Digital Visual Interface</li>\n              <li>• <strong class=\"hl-ans\">LPT:</strong> Line Print Terminal (समानांतर पोर्ट - 25 पिन्स)</li>\n            </ul>\n          </div>\n        </div>\n\n        <div class=\"facts-drive\" style=\"margin-top: 14px;\">\n          <div class=\"facts-drive-title\">⭐ परीक्षा में सबसे ज्यादा रिपीट होने वाले 4 फुल फॉर्म्स</div>\n          <div class=\"facts-drive-content\">\n            <div class=\"facts-drive-item\">• <strong>ENIAC:</strong> Electronic Numerical Integrator and Computer [RRB NTPC 4x]</div>\n            <div class=\"facts-drive-item\">• <strong>PCB:</strong> Printed Circuit Board [SSC CGL & RRB]</div>\n            <div class=\"facts-drive-item\">• <strong>GIGO:</strong> Garbage In, Garbage Out [RRB NTPC 2026]</div>\n            <div class=\"facts-drive-item\">• <strong>VGA:</strong> Video Graphics Array (15-pin analog video) [SSC CGL 2023]</div>\n          </div>\n        </div>\n\n      </div>"}]; // ===== components/master_notes/ModuleNav.js =====
